<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="icon" type="image/png" href="https://i.pinimg.com/originals/f2/fb/63/f2fb63985c273d20b8a5df61462ea997.gif">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phòng Chat Siêu Cấp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass { background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.5); }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.4); }

        @keyframes popIn {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .msg-animate { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .loader { border-top-color: transparent; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen flex items-center justify-center antialiased overflow-hidden">

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen" class="glass p-8 rounded-[2rem] shadow-2xl w-full max-w-md mx-4 transition-all duration-500 transform hover:scale-[1.02]">
        <div class="text-center mb-8">
            <div class="bg-white/40 text-white w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner backdrop-blur-sm border border-white/50">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"></path></svg>
            </div>
            <h2 class="text-3xl font-extrabold text-white drop-shadow-md">Nexus Chat</h2>
            <p class="text-white/80 text-sm mt-2 font-medium" id="status-text">Đang kết nối Server...</p>
        </div>

        <form id="login-form" class="space-y-5">
            <div class="relative">
                <input type="text" id="username" required placeholder="Tên hiển thị của bạn" class="w-full px-5 py-4 rounded-xl bg-white/60 border-2 border-transparent focus:bg-white focus:border-pink-400 outline-none transition-all placeholder-gray-500 text-gray-800 font-medium shadow-sm text-lg">
            </div>
            <div class="relative">
                <input type="password" id="password" required placeholder="Mật khẩu phòng (123456)" class="w-full px-5 py-4 rounded-xl bg-white/60 border-2 border-transparent focus:bg-white focus:border-pink-400 outline-none transition-all placeholder-gray-500 text-gray-800 font-medium shadow-sm text-lg">
            </div>
            <div id="login-error" class="bg-red-500/80 text-white text-sm text-center py-2 rounded-lg hidden backdrop-blur-md animate-pulse font-medium"></div>
            
            <button type="submit" id="login-btn" class="w-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform hover:-translate-y-1 flex justify-center items-center text-lg">
                <span>Vào Phòng Ngay</span>
                <div id="login-loader" class="loader ml-3 w-6 h-6 border-4 border-white border-t-transparent rounded-full hidden"></div>
            </button>
        </form>
    </div>

    <!-- MÀN HÌNH CHAT -->
    <div id="chat-screen" class="hidden w-full h-full md:h-[92vh] md:max-w-4xl md:mx-auto md:rounded-[2rem] shadow-2xl glass-panel flex flex-col overflow-hidden relative">
        
        <!-- Header -->
        <div class="bg-white/40 backdrop-blur-md border-b border-white/40 px-4 md:px-6 py-4 flex items-center justify-between z-10 shadow-sm">
            <div class="flex items-center space-x-3 md:space-x-4">
                <div class="relative">
                    <img id="my-avatar" src="" alt="avatar" class="w-10 h-10 md:w-12 md:h-12 rounded-full border-2 border-pink-500 bg-white p-0.5 object-cover">
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-400 border-2 border-white rounded-full"></div>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 id="room-name-display" class="text-lg md:text-xl font-bold text-gray-800 tracking-tight">Phòng Chat Chung</h1>
                        <button id="edit-room-btn" class="text-gray-500 hover:text-pink-500 transition p-1 rounded-full hover:bg-white/50" title="Đổi tên phòng">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                        </button>
                    </div>
                    <p class="text-xs md:text-sm text-gray-600 font-medium">Tên của bạn: <span id="display-name" class="text-pink-600 font-bold"></span></p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <button id="noti-btn" class="text-gray-600 hover:text-yellow-500 transition-colors p-2 rounded-full hover:bg-white/50" title="Bật thông báo đẩy">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                </button>
                <button id="logout-btn" class="text-gray-600 hover:text-red-500 transition-colors p-2 rounded-full hover:bg-white/50" title="Đăng xuất">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </div>

        <!-- Khung chứa tin nhắn -->
        <div id="chat-messages" class="flex-1 p-4 md:p-6 overflow-y-auto flex flex-col space-y-5 bg-gradient-to-b from-transparent to-white/20 scroll-smooth">
            <div class="flex justify-center items-center h-full opacity-50">
                <div class="loader w-8 h-8 border-4 border-pink-500 border-t-transparent rounded-full"></div>
            </div>
        </div>

        <button id="scroll-bottom-btn" class="hidden absolute bottom-24 right-6 bg-pink-500 text-white p-3 rounded-full shadow-lg hover:bg-pink-600 transition-transform transform hover:scale-110 z-20">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
        </button>

        <!-- Khung nhập tin nhắn -->
        <div class="bg-white/60 backdrop-blur-lg p-3 md:p-4 border-t border-white/50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10">
            <form id="chat-form" class="flex items-end space-x-2 md:space-x-3 max-w-full relative">
                
                <!-- Nút đính kèm File -->
                <button type="button" id="attach-btn" class="p-3 text-gray-500 hover:text-blue-500 bg-white rounded-full shadow-md transition-transform hover:scale-110 flex-shrink-0" title="Gửi hình/file">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                </button>
                <input type="file" id="file-input" class="hidden" accept="image/*, .pdf, .doc, .docx, .xls, .xlsx, .zip">

                <div class="flex-1 relative bg-white rounded-3xl shadow-inner border border-gray-100 overflow-hidden flex items-center">
                    <input type="text" id="message-input" autocomplete="off" placeholder="Soạn tin nhắn..." class="w-full px-4 py-3 md:py-4 bg-transparent focus:outline-none text-gray-700 placeholder-gray-400">
                </div>
                
                <button type="submit" id="send-btn" class="bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white rounded-full p-3 md:p-4 flex-shrink-0 shadow-lg transition-transform transform hover:scale-110 disabled:opacity-50 disabled:hover:scale-100 flex items-center justify-center">
                    <svg class="w-6 h-6 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </form>
            
            <!-- Vùng hiển thị file đang chọn -->
            <div id="file-preview" class="hidden mt-2 px-4 py-2 bg-blue-50 border border-blue-100 rounded-xl text-sm text-blue-700 flex justify-between items-center">
                <span class="truncate max-w-[80%]" id="file-name-display">filename.png</span>
                <button type="button" id="remove-file-btn" class="text-red-500 hover:text-red-700 font-bold">&times;</button>
            </div>
        </div>
    </div>

    <!-- Modal Đổi Tên Phòng -->
    <div id="room-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-80 transform scale-100 transition-transform">
            <h3 class="text-lg font-bold mb-4">Đổi tên phòng chat</h3>
            <input type="text" id="new-room-name" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-500 outline-none mb-4" placeholder="Nhập tên mới...">
            <div class="flex justify-end space-x-2">
                <button id="cancel-room-btn" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">Hủy</button>
                <button id="save-room-btn" class="px-4 py-2 bg-pink-500 text-white rounded-lg hover:bg-pink-600">Lưu</button>
            </div>
        </div>
    </div>

    <script>
        // === CẤU HÌNH API ===
        // Link Apps Script của bạn
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbywIfSXX0hG4CWw_xqIJHJfosAEEqozzNHA27s24GUA74vmM1BTup1pPL2RXz3zriCw/exec';

        // === BIẾN TRẠNG THÁI ===
        let currentUser = '';
        let pollingInterval = null;
        let lastMessageCount = 0;
        let isUserScrolling = false;
        let selectedFile = null;
        let roomNameStr = "Phòng Chat Chung";

        const notifSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3');
        notifSound.volume = 0.5;

        // Các DOM
        const els = {
            loginScreen: document.getElementById('login-screen'), chatScreen: document.getElementById('chat-screen'),
            loginForm: document.getElementById('login-form'), chatForm: document.getElementById('chat-form'),
            messages: document.getElementById('chat-messages'), error: document.getElementById('login-error'),
            loginBtnText: document.querySelector('#login-btn span'), loginLoader: document.getElementById('login-loader'),
            sendBtn: document.getElementById('send-btn'), input: document.getElementById('message-input'),
            myAvatar: document.getElementById('my-avatar'), displayName: document.getElementById('display-name'),
            scrollBtn: document.getElementById('scroll-bottom-btn'), roomNameDisplay: document.getElementById('room-name-display'),
            editRoomBtn: document.getElementById('edit-room-btn'), roomModal: document.getElementById('room-modal'),
            attachBtn: document.getElementById('attach-btn'), fileInput: document.getElementById('file-input'),
            filePreview: document.getElementById('file-preview'), fileNameDisplay: document.getElementById('file-name-display'),
            removeFileBtn: document.getElementById('remove-file-btn'), notiBtn: document.getElementById('noti-btn'),
            statusText: document.getElementById('status-text')
        };

        // --- HÀM GIAO TIẾP VỚI APPS SCRIPT API ---
        async function apiCall(action, payload = {}) {
            try {
                if (action === 'getMessages' || action === 'getRoomInfo') {
                    const res = await fetch(`${SCRIPT_URL}?action=${action}`);
                    return await res.json();
                } else {
                    payload.action = action;
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' } // Tránh lỗi CORS preflight
                    });
                    return await res.json();
                }
            } catch (error) {
                console.error("API Error:", error);
                throw error;
            }
        }

        // --- THÔNG BÁO ĐẨY (PUSH NOTIFICATION) ---
        els.notiBtn.addEventListener('click', () => {
            if (!("Notification" in window)) {
                alert("Trình duyệt của bạn không hỗ trợ thông báo desktop.");
            } else if (Notification.permission === "granted") {
                alert("Thông báo đã được bật từ trước!");
            } else if (Notification.permission !== "denied") {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        new Notification("LOVE PIKEN", { body: "Đã bật thông báo thành công!", icon: getAvatarUrl("LOVE PIKEN") });
                        els.notiBtn.classList.add('text-yellow-500');
                    }
                });
            } else {
                alert("Bạn đã chặn thông báo. Vui lòng mở khóa trong cài đặt trình duyệt.");
            }
        });

        function showPushNotification(msg) {
            if (Notification.permission === "granted" && document.hidden) {
                const notiText = msg.isFile ? "Đã gửi một tệp đính kèm" : msg.text;
                new Notification(`${msg.username} trong ${roomNameStr}`, {
                    body: notiText,
                    icon: getAvatarUrl(msg.username)
                });
            }
        }

        // --- TIỆN ÍCH UI ---
        function getAvatarUrl(name) { return `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(name)}&backgroundColor=b6e3f4,c0aede,d1d4f9,ffdfbf`; }

        function formatMessage(text, isFile = false, fileUrl = '') {
            if (isFile && fileUrl) {
                const isImage = text.match(/\.(jpeg|jpg|gif|png)$/i) != null;
                if (isImage) {
                    return `<br><a href="${fileUrl}" target="_blank"><img src="${fileUrl}" class="mt-2 rounded-xl max-w-[200px] sm:max-w-xs shadow-md border border-gray-100 hover:scale-[1.02] transition-transform" alt="Ảnh"/></a><br><span class="text-xs text-blue-500">📎 ${text}</span>`;
                } else {
                    return `📎 <a href="${fileUrl}" target="_blank" class="text-blue-500 hover:underline font-bold">${text}</a>`;
                }
            }

            let safeText = text.replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag));
            const imgRegex = /(https?:\/\/.*\.(?:png|jpg|jpeg|gif|webp))/ig;
            if (imgRegex.test(safeText)) {
                safeText = safeText.replace(imgRegex, '<br><a href="$1" target="_blank"><img src="$1" class="mt-2 rounded-xl max-w-[200px] sm:max-w-xs shadow-md border border-gray-100 cursor-pointer hover:scale-[1.02] transition-transform" onerror="this.style.display=\'none\'" alt="Ảnh link"/></a>');
            } else {
                const urlRegex = /(https?:\/\/[^\s]+)/g;
                safeText = safeText.replace(urlRegex, '<a href="$1" target="_blank" class="text-blue-500 hover:text-blue-700 underline underline-offset-2 break-all">$1</a>');
            }
            return safeText;
        }

        els.messages.addEventListener('scroll', () => {
            const { scrollTop, scrollHeight, clientHeight } = els.messages;
            if (scrollHeight - scrollTop - clientHeight > 100) {
                isUserScrolling = true; els.scrollBtn.classList.remove('hidden');
            } else {
                isUserScrolling = false; els.scrollBtn.classList.add('hidden');
            }
        });

        els.scrollBtn.addEventListener('click', () => scrollToBottom(true));
        function scrollToBottom(force = false) {
            if (!isUserScrolling || force) els.messages.scrollTo({ top: els.messages.scrollHeight, behavior: force ? 'smooth' : 'auto' });
        }

        // --- LOGIC XÁC THỰC ---
        els.loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const userVal = document.getElementById('username').value.trim();
            const passVal = document.getElementById('password').value.trim();
            if(!userVal || !passVal) return;

            els.loginBtnText.innerText = 'Đang xác thực...';
            els.loginLoader.classList.remove('hidden'); els.error.classList.add('hidden');

            try {
                const res = await apiCall('checkLogin', { username: userVal, password: passVal });
                if (res.success) {
                    enterRoom(userVal);
                } else {
                    showLoginError(res.message);
                }
            } catch (err) {
                showLoginError('Lỗi kết nối Server! Vui lòng thử lại sau.');
            }
        });

        function showLoginError(msg) {
            els.loginBtnText.innerText = 'Vào Phòng Ngay';
            els.loginLoader.classList.add('hidden');
            els.error.innerText = msg; els.error.classList.remove('hidden');
        }

        async function enterRoom(username) {
            currentUser = username;
            els.displayName.innerText = currentUser;
            els.myAvatar.src = getAvatarUrl(currentUser);
            els.loginScreen.classList.add('hidden');
            els.chatScreen.classList.remove('hidden');
            els.messages.innerHTML = '';
            
            await updateRoomInfo();
            fetchMessages();
            pollingInterval = setInterval(() => { fetchMessages(); updateRoomInfo(); }, 3000);
            
            // Check noti permission on start
            if (Notification.permission === "granted") els.notiBtn.classList.add('text-yellow-500');
        }

        document.getElementById('logout-btn').addEventListener('click', () => {
            clearInterval(pollingInterval);
            currentUser = ''; lastMessageCount = 0;
            els.chatScreen.classList.add('hidden'); els.loginScreen.classList.remove('hidden');
            document.getElementById('password').value = '';
        });

        // --- ĐỔI TÊN PHÒNG ---
        async function updateRoomInfo() {
            try {
                const res = await apiCall('getRoomInfo');
                if (res.roomName && res.roomName !== roomNameStr) {
                    roomNameStr = res.roomName;
                    els.roomNameDisplay.innerText = roomNameStr;
                }
            } catch (e) {}
        }

        els.editRoomBtn.addEventListener('click', () => {
            document.getElementById('new-room-name').value = roomNameStr;
            els.roomModal.classList.remove('hidden');
        });
        document.getElementById('cancel-room-btn').addEventListener('click', () => els.roomModal.classList.add('hidden'));
        document.getElementById('save-room-btn').addEventListener('click', async () => {
            const newName = document.getElementById('new-room-name').value.trim();
            if(!newName) return;
            els.roomModal.classList.add('hidden');
            roomNameStr = newName; els.roomNameDisplay.innerText = "Đang đổi...";
            await apiCall('updateRoomName', { roomName: newName });
            updateRoomInfo();
        });

        // --- GỬI FILE ---
        els.attachBtn.addEventListener('click', () => els.fileInput.click());
        els.fileInput.addEventListener('change', function() {
            if(this.files.length > 0) {
                selectedFile = this.files[0];
                if(selectedFile.size > 3 * 1024 * 1024) { // Giới hạn 3MB vì Base64 lớn
                    alert("Vui lòng chọn file dưới 3MB!"); selectedFile = null; this.value = ''; return;
                }
                els.fileNameDisplay.innerText = selectedFile.name;
                els.filePreview.classList.remove('hidden');
            }
        });
        els.removeFileBtn.addEventListener('click', () => {
            selectedFile = null; els.fileInput.value = ''; els.filePreview.classList.add('hidden');
        });

        // --- NHẮN TIN & RENDER ---
        async function fetchMessages() {
            try {
                const messages = await apiCall('getMessages');
                renderMessages(messages);
            } catch (e) { console.log("Lỗi fetch tin nhắn"); }
        }

        function renderMessages(messages) {
            if (messages.length === lastMessageCount) return;
            
            if (lastMessageCount > 0 && messages.length > lastMessageCount) {
                const newMsg = messages[messages.length - 1];
                if (newMsg.username !== currentUser && newMsg.username !== 'Hệ thống') {
                    notifSound.play().catch(e=>{});
                    showPushNotification(newMsg);
                }
            }
            
            lastMessageCount = messages.length;
            els.messages.innerHTML = ''; 
            
            messages.forEach((msg, idx) => {
                const isMe = msg.username === currentUser;
                const isSystem = msg.username === 'Hệ thống';
                const date = new Date(msg.timestamp);
                const timeStr = date.getHours().toString().padStart(2,'0') + ':' + date.getMinutes().toString().padStart(2,'0');
                
                const msgWrapper = document.createElement('div');
                msgWrapper.className = `flex w-full msg-animate ${isSystem ? 'justify-center' : (isMe ? 'justify-end' : 'justify-start')}`;
                
                if (isSystem) {
                    msgWrapper.innerHTML = `<div class="bg-black/10 backdrop-blur-sm text-gray-600 text-xs px-4 py-1.5 rounded-full my-2 font-medium tracking-wide shadow-sm">${formatMessage(msg.text)}</div>`;
                } else {
                    const avatarSrc = getAvatarUrl(msg.username);
                    const bubbleBg = isMe ? 'bg-gradient-to-br from-pink-500 to-rose-500 text-white rounded-tr-sm shadow-pink-500/30' : 'bg-white border border-gray-100 text-gray-800 rounded-tl-sm shadow-gray-200/50';
                    
                    msgWrapper.innerHTML = `
                        <div class="flex max-w-[85%] sm:max-w-[75%] items-end ${isMe ? 'flex-row-reverse space-x-reverse space-x-2' : 'space-x-2'}">
                            <img src="${avatarSrc}" class="w-8 h-8 sm:w-10 sm:h-10 rounded-full border border-gray-200 bg-white object-cover shadow-sm flex-shrink-0" alt="avt">
                            <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                                ${!isMe ? `<span class="text-[11px] font-bold text-gray-500 mb-1 ml-1">${msg.username}</span>` : ''}
                                <div class="px-5 py-3 rounded-[1.2rem] shadow-md ${bubbleBg}">
                                    <div class="text-[15px] leading-relaxed whitespace-pre-wrap break-words">${formatMessage(msg.text, msg.isFile, msg.fileUrl)}</div>
                                    <span class="text-[10px] mt-1.5 block opacity-70 ${isMe ? 'text-pink-100 text-right' : 'text-gray-400 text-left font-medium'}">${timeStr}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }
                els.messages.appendChild(msgWrapper);
            });
            scrollToBottom();
        }

        els.chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const text = els.input.value.trim();
            if (!text && !selectedFile) return;

            els.sendBtn.disabled = true; els.attachBtn.disabled = true;
            
            let payload = { username: currentUser, text: text, isFile: false };

            if (selectedFile) {
                renderTempMessage(text, true); // Hiệu ứng đang tải file
                
                // Chuyển file sang Base64
                const reader = new FileReader();
                reader.onload = async function() {
                    payload.isFile = true;
                    payload.fileName = selectedFile.name;
                    payload.mimeType = selectedFile.type;
                    payload.base64 = reader.result.split(',')[1];
                    
                    await sendMessageToServer(payload);
                    selectedFile = null; els.fileInput.value = ''; els.filePreview.classList.add('hidden');
                };
                reader.readAsDataURL(selectedFile);
            } else {
                renderTempMessage(text, false);
                els.input.value = '';
                await sendMessageToServer(payload);
            }
        });

        async function sendMessageToServer(payload) {
            try {
                await apiCall('saveMessage', payload);
                fetchMessages();
            } catch (err) {
                alert("Lỗi gửi tin! (Nếu có file, file có thể quá nặng).");
            } finally {
                els.sendBtn.disabled = false; els.attachBtn.disabled = false; els.input.focus();
            }
        }

        function renderTempMessage(text, isUploadingFile = false) {
            const tempDiv = document.createElement('div');
            tempDiv.className = `flex w-full justify-end msg-animate opacity-60`;
            let contentText = text;
            if (isUploadingFile) contentText += `<br><span class="text-xs italic">Đang tải file lên Drive... ⏳</span>`;
            
            tempDiv.innerHTML = `
                <div class="flex max-w-[85%] sm:max-w-[75%] items-end flex-row-reverse space-x-reverse space-x-2">
                    <img src="${getAvatarUrl(currentUser)}" class="w-8 h-8 sm:w-10 sm:h-10 rounded-full border border-gray-200 bg-white object-cover opacity-80 flex-shrink-0">
                    <div class="flex flex-col items-end">
                        <div class="px-5 py-3 rounded-[1.2rem] shadow-md bg-gradient-to-br from-pink-400 to-rose-400 text-white rounded-tr-sm">
                            <div class="text-[15px] leading-relaxed whitespace-pre-wrap break-words">${formatMessage(contentText)}</div>
                            <span class="text-[10px] mt-1.5 block text-white/70 text-right animate-pulse">Đang bay đi... ✈️</span>
                        </div>
                    </div>
                </div>
            `;
            els.messages.appendChild(tempDiv);
            scrollToBottom(true);
        }
        
        // Cập nhật trạng thái loading ban đầu
        els.statusText.innerText = "Hệ thống sẵn sàng!";
    </script>
</body>
</html>
