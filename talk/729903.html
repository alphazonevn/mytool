<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phòng Chat Siêu Cấp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            /* Background gradient animation */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism utilities */
        .glass {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Tùy chỉnh thanh cuộn siêu mỏng */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.4); }

        /* Hiệu ứng pop-in cho tin nhắn */
        @keyframes popIn {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .msg-animate { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* Loader */
        .loader {
            border-top-color: transparent;
            animation: spinner 1s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center antialiased overflow-hidden">

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen" class="glass p-8 rounded-[2rem] shadow-2xl w-full max-w-md mx-4 transition-all duration-500 transform hover:scale-[1.02]">
        <div class="text-center mb-8">
            <div class="bg-white/40 text-white w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner backdrop-blur-sm border border-white/50">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"></path>
                </svg>
            </div>
            <h2 class="text-3xl font-extrabold text-white drop-shadow-md">Nexus Chat</h2>
            <p class="text-white/80 text-sm mt-2 font-medium">Kết nối không giới hạn</p>
        </div>

        <form id="login-form" class="space-y-5">
            <div class="relative">
                <input type="text" id="username" required placeholder="Tên hiển thị của bạn" class="w-full px-5 py-4 rounded-xl bg-white/60 border-2 border-transparent focus:bg-white focus:border-pink-400 outline-none transition-all placeholder-gray-500 text-gray-800 font-medium shadow-sm text-lg">
            </div>
            <div class="relative">
                <input type="password" id="password" required placeholder="Mật khẩu phòng (123456)" class="w-full px-5 py-4 rounded-xl bg-white/60 border-2 border-transparent focus:bg-white focus:border-pink-400 outline-none transition-all placeholder-gray-500 text-gray-800 font-medium shadow-sm text-lg">
            </div>
            <div id="login-error" class="bg-red-500/80 text-white text-sm text-center py-2 rounded-lg hidden backdrop-blur-md animate-pulse font-medium">Sai mật khẩu, vui lòng thử lại!</div>
            
            <button type="submit" id="login-btn" class="w-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform hover:-translate-y-1 hover:shadow-xl flex justify-center items-center text-lg">
                <span>Vào Phòng Ngay</span>
                <div id="login-loader" class="loader ml-3 w-6 h-6 border-4 border-white border-t-transparent rounded-full hidden"></div>
            </button>
        </form>
    </div>

    <!-- MÀN HÌNH CHAT -->
    <div id="chat-screen" class="hidden w-full h-full md:h-[92vh] md:max-w-4xl md:mx-auto md:rounded-[2rem] shadow-2xl glass-panel flex flex-col overflow-hidden relative">
        
        <!-- Header -->
        <div class="bg-white/40 backdrop-blur-md border-b border-white/40 px-6 py-4 flex items-center justify-between z-10 shadow-sm">
            <div class="flex items-center space-x-4">
                <div class="relative">
                    <img id="my-avatar" src="" alt="avatar" class="w-12 h-12 rounded-full border-2 border-pink-500 bg-white p-0.5 object-cover shadow-sm">
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-400 border-2 border-white rounded-full"></div>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-800 tracking-tight">Phòng Chat Chung</h1>
                    <p class="text-sm text-gray-600 font-medium">Tên của bạn: <span id="display-name" class="text-pink-600 font-bold"></span></p>
                </div>
            </div>
            <button id="logout-btn" class="text-gray-600 hover:text-red-500 transition-colors p-2 rounded-full hover:bg-white/50" title="Đăng xuất">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </button>
        </div>

        <!-- Khung chứa tin nhắn -->
        <div id="chat-messages" class="flex-1 p-4 md:p-6 overflow-y-auto flex flex-col space-y-5 bg-gradient-to-b from-transparent to-white/20 scroll-smooth">
            <!-- Tin nhắn mẫu chờ load -->
            <div class="flex justify-center items-center h-full opacity-50">
                <div class="loader w-8 h-8 border-4 border-pink-500 border-t-transparent rounded-full"></div>
            </div>
        </div>

        <!-- Nút cuộn xuống dưới (Nổi) -->
        <button id="scroll-bottom-btn" class="hidden absolute bottom-24 right-6 bg-pink-500 text-white p-3 rounded-full shadow-lg hover:bg-pink-600 transition-transform transform hover:scale-110 z-20">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
        </button>

        <!-- Khung nhập tin nhắn -->
        <div class="bg-white/60 backdrop-blur-lg p-4 border-t border-white/50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10">
            <form id="chat-form" class="flex items-end space-x-3 max-w-full">
                <div class="flex-1 relative bg-white rounded-3xl shadow-inner border border-gray-100 overflow-hidden flex items-center">
                    <input type="text" id="message-input" autocomplete="off" placeholder="Soạn tin nhắn hoặc dán link ảnh..." class="w-full px-5 py-4 bg-transparent focus:outline-none text-gray-700 placeholder-gray-400">
                </div>
                <button type="submit" id="send-btn" class="bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white rounded-full p-4 flex-shrink-0 shadow-lg transition-transform transform hover:scale-110 disabled:opacity-50 disabled:hover:scale-100 flex items-center justify-center">
                    <svg class="w-6 h-6 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </form>
        </div>
    </div>

    <script>
        // === MOCK BACKEND DÀNH CHO PREVIEW ===
        if (typeof google === 'undefined') {
            window.google = {
                script: {
                    run: new Proxy({}, {
                        get: function(target, prop) {
                            if (prop === 'withSuccessHandler') return cb => { target._s = cb; return window.google.script.run; }
                            if (prop === 'withFailureHandler') return cb => { target._f = cb; return window.google.script.run; }
                            return function(...args) {
                                setTimeout(() => {
                                    let res;
                                    if (prop === 'checkLogin') res = (args[1] === '123456') ? {success: true} : {success: false, message: 'Sai mật khẩu (123456)'};
                                    else if (prop === 'getMessages') res = window.mockMsgs || [{timestamp: Date.now()-10000, username: 'Hệ thống', text: 'Chào mừng bạn đến với phiên bản Siêu Bứt Phá! 🚀'}];
                                    else if (prop === 'saveMessage') {
                                        if(!window.mockMsgs) window.mockMsgs = [];
                                        window.mockMsgs.push({timestamp: Date.now(), username: args[0], text: args[1]}); res = true;
                                    }
                                    if (target._s) target._s(res);
                                    target._s = null; target._f = null;
                                }, 400); 
                            }
                        }
                    })
                }
            };
        }

        // === BIẾN TRẠNG THÁI ===
        let currentUser = '';
        let pollingInterval = null;
        let lastMessageCount = 0;
        let isUserScrolling = false;

        // Âm thanh thông báo
        const notifSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3');
        notifSound.volume = 0.5;

        // Các phần tử DOM
        const els = {
            loginScreen: document.getElementById('login-screen'),
            chatScreen: document.getElementById('chat-screen'),
            loginForm: document.getElementById('login-form'),
            chatForm: document.getElementById('chat-form'),
            messages: document.getElementById('chat-messages'),
            error: document.getElementById('login-error'),
            loginBtnText: document.querySelector('#login-btn span'),
            loginLoader: document.getElementById('login-loader'),
            sendBtn: document.getElementById('send-btn'),
            input: document.getElementById('message-input'),
            myAvatar: document.getElementById('my-avatar'),
            displayName: document.getElementById('display-name'),
            scrollBtn: document.getElementById('scroll-bottom-btn')
        };

        // Tạo URL Avatar ngẫu nhiên dễ thương theo tên
        function getAvatarUrl(name) {
            return `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(name)}&backgroundColor=b6e3f4,c0aede,d1d4f9,ffdfbf`;
        }

        // Chống XSS & Xử lý hiển thị Link/Ảnh mượt mà
        function formatMessage(text) {
            // 1. Chống XSS
            let safeText = text.replace(/[&<>'"]/g, 
                tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag)
            );
            
            // 2. Tự động nhận diện Image URL (.jpg, .png, .gif)
            const imgRegex = /(https?:\/\/.*\.(?:png|jpg|jpeg|gif|webp))/ig;
            if (imgRegex.test(safeText)) {
                safeText = safeText.replace(imgRegex, '<br><img src="$1" class="mt-2 rounded-xl max-w-[200px] sm:max-w-xs shadow-md border border-gray-100 cursor-pointer hover:scale-[1.02] transition-transform" onerror="this.style.display=\'none\'" alt="Ảnh được gửi"/>');
            } else {
                // 3. Tự động nhận diện Link thường (nếu không phải ảnh)
                const urlRegex = /(https?:\/\/[^\s]+)/g;
                safeText = safeText.replace(urlRegex, '<a href="$1" target="_blank" class="text-blue-500 hover:text-blue-700 underline underline-offset-2 break-all">$1</a>');
            }
            
            return safeText;
        }

        // Giám sát thao tác cuộn để hiện nút "Cuộn xuống"
        els.messages.addEventListener('scroll', () => {
            const { scrollTop, scrollHeight, clientHeight } = els.messages;
            // Nếu người dùng cuộn lên quá 100px so với đáy
            if (scrollHeight - scrollTop - clientHeight > 100) {
                isUserScrolling = true;
                els.scrollBtn.classList.remove('hidden');
            } else {
                isUserScrolling = false;
                els.scrollBtn.classList.add('hidden');
            }
        });

        els.scrollBtn.addEventListener('click', () => {
            scrollToBottom(true);
        });

        function scrollToBottom(force = false) {
            if (!isUserScrolling || force) {
                els.messages.scrollTo({
                    top: els.messages.scrollHeight,
                    behavior: force ? 'smooth' : 'auto'
                });
            }
        }

        // Xử lý Đăng nhập
        els.loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const userVal = document.getElementById('username').value.trim();
            const passVal = document.getElementById('password').value.trim();
            
            if(!userVal || !passVal) return;

            els.loginBtnText.innerText = 'Đang xác thực...';
            els.loginLoader.classList.remove('hidden');
            els.error.classList.add('hidden');

            google.script.run
                .withSuccessHandler(function(res) {
                    els.loginBtnText.innerText = 'Vào Phòng Ngay';
                    els.loginLoader.classList.add('hidden');
                    
                    if (res.success) enterRoom(userVal);
                    else {
                        els.error.innerText = res.message;
                        els.error.classList.remove('hidden');
                    }
                })
                .withFailureHandler(function() {
                    els.loginBtnText.innerText = 'Vào Phòng Ngay';
                    els.loginLoader.classList.add('hidden');
                    els.error.innerText = 'Lỗi mạng! Thử lại sau.';
                    els.error.classList.remove('hidden');
                })
                .checkLogin(userVal, passVal);
        });

        function enterRoom(username) {
            currentUser = username;
            els.displayName.innerText = currentUser;
            els.myAvatar.src = getAvatarUrl(currentUser);
            
            els.loginScreen.classList.add('hidden');
            els.chatScreen.classList.remove('hidden');
            
            els.messages.innerHTML = ''; // Clear loading
            fetchMessages();
            pollingInterval = setInterval(fetchMessages, 2500);
        }

        document.getElementById('logout-btn').addEventListener('click', () => {
            clearInterval(pollingInterval);
            currentUser = '';
            els.chatScreen.classList.add('hidden');
            els.loginScreen.classList.remove('hidden');
            document.getElementById('password').value = '';
            lastMessageCount = 0;
        });

        function fetchMessages() {
            google.script.run.withSuccessHandler(renderMessages).getMessages();
        }

        function renderMessages(messages) {
            if (messages.length === lastMessageCount) return;
            
            // Phát âm thanh nếu có tin nhắn mới (và không phải do mình gửi)
            if (lastMessageCount > 0 && messages.length > lastMessageCount) {
                const newMsg = messages[messages.length - 1];
                if (newMsg.username !== currentUser && newMsg.username !== 'Hệ thống') {
                    notifSound.play().catch(e=>console.log('Audio play block by browser'));
                }
            }
            
            lastMessageCount = messages.length;
            els.messages.innerHTML = ''; 
            
            messages.forEach((msg, idx) => {
                const isMe = msg.username === currentUser;
                const isSystem = msg.username === 'Hệ thống';
                const date = new Date(msg.timestamp);
                const timeStr = date.getHours().toString().padStart(2,'0') + ':' + date.getMinutes().toString().padStart(2,'0');
                
                const msgWrapper = document.createElement('div');
                msgWrapper.className = `flex w-full msg-animate ${isSystem ? 'justify-center' : (isMe ? 'justify-end' : 'justify-start')}`;
                msgWrapper.style.animationDelay = `${Math.min(idx * 0.05, 0.5)}s`; // Stagger animation

                if (isSystem) {
                    msgWrapper.innerHTML = `<div class="bg-black/10 backdrop-blur-sm text-gray-600 text-xs px-4 py-1.5 rounded-full my-2 font-medium tracking-wide shadow-sm">${formatMessage(msg.text)}</div>`;
                } else {
                    const avatarSrc = getAvatarUrl(msg.username);
                    const bubbleBg = isMe ? 'bg-gradient-to-br from-pink-500 to-rose-500 text-white rounded-tr-sm shadow-pink-500/30' : 'bg-white border border-gray-100 text-gray-800 rounded-tl-sm shadow-gray-200/50';
                    
                    msgWrapper.innerHTML = `
                        <div class="flex max-w-[85%] sm:max-w-[75%] items-end ${isMe ? 'flex-row-reverse space-x-reverse space-x-2' : 'space-x-2'}">
                            <!-- Avatar -->
                            <img src="${avatarSrc}" class="w-8 h-8 sm:w-10 sm:h-10 rounded-full border border-gray-200 bg-white object-cover shadow-sm flex-shrink-0" alt="avt">
                            
                            <!-- Nội dung -->
                            <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                                ${!isMe ? `<span class="text-[11px] font-bold text-gray-500 mb-1 ml-1">${msg.username}</span>` : ''}
                                <div class="px-5 py-3 rounded-[1.2rem] shadow-md ${bubbleBg}">
                                    <div class="text-[15px] leading-relaxed whitespace-pre-wrap break-words">${formatMessage(msg.text)}</div>
                                    <span class="text-[10px] mt-1.5 block opacity-70 ${isMe ? 'text-pink-100 text-right' : 'text-gray-400 text-left font-medium'}">${timeStr}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }
                els.messages.appendChild(msgWrapper);
            });
            
            scrollToBottom();
        }

        els.chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const text = els.input.value.trim();
            if (!text || !currentUser) return;

            els.sendBtn.disabled = true;
            els.input.value = '';

            renderTempMessage(text);
            
            google.script.run
                .withSuccessHandler(() => {
                    els.sendBtn.disabled = false;
                    els.input.focus();
                    fetchMessages(); 
                })
                .withFailureHandler(() => {
                    els.sendBtn.disabled = false;
                    alert("Có lỗi khi gửi tin nhắn, vui lòng thử lại!");
                })
                .saveMessage(currentUser, text);
        });

        function renderTempMessage(text) {
            const tempDiv = document.createElement('div');
            tempDiv.className = `flex w-full justify-end msg-animate opacity-60`;
            tempDiv.innerHTML = `
                <div class="flex max-w-[85%] sm:max-w-[75%] items-end flex-row-reverse space-x-reverse space-x-2">
                    <img src="${getAvatarUrl(currentUser)}" class="w-8 h-8 sm:w-10 sm:h-10 rounded-full border border-gray-200 bg-white object-cover opacity-80 flex-shrink-0">
                    <div class="flex flex-col items-end">
                        <div class="px-5 py-3 rounded-[1.2rem] shadow-md bg-gradient-to-br from-pink-400 to-rose-400 text-white rounded-tr-sm">
                            <div class="text-[15px] leading-relaxed whitespace-pre-wrap break-words">${formatMessage(text)}</div>
                            <span class="text-[10px] mt-1.5 block text-white/70 text-right animate-pulse">Đang bay đi... ✈️</span>
                        </div>
                    </div>
                </div>
            `;
            els.messages.appendChild(tempDiv);
            scrollToBottom(true);
        }
    </script>
</body>
</html>
