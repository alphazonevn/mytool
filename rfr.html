<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFR+ | Căn hộ & Phòng trọ cao cấp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); }
    </style>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#0f172a', secondary: '#ef4444' } } } }
    </script>
</head>
<body class="text-slate-800 antialiased h-screen overflow-hidden">

    <!-- GIAO DIỆN PUBLIC -->
    <div id="public-view" class="h-full flex flex-col overflow-y-auto">
        <header class="bg-white sticky top-0 z-30 border-b border-slate-100">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="text-2xl font-black tracking-tighter">RFR<span class="text-red-500">+</span></span>
                </div>
                <nav class="hidden md:flex gap-6 font-medium text-slate-600">
                    <a href="#" class="text-black">Trang chủ</a>
                    <a href="#danh-sach">Danh sách</a>
                </nav>
            </div>
        </header>

        <div class="relative bg-slate-900 text-white py-20 text-center">
            <h1 class="text-5xl font-extrabold mb-6">Chào mừng đến với <span class="text-red-500">RFR+</span></h1>
            <p class="text-slate-400 mb-8 max-w-lg mx-auto">Không gian sống đẳng cấp, tiện nghi và hiện đại tại trung tâm.</p>
        </div>

        <div id="danh-sach" class="max-w-7xl mx-auto px-4 py-16 w-full flex-1">
            <h2 class="text-2xl font-bold mb-8">Danh sách phòng khả dụng</h2>
            <div id="public-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
        </div>

        <footer class="py-8 text-center border-t border-slate-200">
            <button onclick="openLoginModal()" class="text-slate-400 hover:text-black transition">
                <i class="ph ph-lock-key text-xl"></i>
            </button>
        </footer>
    </div>

    <!-- GIAO DIỆN ADMIN (ẨN) -->
    <div id="admin-view" class="h-full hidden flex flex-col">
        <div class="bg-slate-900 text-white p-4 flex justify-between items-center">
            <h1 class="font-bold">RFR+ Admin Dashboard</h1>
            <button onclick="logoutAdmin()" class="bg-red-500 px-4 py-2 rounded text-sm font-bold">Thoát</button>
        </div>
        <div class="flex-1 p-6 overflow-y-auto">
            <button onclick="openModal()" class="bg-black text-white px-6 py-2 rounded mb-6 font-bold">+ Thêm phòng</button>
            <table class="w-full bg-white rounded-lg shadow">
                <thead class="bg-slate-50 uppercase text-xs font-bold text-slate-500">
                    <tr><th class="p-4 text-left">Phòng</th><th class="p-4 text-left">Trạng thái</th><th class="p-4">Action</th></tr>
                </thead>
                <tbody id="admin-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Modals -->
    <div id="login-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center">
        <div class="bg-white p-8 rounded-xl w-80 text-center">
            <input type="password" id="admin-pass" placeholder="Mật khẩu Admin" class="w-full p-3 border mb-4 rounded">
            <button onclick="checkLogin()" class="w-full bg-black text-white py-3 rounded">Đăng nhập</button>
        </div>
    </div>

    <!-- Modal Form (Admin) -->
    <div id="room-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-xl w-full max-w-lg">
            <h3 class="text-xl font-bold mb-4">Cập nhật thông tin phòng</h3>
            <form id="room-form" class="space-y-4">
                <input type="hidden" id="roomId">
                <input type="text" id="roomNumber" placeholder="Số phòng" class="w-full p-2 border rounded">
                <input type="number" id="roomPrice" placeholder="Giá tiền" class="w-full p-2 border rounded">
                <select id="roomStatus" class="w-full p-2 border rounded">
                    <option value="empty">Trống</option>
                    <option value="rented">Đã thuê</option>
                </select>
                <div class="flex gap-2 justify-end">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 rounded">Hủy</button>
                    <button type="button" onclick="saveData()" class="px-4 py-2 bg-black text-white rounded">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwYiPmcvIy_J-xZ6DMJTjt7gE-qo_O_ZM7n7KzM8CBsUm0rSx4KyzIw-9-CA_BIS9-xaA/exec';
        let roomsData = [];
        let isAdminView = false;

        function openLoginModal() { document.getElementById('login-modal').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('login-modal').classList.add('hidden'); }
        
        function checkLogin() {
            if(document.getElementById('admin-pass').value === '729903') {
                closeLoginModal();
                isAdminView = true;
                document.getElementById('public-view').classList.add('hidden');
                document.getElementById('admin-view').classList.remove('hidden');
                renderAdminUI();
            }
        }

        function logoutAdmin() {
            isAdminView = false;
            document.getElementById('admin-view').classList.add('hidden');
            document.getElementById('public-view').classList.remove('hidden');
        }

        function openModal(id = null) {
            document.getElementById('room-modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('room-modal').classList.add('hidden'); }

        async function renderPublicUI() {
            const grid = document.getElementById('public-grid');
            grid.innerHTML = roomsData.map(room => `
                <div class="border rounded-xl p-6 shadow-sm hover:shadow-lg transition">
                    <h3 class="text-xl font-bold">Phòng ${room.number}</h3>
                    <p class="text-slate-500 mb-4">${room.price.toLocaleString()} VNĐ</p>
                    <span class="px-3 py-1 ${room.status === 'empty' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'} rounded-full text-xs font-bold uppercase">
                        ${room.status === 'empty' ? 'Còn trống' : 'Đã thuê'}
                    </span>
                </div>
            `).join('');
        }

        function renderAdminUI() {
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = roomsData.map(room => `
                <tr class="border-t">
                    <td class="p-4 font-bold">${room.number}</td>
                    <td class="p-4">${room.status}</td>
                    <td class="p-4"><button onclick="openModal('${room.id}')" class="text-blue-600">Chỉnh sửa</button></td>
                </tr>
            `).join('');
        }

        // Logic tải dữ liệu giữ nguyên như cũ
        window.onload = async () => {
            // Mẫu dữ liệu ban đầu
            roomsData = [
                {id: 1, number: '101', price: 4500000, status: 'empty'},
                {id: 2, number: '202', price: 5000000, status: 'rented'}
            ];
            renderPublicUI();
        };
    </script>
</body>
</html>
