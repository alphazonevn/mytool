<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS. TRANG - Đặt món & Quản lý</title>
    
    <!-- Cài đặt Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Cài đặt FontAwesome cho các biểu tượng (Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Cài đặt React và ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Cài đặt Babel để biên dịch JSX trình duyệt -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700&display=swap');
        
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #F9FAFB;
        }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes pulseSlow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(249,115,22,0.4); } }
        .animate-pulse-slow { animation: pulseSlow 2.5s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- CẤU HÌNH LIÊN KẾT APP SCRIPT ---
        const DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyxIDh3f0ZaZGvRCIgajpq_NzN2h2JFhxOFRVUQhTB3VOADv0sPreu1IYdkm5fWgVOAXA/exec';

        // Dữ liệu thực đơn mặc định
        const MENU_ITEMS = [
          { id: 'm1', name: 'Trà Sữa Trân Châu', price: 35000, category: 'Nước uống', emoji: '🧋', color: 'bg-amber-100 text-amber-700' },
          { id: 'm2', name: 'Cà Phê Sữa Đá', price: 25000, category: 'Nước uống', emoji: '☕', color: 'bg-stone-100 text-stone-700' },
          { id: 'm3', name: 'Trà Đào Cam Sả', price: 40000, category: 'Nước uống', emoji: '🍹', color: 'bg-orange-100 text-orange-700' },
          { id: 'm4', name: 'Sinh Tố Bơ', price: 45000, category: 'Nước uống', emoji: '🥑', color: 'bg-green-100 text-green-700' },
          { id: 'm5', name: 'Bánh Mì Thịt Nướng', price: 30000, category: 'Đồ ăn', emoji: '🥖', color: 'bg-yellow-100 text-yellow-700' },
          { id: 'm6', name: 'Phở Bò', price: 50000, category: 'Đồ ăn', emoji: '🍜', color: 'bg-red-100 text-red-700' },
          { id: 'm7', name: 'Cơm Tấm Sườn Bì', price: 55000, category: 'Đồ ăn', emoji: '🍛', color: 'bg-orange-100 text-orange-800' },
          { id: 'm8', name: 'Gỏi Cuốn', price: 20000, category: 'Đồ ăn', emoji: '🌯', color: 'bg-green-50 text-green-700' },
        ];

        const formatVND = (amount) => {
          return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
        };

        const getAdminPassword = () => localStorage.getItem('msTrangAdminPwd') || 'admin123';
        const setAdminPassword = (pwd) => localStorage.setItem('msTrangAdminPwd', pwd);

        // Icon Component dùng FontAwesome
        const Icon = ({ name, size = 16, className = "" }) => (
            <i className={`fas fa-${name} ${className}`} style={{ fontSize: size, width: size, textAlign: 'center' }}></i>
        );

        let audioCtx = null;
        const playNotificationSound = () => {
          try {
            if (navigator.vibrate) {
              navigator.vibrate([500, 200, 500, 200, 800]); 
            }
          } catch(e) {}

          try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(1318.51, audioCtx.currentTime + 0.1); 
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.05);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
            
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.5);
          } catch (e) {}
        };

        // Giao tiếp API
        const api = {
          getOrders: async (url) => {
            if (!url) return JSON.parse(localStorage.getItem('msTrangOrders') || '[]');
            try {
              const res = await fetch(`${url}?action=getOrders`);
              return await res.json();
            } catch (e) {
              console.error(e);
              return [];
            }
          },
          createOrder: async (url, orderData) => {
            const newOrder = {
              ...orderData,
              id: Math.random().toString(36).substring(2, 9),
              timestamp: new Date().toISOString()
            };
            if (!url) {
              const orders = JSON.parse(localStorage.getItem('msTrangOrders') || '[]');
              orders.push(newOrder);
              localStorage.setItem('msTrangOrders', JSON.stringify(orders));
              return newOrder;
            }
            await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
              body: JSON.stringify({ action: 'createOrder', ...newOrder })
            });
            return newOrder;
          },
          updateOrder: async (url, updatedOrder) => {
            if (!url) {
              let orders = JSON.parse(localStorage.getItem('msTrangOrders') || '[]');
              orders = orders.map(o => o.id === updatedOrder.id ? updatedOrder : o);
              localStorage.setItem('msTrangOrders', JSON.stringify(orders));
              return updatedOrder;
            }
            await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'updateOrder', ...updatedOrder })
            });
            return updatedOrder;
          }
        };

        const CustomerView = ({ scriptUrl }) => {
          const [cart, setCart] = useState([]);
          const [isCartOpen, setIsCartOpen] = useState(false);
          const [category, setCategory] = useState('Tất cả');
          
          const [customerName, setCustomerName] = useState(localStorage.getItem('msTrangCustName') || '');
          const [customerPhone, setCustomerPhone] = useState(localStorage.getItem('msTrangCustPhone') || '');
          
          const [errorMsg, setErrorMsg] = useState('');
          const [isSubmitting, setIsSubmitting] = useState(false);
          const [orderSuccess, setOrderSuccess] = useState(false);

          const categories = ['Tất cả', ...new Set(MENU_ITEMS.map(item => item.category))];
          const filteredMenu = category === 'Tất cả' ? MENU_ITEMS : MENU_ITEMS.filter(m => m.category === category);

          const addToCart = (item) => {
            setCart(prev => {
              const existing = prev.find(i => i.id === item.id);
              if (existing) return prev.map(i => i.id === item.id ? { ...i, quantity: i.quantity + 1 } : i);
              return [...prev, { ...item, quantity: 1 }];
            });
            setIsCartOpen(true);
          };

          const updateQuantity = (id, delta) => {
            setCart(prev => prev.map(item => {
              if (item.id === id) return { ...item, quantity: Math.max(0, item.quantity + delta) };
              return item;
            }).filter(item => item.quantity > 0));
          };

          const totalAmount = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

          const handleCheckout = async () => {
            if (!customerName.trim() || !customerPhone.trim()) {
              setErrorMsg("Vui lòng nhập Tên/Số bàn và Số điện thoại!");
              return;
            }
            setErrorMsg('');
            setIsSubmitting(true);
            
            localStorage.setItem('msTrangCustName', customerName);
            localStorage.setItem('msTrangCustPhone', customerPhone);
            
            try {
              await api.createOrder(scriptUrl, {
                customerName,
                customerPhone,
                items: cart,
                total: totalAmount,
                status: 'pending'
              });
              setCart([]);
              setIsCartOpen(false);
              setOrderSuccess(true);
              setCustomerName('');
              setTimeout(() => setOrderSuccess(false), 4000);
            } catch (e) {
              setErrorMsg("Có lỗi xảy ra, vui lòng thử lại!");
            } finally {
              setIsSubmitting(false);
            }
          };

          return (
            <div className="relative">
              {orderSuccess && (
                <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-50 bg-green-500 text-white px-6 py-3 rounded-full shadow-lg font-bold flex items-center gap-2 animate-bounce">
                  <Icon name="check-circle" size={20} /> Đặt món thành công!
                </div>
              )}

              <div className="mb-6">
                <h2 className="text-3xl font-extrabold text-gray-800 mb-2">Xin chào 👋</h2>
                <p className="text-gray-500">Mời bạn chọn món ngon hôm nay</p>
              </div>

              <div className="flex gap-2 overflow-x-auto pb-2 mb-6 scrollbar-hide">
                {categories.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setCategory(cat)}
                    className={`whitespace-nowrap px-5 py-2.5 rounded-full font-semibold transition-all shadow-sm ${
                      category === cat ? 'bg-orange-500 text-white shadow-orange-200' : 'bg-white text-gray-600 hover:bg-gray-50 border border-gray-100'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                {filteredMenu.map(item => (
                  <div key={item.id} className="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow flex flex-col items-center relative overflow-hidden group">
                    <div className={`w-20 h-20 md:w-24 md:h-24 ${item.color} rounded-full flex items-center justify-center text-4xl mb-4 shadow-inner transform group-hover:scale-105 transition-transform`}>
                      {item.emoji}
                    </div>
                    <h3 className="font-bold text-gray-800 text-center text-sm md:text-base leading-tight mb-1">{item.name}</h3>
                    <p className="text-orange-600 font-extrabold mb-4">{formatVND(item.price)}</p>
                    <button 
                      onClick={() => addToCart(item)}
                      className="mt-auto w-full bg-orange-50 text-orange-600 hover:bg-orange-500 hover:text-white py-2.5 rounded-2xl font-bold flex justify-center items-center gap-2 transition-colors"
                    >
                      <Icon name="plus" size={16} /> Thêm
                    </button>
                  </div>
                ))}
              </div>

              {cart.length > 0 && !isCartOpen && (
                <button 
                  onClick={() => setIsCartOpen(true)}
                  className="fixed bottom-6 right-6 z-40 bg-orange-500 text-white p-4 rounded-full shadow-2xl flex items-center justify-center animate-pulse-slow hover:scale-105 transition-transform"
                >
                  <div className="relative">
                    <Icon name="shopping-cart" size={24} />
                    <span className="absolute -top-3 -right-3 bg-red-500 text-white text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center border-2 border-white">
                      {cart.reduce((sum, item) => sum + item.quantity, 0)}
                    </span>
                  </div>
                </button>
              )}

              <div className={`fixed inset-y-0 right-0 w-full md:w-96 bg-white shadow-2xl transform transition-transform duration-300 ease-in-out z-50 flex flex-col ${isCartOpen ? 'translate-x-0' : 'translate-x-full'}`}>
                <div className="p-5 flex justify-between items-center border-b border-gray-100 bg-gray-50/50">
                  <h2 className="text-xl font-extrabold text-gray-800 flex items-center gap-2">
                    <Icon name="shopping-cart" className="text-orange-500" size={20} /> Giỏ Hàng
                  </h2>
                  <button onClick={() => setIsCartOpen(false)} className="w-8 h-8 flex items-center justify-center bg-gray-200 hover:bg-gray-300 rounded-full text-gray-600 transition-colors">
                    <Icon name="times" size={16} />
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto p-5 space-y-4">
                  {cart.length === 0 ? (
                    <div className="h-full flex flex-col items-center justify-center text-gray-400">
                      <Icon name="utensils" size={48} className="mb-4 opacity-50 text-gray-300" />
                      <p>Giỏ hàng trống</p>
                    </div>
                  ) : (
                    cart.map(item => (
                      <div key={item.id} className="flex items-center justify-between bg-white p-3 rounded-2xl border border-gray-100 shadow-sm">
                        <div className="flex items-center gap-3">
                          <div className={`w-12 h-12 ${item.color} rounded-xl flex items-center justify-center text-2xl`}>
                            {item.emoji}
                          </div>
                          <div>
                            <h4 className="font-bold text-gray-800 text-sm">{item.name}</h4>
                            <p className="text-orange-600 font-semibold text-sm">{formatVND(item.price)}</p>
                          </div>
                        </div>
                        <div className="flex items-center gap-3 bg-gray-100 rounded-full px-2 py-1">
                          <button onClick={() => updateQuantity(item.id, -1)} className="text-gray-500 hover:text-orange-600 p-1"><Icon name="minus" size={12}/></button>
                          <span className="font-bold w-4 text-center text-sm">{item.quantity}</span>
                          <button onClick={() => updateQuantity(item.id, 1)} className="text-gray-500 hover:text-orange-600 p-1"><Icon name="plus" size={12}/></button>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="p-5 border-t border-gray-100 bg-gray-50 rounded-t-3xl shadow-[0_-4px_15px_-3px_rgba(0,0,0,0.05)]">
                    <div className="mb-4 space-y-3">
                      <div>
                        <label className="block text-sm font-bold text-gray-700 mb-1">Số bàn hoặc Tên của bạn <span className="text-red-500">*</span></label>
                        <input 
                          type="text" 
                          placeholder="VD: Bàn số 5, Anh Tuấn..."
                          className="w-full p-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-500 bg-white"
                          value={customerName}
                          onChange={e => setCustomerName(e.target.value)}
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-bold text-gray-700 mb-1">Số điện thoại liên hệ <span className="text-red-500">*</span></label>
                        <input 
                          type="tel" 
                          placeholder="VD: 0901234567"
                          className="w-full p-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-500 bg-white"
                          value={customerPhone}
                          onChange={e => setCustomerPhone(e.target.value)}
                        />
                      </div>
                      {errorMsg && <p className="text-red-500 text-xs font-semibold mt-2 animate-pulse">{errorMsg}</p>}
                    </div>
                    <div className="flex justify-between items-end mb-4">
                      <span className="text-gray-500 font-semibold">Tổng thanh toán</span>
                      <span className="text-2xl font-extrabold text-orange-600">{formatVND(totalAmount)}</span>
                    </div>
                    <button 
                      onClick={handleCheckout}
                      disabled={isSubmitting}
                      className="w-full bg-orange-500 hover:bg-orange-600 disabled:bg-gray-400 text-white py-4 rounded-2xl font-bold text-lg shadow-lg shadow-orange-200 transition-all active:scale-[0.98] flex justify-center items-center gap-2"
                    >
                      {isSubmitting ? <Icon name="spinner" className="fa-spin" /> : <Icon name="check-circle" />}
                      {isSubmitting ? 'Đang gửi...' : 'Xác nhận Đặt Món'}
                    </button>
                  </div>
                )}
              </div>
              
              {isCartOpen && <div className="fixed inset-0 bg-black/40 z-40 md:hidden backdrop-blur-sm" onClick={() => setIsCartOpen(false)}></div>}
            </div>
          );
        };

        const StaffView = ({ scriptUrl }) => {
          const [orders, setOrders] = useState([]);
          const [loading, setLoading] = useState(true);
          const [editingOrder, setEditingOrder] = useState(null);
          const prevOrdersRef = useRef([]);

          const fetchOrders = useCallback(async () => {
            const data = await api.getOrders(scriptUrl);
            const existingIds = new Set(prevOrdersRef.current.map(o => o.id));
            const newOrders = data.filter(o => !existingIds.has(o.id));
            
            if (newOrders.length > 0 && prevOrdersRef.current.length > 0) {
              playNotificationSound();
            }
            
            data.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            setOrders(data);
            prevOrdersRef.current = data;
            setLoading(false);
          }, [scriptUrl]);

          useEffect(() => {
            fetchOrders();
            const interval = setInterval(fetchOrders, 5000);
            return () => clearInterval(interval);
          }, [fetchOrders]);

          const handleCompleteOrder = async (id) => {
            const order = orders.find(o => o.id === id);
            const updatedOrder = { ...order, status: 'completed' };
            setOrders(prev => prev.map(o => o.id === id ? updatedOrder : o));
            await api.updateOrder(scriptUrl, updatedOrder);
          };

          const handleSaveEdit = async (editedItems, newTotal) => {
            const updatedOrder = { ...editingOrder, items: editedItems, total: newTotal };
            setOrders(prev => prev.map(o => o.id === updatedOrder.id ? updatedOrder : o));
            setEditingOrder(null);
            await api.updateOrder(scriptUrl, updatedOrder);
          };

          const pendingOrders = orders.filter(o => o.status === 'pending');
          const completedOrders = orders.filter(o => o.status === 'completed').slice(0, 5);

          return (
            <div>
              <div className="flex justify-between items-center mb-6">
                <div>
                  <h2 className="text-2xl font-extrabold text-gray-800 flex items-center gap-2">
                    <Icon name="bell" size={24} className="text-orange-500" /> Quản lý Đơn hàng
                  </h2>
                  <p className="text-sm text-gray-500 mt-1">Tự động cập nhật 5s/lần</p>
                </div>
              </div>

              {loading ? (
                <div className="flex justify-center p-12 text-gray-400">
                  <Icon name="spinner" size={40} className="fa-spin opacity-50" />
                </div>
              ) : (
                <div className="space-y-8">
                  <section>
                    <h3 className="font-bold text-lg mb-4 text-orange-600 bg-orange-50 inline-block px-4 py-1 rounded-full">
                      Đang chờ xử lý ({pendingOrders.length})
                    </h3>
                    {pendingOrders.length === 0 ? (
                      <div className="bg-gray-50 border-2 border-dashed border-gray-200 rounded-2xl p-8 text-center text-gray-400 font-semibold">
                        Chưa có đơn hàng nào
                      </div>
                    ) : (
                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        {pendingOrders.map(order => (
                          <div key={order.id} className="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow relative overflow-hidden group">
                            <div className="absolute top-0 left-0 w-1.5 h-full bg-orange-400"></div>
                            <div className="flex justify-between items-start mb-4 pl-2">
                              <div>
                                <span className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1 block">Khách / Bàn</span>
                                <h3 className="font-extrabold text-xl text-gray-800">{order.customerName}</h3>
                                {order.customerPhone && (
                                  <a href={`tel:${order.customerPhone}`} className="text-sm font-semibold text-blue-500 hover:underline inline-flex items-center gap-1 mt-1">
                                    📞 {order.customerPhone}
                                  </a>
                                )}
                              </div>
                              <span className="text-xs font-semibold bg-gray-100 text-gray-600 px-2 py-1 rounded-lg">
                                {new Date(order.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                              </span>
                            </div>
                            
                            <div className="space-y-3 mb-6 bg-gray-50/50 p-3 rounded-2xl border border-gray-100">
                              {order.items.map(item => (
                                <div key={item.id} className="flex justify-between text-sm items-center">
                                  <span className="font-semibold text-gray-700">
                                    <span className="bg-white border text-orange-600 px-2 py-0.5 rounded mr-2 font-bold">{item.quantity}x</span> 
                                    {item.name}
                                  </span>
                                  <span className="font-bold text-gray-500">{formatVND(item.price * item.quantity)}</span>
                                </div>
                              ))}
                            </div>
                            
                            <div className="border-t border-dashed border-gray-200 pt-4 flex justify-between items-center mb-5">
                              <span className="font-bold text-gray-500">Tổng cộng</span>
                              <span className="font-extrabold text-orange-600 text-xl">{formatVND(order.total)}</span>
                            </div>
                            
                            <div className="flex gap-2">
                              <button 
                                onClick={() => setEditingOrder(order)} 
                                className="flex-1 bg-white border-2 border-gray-200 hover:border-gray-300 hover:bg-gray-50 text-gray-700 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 transition-colors"
                              >
                                <Icon name="pen-to-square" size={14}/> Sửa đơn
                              </button>
                              <button 
                                onClick={() => handleCompleteOrder(order.id)} 
                                className="flex-1 bg-green-500 hover:bg-green-600 text-white py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 transition-transform active:scale-95 shadow-md shadow-green-200"
                              >
                                <Icon name="check-circle" size={16}/> Xong
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </section>

                  {completedOrders.length > 0 && (
                    <section className="opacity-70 grayscale-[30%]">
                      <h3 className="font-bold text-lg mb-4 text-gray-600 bg-gray-100 inline-block px-4 py-1 rounded-full">
                        Đã hoàn thành gần đây
                      </h3>
                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        {completedOrders.map(order => (
                          <div key={order.id} className="bg-gray-50 p-4 rounded-3xl border border-gray-200">
                            <div className="flex justify-between items-start mb-2">
                              <div>
                                <h3 className="font-bold text-gray-600">{order.customerName}</h3>
                                {order.customerPhone && <p className="text-xs text-gray-500">{order.customerPhone}</p>}
                              </div>
                              <span className="text-xs text-gray-400">{new Date(order.timestamp).toLocaleTimeString()}</span>
                            </div>
                            <div className="text-sm text-gray-500 mb-2 truncate">
                               {order.items.map(i => `${i.quantity}x ${i.name}`).join(', ')}
                            </div>
                            <div className="font-bold text-gray-500 text-right">{formatVND(order.total)}</div>

            if (newPwd.length < 6) {

              setError('Xác nhận mật khẩu không khớp!');
              return;

            setAdminPassword(newPwd);
            setSuccess(true);
            setError('');

              setCurrentPwd('');
              setNewPwd('');
              setConfirmPwd('');

            const data = await api.getOrders(scriptUrl);

            setLoading(false);

            fetchOrders();

                        onClick={handleLogout}
                        title="Đăng xuất"
                        className="w-10 h-10 flex items-center justify-center text-red-500 hover:bg-red-50 hover:text-red-600 rounded-full transition-colors mr-1"
                      >
                        <Icon name="sign-out-alt" size={18} />
                      </button>
                    )}

                    <button
                      onClick={() => setIsSettingsOpen(true)}
                      className="w-10 h-10 flex items-center justify-center text-gray-500 hover:text-gray-800 rounded-full transition-colors relative"
                    >
                      <Icon name="cog" size={20} />
                      {!scriptUrl && <span className="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full animate-ping"></span>}
                    </button>
                  </div>
                </div>
              </nav>

              <main className="max-w-6xl mx-auto p-4 md:p-6 pb-24 md:pb-8 mt-2 animate-fade-in-up">
                 {!scriptUrl && (
                   <div className="mb-6 bg-blue-50 border border-blue-200 text-blue-700 px-4 py-3 rounded-2xl text-sm font-medium flex items-center justify-between">
                     <span>Đang chạy ở chế độ Dùng thử (Lưu tạm thời). Bấm biểu tượng bánh răng để cài đặt Google Sheets.</span>
                   </div>
                 )}
                 
                 {activeTab === 'customer' && <CustomerView scriptUrl={scriptUrl} />}
                 {activeTab === 'staff' && (
                   isAuthenticated ? <StaffView scriptUrl={scriptUrl} /> : <LoginView onLogin={handleLoginSuccess} />
                 )}
                 {activeTab === 'admin' && (
                   isAuthenticated ? <AdminView scriptUrl={scriptUrl} /> : <LoginView onLogin={handleLoginSuccess} />
                 )}
              </main>

              <SettingsModal 
                isOpen={isSettingsOpen} 
                onClose={() => setIsSettingsOpen(false)} 
                scriptUrl={scriptUrl}
                setScriptUrl={setScriptUrl}
              />
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
