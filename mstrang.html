<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>MS. TRANG - Đặt món & Quản lý</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700&display=swap');
        
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #F9FAFB;
            -webkit-tap-highlight-color: transparent; /* Tắt highlight xanh khi chạm trên mobile */
        }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes pulseSlow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(249,115,22,0.4); } }
        .animate-pulse-slow { animation: pulseSlow 2.5s infinite; }
        
        /* Đảm bảo vùng an toàn (Safe Area) cho iPhone tai thỏ/Dynamic Island */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyxIDh3f0ZaZGvRCIgajpq_NzN2h2JFhxOFRVUQhTB3VOADv0sPreu1IYdkm5fWgVOAXA/exec';

        const DEFAULT_MENU_ITEMS = [
          { id: 'm1', name: 'Trà Sữa Trân Châu', price: 35000, category: 'Nước uống', emoji: '🧋', color: 'bg-amber-100 text-amber-700' },
          { id: 'm2', name: 'Cà Phê Sữa Đá', price: 25000, category: 'Nước uống', emoji: '☕', color: 'bg-stone-100 text-stone-700' },
          { id: 'm3', name: 'Trà Đào Cam Sả', price: 40000, category: 'Nước uống', emoji: '🍹', color: 'bg-orange-100 text-orange-700' },
          { id: 'm4', name: 'Sinh Tố Bơ', price: 45000, category: 'Nước uống', emoji: '🥑', color: 'bg-green-100 text-green-700' },
          { id: 'm5', name: 'Bánh Mì Thịt Nướng', price: 30000, category: 'Đồ ăn', emoji: '🥖', color: 'bg-yellow-100 text-yellow-700' },
        ];

        const COLOR_OPTIONS = [
          { label: 'Cam', value: 'bg-orange-100 text-orange-700' },
          { label: 'Xanh lá', value: 'bg-green-100 text-green-700' },
          { label: 'Đỏ', value: 'bg-red-100 text-red-700' },
          { label: 'Vàng', value: 'bg-yellow-100 text-yellow-700' },
          { label: 'Nâu/Xám', value: 'bg-stone-100 text-stone-700' },
          { label: 'Hổ phách', value: 'bg-amber-100 text-amber-700' },
          { label: 'Xanh dương', value: 'bg-blue-100 text-blue-700' },
          { label: 'Tím', value: 'bg-purple-100 text-purple-700' }
        ];

        const formatVND = (amount) => {
          return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(Number(amount));
        };

        const getAdminPassword = () => localStorage.getItem('msTrangAdminPwd') || 'admin123';
        const setAdminPassword = (pwd) => localStorage.setItem('msTrangAdminPwd', pwd);

        const Icon = ({ name, size = 16, className = "" }) => (
            <i className={`fas fa-${name} ${className}`} style={{ fontSize: size, width: size, textAlign: 'center' }}></i>
        );

        let audioCtx = null;
        const playNotificationSound = () => {
          try {
            if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 800]); 
          } catch(e) {}

          try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(1318.51, audioCtx.currentTime + 0.1); 
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.05);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
            
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.5);
          } catch (e) {}
        };

        const playCompletedSound = () => {
          try {
            if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 600]); 
          } catch(e) {}
          try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const notes = [523.25, 659.25, 783.99, 1046.50]; 
            notes.forEach((freq, i) => {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.type = 'triangle';
              osc.frequency.value = freq;
              const time = audioCtx.currentTime + i * 0.15;
              gain.gain.setValueAtTime(0, time);
              gain.gain.linearRampToValueAtTime(0.6, time + 0.05);
              gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
              osc.start(time);
              osc.stop(time + 0.5);
            });
          } catch (e) {}
        };

        const api = {
          getOrders: async (url) => {
            if (!url) return JSON.parse(localStorage.getItem('msTrangOrders') || '[]');
            try {
              const res = await fetch(`${url}?action=getOrders`);
              return await res.json();
            } catch (e) {
              return [];
            }
          },
          getMenu: async (url) => {
            if (!url) return JSON.parse(localStorage.getItem('msTrangMenu') || JSON.stringify(DEFAULT_MENU_ITEMS));
            try {
              const res = await fetch(`${url}?action=getMenu`);
              const data = await res.json();
              return data.length > 0 ? data : DEFAULT_MENU_ITEMS;
            } catch (e) {
              return DEFAULT_MENU_ITEMS;
            }
          },
          createOrder: async (url, orderData) => {
            const newOrder = { ...orderData, id: Math.random().toString(36).substring(2, 9), timestamp: new Date().toISOString() };
            if (!url) {
              const orders = JSON.parse(localStorage.getItem('msTrangOrders') || '[]');
              orders.push(newOrder);
              localStorage.setItem('msTrangOrders', JSON.stringify(orders));
              return newOrder;
            }
            await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'createOrder', ...newOrder }) });
            return newOrder;
          },
          updateOrder: async (url, updatedOrder) => {
            if (!url) {
              let orders = JSON.parse(localStorage.getItem('msTrangOrders') || '[]');
              orders = orders.map(o => o.id === updatedOrder.id ? updatedOrder : o);
              localStorage.setItem('msTrangOrders', JSON.stringify(orders));
              return updatedOrder;
            }
            await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'updateOrder', ...updatedOrder }) });
            return updatedOrder;
          },
          createMenuItem: async (url, itemData) => {
            const newItem = { ...itemData, id: 'm' + Math.random().toString(36).substring(2, 9) };
            if (!url) {
              const menu = JSON.parse(localStorage.getItem('msTrangMenu') || JSON.stringify(DEFAULT_MENU_ITEMS));
              menu.push(newItem);
              localStorage.setItem('msTrangMenu', JSON.stringify(menu));
              return newItem;
            }
            await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'createMenuItem', item: newItem }) });
            return newItem;
          },
          updateMenuItem: async (url, itemData) => {
            if (!url) {
              let menu = JSON.parse(localStorage.getItem('msTrangMenu') || JSON.stringify(DEFAULT_MENU_ITEMS));
              menu = menu.map(m => m.id === itemData.id ? itemData : m);
              localStorage.setItem('msTrangMenu', JSON.stringify(menu));
              return itemData;
            }
            await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'updateMenuItem', item: itemData }) });
            return itemData;
          },
          deleteMenuItem: async (url, id) => {
            if (!url) {
              let menu = JSON.parse(localStorage.getItem('msTrangMenu') || JSON.stringify(DEFAULT_MENU_ITEMS));
              menu = menu.filter(m => m.id !== id);
              localStorage.setItem('msTrangMenu', JSON.stringify(menu));
              return true;
            }
            await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'deleteMenuItem', id }) });
            return true;
          }
        };

        const CustomerView = ({ scriptUrl, menuItems }) => {
          const [viewMode, setViewMode] = useState('order'); 
          const [cart, setCart] = useState([]);
          const [isCartOpen, setIsCartOpen] = useState(false);
          const [category, setCategory] = useState('Tất cả');
          
          const [customerName, setCustomerName] = useState(localStorage.getItem('msTrangCustName') || '');
          const [customerPhone, setCustomerPhone] = useState(localStorage.getItem('msTrangCustPhone') || '');
          
          const [errorMsg, setErrorMsg] = useState('');
          const [isSubmitting, setIsSubmitting] = useState(false);
          const [orderSuccess, setOrderSuccess] = useState(false);

          const [myOrders, setMyOrders] = useState([]);
          const [isLoadingHistory, setIsLoadingHistory] = useState(false);
          const prevMyOrdersRef = useRef([]);

          const categories = ['Tất cả', ...new Set(menuItems.map(item => item.category))];
          const filteredMenu = category === 'Tất cả' ? menuItems : menuItems.filter(m => m.category === category);

          const fetchMyOrders = async () => {
            setIsLoadingHistory(true);
            const savedOrderIds = JSON.parse(localStorage.getItem('msTrangMyOrderIds') || '[]');
            const allOrders = await api.getOrders(scriptUrl);
            const myOrdersFiltered = allOrders.filter(o => savedOrderIds.includes(o.id));
            
            if (prevMyOrdersRef.current.length > 0) {
              const newlyCompleted = myOrdersFiltered.some(newOrder => {
                const oldOrder = prevMyOrdersRef.current.find(o => o.id === newOrder.id);
                return oldOrder && oldOrder.status === 'pending' && newOrder.status === 'completed';
              });
              if (newlyCompleted) playCompletedSound();
            }
            prevMyOrdersRef.current = myOrdersFiltered;

            myOrdersFiltered.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            setMyOrders(myOrdersFiltered);
            setIsLoadingHistory(false);
          };

          useEffect(() => {
            if (viewMode === 'history') {
              fetchMyOrders();
              const interval = setInterval(fetchMyOrders, 5000);
              return () => clearInterval(interval);
            }
          }, [viewMode, scriptUrl]);

          const addToCart = (item) => {
            setCart(prev => {
              const existing = prev.find(i => i.id === item.id);
              if (existing) return prev.map(i => i.id === item.id ? { ...i, quantity: i.quantity + 1 } : i);
              return [...prev, { ...item, quantity: 1 }];
            });
            setIsCartOpen(true);
          };

          const updateQuantity = (id, delta) => {
            setCart(prev => prev.map(item => {
              if (item.id === id) return { ...item, quantity: Math.max(0, item.quantity + delta) };
              return item;
            }).filter(item => item.quantity > 0));
          };

          const totalAmount = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

          const handleCheckout = async () => {
            if (!customerName.trim() || !customerPhone.trim()) {
              setErrorMsg("Vui lòng nhập Tên/Số bàn và Số điện thoại!");
              return;
            }
            setErrorMsg('');
            setIsSubmitting(true);
            
            localStorage.setItem('msTrangCustName', customerName);
            localStorage.setItem('msTrangCustPhone', customerPhone);
            
            try {
              const createdOrder = await api.createOrder(scriptUrl, {
                customerName,
                customerPhone,
                items: cart,
                total: totalAmount,
                status: 'pending'
              });
              
              const orderIds = JSON.parse(localStorage.getItem('msTrangMyOrderIds') || '[]');
              orderIds.push(createdOrder.id);
              localStorage.setItem('msTrangMyOrderIds', JSON.stringify(orderIds));

              setCart([]);
              setIsCartOpen(false);
              setOrderSuccess(true);
              setTimeout(() => setOrderSuccess(false), 4000);
            } catch (e) {
              setErrorMsg("Có lỗi xảy ra, vui lòng thử lại!");
            } finally {
              setIsSubmitting(false);
            }
          };

          return (
            <div className="relative h-full">
              {/* Alert Hoàn thành */}
              {orderSuccess && (
                <div className="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 bg-green-500 text-white px-6 py-3 rounded-full shadow-lg font-bold flex items-center gap-2 animate-bounce w-[90%] md:w-auto max-w-sm justify-center">
                  <Icon name="check-circle" size={20} /> Đặt món thành công!
                </div>
              )}

              {/* Điều hướng Trạng thái */}
              <div className="flex bg-gray-200/50 p-1.5 rounded-2xl w-full max-w-sm mb-6 mx-auto shadow-inner">
                <button 
                  onClick={() => setViewMode('order')}
                  className={`flex-1 py-2.5 rounded-xl font-bold text-sm transition-all ${viewMode === 'order' ? 'bg-white text-orange-600 shadow' : 'text-gray-500 hover:text-gray-800'}`}
                >
                  <Icon name="utensils" className="mr-2" /> Đặt món
                </button>
                <button 
                  onClick={() => setViewMode('history')}
                  className={`flex-1 py-2.5 rounded-xl font-bold text-sm transition-all ${viewMode === 'history' ? 'bg-white text-orange-600 shadow' : 'text-gray-500 hover:text-gray-800'}`}
                >
                  <Icon name="clock-rotate-left" className="mr-2" /> Đơn của tôi
                </button>
              </div>

              {/* Màn hình Đặt Món */}
              {viewMode === 'order' ? (
                <div className="animate-fade-in-up pb-10">
                  <div className="mb-4">
                    <h2 className="text-2xl md:text-3xl font-extrabold text-gray-800 mb-1">Xin chào 👋</h2>
                    <p className="text-gray-500 text-sm md:text-base">Mời bạn chọn món ngon hôm nay</p>
                  </div>

                  <div className="flex gap-2 overflow-x-auto pb-2 mb-4 scrollbar-hide -mx-4 px-4 md:mx-0 md:px-0">
                    {categories.map(cat => (
                      <button
                        key={cat}
                        onClick={() => setCategory(cat)}
                        className={`whitespace-nowrap px-4 py-2 rounded-full font-semibold transition-all text-sm shadow-sm ${
                          category === cat ? 'bg-orange-500 text-white shadow-orange-200' : 'bg-white text-gray-600 hover:bg-gray-50 border border-gray-100'
                        }`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>

                  <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4">
                    {filteredMenu.map(item => (
                      <div key={item.id} className="bg-white p-3 md:p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center relative overflow-hidden active:scale-95 transition-transform">
                        <div className={`w-16 h-16 md:w-24 md:h-24 ${item.color} rounded-full flex items-center justify-center text-3xl md:text-4xl mb-3 shadow-inner overflow-hidden`}>
                          {item.image ? <img src={item.image} alt={item.name} className="w-full h-full object-cover"/> : item.emoji}
                        </div>
                        <h3 className="font-bold text-gray-800 text-center text-[13px] md:text-base leading-tight mb-1">{item.name}</h3>
                        <p className="text-orange-600 font-extrabold text-sm md:text-base mb-3">{formatVND(item.price)}</p>
                        <button 
                          onClick={() => addToCart(item)}
                          className="mt-auto w-full bg-orange-50 text-orange-600 active:bg-orange-500 active:text-white md:hover:bg-orange-500 md:hover:text-white py-2 rounded-xl font-bold flex justify-center items-center gap-2 transition-colors text-sm"
                        >
                          <Icon name="plus" size={14} /> Thêm
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              ) : (
                /* Màn hình Lịch sử (Đơn của tôi) */
                <div className="animate-fade-in-up pb-10">
                  <div className="mb-4 flex justify-between items-end">
                    <div>
                      <h2 className="text-xl md:text-2xl font-extrabold text-gray-800 mb-1">Đơn hàng của bạn</h2>
                      <p className="text-gray-500 text-xs md:text-sm">Theo dõi trạng thái các món đã đặt</p>
                    </div>
                    <button onClick={fetchMyOrders} className="bg-white border p-2 rounded-full text-gray-500 active:bg-gray-100 shadow-sm transition"><Icon name="rotate-right"/></button>
                  </div>

                  {isLoadingHistory ? (
                     <div className="text-center py-12 text-gray-400"><Icon name="spinner" className="fa-spin text-4xl opacity-50"/></div>
                  ) : myOrders.length === 0 ? (
                     <div className="bg-white rounded-3xl p-8 md:p-10 text-center border border-gray-100 shadow-sm">
                       <Icon name="receipt" size={48} className="text-gray-200 mb-4"/>
                       <p className="font-bold text-gray-400 text-sm md:text-base">Bạn chưa có đơn hàng nào.</p>
                       <button onClick={() => setViewMode('order')} className="mt-4 bg-orange-100 text-orange-600 font-bold px-6 py-2.5 rounded-full text-sm">Đặt món ngay</button>
                     </div>
                  ) : (
                     <div className="space-y-4">
                       {myOrders.map(order => (
                         <div key={order.id} className="bg-white p-4 md:p-5 rounded-2xl md:rounded-3xl shadow-sm border border-gray-100 relative overflow-hidden">
                           <div className={`absolute top-0 left-0 w-1.5 h-full ${order.status === 'pending' ? 'bg-orange-400' : 'bg-green-500'}`}></div>
                           <div className="flex justify-between items-start mb-3 pl-3">
                             <div>
                               <p className="text-[10px] md:text-xs text-gray-400 font-bold mb-1">{new Date(order.timestamp).toLocaleString()}</p>
                               <h4 className="font-bold text-gray-800 text-sm md:text-base">Tên/Bàn: <span className="text-orange-600">{order.customerName}</span></h4>
                             </div>
                             {order.status === 'pending' ? (
                               <span className="bg-orange-50 text-orange-600 px-2 py-1 rounded-full text-[10px] md:text-xs font-bold border border-orange-200 flex items-center gap-1">
                                 <Icon name="clock" size={10}/> Đang xử lý
                               </span>
                             ) : (
                               <span className="bg-green-50 text-green-600 px-2 py-1 rounded-full text-[10px] md:text-xs font-bold border border-green-200 flex items-center gap-1">
                                 <Icon name="check-circle" size={10}/> Hoàn thành
                               </span>
                             )}
                           </div>
                           
                           <div className="bg-gray-50 p-3 rounded-xl border border-gray-100 mb-3 pl-4">
                             {order.items.map(item => (
                               <div key={item.id} className="flex justify-between text-xs md:text-sm mb-2 last:mb-0">
                                 <span className="font-medium text-gray-700">
                                   <b className="text-orange-600 mr-2">{item.quantity}x</b> {item.name}
                                 </span>
                                 <span className="text-gray-500">{formatVND(item.price * item.quantity)}</span>
                               </div>
                             ))}
                           </div>
                           
                           <div className="flex justify-between items-center pl-3 border-t border-dashed border-gray-200 pt-3">
                             <span className="text-gray-500 font-semibold text-xs md:text-sm">Tổng thanh toán</span>
                             <span className="text-lg md:text-xl font-extrabold text-gray-900">{formatVND(order.total)}</span>
                           </div>
                         </div>
                       ))}
                     </div>
                  )}
                </div>
              )}

              {/* Float Cart Button */}
              {cart.length > 0 && !isCartOpen && viewMode === 'order' && (
                <button 
                  onClick={() => setIsCartOpen(true)}
                  className="fixed bottom-[80px] md:bottom-8 right-4 md:right-8 z-40 bg-orange-500 text-white p-4 rounded-full shadow-2xl flex items-center justify-center animate-pulse-slow active:scale-95 transition-transform"
                >
                  <div className="relative">
                    <Icon name="shopping-cart" size={24} />
                    <span className="absolute -top-3 -right-3 bg-red-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">
                      {cart.reduce((sum, item) => sum + item.quantity, 0)}
                    </span>
                  </div>
                </button>
              )}

              {/* Khung Giỏ Hàng (Cart Drawer) sử dụng dvh để fix lỗi Mobile */}
              <div className={`fixed inset-y-0 right-0 w-full md:w-[400px] h-dvh bg-white shadow-2xl transform transition-transform duration-300 ease-in-out z-[70] flex flex-col ${isCartOpen ? 'translate-x-0' : 'translate-x-full'}`}>
                <div className="p-4 md:p-5 flex justify-between items-center border-b border-gray-100 bg-gray-50/50">
                  <h2 className="text-lg md:text-xl font-extrabold text-gray-800 flex items-center gap-2">
                    <Icon name="shopping-cart" className="text-orange-500" size={20} /> Giỏ Hàng
                  </h2>
                  <button onClick={() => setIsCartOpen(false)} className="w-8 h-8 flex items-center justify-center bg-gray-200 rounded-full text-gray-600 active:bg-gray-300 transition-colors">
                    <Icon name="times" size={16} />
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                  {cart.length === 0 ? (
                    <div className="h-full flex flex-col items-center justify-center text-gray-400">
                      <Icon name="utensils" size={48} className="mb-4 opacity-30 text-gray-400" />
                      <p className="text-sm font-medium">Giỏ hàng trống</p>
                    </div>
                  ) : (
                    cart.map(item => (
                      <div key={item.id} className="flex items-center justify-between bg-white p-3 rounded-2xl border border-gray-100 shadow-sm">
                        <div className="flex items-center gap-3">
                          <div className={`w-10 h-10 ${item.color} rounded-xl flex items-center justify-center text-xl overflow-hidden`}>
                            {item.image ? <img src={item.image} className="w-full h-full object-cover"/> : item.emoji}
                          </div>
                          <div>
                            <h4 className="font-bold text-gray-800 text-sm line-clamp-1">{item.name}</h4>
                            <p className="text-orange-600 font-semibold text-xs">{formatVND(item.price)}</p>
                          </div>
                        </div>

             setEditData({ name: '', price: '', category: '', emoji: '🍲', color: COLOR_OPTIONS[0].value, image: '' });
             setIsEditing(true);
          };

          const handleImageUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            setIsUploadingImg(true);
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
              const img = new Image();
              img.src = event.target.result;
              img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 400; 
                const scaleSize = Math.min(1, MAX_WIDTH / img.width);
                canvas.width = img.width * scaleSize;
                canvas.height = img.height * scaleSize;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
                
                setEditData(prev => ({...prev, image: compressedBase64}));
                setIsUploadingImg(false);
              }
            };
          };

          const handleSave = async () => {
            if(!editData.name || !editData.price || !editData.category) return;
            setIsSaving(true);
            try {
              if (editData.id) await api.updateMenuItem(scriptUrl, editData);
              else await api.createMenuItem(scriptUrl, editData);
              await refreshMenu();
              setIsEditing(false);

            setIsSaving(false);

          useEffect(() => {
            fetchOrders();
            const interval = setInterval(fetchOrders, 5000);
            return () => clearInterval(interval);
          }, [fetchOrders]);

          const totalRevenue = orders.filter(o => o.status === 'completed').reduce((sum, o) => sum + o.total, 0);
          const pendingCount = orders.filter(o => o.status === 'pending').length;

          return (
            <div className="pb-10">
              {/* Tab Đổi View Admin */}
              <div className="flex bg-gray-200/50 p-1.5 rounded-2xl w-full max-w-sm mb-4 mx-auto md:mx-0 shadow-inner">
                 <button onClick={() => setViewMode('dashboard')} className={`flex-1 py-2 rounded-xl font-bold text-xs md:text-sm transition-all ${viewMode === 'dashboard' ? 'bg-white text-orange-600 shadow' : 'text-gray-500 hover:text-gray-800'}`}>
                   <Icon name="chart-pie" className="mr-1.5"/> Tổng quan
                 </button>
                 <button onClick={() => setViewMode('menu')} className={`flex-1 py-2 rounded-xl font-bold text-xs md:text-sm transition-all ${viewMode === 'menu' ? 'bg-white text-orange-600 shadow' : 'text-gray-500 hover:text-gray-800'}`}>
                   <Icon name="utensils" className="mr-1.5"/> Menu
                 </button>
                 <button onClick={() => setIsChangePwdOpen(true)} className={`flex-1 py-2 rounded-xl font-bold text-xs md:text-sm transition-all text-gray-500 hover:text-gray-800`}>
                   <Icon name="key" className="mr-1.5"/> Khóa
                 </button>
              </div>

              {viewMode === 'menu' ? (
                 <MenuManager menuItems={menuItems} scriptUrl={scriptUrl} refreshMenu={refreshMenu} />
              ) : loading ? (
                <div className="flex justify-center p-12 text-gray-400"><Icon name="spinner" size={32} className="fa-spin opacity-50" /></div>
              ) : (
                <div className="animate-fade-in-up">
                  {/* Grid Stat cho Mobile (2x2) */}
                  <div className="grid grid-cols-2 gap-3 mb-6">
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center items-center text-center">
                      <div className="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center mb-2"><Icon name="receipt" size={14}/></div>
                      <p className="text-[10px] font-bold text-gray-400 uppercase">Tổng Đơn</p>
                      <p className="text-xl font-black text-gray-800">{orders.length}</p>
                    </div>
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center items-center text-center relative">
                      <div className="w-8 h-8 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center mb-2 relative">
                        <Icon name="bell" size={14}/>
                        {pendingCount > 0 && <span className="absolute 0 top-0 right-0 w-2.5 h-2.5 bg-red-500 border-2 border-white rounded-full animate-ping"></span>}
                      </div>
                      <p className="text-[10px] font-bold text-gray-400 uppercase">Chờ xử lý</p>
                      <p className="text-xl font-black text-gray-800">{pendingCount}</p>
                    </div>
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center items-center text-center col-span-2">
                      <div className="w-8 h-8 rounded-full bg-green-100 text-green-600 flex items-center justify-center mb-2"><Icon name="dollar-sign" size={14}/></div>
                      <p className="text-[10px] font-bold text-gray-400 uppercase">Doanh thu (Đã xong)</p>
                      <p className="text-2xl font-black text-green-600">{formatVND(totalRevenue)}</p>
                    </div>
                  </div>

                  {/* List Đơn hàng (Dạng Cards trên Mobile) */}
                  <div className="bg-white rounded-3xl shadow-sm border border-gray-100 p-4">
                     <h3 className="text-base font-bold text-gray-800 mb-3 flex items-center justify-between">
                       <span>Luồng Đơn Hàng</span>
                       {pendingCount > 0 && <span className="text-xs text-orange-500 animate-pulse"><Icon name="circle" size={8} className="mr-1"/>Có đơn mới</span>}
                     </h3>
                     
                     <div className="space-y-3">
                       {orders.length === 0 ? (
                         <div className="text-center py-6 text-gray-400 text-sm">Chưa có dữ liệu</div>
                       ) : (
                         orders.map(order => (
                           <div key={order.id} className="border border-gray-100 rounded-xl p-3 bg-gray-50 flex flex-col gap-2">
                             <div className="flex justify-between items-start">
                               <div>
                                 <h4 className="font-bold text-sm text-gray-800">{order.customerName}</h4>
                                 <p className="text-[10px] text-gray-500">{new Date(order.timestamp).toLocaleTimeString()} - {order.customerPhone || 'Không có SĐT'}</p>
                               </div>
                               <div>
                                 {order.status === 'pending' ? 
                                    <span className="bg-orange-100 text-orange-700 px-2 py-0.5 rounded text-[10px] font-bold">Chờ</span> : 
                                    <span className="bg-green-100 text-green-700 px-2 py-0.5 rounded text-[10px] font-bold">Xong</span>
                                 }
                               </div>
                             </div>
                             <div className="text-xs text-gray-600 bg-white p-2 rounded border border-gray-100">
                               {order.items.map((i, idx) => <span key={idx} className="mr-2"><b className="text-orange-500">{i.quantity}x</b> {i.name}</span>)}
                             </div>
                             <div className="text-right font-black text-sm text-gray-800">{formatVND(order.total)}</div>
                           </div>
                         ))
                       )}
                     </div>
                  </div>
                </div>
              )}
              <ChangePasswordModal isOpen={isChangePwdOpen} onClose={() => setIsChangePwdOpen(false)} />
            </div>
          );
        };

        const ChangePasswordModal = ({ isOpen, onClose }) => {
          const [currentPwd, setCurrentPwd] = useState('');
          const [newPwd, setNewPwd] = useState('');
          const [confirmPwd, setConfirmPwd] = useState('');
          const [error, setError] = useState('');
          const [success, setSuccess] = useState(false);

          if (!isOpen) return null;

          const handleSave = () => {
            if (currentPwd !== getAdminPassword()) { setError('Mật khẩu sai!'); return; }
            if (newPwd.length < 6) { setError('Tối thiểu 6 ký tự!'); return; }
            if (newPwd !== confirmPwd) { setError('Không khớp!'); return; }
            setAdminPassword(newPwd);
            setSuccess(true);
            setError('');
            setTimeout(() => { setSuccess(false); setCurrentPwd(''); setNewPwd(''); setConfirmPwd(''); onClose(); }, 2000);
          };

          return (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[80] p-4 backdrop-blur-sm">
              <div className="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl animate-fade-in-up">
                <h2 className="text-lg font-extrabold mb-4 text-gray-800"><Icon name="key" className="text-orange-500 mr-2" /> Đổi Mật Khẩu</h2>
                {success ? (
                  <div className="py-8 text-center text-green-600 font-bold"><Icon name="check-circle" size={32} className="mb-2 block mx-auto"/> Thành công!</div>
                ) : (
                  <div className="space-y-3">
                    <input type="password" placeholder="Mật khẩu hiện tại" value={currentPwd} onChange={e => setCurrentPwd(e.target.value)} className="w-full p-2.5 text-sm rounded-xl border border-gray-200 focus:outline-none" />
                    <input type="password" placeholder="Mật khẩu mới" value={newPwd} onChange={e => setNewPwd(e.target.value)} className="w-full p-2.5 text-sm rounded-xl border border-gray-200 focus:outline-none" />
                    <input type="password" placeholder="Xác nhận mật khẩu mới" value={confirmPwd} onChange={e => setConfirmPwd(e.target.value)} className="w-full p-2.5 text-sm rounded-xl border border-gray-200 focus:outline-none" />
                    {error && <p className="text-red-500 text-xs font-bold">{error}</p>}
                    <div className="flex gap-2 mt-2">
                      <button onClick={onClose} className="flex-1 py-2 bg-gray-100 font-bold rounded-xl text-sm">Hủy</button>
                      <button onClick={handleSave} className="flex-1 py-2 bg-orange-500 text-white rounded-xl font-bold text-sm">Lưu</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        };

        const SettingsModal = ({ isOpen, onClose, scriptUrl, setScriptUrl }) => {
          const [url, setUrl] = useState(scriptUrl);
          const handleSave = () => { setScriptUrl(url); localStorage.setItem('msTrangScriptUrl', url); window.location.reload(); };
          if (!isOpen) return null;

          return (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[80] p-4 backdrop-blur-sm">
               <div className="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl animate-fade-in-up">
                 <h2 className="text-lg font-extrabold mb-3 text-gray-800"><Icon name="cog" className="text-gray-500 mr-2"/> Cài đặt Hệ thống</h2>
                 <input type="text" className="w-full border border-gray-200 p-2.5 rounded-xl mb-3 focus:outline-none text-xs font-mono" placeholder="https://script.google.com/.../exec" value={url} onChange={e => setUrl(e.target.value)} />
                 <p className="text-[10px] text-gray-500 mb-4 bg-gray-50 p-2 rounded-lg">Dán URL App Script để kết nối Google Sheets. Xóa đi để dùng Offline (lưu thiết bị).</p>
                 <div className="flex gap-2">
                    <button onClick={onClose} className="flex-1 py-2 bg-gray-100 font-bold rounded-xl text-sm">Đóng</button>
                    <button onClick={handleSave} className="flex-1 py-2 bg-gray-900 text-white rounded-xl font-bold text-sm">Lưu & Tải lại</button>
                 </div>
               </div>
            </div>
          );
        };

        const LoginView = ({ onLogin }) => {
          const [pwd, setPwd] = useState('');
          const [error, setError] = useState('');

          const handleLogin = (e) => {
            e.preventDefault();
            if (pwd === getAdminPassword()) { onLogin(); setError(''); } 
            else setError('Mật khẩu sai!');
          };

          return (
            <div className="flex justify-center items-center py-12 px-4 animate-fade-in-up">
              <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 w-full max-w-xs text-center">
                <div className="w-12 h-12 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mx-auto mb-3"><Icon name="lock" size={20} /></div>
                <h2 className="text-lg font-black text-gray-800 mb-1">Xác thực</h2>
                <p className="text-[10px] text-gray-500 mb-4">Nhập mật khẩu (admin123)</p>
                <form onSubmit={handleLogin} className="space-y-3">
                  <input type="password" placeholder="Mật khẩu..." className="w-full p-3 text-sm rounded-xl border border-gray-200 focus:outline-none text-center tracking-widest" value={pwd} onChange={e => setPwd(e.target.value)} />
                  {error && <p className="text-red-500 text-xs font-bold">{error}</p>}
                  <button type="submit" className="w-full bg-orange-500 text-white py-3 rounded-xl font-bold text-sm shadow-md active:scale-95">Đăng nhập</button>
                </form>
              </div>
            </div>
          );
        };

        function App() {
          const [activeTab, setActiveTab] = useState('customer');
          const savedUrl = localStorage.getItem('msTrangScriptUrl');
          const [scriptUrl, setScriptUrl] = useState(savedUrl !== null ? savedUrl : DEFAULT_SCRIPT_URL);
          const [isSettingsOpen, setIsSettingsOpen] = useState(false);
          const [isAuthenticated, setIsAuthenticated] = useState(localStorage.getItem('msTrangAuth') === 'true');
          
          const [globalMenu, setGlobalMenu] = useState([]);
          const [isMenuLoading, setIsMenuLoading] = useState(true);

          const loadMenu = useCallback(async () => {
             setIsMenuLoading(true);
             const menuData = await api.getMenu(scriptUrl);
             setGlobalMenu(menuData);
             setIsMenuLoading(false);
          }, [scriptUrl]);

          useEffect(() => { loadMenu(); }, [loadMenu]);

          const handleLoginSuccess = () => { setIsAuthenticated(true); localStorage.setItem('msTrangAuth', 'true'); };
          const handleLogout = () => { setIsAuthenticated(false); localStorage.removeItem('msTrangAuth'); setActiveTab('customer'); };

          return (
            <div className="min-h-dvh flex flex-col bg-[#F9FAFB] text-gray-800 selection:bg-orange-200 pb-16 md:pb-0">
              
              {/* Header (Top) - Gọn gàng trên Mobile */}
              <header className="bg-white shadow-sm px-4 py-3 sticky top-0 z-40">
                <div className="max-w-6xl mx-auto flex justify-between items-center">
                  <div className="flex items-center gap-2.5">
                    <div className="bg-orange-500 text-white w-9 h-9 md:w-12 md:h-12 flex items-center justify-center rounded-xl shadow-inner shadow-orange-700/50">
                      <Icon name="bell-concierge" size={16} className="md:text-[24px]" />
                    </div>
                    <div>
                      <h1 className="text-lg md:text-2xl font-black text-gray-900 leading-none tracking-tight">MS. TRANG</h1>
                      <p className="text-[8px] md:text-[10px] uppercase font-bold text-orange-500 mt-0.5">Ăn ngon - Uống sạch</p>
                    </div>
                  </div>
                  
                  {/* Desktop Nav - Ẩn trên Mobile */}
                  <div className="hidden md:flex items-center gap-2 bg-gray-100 p-1.5 rounded-full shadow-inner border border-gray-200/50">
                    <button onClick={() => setActiveTab('customer')} className={`px-6 py-2 rounded-full text-sm font-bold transition-all ${activeTab === 'customer' ? 'bg-white shadow text-orange-600' : 'text-gray-500 hover:text-gray-700'}`}>Đặt món</button>
                    <button onClick={() => setActiveTab('staff')} className={`px-6 py-2 rounded-full text-sm font-bold transition-all ${activeTab === 'staff' ? 'bg-white shadow text-orange-600' : 'text-gray-500 hover:text-gray-700'}`}>Nhân viên</button>
                    <button onClick={() => setActiveTab('admin')} className={`px-6 py-2 rounded-full text-sm font-bold transition-all ${activeTab === 'admin' ? 'bg-white shadow text-orange-600' : 'text-gray-500 hover:text-gray-700'}`}>Quản lý</button>
                  </div>

                  {/* Actions (Logout, Settings) */}
                  <div className="flex items-center gap-1 md:gap-2">
                    {isAuthenticated && (activeTab === 'staff' || activeTab === 'admin') && (
                      <button onClick={handleLogout} className="w-8 h-8 md:w-10 md:h-10 flex items-center justify-center text-red-500 active:bg-red-50 rounded-full"><Icon name="sign-out-alt" size={14} /></button>
                    )}
                    <button onClick={() => setIsSettingsOpen(true)} className="w-8 h-8 md:w-10 md:h-10 flex items-center justify-center text-gray-500 active:bg-gray-100 rounded-full relative">
                      <Icon name="cog" size={16} />
                      {!scriptUrl && <span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full animate-ping"></span>}
                    </button>
                  </div>
                </div>
              </header>

              {/* Vùng Main Content */}
              <main className="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 w-full">
                 {!scriptUrl && (
                   <div className="mb-4 bg-blue-50 text-blue-700 p-2.5 rounded-xl text-[10px] md:text-sm font-bold text-center border border-blue-100">
                     Chế độ Offline (Dữ liệu lưu tại máy này). Bấm ⚙️ để kết nối Sheets.
                   </div>
                 )}
                 
                 {isMenuLoading ? (
                    <div className="flex flex-col items-center justify-center py-20 text-orange-500">
                       <Icon name="spinner" size={32} className="fa-spin mb-3" />
                       <p className="font-bold text-sm">Đang tải...</p>
                    </div>
                 ) : (
                    <>
                       {activeTab === 'customer' && <CustomerView scriptUrl={scriptUrl} menuItems={globalMenu} />}
                       {activeTab === 'staff' && (isAuthenticated ? <StaffView scriptUrl={scriptUrl} menuItems={globalMenu} /> : <LoginView onLogin={handleLoginSuccess} />)}
                       {activeTab === 'admin' && (isAuthenticated ? <AdminView scriptUrl={scriptUrl} menuItems={globalMenu} refreshMenu={loadMenu} /> : <LoginView onLogin={handleLoginSuccess} />)}
                    </>
                 )}
              </main>

              {/* Bottom Navigation (Chỉ hiện trên Mobile) */}
              <nav className="md:hidden fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 z-40 pb-safe flex justify-around items-center px-2 pt-2 pb-2 shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
                 <button onClick={() => setActiveTab('customer')} className={`flex flex-col items-center p-2 w-1/3 transition-colors ${activeTab === 'customer' ? 'text-orange-500' : 'text-gray-400'}`}>
                    <Icon name="utensils" size={20} className="mb-1" />
                    <span className="text-[10px] font-bold">Đặt Món</span>
                 </button>
                 <button onClick={() => {setActiveTab('staff'); playNotificationSound();}} className={`flex flex-col items-center p-2 w-1/3 transition-colors ${activeTab === 'staff' ? 'text-orange-500' : 'text-gray-400'}`}>
                    <Icon name="clipboard-list" size={20} className="mb-1" />
                    <span className="text-[10px] font-bold">Nhân Viên</span>
                 </button>
                 <button onClick={() => {setActiveTab('admin'); playNotificationSound();}} className={`flex flex-col items-center p-2 w-1/3 transition-colors ${activeTab === 'admin' ? 'text-orange-500' : 'text-gray-400'}`}>
                    <Icon name="chart-pie" size={20} className="mb-1" />
                    <span className="text-[10px] font-bold">Quản Lý</span>
                 </button>
              </nav>

              <SettingsModal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} scriptUrl={scriptUrl} setScriptUrl={setScriptUrl}/>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
