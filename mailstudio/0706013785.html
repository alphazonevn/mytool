<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <link rel="icon" href="https://i.pinimg.com/736x/58/98/19/58981979f44731d95ab25aad9a7c88cb.jpg" alt="Logo" class="w-10 h-10 rounded-xl object-cover mr-3 shadow-md border border-slate-100 transition-transform group-hover:scale-105">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Email Studio - Modern Dark</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        * { font-family: 'Outfit', sans-serif; }
        
        body { 
            background-color: #050505;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(207, 1, 6, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.03) 0%, transparent 50%);
            background-attachment: fixed;
            box-sizing: border-box; 
            -webkit-font-smoothing: antialiased;
            color: #e2e8f0;
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .tab-active { 
            background: linear-gradient(135deg, #cf0106 0%, #990000 100%); 
            color: white !important; 
            box-shadow: 0 4px 20px rgba(207, 1, 6, 0.3); 
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
        
        @keyframes slideIn { 
            from { opacity: 0; transform: translateY(-10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .animate-slide { animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

        .glass-input {
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            color: #ffffff;
            transition: all 0.3s ease;
            outline: none;
        }
        .glass-input:focus {
            border-color: #cf0106;
            background-color: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 0 2px rgba(207, 1, 6, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #cf0106 0%, #990000 100%);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            box-shadow: 0 4px 25px rgba(207, 1, 6, 0.4);
            transform: translateY(-1px);
        }
        .btn-primary:active {
            transform: translateY(1px);
        }
        
        /* Chỉnh riêng vùng Editor Preview để hiển thị Email đúng nền trắng chuẩn */
        .preview-content {
            background-color: #ffffff;
            color: #1a1a1a;
        }
    </style>
</head>
<body class="h-full w-full overflow-auto">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- CẤU HÌNH API ---
    const API_URL = "https://script.google.com/macros/s/AKfycbxw-j0MAu4t_wAFEQVmQ615yFKRrIfnee39F37dtn2RkWMzAXW6wTRu8c025KPuRmfk/exec";

    // --- MẶC ĐỊNH (PHÒNG KHI API LỖI) ---
    const defaultTemplates = [{
      id: '1', name: "Thư mời Phỏng vấn", subject: "THƯ MỜI PHỎNG VẤN - [Vị Trí]",
      body: `<div style="background:#fafafa; color:#333; padding:40px; font-family:Arial, sans-serif; border: 1px solid #eee; border-radius: 8px; max-width: 600px; margin: 0 auto;">
  <h1 style="color:#cf0106; text-transform:uppercase; font-weight: normal; letter-spacing: 1px;">Thư Mời Phỏng Vấn</h1>
  <p>Chào <strong>[Tên Ứng Viên]</strong>,</p>
  <p>Cảm ơn bạn đã ứng tuyển vị trí <strong>[Vị Trí]</strong>. Chúng tôi mời bạn tham gia phỏng vấn:</p>
  <ul style="background:#fff; padding:20px; border: 1px solid #e5e7eb; border-radius:8px; list-style:none;">
    <li style="margin-bottom: 10px;"><strong style="color: #666;">Thời gian:</strong> [Giờ] ngày [Ngày]</li>
    <li><strong style="color: #666;">Địa điểm:</strong> [Địa Điểm]</li>
  </ul>
  <p style="color: #666; font-size: 13px; margin-top: 20px;">Vui lòng phản hồi email này để xác nhận.</p>
</div>`
    }];

    const App = () => {
      const [templates, setTemplates] = useState([]);
      const [activeId, setActiveId] = useState(null);
      const [viewMode, setViewMode] = useState('split');
      const [toast, setToast] = useState(null);
      const [isLoading, setIsLoading] = useState(true);

      const [vars, setVars] = useState({
        '[Tên Ứng Viên]': 'Anh Minh', 
        '[Vị Trí]': 'Frontend Developer',
        '[Giờ]': '09:00 AM', 
        '[Ngày]': '20/11/2026', 
        '[Địa Điểm]': 'Google Meet (Online)'
      });

      const activeTemplate = templates.find(t => t.id === activeId);
      const [editSubject, setEditSubject] = useState('');
      const [editBody, setEditBody] = useState('');

      // TẢI DỮ LIỆU
      useEffect(() => {
        fetch(API_URL)
          .then(res => res.json())
          .then(result => {
            if (result.status === 'success' && result.data && result.data.length > 0) {
              setTemplates(result.data);
              setActiveId(result.data[0].id);
              if(result.data[0].vars) setVars(result.data[0].vars);
            } else {
              setTemplates(defaultTemplates);
              setActiveId(defaultTemplates[0].id);
            }
            setIsLoading(false);
          })
          .catch(err => {
            setTemplates(defaultTemplates);
            setActiveId(defaultTemplates[0].id);
            setIsLoading(false);
            showToast("Lỗi tải API. Đang dùng mẫu nội bộ.", "error");
          });
      }, []);

      // Đồng bộ nội dung & biến khi đổi Tab
      useEffect(() => {
        if (activeTemplate) {
          setEditSubject(activeTemplate.subject);
          setEditBody(activeTemplate.body);
          if (activeTemplate.vars) setVars(activeTemplate.vars);
        }
      }, [activeId, templates.length]);

      const showToast = (msg, type = "info") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      // Xử lý Thêm / Xóa Biến Động
      const handleAddVar = () => {
          const varName = prompt("Nhập tên trường dữ liệu mới (Ví dụ: [Số Điện Thoại]):");
          if (varName && varName.trim() !== '') {
              const formattedName = varName.startsWith('[') && varName.endsWith(']') ? varName : `[${varName}]`;
              if (!vars.hasOwnProperty(formattedName)) {
                  setVars(prev => ({ ...prev, [formattedName]: '' }));
              }
          }
      };

      const handleRemoveVar = (keyToRemove) => {
          if (confirm(`Hệ thống sẽ xóa biến ${keyToRemove}. Tiếp tục?`)) {
              setVars(prev => {
                  const newVars = { ...prev };
                  delete newVars[keyToRemove];
                  return newVars;
              });
          }
      };

      const renderContent = (content) => {
        if(!content) return '';
        let result = content;
        Object.keys(vars).forEach(key => {
          const regex = new RegExp(key.replace(/\[/g, '\\[').replace(/\]/g, '\\]'), 'g');
          result = result.replace(regex, vars[key] || key); 
        });
        return result;
      };

      const renderedSubject = useMemo(() => renderContent(editSubject), [editSubject, vars]);
      const renderedBody = useMemo(() => renderContent(editBody), [editBody, vars]);

      // LƯU API
      const handleSave = () => {
        if(!activeTemplate) return;
        
        const password = window.prompt("Vui lòng nhập mật khẩu xác nhận ghi đè dữ liệu:");
        if (password !== "729903") {
            showToast('Sai mật khẩu. Đã hủy thao tác lưu.', 'error');
            return;
        }

        const updatedTemplate = { id: activeId, name: activeTemplate.name, subject: editSubject, body: editBody, vars: vars };
        setTemplates(prev => prev.map(t => t.id === activeId ? updatedTemplate : t));
        showToast('Đang khởi tạo gói tin lưu trữ...', 'info');

        fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'SAVE', template: updatedTemplate }),
          redirect: "follow"
        })
        .then(res => res.json())
        .then(res => {
          if(res.status === 'success') showToast('Cấu trúc đã lưu vào máy chủ.', 'success');
        })
        .catch(err => showToast('Lưu Offline thành công (Mất kết nối API)', 'warning'));
      };

      const handleAddTemplate = () => {
        const newId = Date.now().toString();
        const newTemplate = { id: newId, name: 'Bản thảo mới', subject: 'Tiêu đề thư...', body: '<h1>Nội dung</h1>', vars: {} };
        setTemplates([...templates, newTemplate]);
        setActiveId(newId);
        setVars({});
      };

      const handleSendGmail = () => {
        const el = document.createElement('div');
        el.innerHTML = renderedBody;
        el.style.position = 'absolute'; el.style.left = '-9999px';
        document.body.appendChild(el);
        const sel = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(el);
        sel.removeAllRanges(); sel.addRange(range);
        document.execCommand('copy');
        sel.removeAllRanges(); document.body.removeChild(el);

        showToast("Dữ liệu lưu vào khay tạm. Mở dịch vụ Gmail...", "success");
        setTimeout(() => {
          window.open(`https://mail.google.com/mail/?view=cm&fs=1&su=${encodeURIComponent(renderedSubject)}`, '_blank');
        }, 800);
      };

      // Loading State
      if (isLoading) {
        return (
          <div className="h-screen w-full flex items-center justify-center">
             <div className="text-center flex flex-col items-center gap-4">
                <div className="w-8 h-8 border-t-2 border-r-2 border-red-600 rounded-full animate-spin"></div>
                <p className="text-gray-400 font-light text-xs uppercase tracking-[0.2em]">Đang truy xuất hệ thống...</p>
             </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col pb-12">
          
          {/* TOAST */}
          {toast && (
            <div className="fixed top-6 right-6 z-[100] flex flex-col gap-2 max-w-sm w-full pointer-events-none">
                <div className={`flex items-center p-4 rounded-2xl text-[11px] font-medium uppercase tracking-widest shadow-2xl backdrop-blur-xl border animate-slide ${toast.type === 'success' ? 'bg-green-500/10 border-green-500/20 text-green-400' : toast.type === 'error' ? 'bg-red-500/10 border-red-500/20 text-red-400' : 'bg-white/5 border-white/10 text-gray-300'}`}>
                    <span>{toast.msg}</span>
                </div>
            </div>
          )}

          {/* HEADER */}
          <header className="glass-panel border-x-0 border-t-0 border-b border-white/5 py-6 px-4 relative z-10">
              <div className="max-w-7xl mx-auto relative flex flex-col md:flex-row items-center justify-between gap-4">
                  <div className="flex items-center gap-4">
                      <div>
                          <h1 className="text-2xl md:text-3xl font-light tracking-wider uppercase text-white">Email Studio<span className="text-red-600 font-bold">.</span></h1>
                          <p className="text-[10px] text-gray-400 uppercase tracking-[0.2em] mt-1">Hệ thống quản trị mẫu thư</p>
                      </div>
                  </div>
                  <div className="bg-white/5 px-4 py-2.5 rounded-xl border border-white/5 text-[11px] font-light tracking-widest flex items-center gap-3 text-gray-300">
                      <div className="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.8)]"></div> 
                      Đồng bộ API Live
                  </div>
              </div>
          </header>

          {/* TABS */}
          <div className="max-w-7xl mx-auto px-4 mt-8 w-full">
              <div className="flex glass-panel rounded-2xl p-1.5 gap-1.5 overflow-x-auto scrollbar-hide">
                  {templates.map(t => (
                      <button 
                        key={t.id} 
                        onClick={() => setActiveId(t.id)} 
                        className={`flex-none whitespace-nowrap py-3 px-7 rounded-xl font-medium transition-all uppercase text-[11px] tracking-widest ${activeId === t.id ? 'tab-active' : 'text-gray-400 hover:text-white hover:bg-white/5 border border-transparent'}`}
                      >
                          {t.name}
                      </button>
                  ))}
                  <button onClick={handleAddTemplate} className="flex-none whitespace-nowrap py-3 px-6 rounded-xl font-medium text-red-500 transition-all hover:bg-red-500/10 hover:text-red-400 border border-dashed border-red-500/30 uppercase text-[11px] tracking-widest ml-1">
                      + Vùng mới
                  </button>
              </div>
          </div>

          {/* MAIN WORKSPACE */}
          <div className="max-w-7xl mx-auto px-4 py-6 w-full flex-1 flex flex-col">
              <div className="glass-panel rounded-[2rem] p-6 md:p-8 animate-slide flex-1 flex flex-col border border-white/5 relative overflow-hidden">
                  
                  {/* Subtle Background Glow inside Panel */}
                  <div className="absolute top-0 right-0 w-96 h-96 bg-red-600/5 rounded-full blur-[100px] pointer-events-none"></div>

                  {/* Info & Action Bar */}
                  <div className="flex flex-col md:flex-row gap-6 mb-10 relative z-10">
                      <div className="flex-1 space-y-5">
                          <div>
                              <label className="block text-[10px] font-light text-gray-400 mb-2.5 uppercase tracking-[0.15em]">Định danh hiển thị</label>
                              <input 
                                type="text" 
                                value={activeTemplate?.name || ''} 
                                onChange={(e) => setTemplates(prev => prev.map(t => t.id === activeId ? { ...t, name: e.target.value } : t))}
                                className="w-full glass-input px-5 py-3.5 font-light text-white text-[15px] tracking-wide" 
                              />
                          </div>
                          <div>
                              <label className="block text-[10px] font-light text-gray-400 mb-2.5 uppercase tracking-[0.15em]">Cấu trúc chủ đề (Subject)</label>
                              <input 
                                type="text" 
                                value={editSubject}
                                onChange={(e) => setEditSubject(e.target.value)}
                                className="w-full glass-input px-5 py-3.5 font-light text-white text-[15px] tracking-wide" 
                              />
                          </div>
                      </div>
                      
                      <div className="flex flex-col gap-3 min-w-[220px] justify-end">
                          <button onClick={handleSave} className="btn-primary py-3.5 px-8 rounded-xl font-medium text-[11px] uppercase tracking-widest text-center shadow-lg">
                              Ghi đè cấu hình
                          </button>
                          <button onClick={handleSendGmail} className="py-3.5 px-8 bg-black/20 backdrop-blur-md border border-red-500/50 text-red-500 hover:bg-red-500/10 hover:border-red-500 hover:text-red-400 rounded-xl font-medium text-[11px] uppercase tracking-widest transition-all text-center">
                              Đẩy qua Gmail
                          </button>
                      </div>
                  </div>

                  {/* Variables Manager */}
                  <div className="bg-red-950/20 border border-red-900/30 rounded-2xl p-6 mb-10 relative z-10">
                      <span className="text-[10px] font-medium text-red-400/80 uppercase tracking-[0.2em] block mb-5 flex items-center gap-2">
                          <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                          Mảng biến động (Đầu vào)
                      </span>
                      <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-5">
                          {Object.keys(vars).map(key => (
                              <div key={key} className="relative group">
                                  <label className="block text-[10px] font-light text-gray-400 mb-2 uppercase tracking-widest">{key}</label>
                                  <input 
                                    type="text" 
                                    value={vars[key]} 
                                    onChange={(e) => setVars(prev => ({ ...prev, [key]: e.target.value }))}
                                    className="w-full bg-black/40 border border-white/5 rounded-xl pl-4 pr-10 py-3 text-[13px] font-light text-white focus:outline-none focus:border-red-500/50 focus:bg-black/60 transition-all"
                                  />
                                  <button 
                                    onClick={() => handleRemoveVar(key)}
                                    className="absolute right-2 top-[28px] w-7 h-7 flex items-center justify-center text-gray-500 hover:text-red-500 hover:bg-red-500/10 rounded-lg transition-colors"
                                    title="Xóa trường này"
                                  >✕</button>
                              </div>
                          ))}
                          <div className="flex items-end">
                              <button onClick={handleAddVar} className="h-[46px] w-full px-4 bg-transparent text-red-400/80 border border-dashed border-red-500/30 rounded-xl text-[11px] hover:bg-red-500/10 hover:text-red-400 hover:border-red-500/50 transition-all font-light tracking-widest uppercase">
                                  + Thêm vùng
                              </button>
                          </div>
                      </div>
                  </div>

                  {/* View Controls */}
                  <div className="flex justify-center md:justify-start gap-3 mb-6 border-b border-white/5 pb-5 relative z-10">
                      <button onClick={() => setViewMode('code')} className={`px-6 py-2.5 text-[10px] font-medium tracking-[0.2em] uppercase rounded-xl transition-all border ${viewMode === 'code' ? 'bg-red-500/10 border-red-500/30 text-red-400 shadow-[0_0_15px_rgba(220,38,38,0.1)]' : 'bg-black/20 border-white/5 text-gray-500 hover:text-gray-300 hover:bg-white/5'}`}>Mã nguồn</button>
                      <button onClick={() => setViewMode('preview')} className={`px-6 py-2.5 text-[10px] font-medium tracking-[0.2em] uppercase rounded-xl transition-all border ${viewMode === 'preview' ? 'bg-red-500/10 border-red-500/30 text-red-400 shadow-[0_0_15px_rgba(220,38,38,0.1)]' : 'bg-black/20 border-white/5 text-gray-500 hover:text-gray-300 hover:bg-white/5'}`}>Trực quan</button>
                      <button onClick={() => setViewMode('split')} className={`hidden md:block px-6 py-2.5 text-[10px] font-medium tracking-[0.2em] uppercase rounded-xl transition-all border ${viewMode === 'split' ? 'bg-red-500/10 border-red-500/30 text-red-400 shadow-[0_0_15px_rgba(220,38,38,0.1)]' : 'bg-black/20 border-white/5 text-gray-500 hover:text-gray-300 hover:bg-white/5'}`}>Phân mảnh</button>
                  </div>

                  {/* Editors */}
                  <div className="flex-1 flex flex-col md:flex-row gap-6 min-h-[500px] relative z-10">
                      
                      {(viewMode === 'code' || viewMode === 'split') && (
                          <div className="flex-1 flex flex-col relative group">
                              <label className="block text-[10px] font-light text-gray-400 mb-3 uppercase tracking-[0.15em] flex items-center gap-2">
                                 <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                                 Cấu trúc HTML (Raw)
                              </label>
                              <textarea 
                                  value={editBody}
                                  onChange={(e) => setEditBody(e.target.value)}
                                  spellCheck="false"
                                  className="flex-1 w-full bg-[#0a0a0a]/80 border border-white/10 rounded-2xl p-6 text-emerald-400/90 font-mono text-[13px] leading-relaxed focus:outline-none focus:border-red-500/50 transition-all resize-none shadow-inner custom-scrollbar"
                                  placeholder="Nhập mã HTML..."
                                  style={{ scrollbarColor: '#334155 transparent', scrollbarWidth: 'thin' }}
                              />
                          </div>
                      )}

                      {(viewMode === 'preview' || viewMode === 'split') && (
                          <div className="flex-1 flex flex-col relative">
                              <label className="flex items-center justify-between text-[10px] font-light text-gray-400 mb-3 uppercase tracking-[0.15em]">
                                  <span className="flex items-center gap-2">
                                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                                    Đầu ra hiển thị
                                  </span>
                                  <span className="text-[9px] text-red-400/70 normal-case tracking-normal hidden md:inline">*Cảnh báo: Sửa trực tiếp sẽ ghi đè tham số.</span>
                              </label>
                              <div 
                                className="flex-1 w-full preview-content border border-white/10 rounded-2xl p-6 overflow-y-auto shadow-sm outline-none focus:ring-2 focus:ring-red-500/30 transition-all cursor-text"
                                contentEditable={true}
                                suppressContentEditableWarning={true}
                                onBlur={(e) => {
                                    if (e.target.innerHTML !== renderedBody) {
                                        setEditBody(e.target.innerHTML);
                                        showToast('Đồng bộ dữ liệu trực quan xuống mã HTML thành công.', 'success');
                                    }
                                }}
                                dangerouslySetInnerHTML={{ __html: renderedBody }} 
                              />
                          </div>
                      )}

                  </div>
              </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
