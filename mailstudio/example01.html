<!DOCTYPE html>
<html lang="vi" class="dark h-full">
<head>
    <link rel="icon" type="image/png" href="https://nrhh.rutgers.edu/wp-content/uploads/sites/1231/2024/06/kisspng-email-computer-icons-signature-block-clip-art-mail-5abf317abda745.0789109915224794827768.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Studio Pro - Alpha Zone</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            500: '#f43f5e',
                            600: '#e11d48',
                            900: '#881337',
                            950: '#4c0519',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #050505;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(225, 29, 72, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(255, 255, 255, 0.02) 0%, transparent 40%);
            background-attachment: fixed;
            color: #f8fafc;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #e11d48; }

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        
        .glass-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0.75rem;
            color: #ffffff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }
        .glass-input:focus {
            background: rgba(0, 0, 0, 0.6);
            border-color: #e11d48;
            box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.15);
        }

        .btn-brand {
            background: linear-gradient(135deg, #e11d48 0%, #9f1239 100%);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.2);
        }
        .btn-brand:hover:not(:disabled) {
            box-shadow: 0 6px 25px rgba(225, 29, 72, 0.4);
            transform: translateY(-1px);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .btn-brand:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Animations */
        @keyframes fadeSlideUp { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .animate-enter { animation: fadeSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; box-shadow: 0 0 15px rgba(225,29,72,0.3); }
            50% { opacity: 0.7; box-shadow: 0 0 5px rgba(225,29,72,0.1); }
        }
        .live-indicator { animation: pulse-glow 2s infinite; }

        /* Editor adjustments */
        .editor-container { background: #0a0a0a; }
        .preview-content { background-color: #ffffff; color: #1a1a1a; border-radius: 0.75rem; }
    </style>
</head>
<body class="h-full w-full overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // THAY ĐỔI LINK NÀY THÀNH LINK WEB APP MỚI NHẤT CỦA BẠN
    const API_URL = "https://script.google.com/macros/s/AKfycbyKIhHdqGp6B6Z-D5oOg7TmL_iSYmLfUx_zGDnyUMj-F3g9Iybib9kxv56GedfLQX_m/exec";

    const App = () => {
      const [templates, setTemplates] = useState([]);
      const [activeId, setActiveId] = useState(null);
      const [viewMode, setViewMode] = useState('split');
      const [toast, setToast] = useState(null);
      const [isLoading, setIsLoading] = useState(true);
      const [isSending, setIsSending] = useState(false);
      const [isSaving, setIsSaving] = useState(false);

      const [vars, setVars] = useState({});
      const [editSubject, setEditSubject] = useState('');
      const [editBody, setEditBody] = useState('');
      
      const [bulkEmails, setBulkEmails] = useState('');
      const [senderEmail, setSenderEmail] = useState('contact@alphazone.io.vn');
      const [senderName, setSenderName] = useState('Alpha Zone Studio');

      const activeTemplate = templates.find(t => t.id === activeId);

      useEffect(() => {
        fetch(API_URL)
          .then(res => res.json())
          .then(result => {
            if (result.status === 'success' && result.data && result.data.length > 0) {
              setTemplates(result.data);
              setActiveId(result.data[0].id);
              if(result.data[0].vars) setVars(result.data[0].vars);
            }
            setIsLoading(false);
          })
          .catch(() => {
            setIsLoading(false);
            showToast("Chưa có dữ liệu hoặc lỗi kết nối. Hãy khởi tạo mẫu mới.", "warning");
          });
      }, []);

      useEffect(() => {
        if (activeTemplate) {
          setEditSubject(activeTemplate.subject);
          setEditBody(activeTemplate.body);
          setVars(activeTemplate.vars || {});
        } else {
          setEditSubject('');
          setEditBody('');
          setVars({});
        }
      }, [activeId, templates]);

      const showToast = (msg, type = "info") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      const handleAddVar = () => {
          const varName = prompt("Nhập tên trường dữ liệu mới (Ví dụ: [TenKhachHang]):");
          if (varName && varName.trim()) {
              const formattedName = varName.startsWith('[') && varName.endsWith(']') ? varName : `[${varName}]`;
              if (!vars.hasOwnProperty(formattedName)) {
                  setVars(prev => ({ ...prev, [formattedName]: '' }));
              }
          }
      };

      const handleRemoveVar = (keyToRemove) => {
          if (confirm(`Xóa biến ${keyToRemove}?`)) {
              setVars(prev => {
                  const newVars = { ...prev };
                  delete newVars[keyToRemove];
                  return newVars;
              });
          }
      };

      const renderContent = (content) => {
        if(!content) return '';
        let result = content;
        Object.keys(vars).forEach(key => {
          const regex = new RegExp(key.replace(/\[/g, '\\[').replace(/\]/g, '\\]'), 'g');
          result = result.replace(regex, vars[key] || key); 
        });
        return result;
      };

      const renderedSubject = useMemo(() => renderContent(editSubject), [editSubject, vars]);
      const renderedBody = useMemo(() => renderContent(editBody), [editBody, vars]);

      // --- CHỨC NĂNG LƯU GHI ĐÈ ---
      const handleSave = () => {
        if(!activeTemplate) return;
        
        const password = window.prompt("Xác thực quản trị viên (Mật khẩu lưu trữ):");
        if (password !== "729903") {
            showToast('Xác thực thất bại. Đã hủy thao tác.', 'error');
            return;
        }

        setIsSaving(true);
        const updatedTemplate = { id: activeId, name: activeTemplate.name, subject: editSubject, body: editBody, vars: vars };
        setTemplates(prev => prev.map(t => t.id === activeId ? updatedTemplate : t));

        fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'SAVE', template: updatedTemplate }),
          redirect: "follow"
        })
        .then(res => res.json())
        .then(res => {
          if(res.status === 'success') showToast('Đã ghi đè cấu hình lên đám mây.', 'success');
          else showToast('Lỗi máy chủ: ' + res.message, 'error');
        })
        .catch(() => showToast('Lưu ngoại tuyến thành công (Không gọi được API)', 'warning'))
        .finally(() => setIsSaving(false));
      };

      const handleAddTemplate = () => {
        const newId = Date.now().toString();
        const newTemplate = { 
            id: newId, 
            name: 'Template Không Tên', 
            subject: 'Nhập tiêu đề...', 
            body: `<div style="background:#0a0a0a; color:#fff; padding:40px; font-family:Arial, sans-serif;">\n  <h1 style="color:#e11d48;">Xin chào [TenKhachHang],</h1>\n  <p>Nội dung thư của bạn ở đây.</p>\n</div>`, 
            vars: { "[TenKhachHang]": "" } 
        };
        setTemplates([...templates, newTemplate]);
        setActiveId(newId);
      };

      // --- CHỨC NĂNG GỬI HÀNG LOẠT QUA BREVO API ---
      const handleSendBulkAPI = async () => {
        if (!bulkEmails.trim()) return showToast('Danh sách người nhận đang trống.', 'warning');
        if (!senderEmail || !senderName) return showToast('Vui lòng kiểm tra lại Định danh người gửi.', 'warning');
        
        const emailList = bulkEmails.split(/[\n,]+/).map(e => e.trim()).filter(e => e);
        if (emailList.length === 0) return showToast('Định dạng email không hợp lệ.', 'warning');

        if(!window.confirm(`Hệ thống sẽ đẩy ${emailList.length} email vào hàng đợi API Brevo. Tiếp tục?`)) return;

        setIsSending(true);
        showToast(`Đang kết nối cổng SMTP. Vui lòng chờ...`, 'info');

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'BULK_SEND',
                    emails: emailList,
                    subject: renderedSubject,
                    body: renderedBody,
                    senderEmail: senderEmail,
                    senderName: senderName
                }),
                redirect: "follow"
            });
            
            const res = await response.json();
            if(res.status === 'success') {
                showToast(res.message, 'success');
                setBulkEmails(''); 
            } else {
                showToast('Lỗi máy chủ gửi: ' + res.message, 'error');
            }
        } catch (err) {
            showToast('Mất kết nối với Google Apps Script.', 'error');
        } finally {
            setIsSending(false);
        }
      };

      // Loading Screen
      if (isLoading) {
        return (
          <div className="h-screen w-full flex flex-col items-center justify-center bg-[#050505]">
             <div className="w-12 h-12 border-2 border-brand-950 border-t-brand-500 rounded-full animate-spin mb-6 shadow-[0_0_15px_rgba(225,29,72,0.5)]"></div>
             <p className="text-gray-400 font-light text-xs uppercase tracking-[0.3em] animate-pulse">Khởi tạo không gian làm việc</p>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col pb-16 font-sans">
          
          {/* TOAST NOTIFICATION */}
          <div className="fixed top-6 right-6 z-[100] flex flex-col gap-3 max-w-sm w-full pointer-events-none">
            {toast && (
              <div className={`flex items-center p-4 rounded-xl text-[12px] font-medium uppercase tracking-widest shadow-2xl backdrop-blur-xl border transform transition-all duration-300 ${
                  toast.type === 'success' ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400' : 
                  toast.type === 'error' ? 'bg-rose-500/10 border-rose-500/20 text-rose-400' : 
                  'bg-white/5 border-white/10 text-gray-300'
              }`}>
                  <span className="flex-1">{toast.msg}</span>
              </div>
            )}
          </div>

          {/* HEADER TOPBAR */}
          <header className="glass-panel border-x-0 border-t-0 py-4 px-6 sticky top-0 z-50">
              <div className="max-w-[1400px] mx-auto flex items-center justify-between">
                  <div className="flex items-center gap-4">
                      {/* ĐÃ CẬP NHẬT LOGO VÀO NAVBAR VÀ THÊM NỀN TRẮNG ĐỂ NỔI BẬT */}
                      <div className="w-11 h-11 rounded-xl bg-white/90 flex items-center justify-center shadow-[0_0_15px_rgba(225,29,72,0.3)] border border-brand-500/30 overflow-hidden shrink-0">
                          <img 
                              src="https://nrhh.rutgers.edu/wp-content/uploads/sites/1231/2024/06/kisspng-email-computer-icons-signature-block-clip-art-mail-5abf317abda745.0789109915224794827768.png" 
                              alt="Email Studio" 
                              className="w-[70%] h-[70%] object-contain"
                          />
                      </div>
                      <div>
                          <h1 className="text-xl font-medium tracking-wide text-white">Email Studio<span className="text-brand-500 font-bold">.</span></h1>
                          <p className="text-[10px] text-gray-400 uppercase tracking-[0.2em] mt-0.5">Automated Mailing System</p>
                      </div>
                  </div>
                  <div className="live-indicator bg-brand-500/10 px-4 py-2 rounded-full border border-brand-500/20 text-[10px] font-medium tracking-widest text-brand-400 flex items-center gap-2">
                      <div className="w-1.5 h-1.5 rounded-full bg-brand-500"></div> API Connected
                  </div>
              </div>
          </header>

          {/* WORKSPACE NAV (TABS) */}
          <div className="max-w-[1400px] mx-auto px-6 mt-8 w-full animate-enter" style={{ animationDelay: '0.1s' }}>
              <div className="flex items-center gap-2 overflow-x-auto scrollbar-hide pb-2">
                  {templates.map(t => (
                      <button 
                        key={t.id} 
                        onClick={() => setActiveId(t.id)} 
                        className={`flex-none whitespace-nowrap py-2.5 px-6 rounded-lg font-medium transition-all uppercase text-[11px] tracking-widest border ${
                            activeId === t.id 
                            ? 'bg-brand-500/10 border-brand-500/30 text-brand-400 shadow-[0_0_15px_rgba(225,29,72,0.15)]' 
                            : 'bg-transparent border-transparent text-gray-500 hover:text-gray-300 hover:bg-white/5'
                        }`}
                      >
                          {t.name}
                      </button>
                  ))}
                  <button onClick={handleAddTemplate} className="flex-none whitespace-nowrap py-2.5 px-5 rounded-lg font-medium text-gray-400 transition-all hover:bg-white/5 hover:text-white border border-dashed border-white/20 uppercase text-[11px] tracking-widest ml-2 flex items-center gap-2">
                      <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>
                      New
                  </button>
              </div>
          </div>

          {/* MAIN EDITOR AREA */}
          <div className="max-w-[1400px] mx-auto px-6 mt-4 w-full flex-1 flex flex-col lg:flex-row gap-6 animate-enter" style={{ animationDelay: '0.2s' }}>
              
              {templates.length === 0 ? (
                  <div className="glass-panel w-full rounded-2xl p-12 flex flex-col items-center justify-center text-center border-dashed border-white/10 min-h-[500px]">
                      <div className="w-16 h-16 bg-white/5 rounded-2xl flex items-center justify-center mb-6">
                          <svg className="w-8 h-8 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                      </div>
                      <h3 className="text-lg font-medium text-white mb-2">Không gian làm việc trống</h3>
                      <p className="text-sm text-gray-400 mb-8 max-w-sm">Tạo mẫu email đầu tiên của bạn để bắt đầu thiết lập các biến số và chiến dịch gửi tự động.</p>
                      <button onClick={handleAddTemplate} className="btn-brand py-3 px-8 rounded-xl font-medium text-[12px] uppercase tracking-widest">
                          Khởi tạo mẫu thư
                      </button>
                  </div>
              ) : (
                  <>
                      {/* SETTINGS SIDEBAR (LEFT) */}
                      <div className="w-full lg:w-[380px] flex flex-col gap-6 shrink-0">
                          
                          {/* Basic Info */}
                          <div className="glass-panel rounded-2xl p-5 border border-white/5 relative overflow-hidden">
                              <div className="absolute top-0 right-0 w-32 h-32 bg-brand-600/10 rounded-full blur-[50px] -mt-10 -mr-10"></div>
                              <h3 className="text-[10px] font-medium text-gray-500 uppercase tracking-[0.2em] mb-4">Cấu hình mẫu</h3>
                              <div className="space-y-4 relative z-10">
                                  <div>
                                      <label className="block text-[11px] text-gray-400 mb-2">Tên định dạng (Bản nháp)</label>
                                      <input 
                                          type="text" 
                                          value={activeTemplate?.name || ''} 
                                          onChange={(e) => setTemplates(prev => prev.map(t => t.id === activeId ? { ...t, name: e.target.value } : t))}
                                          className="w-full glass-input px-4 py-2.5 text-sm" 
                                      />
                                  </div>
                                  <div>
                                      <label className="block text-[11px] text-gray-400 mb-2">Chủ đề Email (Subject)</label>
                                      <input 
                                          type="text" 
                                          value={editSubject}
                                          onChange={(e) => setEditSubject(e.target.value)}
                                          className="w-full glass-input px-4 py-2.5 text-sm" 
                                      />
                                  </div>
                                  <button onClick={handleSave} disabled={isSaving} className="w-full py-3 px-4 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl font-medium text-[11px] uppercase tracking-widest text-white transition-all flex items-center justify-center gap-2 mt-2">
                                      {isSaving ? <span className="w-4 h-4 border-2 border-white/20 border-t-white rounded-full animate-spin"></span> : 'Lưu cấu hình Server'}
                                  </button>
                              </div>
                          </div>

                          {/* Sender & Bulk Setup */}
                          <div className="glass-panel rounded-2xl p-5 border border-brand-500/20 shadow-[0_0_30px_rgba(225,29,72,0.05)] relative">
                              <h3 className="text-[10px] font-medium text-brand-400 uppercase tracking-[0.2em] mb-4 flex items-center gap-2">
                                  <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                  Chiến dịch API
                              </h3>
                              <div className="space-y-4">
                                  <div className="grid grid-cols-2 gap-3">
                                      <div>
                                          <label className="block text-[11px] text-gray-400 mb-2">Tên người gửi</label>
                                          <input 
                                              type="text" 
                                              value={senderName}
                                              onChange={(e) => setSenderName(e.target.value)}
                                              className="w-full glass-input px-3 py-2 text-[13px]" 
                                          />
                                      </div>
                                      <div>
                                          <label className="block text-[11px] text-gray-400 mb-2">Email gốc</label>
                                          <input 
                                              type="email" 
                                              value={senderEmail}
                                              onChange={(e) => setSenderEmail(e.target.value)}
                                              className="w-full glass-input px-3 py-2 text-[13px]" 
                                          />
                                      </div>
                                  </div>
                                  <div>
                                      <label className="block text-[11px] text-gray-400 mb-2 flex justify-between">
                                          <span>Tập khách hàng nhận</span>
                                          <span className="text-gray-600 font-mono text-[10px]">{bulkEmails.split(/[\n,]+/).filter(e=>e.trim()).length} records</span>
                                      </label>
                                      <textarea 
                                          value={bulkEmails}
                                          onChange={(e) => setBulkEmails(e.target.value)}
                                          className="w-full glass-input px-4 py-3 text-[13px] font-mono h-28 resize-none" 
                                          placeholder="user1@gmail.com&#10;user2@yahoo.com"
                                      />
                                  </div>
                                  <button onClick={handleSendBulkAPI} disabled={isSending} className="btn-brand w-full py-3.5 px-4 rounded-xl font-medium text-[11px] uppercase tracking-widest flex items-center justify-center gap-2">
                                      {isSending ? (
                                          <><span className="w-4 h-4 border-2 border-white/20 border-t-white rounded-full animate-spin"></span> Đang đẩy API...</>
                                      ) : (
                                          <><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg> Phát lệnh Gửi Hàng Loạt</>
                                      )}
                                  </button>
                              </div>
                          </div>
                          
                      </div>

                      {/* MAIN WORKSPACE (RIGHT) */}
                      <div className="flex-1 flex flex-col gap-6">
                          
                          {/* Variables Row */}
                          <div className="glass-panel rounded-2xl p-5 border border-white/5">
                              <div className="flex items-center justify-between mb-4">
                                  <h3 className="text-[10px] font-medium text-gray-500 uppercase tracking-[0.2em]">Khối dữ liệu động (Variables)</h3>
                                  <button onClick={handleAddVar} className="text-[10px] text-brand-400 hover:text-brand-300 font-medium tracking-widest uppercase flex items-center gap-1 bg-brand-500/10 px-3 py-1.5 rounded-lg border border-brand-500/20 transition-colors">
                                      + Thêm biến
                                  </button>
                              </div>
                              <div className="flex flex-wrap gap-3">
                                  {Object.keys(vars).length === 0 && <p className="text-[12px] text-gray-600 italic">Chưa có biến dữ liệu nào được định nghĩa.</p>}
                                  {Object.keys(vars).map(key => (
                                      <div key={key} className="flex items-center bg-black/40 border border-white/10 rounded-lg overflow-hidden group focus-within:border-brand-500/50 focus-within:shadow-[0_0_10px_rgba(225,29,72,0.1)] transition-all">
                                          <span className="px-3 py-2 text-[11px] font-mono text-gray-400 bg-white/5 border-r border-white/5">{key}</span>
                                          <input 
                                              type="text" 
                                              value={vars[key]} 
                                              onChange={(e) => setVars(prev => ({ ...prev, [key]: e.target.value }))}
                                              className="w-32 bg-transparent px-3 py-2 text-[13px] text-white outline-none"
                                              placeholder="Giá trị test..."
                                          />
                                          <button onClick={() => handleRemoveVar(key)} className="px-3 py-2 text-gray-500 hover:text-rose-500 hover:bg-rose-500/10 transition-colors">
                                              <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                          </button>
                                      </div>
                                  ))}
                              </div>
                          </div>

                          {/* Editor Container */}
                          <div className="glass-panel rounded-2xl border border-white/5 flex-1 flex flex-col overflow-hidden min-h-[500px]">
                              {/* Editor Toolbar */}
                              <div className="bg-white/5 border-b border-white/5 px-4 py-3 flex items-center justify-between">
                                  <div className="flex bg-black/40 rounded-lg p-1 border border-white/5">
                                      <button onClick={() => setViewMode('code')} className={`px-4 py-1.5 text-[10px] font-medium tracking-[0.1em] uppercase rounded-md transition-all ${viewMode === 'code' ? 'bg-white/10 text-white shadow-sm' : 'text-gray-500 hover:text-gray-300'}`}>Raw HTML</button>
                                      <button onClick={() => setViewMode('preview')} className={`px-4 py-1.5 text-[10px] font-medium tracking-[0.1em] uppercase rounded-md transition-all ${viewMode === 'preview' ? 'bg-white/10 text-white shadow-sm' : 'text-gray-500 hover:text-gray-300'}`}>Visual</button>
                                      <button onClick={() => setViewMode('split')} className={`hidden md:block px-4 py-1.5 text-[10px] font-medium tracking-[0.1em] uppercase rounded-md transition-all ${viewMode === 'split' ? 'bg-white/10 text-white shadow-sm' : 'text-gray-500 hover:text-gray-300'}`}>Split View</button>
                                  </div>
                              </div>
                              
                              {/* Editor Workspace */}
                              <div className="flex-1 flex flex-col md:flex-row bg-[#0a0a0a]">
                                  {(viewMode === 'code' || viewMode === 'split') && (
                                      <div className={`flex-1 flex flex-col border-r border-white/5 ${viewMode === 'split' ? 'md:max-w-[50%]' : ''}`}>
                                          <textarea 
                                              value={editBody}
                                              onChange={(e) => setEditBody(e.target.value)}
                                              spellCheck="false"
                                              className="flex-1 w-full bg-transparent p-5 text-brand-400 font-mono text-[13px] leading-relaxed focus:outline-none resize-none custom-scrollbar"
                                              placeholder="<html>..."
                                          />
                                      </div>
                                  )}
                                  {(viewMode === 'preview' || viewMode === 'split') && (
                                      <div className="flex-1 p-5 bg-[#111] overflow-y-auto custom-scrollbar flex justify-center">
                                          <div className="w-full max-w-2xl">
                                              <div 
                                                  className="w-full preview-content p-6 min-h-[400px] shadow-2xl transition-all cursor-text outline-none focus:ring-2 focus:ring-brand-500/50"
                                                  contentEditable={true}
                                                  suppressContentEditableWarning={true}
                                                  onBlur={(e) => {
                                                      if (e.target.innerHTML !== renderedBody) {
                                                          setEditBody(e.target.innerHTML);
                                                          showToast('Đồng bộ Visual -> HTML thành công.', 'success');
                                                      }
                                                  }}
                                                  dangerouslySetInnerHTML={{ __html: renderedBody }} 
                                              />
                                          </div>
                                      </div>
                                  )}
                              </div>
                          </div>
                      </div>
                  </>
              )}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
