<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beta Cinemas Nowzone | Khuyến mãi</title>

  <style>
    :root {
      --beta-blue: #07539a;
      --beta-blue-dark: #003e78;
      --beta-blue-light: #eaf3fb;
      --beta-yellow: #ffb323;
      --beta-green: #b4d52b;
      --beta-pink: #f18aa7;
      --ink: #172536;
      --muted: #657487;
      --line: #e2eaf2;
      --page: #f3f7fb;
      --white: #fff;
      --shadow: 0 12px 32px rgba(1, 53, 101, .10);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }

    .hero {
      position: relative;
      overflow: hidden;
      color: white;
      padding: 32px 20px;
      background: linear-gradient(120deg, var(--beta-blue-dark), var(--beta-blue) 65%, #0872b9);
    }
    .hero::after {
      content: "";
      position: absolute;
      width: 230px;
      height: 230px;
      right: -65px;
      top: -115px;
      border: 32px solid rgba(255,255,255,.08);
      border-radius: 50%;
      pointer-events: none;
    }
    .hero-inner, .main { max-width: 1180px; margin: auto; }
    .hero-inner { position: relative; z-index: 1; }
    .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .13em; }
    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 35px;
      border-radius: 50%;
      background: var(--beta-yellow);
      box-shadow: 13px 0 var(--beta-green), 26px 0 var(--beta-pink);
    }
    h1 { margin: 10px 0; font-size: clamp(25px, 4vw, 38px); letter-spacing: -.03em; }
    .hero p { margin: 0; max-width: 650px; line-height: 1.6; opacity: .92; }

    .main { padding: 22px 18px 42px; }
    .toolbar {
      position: sticky;
      top: 8px;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 180px 180px auto;
      gap: 10px;
      padding: 12px;
      margin-bottom: 18px;
      background: rgba(255,255,255,.94);
      border: 1px solid var(--line);
      border-radius: 17px;
      box-shadow: 0 8px 24px rgba(1,53,101,.08);
      backdrop-filter: blur(12px);
    }
    .field, .btn {
      min-height: 43px;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: white;
    }
    .field { width: 100%; outline: none; }
    .field:focus { border-color: var(--beta-blue); box-shadow: 0 0 0 3px rgba(7,83,154,.10); }
    .btn { font-weight: 700; color: var(--ink); }
    .btn:hover { border-color: #a9c4dc; }
    .btn-primary { color: white; background: var(--beta-blue); border-color: var(--beta-blue); }
    .btn-primary:hover { background: var(--beta-blue-dark); }
    .btn:disabled { opacity: .6; cursor: wait; }

    .summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 12px 0 18px;
      color: var(--muted);
      font-size: 14px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: white;
      color: #4d5a68;
      font-size: 13px;
      font-weight: 700;
    }
    .chip.active { background: var(--beta-blue); color: white; border-color: var(--beta-blue); }

    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 17px; }
    .card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      background: white;
      border: 1px solid var(--line);
      border-radius: 17px;
      box-shadow: 0 5px 18px rgba(1,53,101,.04);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: #b9d0e5; }
    .poster {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 145px;
      overflow: hidden;
      padding: 18px;
      color: white;
      text-align: center;
      background:
        radial-gradient(circle at 85% 18%, rgba(255,179,35,.8), transparent 36px),
        linear-gradient(135deg, var(--beta-blue-dark), #0872b9);
    }
    .poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .poster-title {
      position: relative;
      z-index: 1;
      max-width: 90%;
      overflow-wrap: anywhere;
      font-size: 22px;
      font-weight: 900;
      text-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .card-body { display: flex; flex: 1; flex-direction: column; padding: 17px; }
    .badges { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
    .badge { padding: 5px 9px; border-radius: 999px; background: #eef1f4; color: #596575; font-size: 11px; font-weight: 800; }
    .badge.active { background: #e7f5ed; color: #177344; }
    .badge.upcoming { background: #eaf3fb; color: var(--beta-blue); }
    .badge.ending { background: #fff3df; color: #9a5b00; }
    .badge.ended { background: #eef1f4; color: #687789; }
    .code { color: var(--beta-blue); font-size: 12px; font-weight: 800; }
    .card h2 { margin: 6px 0 9px; font-size: 17px; line-height: 1.4; }
    .dates { margin: 8px 0 11px; padding: 9px 11px; border-radius: 9px; background: #f3f7fb; color: #42566b; font-size: 13px; line-height: 1.45; }
    .excerpt {
      display: -webkit-box;
      overflow: hidden;
      margin: 0 0 15px;
      color: #4d5967;
      font-size: 14px;
      line-height: 1.55;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }
    .card-actions { display: flex; gap: 8px; margin-top: auto; }
    .card-actions .btn { flex: 1; padding-inline: 9px; font-size: 13px; }
    .card-actions .btn:not(.btn-primary) { color: var(--beta-blue); border-color: #cbdceb; }

    .message {
      grid-column: 1 / -1;
      padding: 30px 18px;
      border: 1px dashed #cbd7e3;
      border-radius: 15px;
      background: white;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }
    .message.error { color: #a51c2b; border-color: #f0b8bf; }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(0,28,55,.66);
      backdrop-filter: blur(5px);
    }
    .modal-panel {
      width: min(760px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: white;
      border-radius: 19px;
      box-shadow: 0 24px 80px rgba(0,0,0,.28);
    }
    .modal-head {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 17px 20px;
      border-bottom: 1px solid var(--line);
      background: white;
    }
    .modal-head h2 { margin: 0; color: var(--beta-blue-dark); font-size: 20px; line-height: 1.4; }
    .close {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 9px;
      background: #edf3f8;
      color: var(--beta-blue);
      font-size: 23px;
    }
    .modal-content { padding: 20px; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .detail-box { padding: 13px; border: 1px solid #e7eef5; border-radius: 12px; background: #f7faff; }
    .detail-label { margin-bottom: 5px; color: var(--beta-blue); font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .detail-value { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
    .detail-section { margin-top: 18px; }
    .detail-section h3 { margin: 0 0 8px; color: var(--beta-blue-dark); font-size: 15px; }
    .detail-section p { margin: 0; color: #414d5a; white-space: pre-wrap; line-height: 1.65; }
    .modal-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 20px; }

    .toast {
      position: fixed;
      z-index: 1200;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 11px 16px;
      border-radius: 999px;
      background: #172536;
      color: white;
      box-shadow: var(--shadow);
      font-size: 14px;
    }

    @media (max-width: 900px) {
      .toolbar { position: static; grid-template-columns: 1fr 1fr; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 580px) {
      .hero { padding: 25px 16px; }
      .main { padding: 15px 12px 28px; }
      .toolbar, .grid, .detail-grid { grid-template-columns: 1fr; }
      .toolbar { padding: 10px; }
      .poster { min-height: 125px; }
      .card-body { padding: 15px; }
      .modal { padding: 8px; }
      .modal-content { padding: 15px; }
    }
    @media print {
      body * { visibility: hidden; }
      .modal, .modal * { visibility: visible; }
      .modal { position: absolute; inset: 0; display: block; padding: 0; background: white; }
      .modal-panel { max-height: none; overflow: visible; width: 100%; box-shadow: none; }
      .modal-head { position: static; }
      .close, .modal-actions { display: none !important; }
    }
  </style>
</head>

<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="eyebrow">BETA CINEMAS · NOWZONE</div>
      <h1>Thông tin chương trình khuyến mãi</h1>
      <p>Tra cứu nhanh chương trình, thời gian áp dụng và hướng dẫn dành cho nhân viên.</p>
    </div>
  </header>

  <main class="main">
    <section class="toolbar" aria-label="Tìm kiếm và lọc chương trình">
      <input id="searchInput" class="field" type="search"
             placeholder="Tìm tên chương trình, code, sản phẩm…" autocomplete="off">
      <select id="statusFilter" class="field" aria-label="Lọc trạng thái">
        <option value="all">Tất cả trạng thái</option>
        <option value="active">Đang áp dụng</option>
        <option value="upcoming">Sắp diễn ra</option>
        <option value="ending">Sắp hết hạn</option>
        <option value="ended">Đã kết thúc</option>
      </select>
      <select id="sortSelect" class="field" aria-label="Sắp xếp">
        <option value="date-asc">Ngày bắt đầu: gần nhất</option>
        <option value="date-desc">Ngày bắt đầu: xa nhất</option>
        <option value="name-asc">Tên chương trình: A–Z</option>
      </select>
      <button id="refreshBtn" class="btn btn-primary" type="button">↻ Làm mới</button>
    </section>

    <div class="summary">
      <div class="chips">
        <button class="chip active" data-filter="all" type="button">Tất cả</button>
        <button class="chip" data-filter="active" type="button">Đang áp dụng</button>
        <button class="chip" data-filter="upcoming" type="button">Sắp diễn ra</button>
        <button class="chip" data-filter="ending" type="button">Sắp hết hạn</button>
        <button class="chip" data-filter="favorites" type="button">★ Yêu thích</button>
      </div>
      <span id="resultCount">Đang tải dữ liệu…</span>
    </div>

    <section id="promotionGrid" class="grid" aria-live="polite">
      <div class="message">Đang tải chương trình khuyến mãi…</div>
    </section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-panel">
      <div class="modal-head">
        <h2 id="modalTitle">Chi tiết chương trình</h2>
        <button id="closeModalBtn" class="close" type="button" aria-label="Đóng">×</button>
      </div>
      <div id="modalContent" class="modal-content"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <script>
    // 1) Thay bằng URL Web App Apps Script của bạn.
    const API_URL = "https://script.google.com/macros/s/AKfycbx4BwoRhu-sshi1ZZMjLRuY5mKoYZno3CV1ozcPv38H51AQlfBNiEJUkmN0SFtCl4iQ7A/exec";

    const state = {
      promotions: [],
      query: "",
      filter: "all",
      sort: "date-asc",
      favorites: new Set(),
      activePromotion: null
    };

    const $ = (id) => document.getElementById(id);
    const grid = $("promotionGrid");

    document.addEventListener("DOMContentLoaded", () => {
      loadFavorites();
      bindEvents();
      loadPromotions();
    });

    function bindEvents() {
      $("searchInput").addEventListener("input", (event) => {
        state.query = event.target.value.trim().toLowerCase();
        render();
      });

      $("statusFilter").addEventListener("change", (event) => {
        state.filter = event.target.value;
        syncControls();
        render();
      });

      $("sortSelect").addEventListener("change", (event) => {
        state.sort = event.target.value;
        render();
      });

      $("refreshBtn").addEventListener("click", loadPromotions);
      $("closeModalBtn").addEventListener("click", closeModal);

      $("modal").addEventListener("click", (event) => {
        if (event.target === $("modal")) closeModal();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeModal();
      });

      document.querySelectorAll("[data-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          state.filter = button.dataset.filter;
          $("statusFilter").value = state.filter === "favorites" ? "all" : state.filter;
          syncControls();
          render();
        });
      });

      grid.addEventListener("click", handleCardAction);
      $("modalContent").addEventListener("click", handleModalAction);
    }

    async function loadPromotions() {
      if (!API_URL || API_URL.includes("YOUR_GOOGLE_APPS_SCRIPT_URL")) {
        showMessage("Hãy thay API_URL bằng URL Web App Apps Script của bạn.", true);
        return;
      }

      $("refreshBtn").disabled = true;
      $("refreshBtn").textContent = "Đang tải…";
      grid.innerHTML = '<div class="message">Đang tải chương trình khuyến mãi…</div>';

      try {
        const result = await fetchJsonp(API_URL);
        const list = Array.isArray(result)
          ? result
          : result.data || result.promotions || result.items || [];

        if (!Array.isArray(list)) throw new Error("API không trả về danh sách chương trình.");

        state.promotions = list.map(normalizePromotion);
        render();
      } catch (error) {
        showMessage("Không tải được dữ liệu. Kiểm tra URL, quyền truy cập Web App và định dạng phản hồi. " + error.message, true);
      } finally {
        $("refreshBtn").disabled = false;
        $("refreshBtn").textContent = "↻ Làm mới";
      }
    }

    // API Apps Script cần nhận tham số callback và trả về callback({...});
    function fetchJsonp(url) {
      return new Promise((resolve, reject) => {
        const callbackName = "betaCallback_" + Date.now() + "_" + Math.random().toString(36).slice(2);
        const script = document.createElement("script");
        const separator = url.includes("?") ? "&" : "?";
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("Quá thời gian chờ phản hồi."));
        }, 15000);

        function cleanup() {
          clearTimeout(timer);
          delete window[callbackName];
          script.remove();
        }

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error("Không thể kết nối tới Apps Script."));
        };

        script.src = url + separator + "callback=" + encodeURIComponent(callbackName) + "&_=" + Date.now();
        document.body.appendChild(script);
      });
    }

    // Hỗ trợ tên trường phổ biến từ Google Sheets hoặc API.
    function normalizePromotion(item, index) {
      const p = { ...item };
      p.code = text(p.code || p.Code || p.ctkm || p.CTKM || p["Code CTKM"] || `KM-${index + 1}`);
      p.name = text(p.name || p.title || p.ten_chuong_trinh || p["Tên chương trình"] || "Chương trình khuyến mãi");
      p.startDate = p.startDate || p.start_date || p.start || p["Ngày bắt đầu"] || "";
      p.endDate = p.endDate || p.end_date || p.end || p["Ngày kết thúc"] || "";
      p.location = text(p.location || p.place || p["Địa điểm"] || "Beta Nowzone");
      p.kpi = text(p.kpi || p["KPI"] || "");
      p.product = text(p.product || p.products || p["Sản phẩm"] || "");
      p.content = text(p.content || p.description || p["Nội dung"] || "");
      p.terms = text(p.terms || p["Điều khoản"] || "");
      p.process = text(p.process || p.procedure || p["Quy trình"] || "");
      p.control = text(p.control || p["Kiểm soát"] || "");
      p.image = text(p.image || p.imageUrl || p.poster || p["Link LCD"] || "");
      p.status = getStatus(p);
      return p;
    }

    function text(value) {
      return value == null ? "" : String(value).trim();
    }

    function parseDate(value) {
      if (!value) return null;
      if (value instanceof Date) return value;

      const s = String(value).trim();
      let m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
      if (m) return new Date(+m[3], +m[2] - 1, +m[1]);

      m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m) return new Date(+m[1], +m[2] - 1, +m[3]);

      const d = new Date(s);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function getStatus(p) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const start = parseDate(p.startDate);
      const end = parseDate(p.endDate);

      if (start) start.setHours(0, 0, 0, 0);
      if (end) end.setHours(23, 59, 59, 999);

      if (start && today < start) return "upcoming";
      if (end && today > end) return "ended";
      if (end && Math.ceil((end - today) / 86400000) <= 3) return "ending";
      return "active";
    }

    function statusLabel(status) {
      return ({
        active: "Đang áp dụng",
        upcoming: "Sắp diễn ra",
        ending: "Sắp hết hạn",
        ended: "Đã kết thúc"
      })[status] || "Chưa xác định";
    }

    function filteredPromotions() {
      let list = [...state.promotions];

      if (state.filter === "favorites") {
        list = list.filter((p) => state.favorites.has(p.code));
      } else if (state.filter !== "all") {
        list = list.filter((p) => p.status === state.filter);
      }

      if (state.query) {
        list = list.filter((p) => {
          const haystack = [
            p.code, p.name, p.product, p.location, p.content, p.kpi
          ].join(" ").toLowerCase();
          return haystack.includes(state.query);
        });
      }

      list.sort((a, b) => {
        if (state.sort === "name-asc") return a.name.localeCompare(b.name, "vi");
        const aDate = parseDate(a.startDate)?.getTime() || 0;
        const bDate = parseDate(b.startDate)?.getTime() || 0;
        return state.sort === "date-desc" ? bDate - aDate : aDate - bDate;
      });

      return list;
    }

    function render() {
      const list = filteredPromotions();
      $("resultCount").textContent = `${list.length} / ${state.promotions.length} chương trình`;
      syncControls();

      if (!list.length) {
        showMessage("Không tìm thấy chương trình phù hợp. Hãy thử đổi từ khóa hoặc bộ lọc.");
        return;
      }

      grid.innerHTML = list.map((p) => {
        const favorite = state.favorites.has(p.code);
        const image = safeImageUrl(p.image);
        const imageHtml = image
          ? `<img src="${escapeAttr(image)}" alt="" loading="lazy" onerror="this.remove()">`
          : "";

        return `
          <article class="card">
            <div class="poster">
              ${imageHtml}
              <div class="poster-title">${escapeHtml(p.code)}</div>
            </div>
            <div class="card-body">
              <div class="badges">
                <span class="badge ${p.status}">${statusLabel(p.status)}</span>
                ${p.location ? `<span class="badge">${escapeHtml(p.location)}</span>` : ""}
              </div>
              <div class="code">${escapeHtml(p.code)}</div>
              <h2>${escapeHtml(p.name)}</h2>
              <div class="dates">Thời gian: ${escapeHtml(formatDate(p.startDate))} – ${escapeHtml(formatDate(p.endDate))}</div>
              <p class="excerpt">${escapeHtml(p.content || p.product || "Nhấn xem chi tiết để đọc thông tin chương trình.")}</p>
              <div class="card-actions">
                <button class="btn btn-primary" type="button" data-action="detail" data-code="${escapeAttr(p.code)}">Xem chi tiết</button>
                <button class="btn" type="button" data-action="favorite" data-code="${escapeAttr(p.code)}">${favorite ? "★ Đã lưu" : "☆ Yêu thích"}</button>
              </div>
            </div>
          </article>`;
      }).join("");
    }

    function handleCardAction(event) {
      const button = event.target.closest("button[data-action]");
      if (!button) return;

      const promotion = state.promotions.find((p) => p.code === button.dataset.code);
      if (!promotion) return;

      if (button.dataset.action === "detail") openModal(promotion);
      if (button.dataset.action === "favorite") toggleFavorite(promotion.code);
    }

    function openModal(p) {
      state.activePromotion = p;
      $("modalTitle").textContent = p.name;

      $("modalContent").innerHTML = `
        <div class="badges">
          <span class="badge ${p.status}">${statusLabel(p.status)}</span>
          <span class="badge">${escapeHtml(p.code)}</span>
        </div>
        <div class="detail-grid">
          ${detailBox("Thời gian", `${formatDate(p.startDate)} – ${formatDate(p.endDate)}`)}
          ${detailBox("Địa điểm", p.location)}
          ${detailBox("KPI", p.kpi)}
          ${detailBox("Sản phẩm", p.product)}
        </div>
        ${detailSection("Nội dung chương trình", p.content)}
        ${detailSection("Điều khoản", p.terms)}
        ${detailSection("Quy trình thực hiện", p.process)}
        ${detailSection("Kiểm soát", p.control)}
        <div class="modal-actions">
          <button class="btn btn-primary" type="button" data-modal-action="copy">Sao chép nội dung</button>
          <button class="btn" type="button" data-modal-action="print">In chi tiết</button>
          <button class="btn" type="button" data-modal-action="favorite">${state.favorites.has(p.code) ? "★ Bỏ yêu thích" : "☆ Thêm yêu thích"}</button>
        </div>`;

      $("modal").classList.remove("hidden");
      document.body.style.overflow = "hidden";
      $("closeModalBtn").focus();
    }

    function detailBox(label, value) {
      return `<div class="detail-box"><div class="detail-label">${escapeHtml(label)}</div><div class="detail-value">${escapeHtml(value || "—")}</div></div>`;
    }

    function detailSection(title, content) {
      if (!content) return "";
      return `<section class="detail-section"><h3>${escapeHtml(title)}</h3><p>${escapeHtml(content)}</p></section>`;
    }

    function handleModalAction(event) {
      const button = event.target.closest("[data-modal-action]");
      if (!button || !state.activePromotion) return;

      const p = state.activePromotion;
      if (button.dataset.modalAction === "copy") copyText(promotionText(p));
      if (button.dataset.modalAction === "print") window.print();
      if (button.dataset.modalAction === "favorite") {
        toggleFavorite(p.code);
        openModal(p);
      }
    }

    function promotionText(p) {
      return [
        `MÃ CHƯƠNG TRÌNH: ${p.code}`,
        `TÊN: ${p.name}`,
        `THỜI GIAN: ${formatDate(p.startDate)} – ${formatDate(p.endDate)}`,
        `ĐỊA ĐIỂM: ${p.location}`,
        `KPI: ${p.kpi}`,
        `SẢN PHẨM: ${p.product}`,
        `NỘI DUNG: ${p.content}`,
        `ĐIỀU KHOẢN: ${p.terms}`,
        `QUY TRÌNH: ${p.process}`,
        `KIỂM SOÁT: ${p.control}`
      ].join("\n");
    }

    async function copyText(value) {
      try {
        await navigator.clipboard.writeText(value);
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = value;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
      }
      showToast("Đã sao chép nội dung chương trình.");
    }

    function toggleFavorite(code) {
      if (state.favorites.has(code)) state.favorites.delete(code);
      else state.favorites.add(code);

      localStorage.setItem("betaNowzoneFavorites", JSON.stringify([...state.favorites]));
      render();
      showToast(state.favorites.has(code) ? "Đã thêm vào yêu thích." : "Đã bỏ khỏi yêu thích.");
    }

    function loadFavorites() {
      try {
        state.favorites = new Set(JSON.parse(localStorage.getItem("betaNowzoneFavorites") || "[]"));
      } catch {
        state.favorites = new Set();
      }
    }

    function syncControls() {
      $("statusFilter").value = state.filter === "favorites" ? "all" : state.filter;
      document.querySelectorAll("[data-filter]").forEach((button) => {
        button.classList.toggle("active", button.dataset.filter === state.filter);
      });
    }

    function closeModal() {
      $("modal").classList.add("hidden");
      document.body.style.overflow = "";
      state.activePromotion = null;
    }

    function showMessage(message, isError = false) {
      grid.innerHTML = `<div class="message ${isError ? "error" : ""}">${escapeHtml(message)}</div>`;
      $("resultCount").textContent = isError ? "Lỗi tải dữ liệu" : "0 chương trình";
    }

    function showToast(message) {
      const toast = $("toast");
      toast.textContent = message;
      toast.classList.remove("hidden");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.add("hidden"), 2400);
    }

    function formatDate(value) {
      const date = parseDate(value);
      if (!date) return value ? String(value) : "Chưa cập nhật";
      return new Intl.DateTimeFormat("vi-VN", {
        day: "2-digit", month: "2-digit", year: "numeric"
      }).format(date);
    }

    function safeImageUrl(value) {
      return /^https?:\/\//i.test(String(value || "").trim()) ? String(value).trim() : "";
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }
  </script>
</body>
</html>
