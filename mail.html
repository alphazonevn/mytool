<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Outsourcing Mailer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #020617; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- CÀI ĐẶT & SOẠN THẢO -->
        <div class="lg:col-span-7 space-y-6">
            <header class="mb-8">
                <h1 class="text-3xl font-black text-indigo-500 tracking-tight">MY TOOL <span class="text-white">v8.0</span></h1>
                <p class="text-slate-500 text-sm">Hệ thống gửi mail Outsource - Không phụ thuộc file Apps Script.</p>
            </header>

            <div class="glass p-6 rounded-3xl space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Security Token</label>
                        <input type="password" id="apiToken" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 mt-1 outline-none focus:border-indigo-500" placeholder="••••">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Tiêu đề Mail</label>
                        <input type="text" id="subject" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 mt-1 outline-none focus:border-indigo-500" value="Chào {{Tên}}, MY TOOL tặng quà bạn!">
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-indigo-400 uppercase flex justify-between">
                        <span>Thiết kế HTML mẫu</span>
                        <span class="text-slate-500 lowercase font-normal">Hỗ trợ: {{Tên}}, {{Sản phẩm}}, {{AI_MESSAGE}}</span>
                    </label>
                    <textarea id="htmlSource" class="w-full h-80 bg-black/50 border border-white/10 rounded-2xl p-4 mt-2 font-mono text-xs text-indigo-300 outline-none focus:border-indigo-500 transition-all" 
                    placeholder="<html><body style='color:blue'>Chào {{Tên}}...</body></html>"></textarea>
                </div>

                <div class="flex items-center justify-between p-4 bg-white/5 rounded-2xl">
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" id="resetMode" class="w-4 h-4 accent-indigo-500">
                        <span class="text-xs font-bold text-slate-400">Gửi đợt mới (Reset trạng thái)</span>
                    </label>
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" id="useAI" class="w-4 h-4 accent-indigo-500">
                        <span class="text-xs font-bold text-indigo-400">Sử dụng AI Gemini</span>
                    </label>
                </div>

                <button id="runBtn" onclick="execute()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-4 rounded-2xl font-bold text-white transition-all shadow-xl shadow-indigo-500/10 flex items-center justify-center gap-2">
                    <span>KÍCH HOẠT CHIẾN DỊCH</span>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <!-- NHẬT KÝ VÀ TRẠNG THÁI -->
        <div class="lg:col-span-5 space-y-6">
            <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest px-2">Nhật ký thực thi</h3>
            <div id="logPanel" class="glass rounded-3xl p-6 h-[600px] overflow-y-auto font-mono text-[11px] space-y-2">
                <div class="text-slate-600 italic">Hệ thống đang chờ lệnh...</div>
            </div>
            
            <div id="stats" class="grid grid-cols-2 gap-4">
                <div class="glass p-4 rounded-2xl text-center">
                    <div id="countSuccess" class="text-2xl font-bold text-green-400">0</div>
                    <div class="text-[9px] text-slate-500 uppercase">Thành công</div>
                </div>
                <div class="glass p-4 rounded-2xl text-center">
                    <div id="countTotal" class="text-2xl font-bold text-indigo-400">0</div>
                    <div class="text-[9px] text-slate-500 uppercase">Tổng xử lý</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwvZgYLPn0os6jiPn11AD5lyr8XBdvW3OL7LbO8Bnbvencu_hxnbw68bReEmOtlWb2Gdw/exec"; // Dán URL Script tại đây

        async function execute() {
            const btn = document.getElementById('runBtn');
            const logs = document.getElementById('logPanel');
            const payload = {
                token: document.getElementById('apiToken').value,
                subject: document.getElementById('subject').value,
                htmlSource: document.getElementById('htmlSource').value,
                resetMode: document.getElementById('resetMode').checked,
                useAI: document.getElementById('useAI').checked
            };

            if(!payload.token || !payload.htmlSource) return alert("Vui lòng nhập đầy đủ Token và Nội dung HTML!");

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ĐANG GỬI...`;
            logs.innerHTML = `<div class="text-indigo-400 font-bold">[${new Date().toLocaleTimeString()}] BẮT ĐẦU CHIẾN DỊCH...</div>`;

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const resData = await response.json();

                if(resData.status === "success") {
                    document.getElementById('countSuccess').innerText = resData.count;
                    document.getElementById('countTotal').innerText = resData.details.length;
                    
                    resData.details.forEach(item => {
                        const color = item.status === "Thành công" ? "text-green-400" : "text-red-400";
                        logs.insertAdjacentHTML('afterbegin', `<div class="py-1 border-b border-white/5 ${color}">● ${item.email} - ${item.status}</div>`);
                    });
                } else {
                    logs.insertAdjacentHTML('afterbegin', `<div class="text-red-500 font-bold">LỖI: ${resData.msg}</div>`);
                }
            } catch (err) {
                logs.insertAdjacentHTML('afterbegin', `<div class="text-red-500 font-bold">KHÔNG THỂ KẾT NỐI SERVER</div>`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `KÍCH HOẠT CHIẾN DỊCH <i class="fas fa-paper-plane ml-2"></i>`;
            }
        }
    </script>
</body>
</html>
