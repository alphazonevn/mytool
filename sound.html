<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/4/4d/Music_logo.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Livestream Audio Mixer Pro V5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #05050a; /* Vùng tối sâu */
            color: #f8fafc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Tùy chỉnh thanh cuộn thanh lịch hơn */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        .sound-pad { transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1); }
        .sound-pad:active { transform: scale(0.92); filter: brightness(1.3); }
        .sound-pad.playing {
            box-shadow: 0 0 20px 2px var(--pad-color, rgba(255,255,255,0.5)), inset 0 0 10px rgba(0,0,0,0.5);
            border-color: #fff;
            filter: brightness(1.4);
        }

        /* Thanh trượt Touch-Friendly */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            touch-action: pan-y;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px; width: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: transform 0.15s;
        }
        input[type=range]:active::-webkit-slider-thumb { transform: scale(1.3); }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }
        input[type=range]:focus { outline: none; }
        
        .drag-over {
            border-color: #3b82f6 !important;
            background-color: rgba(59, 130, 246, 0.15) !important;
            transform: scale(1.02);
        }

        @keyframes slideInUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-enter { animation: slideInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="h-screen flex flex-col relative overflow-hidden">
    <!-- Hình nền hiệu ứng mờ -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-[-20%] left-[-10%] w-[60%] h-[60%] bg-indigo-600/10 blur-[120px] rounded-full mix-blend-screen"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[50%] h-[50%] bg-emerald-600/10 blur-[120px] rounded-full mix-blend-screen"></div>
    </div>

    <!-- Header UI (Responsive) -->
    <header class="glass-panel border-b border-white/10 p-3 lg:px-6 flex flex-col md:flex-row justify-between items-center gap-4 z-20 shrink-0 shadow-lg">
        <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-br from-indigo-500 to-cyan-500 p-2.5 rounded-xl shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid fa-layer-group text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-bold tracking-tight text-white leading-tight">Mixer Pro V5</h1>
                    <p class="text-[10px] md:text-xs text-slate-400 font-mono flex items-center gap-1">
                        Studio & Mobile Edition
                    </p>
                </div>
            </div>
            
            <!-- Trạng thái Cloud Sync (Trên Mobile nằm cạnh Title) -->
            <div id="cloud-status" class="flex md:hidden items-center gap-1.5 text-[9px] bg-black/40 px-2 py-1 rounded-full border border-white/10">
                <i class="fa-solid fa-spinner fa-spin text-slate-400"></i>
            </div>
        </div>
        
        <div class="flex flex-wrap md:flex-nowrap items-center justify-center gap-2 md:gap-4 w-full md:w-auto">
            <!-- Trạng thái Cloud Sync (Trên PC) -->
            <div id="cloud-status-pc" class="hidden md:flex items-center gap-2 text-[10px] bg-black/40 px-3 py-1.5 rounded-full border border-white/10 transition-colors">
                <i class="fa-solid fa-spinner fa-spin text-slate-400"></i>
                <span class="text-slate-400 font-medium uppercase">Khởi tạo...</span>
            </div>

            <button id="btn-record" onclick="window.toggleRecording()" class="flex-1 md:flex-none flex items-center justify-center gap-2 px-3 py-2 rounded-xl bg-white/5 border border-white/10 text-slate-300 hover:bg-white/10 transition-all active:scale-95">
                <i class="fa-solid fa-record-vinyl text-red-400"></i>
                <div class="flex flex-col text-left leading-none hidden sm:flex">
                    <span class="text-xs font-bold">Ghi Âm</span>
                    <span class="text-[9px] opacity-70" id="record-timer">00:00</span>
                </div>
            </button>

            <button id="btn-talkover" onclick="window.toggleTalkover()" class="flex-1 md:flex-none flex items-center justify-center gap-2 px-3 py-2 rounded-xl bg-white/5 border border-white/10 text-slate-300 hover:bg-white/10 transition-all active:scale-95">
                <i class="fa-solid fa-microphone-lines text-amber-400"></i>
                <div class="flex flex-col text-left leading-none hidden sm:flex">
                    <span class="text-xs font-bold">Talkover</span>
                    <span class="text-[9px] opacity-70">Giảm nhạc</span>
                </div>
            </button>

            <!-- Master Volume -->
            <div class="flex items-center gap-3 bg-black/40 px-4 py-2 rounded-xl border border-white/10 w-full md:w-auto mt-2 md:mt-0">
                <i class="fa-solid fa-volume-high text-cyan-400 text-sm"></i>
                <div class="flex flex-col w-full md:w-32">
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Master</label>
                        <span id="master-vol-val" class="text-xs font-mono text-cyan-400 font-bold">100%</span>
                    </div>
                    <input type="range" id="master-volume" min="0" max="1" step="0.01" value="1">
                </div>
            </div>
        </div>
    </header>

    <!-- Main Workspace (Responsive) -->
    <main class="flex-1 flex flex-col lg:flex-row gap-4 p-3 md:p-4 overflow-y-auto lg:overflow-hidden z-10 w-full max-w-[1800px] mx-auto">
        
        <!-- Cột trái: Kênh nhạc -->
        <div class="w-full lg:flex-[3] flex flex-col gap-4 lg:overflow-y-auto pb-10 lg:pb-0 lg:pr-2" id="decks-container">
            <div class="flex justify-between items-center shrink-0 px-1">
                <h2 class="text-sm md:text-base font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-indigo-400"></i> Bộ trộn Audio (Decks)
                </h2>
                <button onclick="window.addDeck()" class="bg-indigo-600/90 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-xl text-xs font-medium transition-colors shadow-lg shadow-indigo-500/20 flex items-center gap-2 active:scale-95">
                    <i class="fa-solid fa-plus"></i> Kênh mới
                </button>
            </div>
            <!-- Grid responsive: 1 cột trên ĐT, 2 cột trên Tablet/PC -->
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-4" id="decks-grid"></div>
        </div>

        <!-- Cột phải: Soundboard -->
        <div class="w-full lg:flex-[1] lg:min-w-[320px] lg:max-w-[420px] glass-panel rounded-2xl p-4 flex flex-col relative shrink-0 min-h-[400px] lg:h-full">
            <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-emerald-500 via-teal-400 to-cyan-500 rounded-t-2xl"></div>
            
            <div class="flex justify-between items-center mb-4 mt-1">
                <h2 class="text-sm md:text-base font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-table-cells-large text-emerald-400"></i> Soundboard
                </h2>
                <div class="flex items-center gap-2">
                    <button onclick="window.addPad()" class="w-7 h-7 flex items-center justify-center bg-white/5 hover:bg-white/20 text-emerald-400 rounded-lg transition-colors tooltip active:scale-95" title="Thêm ô">
                        <i class="fa-solid fa-plus text-xs"></i>
                    </button>
                    <div class="flex items-center bg-black/40 px-2.5 py-1.5 rounded-lg border border-white/5" title="Âm lượng Soundboard">
                        <i class="fa-solid fa-volume-low text-[10px] text-slate-400 mr-2"></i>
                        <input type="range" id="soundboard-vol" min="0" max="1" step="0.05" value="1" oninput="window.updateSoundboardVol()" class="w-14 md:w-16">
                    </div>
                    <button onclick="window.stopAllSounds()" class="w-7 h-7 flex items-center justify-center bg-red-500/10 hover:bg-red-500/30 text-red-400 rounded-lg transition-colors tooltip active:scale-95" title="Dừng Hết">
                        <i class="fa-solid fa-hand text-xs"></i>
                    </button>
                </div>
            </div>
            
            <p class="text-[10px] text-slate-400 mb-4 bg-black/20 p-2 rounded-lg border border-white/5">💡 Kéo thả file .mp3 từ máy tính vào ô trống để nạp âm thanh nhanh.</p>
            
            <!-- Lưới Soundboard tự co giãn -->
            <div class="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-3 auto-rows-[85px] gap-2.5 overflow-y-auto flex-1 pr-1 pb-10 lg:pb-0 content-start" id="soundboard-grid"></div>
        </div>
    </main>

    <!-- Modal nhập URL -->
    <div id="url-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex items-center justify-center hidden opacity-0 transition-opacity">
        <div class="glass-panel p-6 rounded-2xl shadow-2xl w-[90%] max-w-[400px] transform scale-95 transition-transform" id="url-modal-content">
            <h3 class="text-lg font-bold text-white mb-2"><i class="fa-solid fa-link text-cyan-400 mr-2"></i>Thêm âm thanh từ Link</h3>
            <p class="text-xs text-slate-400 mb-4">Nhập link trực tiếp đến file .mp3 hoặc .mp4 (Không hỗ trợ link Youtube do bản quyền).</p>
            <input type="text" id="url-input" placeholder="https://example.com/audio.mp3" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-500 mb-5 transition-colors">
            <div class="flex justify-end gap-3">
                <button onclick="window.closeUrlModal()" class="px-4 py-2 rounded-xl text-sm bg-white/5 hover:bg-white/10 text-slate-300 transition-colors">Hủy</button>
                <button onclick="window.submitUrlModal()" class="px-4 py-2 rounded-xl text-sm bg-cyan-600 hover:bg-cyan-500 text-white font-medium transition-colors shadow-lg shadow-cyan-500/20">Tải ngay</button>
            </div>
            <input type="hidden" id="url-target-deck">
        </div>
    </div>

    <!-- Modal Đổi Tên -->
    <div id="rename-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex items-center justify-center hidden opacity-0 transition-opacity">
        <div class="glass-panel p-6 rounded-2xl shadow-2xl w-[90%] max-w-[320px] transform scale-95 transition-transform" id="rename-modal-content">
            <h3 class="text-lg font-bold text-white mb-4">Đổi tên Hiệu ứng</h3>
            <input type="text" id="rename-input" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-500 mb-5 transition-colors" onkeypress="if(event.key==='Enter') window.submitRenameModal()">
            <div class="flex justify-end gap-3">
                <button onclick="window.closeRenameModal()" class="px-4 py-2 rounded-xl text-sm bg-white/5 hover:bg-white/10 text-slate-300 transition-colors">Hủy</button>
                <button onclick="window.submitRenameModal()" class="px-4 py-2 rounded-xl text-sm bg-cyan-600 hover:bg-cyan-500 text-white font-medium transition-colors">Lưu</button>
            </div>
            <input type="hidden" id="rename-target-index">
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none w-[90%] max-w-[350px]"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let audioCtx;
        let masterGain;
        let isTalkoverActive = false;
        const talkoverMultiplier = 0.3; 

        // Bảng màu rực rỡ hơn cho V5
        const deckColors = ['#3b82f6', '#a855f7', '#f59e0b', '#10b981', '#ec4899', '#ef4444', '#14b8a6', '#6366f1'];
        const padColors = ['#e11d48', '#ea580c', '#d97706', '#16a34a', '#059669', '#0d9488', '#0891b2', '#0284c7', '#4f46e5', '#7c3aed', '#c026d3', '#db2777'];
        
        const decks = {}; 
        const soundPads = [];

        let appState = {
            masterVolume: 1.0,
            soundboardVolume: 1.0,
            deckOrder: ['deck_a', 'deck_b'], // Mặc định 2 kênh cho gọn
            decks: {
                'deck_a': { id: 'deck_a', name: 'Nhạc Nền (A)', hex: '#3b82f6', vol: 1, speed: 1, bass: 0, treb: 0, loop: true, source: null, note: '' },
                'deck_b': { id: 'deck_b', name: 'Lót Giọng (B)', hex: '#a855f7', vol: 1, speed: 1, bass: 0, treb: 0, loop: true, source: null, note: '' }
            },
            pads: Array(12).fill(null).map((_, i) => ({ type: null, url: null, name: `Pad ${i + 1}`, hex: padColors[i % padColors.length] }))
        };
        let isStateLoading = true; 
        let saveTimeout = null;

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'livestream-mixer-pro-v5';
        let app, auth, db, userId;

        function updateCloudStatus(status) {
            const els = [document.getElementById('cloud-status'), document.getElementById('cloud-status-pc')];
            els.forEach(el => {
                if (!el) return;
                if (status === 'saving') {
                    el.innerHTML = '<i class="fa-solid fa-sync fa-spin text-cyan-400"></i> <span class="hidden md:inline text-cyan-400 font-medium">Đang lưu...</span>';
                    el.classList.replace('border-white/10', 'border-cyan-500/30');
                } else if (status === 'saved') {
                    el.innerHTML = '<i class="fa-solid fa-cloud-check text-emerald-400"></i> <span class="hidden md:inline text-emerald-400 font-medium">Đã đồng bộ</span>';
                    el.classList.replace('border-cyan-500/30', 'border-emerald-500/30');
                    el.classList.replace('border-red-500/30', 'border-emerald-500/30');
                    el.classList.replace('border-white/10', 'border-emerald-500/30');
                } else if (status === 'error') {
                    el.innerHTML = '<i class="fa-solid fa-cloud-xmark text-red-400"></i> <span class="hidden md:inline text-red-400 font-medium">Lỗi kết nối</span>';
                    el.classList.replace('border-white/10', 'border-red-500/30');
                    el.classList.replace('border-emerald-500/30', 'border-red-500/30');
                }
            });
        }

        async function initCloudStorage() {
            try {
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
                if (!firebaseConfig) {
                    isStateLoading = false;
                    const els = [document.getElementById('cloud-status'), document.getElementById('cloud-status-pc')];
                    els.forEach(el => { if(el) el.style.display = 'none'; });
                    return;
                }

                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                userId = auth.currentUser.uid;
                await loadStateFromCloud();
            } catch (e) {
                updateCloudStatus('error');
                isStateLoading = false;
            }
        }

        function saveStateToCloud() {
            if (!userId || isStateLoading || !db) return;
            updateCloudStatus('saving');
            clearTimeout(saveTimeout);
            
            saveTimeout = setTimeout(async () => {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'mixer_config', 'v5');
                    await setDoc(docRef, appState);
                    updateCloudStatus('saved');
                } catch (e) {
                    updateCloudStatus('error');
                }
            }, 1500);
        }

        async function loadStateFromCloud() {
            isStateLoading = true;
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'mixer_config', 'v5');
                const snap = await getDoc(docRef);
                
                if (snap.exists()) {
                    const data = snap.data();
                    appState.masterVolume = data.masterVolume ?? 1.0;
                    appState.soundboardVolume = data.soundboardVolume ?? 1.0;
                    if (data.decks) {
                        appState.decks = data.decks;
                        appState.deckOrder = data.deckOrder || Object.keys(data.decks);
                    }
                    if (data.pads) appState.pads = data.pads;
                    
                    applyStateToUI();
                    showToast("Đã khôi phục cài đặt từ Cloud!", "success");
                }
                updateCloudStatus('saved');
            } catch (e) {
                updateCloudStatus('error');
            }
            setTimeout(() => { isStateLoading = false; }, 500); 
        }

        function applyStateToUI() {
            document.getElementById('master-volume').value = appState.masterVolume;
            document.getElementById('master-vol-val').innerText = Math.round(appState.masterVolume * 100) + '%';
            if (masterGain) masterGain.gain.value = appState.masterVolume;

            const sbVolEl = document.getElementById('soundboard-vol');
            if (sbVolEl) sbVolEl.value = appState.soundboardVolume;

            renderDecks();
            renderSoundboard();

            appState.deckOrder.forEach(id => {
                const state = appState.decks[id];
                if (decks[id] && decks[id].nodes) {
                    decks[id].nodes.bassEQ.gain.value = state.bass;
                    decks[id].nodes.trebleEQ.gain.value = state.treb;
                    decks[id].audioEl.playbackRate = state.speed;
                    decks[id].nodes.gainNode.gain.value = state.vol;
                }
            });
        }

        function initAudioContext() {
            if (audioCtx) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = appState.masterVolume;
                masterGain.connect(audioCtx.destination);
                
                Object.values(decks).forEach(deck => setupDeckAudioNodes(deck));
                drawVisualizers();
            } catch (e) {
                showToast("Trình duyệt không hỗ trợ Web Audio", "error");
            }
        }

        function setupDeckAudioNodes(deck) {
            if (deck.nodes) return; 

            const source = audioCtx.createMediaElementSource(deck.audioEl);
            const bassEQ = audioCtx.createBiquadFilter();
            const trebleEQ = audioCtx.createBiquadFilter();
            const gainNode = audioCtx.createGain();
            const analyser = audioCtx.createAnalyser();

            bassEQ.type = "lowshelf";
            bassEQ.frequency.value = 250;
            trebleEQ.type = "highshelf";
            trebleEQ.frequency.value = 4000;
            analyser.fftSize = 128; // Tăng mượt cho V5

            source.connect(bassEQ);
            bassEQ.connect(trebleEQ);
            trebleEQ.connect(gainNode);
            gainNode.connect(analyser);
            analyser.connect(masterGain);

            deck.nodes = { source, bassEQ, trebleEQ, gainNode, analyser };
            
            const state = appState.decks[deck.id];
            bassEQ.gain.value = state.bass;
            trebleEQ.gain.value = state.treb;
            const ducking = isTalkoverActive ? talkoverMultiplier : 1.0;
            gainNode.gain.value = state.vol * ducking;
        }

        function renderDecks() {
            const container = document.getElementById('decks-grid');
            let html = '';
            
            appState.deckOrder.forEach(id => {
                const conf = appState.decks[id];
                
                if (!decks[id]) {
                    decks[id] = { id: id, audioEl: new Audio(), nodes: null, isFading: false, isLoop: conf.loop || false };
                    decks[id].audioEl.crossOrigin = "anonymous";
                    decks[id].audioEl.id = `audio-el-${id}`;
                    document.body.appendChild(decks[id].audioEl);
                    
                    if (conf.source && conf.source.type === 'url' && conf.source.url) {
                        decks[id].audioEl.src = conf.source.url;
                        decks[id].audioEl.load();
                    }

                    decks[id].audioEl.addEventListener('timeupdate', () => updateProgress(id));
                    decks[id].audioEl.addEventListener('loadedmetadata', () => {
                        const totalEl = document.getElementById(`time-total-${id}`);
                        if(totalEl) totalEl.innerText = formatTime(decks[id].audioEl.duration);
                    });
                    decks[id].audioEl.addEventListener('ended', () => {
                        if(!decks[id].isLoop) {
                            const btn = document.getElementById(`play-btn-${id}`);
                            if(btn) {
                                btn.innerHTML = '<i class="fa-solid fa-play ml-1"></i>';
                                btn.classList.remove('bg-emerald-500', 'shadow-[0_0_15px_rgba(16,185,129,0.5)]');
                                btn.style.backgroundColor = conf.hex;
                            }
                        }
                    });
                }
                
                let trackNameHtml = 'Kéo thả file mp3 vào đây...';
                let trackNameClass = 'text-slate-500';
                if (conf.source) {
                    if (conf.source.type === 'local') {
                        trackNameHtml = `<i class="fa-solid fa-triangle-exclamation text-amber-400 mr-1"></i> ${conf.source.name} (Tải lại)`;
                        trackNameClass = 'text-amber-400';
                    } else {
                        trackNameHtml = conf.source.name;
                        trackNameClass = `text-white drop-shadow-md`;
                    }
                }

                html += `
                <div id="deck-container-${id}" class="glass-panel rounded-2xl p-3 md:p-4 shadow-xl flex flex-col gap-3 transition-all duration-300 hover:bg-white/[0.05] relative overflow-hidden group"
                     ondragover="window.handleDragOver(event, '${id}')" 
                     ondragleave="window.handleDragLeave(event, '${id}')" 
                     ondrop="window.handleDrop(event, '${id}', 'deck')">
                     
                    <!-- Màu nhấn bên trái -->
                    <div class="absolute top-0 left-0 w-1.5 h-full" style="background-color: ${conf.hex}; box-shadow: 0 0 10px ${conf.hex}80;"></div>
                    
                    <!-- Header Kênh -->
                    <div class="flex justify-between items-center pl-2">
                        <div class="flex items-center gap-2 flex-1 min-w-0">
                            <i class="fa-solid fa-compact-disc animate-[spin_4s_linear_infinite]" style="color: ${conf.hex}; animation-play-state: paused;" id="disc-${id}"></i>
                            <input type="text" value="${conf.name}" onchange="window.renameDeck('${id}', this.value)" class="bg-transparent border-b border-transparent hover:border-white/20 focus:border-white/50 focus:outline-none text-sm font-bold text-white w-full max-w-[150px] transition-colors truncate" title="Đổi tên kênh">
                        </div>
                        <div class="flex gap-1.5 shrink-0">
                            <button onclick="document.getElementById('file-${id}').click()" class="w-7 h-7 flex items-center justify-center bg-black/40 hover:bg-black/60 rounded-lg text-[10px] text-slate-300 transition-colors tooltip border border-white/5" title="Tải File">
                                <i class="fa-solid fa-folder-open"></i>
                            </button>
                            <input type="file" id="file-${id}" accept="audio/*,video/mp4" class="hidden" onchange="window.handleFileSelect(event, '${id}', 'deck')">
                            
                            <button onclick="window.openUrlModal('${id}')" class="w-7 h-7 flex items-center justify-center bg-black/40 hover:bg-black/60 rounded-lg text-[10px] text-slate-300 transition-colors tooltip border border-white/5" title="Nhập Link URL">
                                <i class="fa-solid fa-link"></i>
                            </button>
                            
                            <button onclick="window.deleteDeck('${id}')" class="w-7 h-7 flex items-center justify-center bg-red-500/10 hover:bg-red-500/20 rounded-lg text-[10px] text-red-400 transition-colors tooltip border border-red-500/20 ml-1" title="Xóa Kênh">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Khu vực Sóng âm & Tiến trình -->
                    <div class="bg-black/40 rounded-xl p-2.5 border border-white/5 relative overflow-hidden h-24 flex flex-col justify-between shadow-inner">
                        <div class="text-[11px] truncate font-medium z-10 ${trackNameClass}" id="track-name-${id}" style="${conf.source && conf.source.type !== 'local' ? `color: ${conf.hex}` : ''}">${trackNameHtml}</div>
                        
                        <canvas id="canvas-${id}" class="absolute bottom-0 left-0 w-full h-16 opacity-90 mix-blend-screen"></canvas>
                        
                        <!-- Thanh tiến trình clickable -->
                        <div class="absolute bottom-0 left-0 w-full h-full cursor-pointer z-20 group/progress" id="progress-bg-${id}" onclick="window.seekTrack(event, '${id}')">
                            <div class="h-full bg-white/10 pointer-events-none w-0 transition-all duration-75 border-r border-white/80 shadow-[0_0_10px_rgba(255,255,255,0.5)] group-hover/progress:bg-white/20" id="progress-bar-${id}"></div>
                        </div>
                        
                        <div class="flex justify-between text-[10px] text-white/70 font-mono relative z-10 mt-auto pointer-events-none drop-shadow-md">
                            <span id="time-current-${id}">00:00</span>
                            <span id="time-total-${id}">00:00</span>
                        </div>
                    </div>
                    
                    <input type="text" id="note-${id}" value="${conf.note || ''}" placeholder="Ghi chú (VD: Nhạc dạo đầu...)" class="w-full bg-black/20 border border-transparent hover:border-white/10 rounded-lg px-3 py-1.5 text-[11px] text-slate-300 focus:outline-none focus:border-white/20 transition-colors pl-2" oninput="window.updateNote('${id}')">

                    <!-- Các nút điều khiển (Responsive Stack) -->
                    <div class="flex flex-col sm:flex-row gap-3 pl-2 mt-1">
                        <!-- Play/Stop/Loop -->
                        <div class="flex items-center gap-3 justify-center sm:justify-start">
                            <button id="play-btn-${id}" onclick="window.togglePlay('${id}')" class="w-12 h-12 shrink-0 rounded-full flex items-center justify-center text-lg shadow-lg transition-all transform hover:scale-105 active:scale-95 text-white" style="background-color: ${conf.hex}">
                                <i class="fa-solid fa-play ml-1"></i>
                            </button>
                            <div class="flex flex-col gap-2">
                                <button onclick="window.stopTrack('${id}')" class="w-8 h-8 bg-black/40 hover:bg-black/60 rounded-full flex items-center justify-center transition-colors border border-white/5">
                                    <i class="fa-solid fa-stop text-slate-400 text-xs"></i>
                                </button>
                                <button id="loop-btn-${id}" onclick="window.toggleLoop('${id}')" class="w-8 h-8 ${conf.loop ? 'text-white shadow-[0_0_8px_'+conf.hex+'80]' : 'bg-black/40 text-slate-500'} hover:bg-black/60 rounded-full flex items-center justify-center transition-all border border-white/5" style="${conf.loop ? `background-color: ${conf.hex}` : ''}">
                                    <i class="fa-solid fa-repeat text-xs"></i>
                                </button>
                            </div>
                        </div>

                        <!-- EQ & Điều khiển nâng cao -->
                        <div class="flex-1 flex flex-col xl:flex-row gap-3 bg-black/20 p-2.5 rounded-xl border border-white/5">
                            
                            <!-- BASS & TREBLE -->
                            <div class="flex-1 grid grid-cols-2 gap-3 xl:border-r border-white/10 xl:pr-3">
                                <div class="flex flex-col justify-center">
                                    <div class="flex justify-between text-[9px] text-slate-400 mb-1.5">
                                        <span class="font-bold">BASS</span>
                                        <span id="lbl-bass-${id}" class="font-mono text-white">${conf.bass > 0 ? '+'+conf.bass : conf.bass}</span>
                                    </div>
                                    <input type="range" id="eq-bass-${id}" min="-15" max="15" step="1" value="${conf.bass}" oninput="window.updateEQ('${id}')">
                                </div>
                                <div class="flex flex-col justify-center">
                                    <div class="flex justify-between text-[9px] text-slate-400 mb-1.5">
                                        <span class="font-bold">TREB</span>
                                        <span id="lbl-treb-${id}" class="font-mono text-white">${conf.treb > 0 ? '+'+conf.treb : conf.treb}</span>
                                    </div>
                                    <input type="range" id="eq-treb-${id}" min="-15" max="15" step="1" value="${conf.treb}" oninput="window.updateEQ('${id}')">
                                </div>
                            </div>

                            <!-- TỐC ĐỘ & ÂM LƯỢNG KÊNH -->
                            <div class="flex-1 flex flex-col gap-2 justify-center">
                                <div class="flex items-center gap-2">
                                    <div class="w-12 text-[9px] text-slate-400 font-bold">SPEED</div>
                                    <input type="range" id="speed-${id}" min="0.5" max="1.5" step="0.05" value="${conf.speed}" oninput="window.updateSpeed('${id}')" ondblclick="window.resetSpeed('${id}')" class="flex-1">
                                    <span id="lbl-speed-${id}" class="w-8 text-[9px] font-mono text-white text-right">${parseFloat(conf.speed).toFixed(2)}x</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <div class="w-12 text-[10px] font-bold" style="color: ${conf.hex}">VOL</div>
                                    <input type="range" id="vol-${id}" min="0" max="1" step="0.01" value="${conf.vol}" oninput="window.updateDeckVolume('${id}')" class="flex-1">
                                    <span id="lbl-vol-${id}" class="w-8 text-[10px] font-mono text-white font-bold text-right">${Math.round(conf.vol * 100)}%</span>
                                </div>
                            </div>

                        </div>

                        <!-- Fade Buttons -->
                        <div class="flex flex-row sm:flex-col gap-2 shrink-0 sm:w-16 pt-1 sm:pt-0">
                            <button onclick="window.fadeDeck('${id}', 'in')" class="flex-1 sm:flex-none text-[9px] bg-black/40 hover:bg-black/60 py-1.5 rounded-lg text-slate-300 font-medium border border-white/5 active:scale-95 transition-all">Fade IN</button>
                            <button onclick="window.fadeDeck('${id}', 'out')" class="flex-1 sm:flex-none text-[9px] bg-black/40 hover:bg-black/60 py-1.5 rounded-lg text-slate-300 font-medium border border-white/5 active:scale-95 transition-all">Fade OUT</button>
                        </div>
                    </div>
                </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderSoundboard() {
            const grid = document.getElementById('soundboard-grid');
            let html = '';
            
            appState.pads.forEach((padConf, index) => {
                if (!soundPads[index]) {
                    soundPads[index] = { audioEl: new Audio(), isMissing: false };
                    if (padConf.type === 'url' && padConf.url) {
                        soundPads[index].audioEl.src = padConf.url;
                    } else if (padConf.type === 'local') {
                        soundPads[index].isMissing = true;
                    }
                }

                const isMissing = soundPads[index].isMissing;
                const hasFile = padConf.type !== null;

                let textHtml = hasFile ? padConf.name : 'Trống';
                let style = hasFile ? `background-color: ${padConf.hex}22; border: 1px solid ${padConf.hex}50;` : 'background-color: rgba(0,0,0,0.3); border: 1px dashed rgba(255,255,255,0.1);';
                let textClass = hasFile ? 'text-white drop-shadow-md' : 'text-slate-500';
                
                if (isMissing) {
                    textHtml = `<i class="fa-solid fa-triangle-exclamation mr-1 mb-1 block text-sm"></i>${padConf.name}`;
                    style = `background-color: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.5);`;
                    textClass = 'text-amber-400';
                }

                html += `
                <div class="relative w-full h-full rounded-xl p-1 group transition-colors"
                     ondragover="window.handleDragOver(event, ${index})" 
                     ondragleave="window.handleDragLeave(event, ${index})" 
                     ondrop="window.handleDrop(event, ${index}, 'pad')"
                     id="pad-container-${index}">
                     
                    <button onclick="window.playSoundPad(${index})" id="pad-btn-${index}" 
                            class="sound-pad absolute inset-1 rounded-lg flex items-center justify-center flex-col gap-1 z-10 overflow-hidden"
                            style="--pad-color: ${padConf.hex}; ${style}" title="${isMissing ? 'Vui lòng kéo thả lại file' : ''}">
                        
                        <div class="absolute inset-0 bg-gradient-to-br from-white/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <span class="font-bold text-[11px] leading-tight text-center px-1 truncate w-full z-20 ${textClass}">
                            ${textHtml}
                        </span>
                        
                        ${!hasFile ? '<i class="fa-solid fa-plus text-white/20 text-lg absolute"></i>' : ''}
                    </button>

                    <div class="absolute top-2 right-2 z-30 flex flex-col gap-1 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none group-hover:pointer-events-auto">
                        <button onclick="event.stopPropagation(); window.renamePad(${index})" class="w-6 h-6 flex justify-center items-center bg-black/80 hover:bg-black rounded-md backdrop-blur text-slate-300 tooltip" title="Đổi tên">
                            <i class="fa-solid fa-pen text-[9px]"></i>
                        </button>
                        <button onclick="event.stopPropagation(); document.getElementById('pad-file-${index}').click()" class="w-6 h-6 flex justify-center items-center bg-black/80 hover:bg-black rounded-md backdrop-blur text-slate-300 tooltip" title="Tải file">
                            <i class="fa-solid fa-folder-open text-[9px]"></i>
                        </button>
                        <button onclick="event.stopPropagation(); window.deletePad(${index})" class="w-6 h-6 flex justify-center items-center bg-red-900/80 hover:bg-red-600 rounded-md backdrop-blur text-white tooltip" title="Xóa ô">
                            <i class="fa-solid fa-trash text-[9px]"></i>
                        </button>
                    </div>
                    
                    <input type="file" id="pad-file-${index}" accept="audio/*" class="hidden" onchange="window.handleFileSelect(event, ${index}, 'pad')">
                </div>
                `;
            });
            grid.innerHTML = html;
        }

        function addDeck() {
            const id = 'deck_' + Math.random().toString(36).substring(2, 9);
            const colorHex = deckColors[appState.deckOrder.length % deckColors.length];
            const newCount = appState.deckOrder.length + 1;
            
            appState.deckOrder.push(id);
            appState.decks[id] = {
                id: id, name: `Kênh Mới ${newCount}`, hex: colorHex,
                vol: 1, speed: 1, bass: 0, treb: 0, loop: false, source: null, note: ''
            };
            
            renderDecks();
            saveStateToCloud();
            if (audioCtx && audioCtx.state !== 'suspended') setupDeckAudioNodes(decks[id]);
            showToast("Đã thêm kênh nhạc mới!", "success");
            // Cuộn xuống
            setTimeout(()=> document.getElementById('decks-container').scrollTo({top: 9999, behavior:'smooth'}), 100);
        }

        function deleteDeck(id) {
            if (appState.deckOrder.length <= 1) {
                showToast("Phải giữ lại ít nhất 1 kênh nhạc!", "error");
                return;
            }
            if (decks[id] && decks[id].audioEl) {
                decks[id].audioEl.pause();
                decks[id].audioEl.src = "";
                decks[id].audioEl.remove();
            }
            delete decks[id];
            delete appState.decks[id];
            appState.deckOrder = appState.deckOrder.filter(deckId => deckId !== id);
            
            renderDecks();
            saveStateToCloud();
            showToast("Đã xóa kênh nhạc", "info");
        }

        function renameDeck(id, newName) {
            if(!newName.trim()) return;
            appState.decks[id].name = newName.trim();
            saveStateToCloud();
        }

        function addPad() {
            const newIndex = appState.pads.length;
            const colorHex = padColors[newIndex % padColors.length];
            appState.pads.push({ type: null, url: null, name: `Pad ${newIndex + 1}`, hex: colorHex });
            renderSoundboard();
            saveStateToCloud();
            setTimeout(()=> document.getElementById('soundboard-grid').scrollTo({top: 9999, behavior:'smooth'}), 100);
        }

        function deletePad(index) {
            if (soundPads[index] && soundPads[index].audioEl) {
                soundPads[index].audioEl.pause();
                soundPads[index].audioEl.src = "";
            }
            appState.pads.splice(index, 1);
            soundPads.splice(index, 1);
            renderSoundboard();
            saveStateToCloud();
        }

        function renamePad(index) {
            document.getElementById('rename-target-index').value = index;
            document.getElementById('rename-input').value = appState.pads[index].name;
            const modal = document.getElementById('rename-modal');
            const content = document.getElementById('rename-modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.replace('opacity-0', 'opacity-100');
                content.classList.replace('scale-95', 'scale-100');
            }, 10);
            document.getElementById('rename-input').focus();
        }

        function closeRenameModal() {
            const modal = document.getElementById('rename-modal');
            const content = document.getElementById('rename-modal-content');
            modal.classList.replace('opacity-100', 'opacity-0');
            content.classList.replace('scale-100', 'scale-95');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        function submitRenameModal() {
            const index = parseInt(document.getElementById('rename-target-index').value);
            const newName = document.getElementById('rename-input').value.trim();
            if (newName) {
                appState.pads[index].name = newName;
                renderSoundboard();
                saveStateToCloud();
                closeRenameModal();
            } else {
                showToast("Tên không được để trống!", "error");
            }
        }

        function handleFileSelect(event, targetId, type) {
            const file = event.target.files[0];
            if (!file) return;
            loadMediaData(file, targetId, type);
            event.target.value = '';
        }

        function loadMediaData(file, targetId, type) {
            const url = URL.createObjectURL(file);
            let cleanName = file.name.replace(/\.[^/.]+$/, "");
            if (type === 'deck') applyMediaToDeck(targetId, url, cleanName, 'local');
            else applyMediaToPad(targetId, url, cleanName, 'local');
        }

        function applyMediaToDeck(deckId, srcUrl, displayName, mediaType = 'url') {
            const deck = decks[deckId];
            deck.audioEl.src = srcUrl;
            deck.audioEl.load();
            
            initAudioContext();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            setupDeckAudioNodes(deck);
            
            const nameEl = document.getElementById(`track-name-${deckId}`);
            if (nameEl) {
                nameEl.innerHTML = displayName;
                nameEl.classList.remove('text-slate-500', 'text-amber-400');
                nameEl.classList.add('text-white', 'drop-shadow-md');
                nameEl.style.color = appState.decks[deckId].hex;
            }
            
            const pb = document.getElementById(`progress-bar-${deckId}`);
            if (pb) pb.style.width = '0%';
            stopTrack(deckId);
            
            if (!isStateLoading) showToast(`Đã tải: ${displayName.substring(0, 25)}...`, "success");
            appState.decks[deckId].source = { type: mediaType, url: mediaType === 'url' ? srcUrl : null, name: displayName };
            saveStateToCloud();
        }

        function applyMediaToPad(index, srcUrl, displayName, mediaType = 'url') {
            const padRuntime = soundPads[index];
            if (displayName.length > 15) displayName = displayName.substring(0, 13) + "..";
            
            padRuntime.audioEl.src = srcUrl;
            padRuntime.isMissing = false;
            
            appState.pads[index].name = displayName;
            appState.pads[index].type = mediaType;
            appState.pads[index].url = mediaType === 'url' ? srcUrl : null;
            
            renderSoundboard();
            saveStateToCloud();
        }

        function handleDragOver(e, id) {
            e.preventDefault();
            const el = document.getElementById(typeof id === 'string' ? `deck-container-${id}` : `pad-container-${id}`);
            if(el) el.classList.add('drag-over');
        }

        function handleDragLeave(e, id) {
            e.preventDefault();
            const el = document.getElementById(typeof id === 'string' ? `deck-container-${id}` : `pad-container-${id}`);
            if(el) el.classList.remove('drag-over');
        }

        function handleDrop(e, targetId, type) {
            e.preventDefault();
            const el = document.getElementById(typeof targetId === 'string' ? `deck-container-${targetId}` : `pad-container-${targetId}`);
            if(el) el.classList.remove('drag-over');

            if (e.dataTransfer.items) {
                const item = e.dataTransfer.items[0];
                if (item.kind === 'file') {
                    const file = item.getAsFile();
                    if(file.type.startsWith('audio/') || file.type.startsWith('video/')) {
                        loadMediaData(file, targetId, type);
                    } else showToast("Chỉ hỗ trợ file âm thanh/video!", "error");
                }
            }
        }

        function openUrlModal(deckId) {
            document.getElementById('url-target-deck').value = deckId;
            const modal = document.getElementById('url-modal');
            const content = document.getElementById('url-modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.replace('opacity-0', 'opacity-100');
                content.classList.replace('scale-95', 'scale-100');
            }, 10);
            document.getElementById('url-input').focus();
        }

        function closeUrlModal() {
            const modal = document.getElementById('url-modal');
            const content = document.getElementById('url-modal-content');
            modal.classList.replace('opacity-100', 'opacity-0');
            content.classList.replace('scale-100', 'scale-95');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        function submitUrlModal() {
            const url = document.getElementById('url-input').value.trim();
            const deckId = document.getElementById('url-target-deck').value;
            if (url) {
                let name = url.split('/').pop().split('?')[0] || "Audio từ Link Web";
                applyMediaToDeck(deckId, url, decodeURIComponent(name), 'url');
                closeUrlModal();
                document.getElementById('url-input').value = '';
            } else showToast("Vui lòng nhập link!", "error");
        }

        function showToast(message, type = "info") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bg = 'bg-black/80 backdrop-blur-md border-slate-700', icon = 'fa-info-circle text-cyan-400';
            if(type === 'success') { bg = 'bg-emerald-950/80 backdrop-blur-md border-emerald-800'; icon = 'fa-check-circle text-emerald-400'; }
            else if(type === 'error') { bg = 'bg-red-950/80 backdrop-blur-md border-red-800'; icon = 'fa-exclamation-circle text-red-400'; }
            
            toast.className = `${bg} border text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 text-sm toast-enter w-full`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i> <span class="flex-1 font-medium">${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(100%) scale(0.9)';
                toast.style.transition = 'all 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function togglePlay(id) {
            initAudioContext();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            const deck = decks[id];
            const btn = document.getElementById(`play-btn-${id}`);
            const disc = document.getElementById(`disc-${id}`);
            
            if (!deck.audioEl.src || deck.audioEl.src.endsWith(window.location.pathname)) {
                if (appState.decks[id].source?.type === 'local') {
                    showToast("Vui lòng thả lại file này vào kênh!", "error");
                } else showToast("Vui lòng tải bài hát trước!", "error");
                return;
            }

            if (deck.audioEl.paused) {
                deck.audioEl.play().catch(e => showToast("Lỗi phát audio", "error"));
                btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                btn.classList.add('bg-emerald-500', 'shadow-[0_0_15px_rgba(16,185,129,0.5)]');
                btn.style.backgroundColor = '';
                if(disc) disc.style.animationPlayState = 'running';
            } else {
                deck.audioEl.pause();
                btn.innerHTML = '<i class="fa-solid fa-play ml-1"></i>';
                btn.classList.remove('bg-emerald-500', 'shadow-[0_0_15px_rgba(16,185,129,0.5)]');
                btn.style.backgroundColor = appState.decks[id].hex;
                if(disc) disc.style.animationPlayState = 'paused';
            }
        }

        function toggleLoop(id, forceValue = null) {
            const deck = decks[id];
            if (forceValue !== null) deck.isLoop = forceValue;
            else deck.isLoop = !deck.isLoop;
            
            deck.audioEl.loop = deck.isLoop;
            appState.decks[id].loop = deck.isLoop;
            saveStateToCloud();
            
            const btn = document.getElementById(`loop-btn-${id}`);
            if (btn) {
                if (deck.isLoop) {
                    btn.classList.replace('text-slate-500', 'text-white');
                    btn.classList.remove('bg-black/40');
                    btn.style.backgroundColor = appState.decks[id].hex;
                    btn.style.boxShadow = `0 0 8px ${appState.decks[id].hex}80`;
                } else {
                    btn.classList.replace('text-white', 'text-slate-500');
                    btn.style.backgroundColor = '';
                    btn.style.boxShadow = '';
                    btn.classList.add('bg-black/40');
                }
            }
        }
        
        function stopTrack(id) {
            const deck = decks[id];
            deck.audioEl.pause();
            deck.audioEl.currentTime = 0;
            const btn = document.getElementById(`play-btn-${id}`);
            const disc = document.getElementById(`disc-${id}`);
            if(btn) {
                btn.innerHTML = '<i class="fa-solid fa-play ml-1"></i>';
                btn.classList.remove('bg-emerald-500', 'shadow-[0_0_15px_rgba(16,185,129,0.5)]');
                btn.style.backgroundColor = appState.decks[id].hex;
            }
            if(disc) disc.style.animationPlayState = 'paused';
        }

        function updateProgress(id) {
            const audio = decks[id].audioEl;
            if(isNaN(audio.duration)) return;
            const percent = (audio.currentTime / audio.duration) * 100;
            document.getElementById(`progress-bar-${id}`).style.width = `${percent}%`;
            document.getElementById(`time-current-${id}`).innerText = formatTime(audio.currentTime);
        }

        function seekTrack(event, id) {
            const audio = decks[id].audioEl;
            if(!audio.src || isNaN(audio.duration)) return;
            const bg = document.getElementById(`progress-bg-${id}`);
            const clickX = event.clientX - bg.getBoundingClientRect().left;
            audio.currentTime = Math.max(0, Math.min(1, clickX / bg.getBoundingClientRect().width)) * audio.duration;
        }

        function updateEQ(id) {
            const bass = parseFloat(document.getElementById(`eq-bass-${id}`).value);
            const treb = parseFloat(document.getElementById(`eq-treb-${id}`).value);
            
            if (decks[id].nodes) {
                decks[id].nodes.bassEQ.gain.value = bass;
                decks[id].nodes.trebleEQ.gain.value = treb;
            }
            
            document.getElementById(`lbl-bass-${id}`).innerText = bass > 0 ? `+${bass}` : bass;
            document.getElementById(`lbl-treb-${id}`).innerText = treb > 0 ? `+${treb}` : treb;
            
            appState.decks[id].bass = bass;
            appState.decks[id].treb = treb;
            saveStateToCloud();
        }

        function updateSpeed(id) {
            const speed = parseFloat(document.getElementById(`speed-${id}`).value);
            decks[id].audioEl.playbackRate = speed;
            document.getElementById(`lbl-speed-${id}`).innerText = speed.toFixed(2) + 'x';
            
            appState.decks[id].speed = speed;
            saveStateToCloud();
        }

        function resetSpeed(id) {
            document.getElementById(`speed-${id}`).value = 1;
            updateSpeed(id);
        }

        function updateDeckVolume(id, forceLogic = false) {
            const deck = decks[id];
            const volSlider = parseFloat(document.getElementById(`vol-${id}`).value);
            
            document.getElementById(`lbl-vol-${id}`).innerText = Math.round(volSlider * 100) + '%';
            
            if (deck.nodes || forceLogic) {
                const duck = isTalkoverActive ? talkoverMultiplier : 1.0;
                if(deck.nodes) deck.nodes.gainNode.gain.setTargetAtTime(volSlider * duck, audioCtx.currentTime, 0.05);
            }

            appState.decks[id].vol = volSlider;
            saveStateToCloud();
        }

        function fadeDeck(id, direction) {
            const deck = decks[id];
            if(!deck.audioEl.src || (deck.audioEl.paused && direction==='out')) return;
            if(deck.isFading) return;
            
            deck.isFading = true;
            const slider = document.getElementById(`vol-${id}`);
            
            if (direction === 'in') {
                slider.value = 0;
                updateDeckVolume(id);
                if (deck.audioEl.paused) togglePlay(id);
            }

            const step = 0.02;
            const fadeInterval = setInterval(() => {
                let nextVal = parseFloat(slider.value) + (direction === 'in' ? step : -step);
                nextVal = Math.max(0, Math.min(1, nextVal));
                
                slider.value = nextVal;
                updateDeckVolume(id); 

                if ((direction === 'in' && nextVal >= 1) || (direction === 'out' && nextVal <= 0)) {
                    clearInterval(fadeInterval);
                    deck.isFading = false;
                    if (direction === 'out' && nextVal <= 0) stopTrack(id);
                }
            }, 40);
        }

        document.getElementById('master-volume').addEventListener('input', (e) => {
            appState.masterVolume = parseFloat(e.target.value);
            document.getElementById('master-vol-val').innerText = Math.round(appState.masterVolume * 100) + '%';
            if (masterGain) masterGain.gain.setTargetAtTime(appState.masterVolume, audioCtx.currentTime, 0.05);
            saveStateToCloud();
        });

        function drawVisualizers() {
            requestAnimationFrame(drawVisualizers);
            Object.keys(decks).forEach(id => {
                const deck = decks[id];
                if (!deck.nodes) return;
                const canvas = document.getElementById(`canvas-${id}`);
                if(!canvas) return;
                
                const ctx = canvas.getContext('2d');
                canvas.width = canvas.parentElement.getBoundingClientRect().width;
                canvas.height = 64; // Tăng chiều cao canvas nội bộ

                const analyser = deck.nodes.analyser;
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                analyser.getByteFrequencyData(dataArray);

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Tối ưu: Nếu đang pause và không có âm lượng thì không cần vẽ mượt
                if(deck.audioEl.paused && dataArray[0] === 0) return;

                const barWidth = (canvas.width / bufferLength) * 2.5;
                let x = 0;
                
                const state = appState.decks[id];
                const r = parseInt(state.hex.slice(1, 3), 16);
                const g = parseInt(state.hex.slice(3, 5), 16);
                const b = parseInt(state.hex.slice(5, 7), 16);

                for (let i = 0; i < bufferLength; i++) {
                    const barHeight = (dataArray[i] / 255) * canvas.height;
                    
                    // Tạo gradient cho mỗi cột sóng
                    const grad = ctx.createLinearGradient(0, canvas.height, 0, canvas.height - barHeight);
                    grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.2)`);
                    grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0.8)`);
                    
                    ctx.fillStyle = grad;
                    // Bo tròn đầu cột sóng
                    ctx.beginPath();
                    ctx.roundRect(x, canvas.height - barHeight, barWidth - 1, barHeight, [2, 2, 0, 0]);
                    ctx.fill();
                    
                    x += barWidth;
                }
            });
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
        }

        function toggleTalkover() {
            isTalkoverActive = !isTalkoverActive;
            const btn = document.getElementById('btn-talkover');
            
            if (isTalkoverActive) {
                btn.classList.replace('bg-white/5', 'bg-amber-500/20');
                btn.classList.replace('text-slate-300', 'text-amber-300');
                btn.classList.replace('border-white/10', 'border-amber-500/50');
                showToast("Đã bật chế độ MC (Giảm nhạc)", "info");
            } else {
                btn.classList.replace('bg-amber-500/20', 'bg-white/5');
                btn.classList.replace('text-amber-300', 'text-slate-300');
                btn.classList.replace('border-amber-500/50', 'border-white/10');
            }
            Object.keys(decks).forEach(id => updateDeckVolume(id, true));
        }

        function playSoundPad(index) {
            const padRuntime = soundPads[index];
            const padConf = appState.pads[index];
            
            if (!padConf.type) {
                document.getElementById(`pad-file-${index}`).click();
                return;
            }
            if (padRuntime.isMissing) {
                showToast("Vui lòng thả lại file audio này vào ô trống!", "error");
                return;
            }

            padRuntime.audioEl.pause();
            padRuntime.audioEl.currentTime = 0;
            padRuntime.audioEl.volume = appState.masterVolume * appState.soundboardVolume; 
            padRuntime.audioEl.play().catch(e => console.error("Pad error:", e));
            
            const btn = document.getElementById(`pad-btn-${index}`);
            if(btn) btn.classList.add('playing');
            padRuntime.audioEl.onended = () => { if(btn) btn.classList.remove('playing'); };
        }

        function stopAllSounds() {
            soundPads.forEach((pad, index) => {
                if (pad && pad.audioEl) {
                    pad.audioEl.pause();
                    pad.audioEl.currentTime = 0;
                }
                const btn = document.getElementById(`pad-btn-${index}`);
                if(btn) btn.classList.remove('playing');
            });
        }

        function updateNote(id) {
            const val = document.getElementById(`note-${id}`).value;
            appState.decks[id].note = val;
            saveStateToCloud();
        }

        function updateSoundboardVol() {
            appState.soundboardVolume = parseFloat(document.getElementById('soundboard-vol').value);
            saveStateToCloud();
        }

        // Module Ghi Âm
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;
        let streamDestination;
        let recordInterval;
        let recordSeconds = 0;

        function toggleRecording() {
            initAudioContext();
            
            const btn = document.getElementById('btn-record');
            const timerEl = document.getElementById('record-timer');

            if (!isRecording) {
                streamDestination = audioCtx.createMediaStreamDestination();
                masterGain.connect(streamDestination);
                
                try {
                    mediaRecorder = new MediaRecorder(streamDestination.stream);
                } catch (e) {
                    showToast("Trình duyệt chưa hỗ trợ ghi âm nội bộ!", "error");
                    return;
                }

                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `Livestream_Mix_${new Date().toISOString().slice(0,10)}.webm`;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 100);
                    recordedChunks = [];
                    showToast("Đã lưu file âm thanh WebM thành công!", "success");
                };
                
                mediaRecorder.start();
                isRecording = true;
                
                btn.classList.replace('bg-white/5', 'bg-red-500/20');
                btn.classList.replace('border-white/10', 'border-red-500/50');
                btn.querySelector('i').classList.add('animate-pulse');
                showToast("Bắt đầu ghi âm...", "info");
                
                recordSeconds = 0;
                recordInterval = setInterval(() => {
                    recordSeconds++;
                    if(timerEl) timerEl.innerText = formatTime(recordSeconds);
                }, 1000);
                
            } else {
                mediaRecorder.stop();
                masterGain.disconnect(streamDestination);
                isRecording = false;
                
                clearInterval(recordInterval);
                if(timerEl) timerEl.innerText = "00:00";
                btn.classList.replace('bg-red-500/20', 'bg-white/5');
                btn.classList.replace('border-red-500/50', 'border-white/10');
                btn.querySelector('i').classList.remove('animate-pulse');
            }
        }

        Object.assign(window, {
            toggleTalkover, handleDragOver, handleDragLeave, handleDrop,
            handleFileSelect, openUrlModal, closeUrlModal, submitUrlModal,
            togglePlay, stopTrack, toggleLoop, seekTrack, updateEQ, updateSpeed,
            resetSpeed, updateDeckVolume, fadeDeck, playSoundPad, stopAllSounds,
            updateNote, updateSoundboardVol, toggleRecording,
            addDeck, deleteDeck, renameDeck, addPad, deletePad, renamePad,
            closeRenameModal, submitRenameModal
        });

        window.addEventListener('DOMContentLoaded', () => {
            renderDecks();
            renderSoundboard();
            initCloudStorage();
            
            document.body.addEventListener('click', initAudioContext, { once: true });
            document.body.addEventListener('touchstart', initAudioContext, { once: true });
        });
    </script>
</body>
