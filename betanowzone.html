<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beta Nowzone | Cổng Nội Bộ Nhân Sự</title>
    
    <link rel="icon" href="https://play-lh.googleusercontent.com/so_2mIzE8qaobdSafVStIV7olRZL8Q1SkclYErPgbFDPn1SzAUO33stPfshdztJZCVA0eqfWsO_iia59aHLKZL8" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@200;300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            color-scheme: dark;
            --brand-accent: #f58220;
            --brand-secondary: #00549c;
            --surface-glass: rgba(15, 15, 20, 0.75);
            --border-thin: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.5);
            --holo-glow: 0 0 50px rgba(245, 130, 32, 0.1);
        }

        body {
            margin: 0; padding: 20px; font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #030508; color: var(--text-primary);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; position: relative; overflow-x: hidden;
        }

        body::before, body::after {
            content: ''; position: absolute; border-radius: 50%;
            filter: blur(100px); z-index: -1; opacity: 0.3;
        }
        body::before { width: 45vw; height: 45vw; background: var(--brand-secondary); top: -10%; left: -10%; }
        body::after { width: 40vw; height: 40vw; background: var(--brand-accent); bottom: -10%; right: -10%; }

        .glass-container {
            position: relative; width: 100%; max-width: 480px;
            padding: 40px 35px; border-radius: 4px;
            background: var(--surface-glass);
            backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-thin);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), var(--holo-glow);
            z-index: 1; box-sizing: border-box;
        }

        .logo-header { text-align: center; margin-bottom: 25px; }
        .logo-header img { width: 55px; height: 55px; object-fit: cover; border-radius: 4px; filter: grayscale(10%) contrast(120%); }

        h2 { text-align: center; margin: 0 0 10px; font-weight: 300; font-size: 1.2rem; letter-spacing: 3px; text-transform: uppercase; }
        .subtitle { text-align: center; font-size: 0.75rem; color: var(--text-secondary); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 30px; }

        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; font-size: 0.7rem; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1.5px; }

        input {
            width: 100%; padding: 10px 0; background: transparent; border: none; border-bottom: 1px solid var(--border-thin);
            color: var(--text-primary); font-family: inherit; font-size: 1rem; font-weight: 300; box-sizing: border-box; transition: all 0.4s ease;
        }
        input:focus { outline: none; border-bottom-color: var(--brand-accent); background: linear-gradient(to top, rgba(245, 130, 32, 0.03) 0%, transparent 50%); }
        input::placeholder { color: rgba(255, 255, 255, 0.15); }

        .btn-main {
            width: 100%; padding: 15px; margin-top: 15px; background: var(--text-primary); border: none; color: #000000;
            font-weight: 600; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; font-family: inherit; cursor: pointer; transition: all 0.4s;
        }
        .btn-main:hover { background: var(--brand-accent); color: #ffffff; box-shadow: 0 10px 30px rgba(245, 130, 32, 0.3); }

        /* --- DASHBOARD NỘI BỘ (ẨN KHI CHƯA ĐĂNG NHẬP) --- */
        #dashboardView { display: none; width: 100%; max-width: 650px; }
        
        .announcement-ticker {
            background: rgba(245, 130, 32, 0.08); border: 1px solid rgba(245, 130, 32, 0.2);
            padding: 12px 20px; font-size: 0.8rem; margin-bottom: 25px; display: flex; align-items: center; gap: 15px;
        }
        .announcement-ticker span { color: var(--brand-accent); font-weight: 600; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 1px; }

        .section-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-secondary); margin-bottom: 15px; border-bottom: 1px solid var(--border-thin); padding-bottom: 8px; }

        .modules-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-bottom: 30px;
        }
        
        .module-card {
            background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-thin);
            padding: 20px; text-decoration: none; color: var(--text-primary); display: flex; flex-direction: column;
            justify-content: space-between; height: 110px; transition: all 0.3s ease; position: relative; overflow: hidden;
        }
        .module-card:hover { border-color: var(--brand-accent); background: rgba(245, 130, 32, 0.04); transform: translateY(-3px); }
        .module-card .tag { font-size: 0.65rem; color: var(--brand-accent); text-transform: uppercase; letter-spacing: 1px; }
        .module-card .title { font-size: 0.9rem; font-weight: 500; }
        
        .user-welcome { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .logout-btn { background: transparent; border: 1px solid var(--border-thin); color: var(--text-secondary); padding: 6px 12px; font-size: 0.7rem; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        .logout-btn:hover { border-color: #fff; color: #fff; }
        
        .error-msg { color: #ff5555; font-size: 0.75rem; margin-top: 15px; text-align: center; display: none; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div class="glass-container" id="loginCard">
        <div class="logo-header">
            <img src="https://play-lh.googleusercontent.com/so_2mIzE8qaobdSafVStIV7olRZL8Q1SkclYErPgbFDPn1SzAUO33stPfshdztJZCVA0eqfWsO_iia59aHLKZL8" alt="Logo">
        </div>
        <h2>Beta Nowzone</h2>
        <div class="subtitle">Cổng Nhân Sự Nội Bộ</div>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Email Nội Bộ</label>
                <input type="email" id="loginEmail" required placeholder="nhansu@beta.vn">
            </div>
            <div class="form-group">
                <label>Mật Khẩu</label>
                <input type="password" id="loginPass" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-main" id="loginBtn">Đăng Nhập Hệ Thống</button>
            <div class="error-msg" id="loginError"></div>
        </form>
    </div>

    <!-- MÀN HÌNH DASHBOARD NỘI BỘ (Sau khi đăng nhập) -->
    <div class="glass-container" id="dashboardView">
        <div class="user-welcome">
            <div>
                <div style="font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px;">Xin chào,</div>
                <div id="userNameDisplay" style="font-weight: 500; font-size: 1.1rem; margin-top: 2px;"></div>
            </div>
            <button class="logout-btn" id="logoutBtn">Đăng Xuất</button>
        </div>

        <div class="announcement-ticker">
            <span>Thông Báo</span>
            <div id="tickerText">Hệ thống đồng bộ dữ liệu POSM và chấm công đã hoạt động ổn định.</div>
        </div>

        <div class="section-title">Ứng Dụng & Công Cụ Đang Phát Triển</div>
        
        <!-- Các nút và liên kết được nạp tự động từ Google Apps Script / Sheets -->
        <div class="modules-grid" id="modulesGrid">
            <!-- Render động qua JS -->
        </div>
    </div>

<script>
    // --- THAY LINK WEB APP APPS SCRIPT CỦA BẠN VÀO ĐÂY ---
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzn-42kqYWqAeTeopHomiEwEboXxCC0x3z3uwLlKF3qdjYfQWquEza7OBk9mMo0D3j-/exec';

    const loginCard = document.getElementById('loginCard');
    const dashboardView = document.getElementById('dashboardView');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userNameDisplay = document.getElementById('userNameDisplay');
    const modulesGrid = document.getElementById('modulesGrid');

    // Xử lý đăng nhập
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        loginBtn.disabled = true;
        loginBtn.textContent = 'ĐANG XÁC THỰC...';
        loginError.style.display = 'none';

        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPass').value;

        try {
            const response = await fetch(`${SCRIPT_URL}?action=login&email=${encodeURIComponent(email)}&pass=${encodeURIComponent(pass)}`);
            const data = await response.json();

            if (data.status === 'success') {
                // Lưu session tạm thời
                sessionStorage.setItem('betaUser', JSON.stringify(data.user));
                initDashboard(data.user);
            } else {
                throw new Error(data.message);
            }
        } catch (err) {
            loginError.style.display = 'block';
            loginError.textContent = err.message || 'Lỗi kết nối máy chủ.';
            loginBtn.disabled = false;
            loginBtn.textContent = 'ĐĂNG NHẬP HỆ THỐNG';
        }
    });

    // Kiểm tra session cũ
    window.addEventListener('DOMContentLoaded', () => {
        const savedUser = sessionStorage.getItem('betaUser');
        if (savedUser) {
            initDashboard(JSON.parse(savedUser));
        }
    });

    // Khởi tạo Dashboard & Tải các nút liên kết động
    async function initDashboard(user) {
        loginCard.style.display = 'none';
        dashboardView.style.display = 'block';
        userNameDisplay.textContent = user.name + ` (${user.role})`;

        modulesGrid.innerHTML = '<div style="color:var(--text-secondary); font-size:0.8rem;">Đang tải danh mục...</div>';

        try {
            const response = await fetch(`${SCRIPT_URL}?action=getConfig`);
            const data = await response.json();

            if (data.status === 'success') {
                modulesGrid.innerHTML = '';
                data.links.forEach(item => {
                    const card = document.createElement('a');
                    card.href = item.url;
                    card.target = '_blank';
                    card.className = 'module-card';
                    card.innerHTML = `
                        <div class="tag">${item.category}</div>
                        <div class="title">${item.title}</div>
                        <div style="font-size:0.7rem; color:var(--text-secondary);">Truy cập hệ thống →</div>
                    `;
                    modulesGrid.appendChild(card);
                });
            }
        } catch (err) {
            modulesGrid.innerHTML = '<div style="color:#ff5555; font-size:0.8rem;">Không thể tải danh sách liên kết.</div>';
        }
    }

    // Đăng xuất
    logoutBtn.addEventListener('click', () => {
        sessionStorage.removeItem('betaUser');
        dashboardView.style.display = 'none';
        loginCard.style.display = 'block';
        loginForm.reset();
        loginBtn.disabled = false;
        loginBtn.textContent = 'ĐĂNG NHẬP HỆ THỐNG';
    });
</script>

</body>
</html>
