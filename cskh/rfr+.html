<!DOCTYPE html>
<html lang="vi">
<head>
    
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" type="image/webp" href="https://i.pinimg.com/vwebp/1200x/9c/4a/a4/9c4aa4e530538af389e4e5747603e8b2.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="theme-color" content="#ee7752">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nexus Chat">
    <link rel="apple-touch-icon" href="https://api.dicebear.com/7.x/shapes/svg?seed=Nexus&backgroundColor=ee7752">
    <link rel="manifest" id="manifest-link"> <title>Phòng Chat Siêu Cấp AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --bg-grad-1: #ee7752; --bg-grad-2: #e73c7e; --bg-grad-3: #23a6d5; --bg-grad-4: #23d5ab;
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-panel: rgba(255, 255, 255, 0.85);
            --text-color: #1f2937;
            --header-bg: rgba(255, 255, 255, 0.4);
            --input-bg: #ffffff;
            --sys-msg-bg: rgba(0, 0, 0, 0.1);
        }

        body.dark-theme {
            --bg-grad-1: #0f2027; --bg-grad-2: #203a43; --bg-grad-3: #2c5364; --bg-grad-4: #1a2a6c;
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-panel: rgba(15, 23, 42, 0.85);
            --text-color: #f1f5f9;
            --header-bg: rgba(15, 23, 42, 0.6);
            --input-bg: rgba(30, 41, 59, 0.8);
            --sys-msg-bg: rgba(255, 255, 255, 0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(-45deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3), var(--bg-grad-4));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-color);
            transition: color 0.3s ease;
        }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .glass { background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.2); transition: background 0.3s ease; }
        .glass-panel { background: var(--glass-panel); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2); transition: background 0.3s ease; }
        .theme-text { color: var(--text-color); }
        .theme-header { background: var(--header-bg); }
        .theme-input { background: var(--input-bg); color: var(--text-color); }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(107, 114, 128, 0.8); }

        @keyframes popIn { 0% { opacity: 0; transform: translateY(20px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        .msg-animate { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .loader { border-top-color: transparent; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse-red { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        
        .md-code { background: rgba(156, 163, 175, 0.3); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 0.9em; color: #db2777; }
        body.dark-theme .md-code { color: #fbcfe8; }
        
        /* Chỉnh style cho bảng Emoji */
        emoji-picker {
            width: 100%;
            height: 300px;
            --background: var(--input-bg);
            --border-color: rgba(255,255,255,0.1);
            --button-hover-background: rgba(156, 163, 175, 0.2);
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center antialiased overflow-hidden">

    <div id="login-screen" class="glass p-8 rounded-[2rem] shadow-2xl w-full max-w-md mx-4 transition-all duration-500 transform hover:scale-[1.02] relative z-10">
        <button id="theme-toggle-login" class="absolute top-6 right-6 text-white/80 hover:text-white transition p-2 rounded-full hover:bg-white/20">
            <svg class="w-6 h-6 dark-icon hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            <svg class="w-6 h-6 light-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        </button>

        <div class="text-center mb-8">
            <div class="bg-white/40 text-white w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner backdrop-blur-sm border border-white/50">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"></path></svg>
            </div>
            <h2 class="text-3xl font-extrabold text-white drop-shadow-md">Nexus Chat AI</h2>
            <p class="text-white/80 text-sm mt-2 font-medium" id="status-text">Đang kết nối Server...</p>
        </div>

        <form id="login-form" class="space-y-5">
            <div class="relative">
                <input type="text" id="username" required placeholder="Tên hiển thị của bạn" class="w-full px-5 py-4 rounded-xl theme-input border-2 border-transparent focus:border-pink-400 outline-none transition-all placeholder-gray-400 font-medium shadow-sm text-lg">
            </div>
            <div id="login-error" class="bg-red-500/80 text-white text-sm text-center py-2 rounded-lg hidden backdrop-blur-md animate-pulse font-medium"></div>
            
            <button type="submit" id="login-btn" class="whitespace-nowrap w-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform hover:-translate-y-1 flex justify-center items-center text-lg">
                <span>Vào Phòng Ngay</span>
                <div id="login-loader" class="loader ml-3 w-6 h-6 border-4 border-white border-t-transparent rounded-full hidden"></div>
            </button>
            
            <button type="button" id="install-app-btn" class="hidden whitespace-nowrap w-full bg-white/20 hover:bg-white/30 text-white font-medium py-3 rounded-xl transition-colors flex justify-center items-center text-sm border border-white/30">
                <svg class="w-5 h-5 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Tải App (Thêm vào Màn hình chính)
            </button>
        </form>
    </div>

    <div id="chat-screen" class="hidden w-full h-full md:h-[92vh] md:max-w-4xl md:mx-auto md:rounded-[2rem] shadow-2xl glass-panel flex flex-col overflow-hidden relative">
        
        <div class="theme-header backdrop-blur-md border-b border-gray-200/20 px-4 md:px-6 py-4 flex items-center justify-between z-10 shadow-sm transition-colors duration-300">
            <div class="flex items-center space-x-3 md:space-x-4">
                <div class="relative">
                    <img id="my-avatar" src="" alt="avatar" class="w-10 h-10 md:w-12 md:h-12 rounded-full border-2 border-pink-500 bg-white p-0.5 object-cover">
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-400 border-2 border-white rounded-full"></div>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 id="room-name-display" class="text-lg md:text-xl font-bold theme-text tracking-tight">Phòng Chat Chung</h1>
                        <button id="edit-room-btn" class="text-gray-400 hover:text-pink-500 transition p-1 rounded-full hover:bg-black/5" title="Đổi tên phòng">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                        </button>
                    </div>
                    <p class="text-xs md:text-sm text-gray-500 font-medium whitespace-nowrap">Tên của bạn: <span id="display-name" class="text-pink-500 font-bold"></span></p>
                </div>
            </div>
            
            <div class="flex items-center space-x-1 sm:space-x-2">
                <button id="sound-btn" class="text-gray-400 hover:text-indigo-500 transition-colors p-2 rounded-full hover:bg-black/5" title="Tắt/Bật âm thanh">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6 sound-on" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M10 19l-5-5H2v-4h3l5-5v14z"></path></svg>
                    <svg class="w-5 h-5 sm:w-6 sm:h-6 sound-off hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h2.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>
                </button>
                <button id="noti-btn" class="text-gray-400 hover:text-yellow-500 transition-colors p-2 rounded-full hover:bg-black/5" title="Bật thông báo đẩy">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                </button>
                <button id="theme-toggle-chat" class="text-gray-400 hover:text-blue-400 transition-colors p-2 rounded-full hover:bg-black/5" title="Đổi giao diện">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6 dark-icon hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    <svg class="w-5 h-5 sm:w-6 sm:h-6 light-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                </button>
                <button id="logout-btn" class="text-gray-400 hover:text-red-500 transition-colors p-2 rounded-full hover:bg-black/5" title="Đăng xuất">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </div>

        <div id="chat-messages" class="flex-1 p-4 md:p-6 overflow-y-auto flex flex-col space-y-5 bg-gradient-to-b from-transparent to-black/5 scroll-smooth relative">
            <div class="flex justify-center items-center h-full opacity-50">
                <div class="loader w-8 h-8 border-4 border-pink-500 border-t-transparent rounded-full"></div>
            </div>
        </div>

        <div id="new-msg-toast" class="absolute top-20 left-1/2 transform -translate-x-1/2 -translate-y-32 opacity-0 transition-all duration-500 z-30 bg-gradient-to-r from-pink-500 to-rose-500 text-white px-5 py-2 rounded-full shadow-xl shadow-pink-500/30 flex items-center space-x-3 cursor-pointer font-medium text-sm border border-white/20 pointer-events-none">
            <img id="toast-avatar" src="" class="w-7 h-7 rounded-full border border-white/50 bg-white object-cover">
            <span class="truncate max-w-[150px] sm:max-w-[250px]" id="toast-text">Tin nhắn mới...</span>
            <svg class="w-4 h-4 ml-1 flex-shrink-0 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
        </div>

        <button id="scroll-bottom-btn" class="hidden absolute bottom-24 right-6 bg-pink-500 text-white p-3 rounded-full shadow-lg hover:bg-pink-600 transition-transform transform hover:scale-110 z-20">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
        </button>

        <div id="emoji-picker-container" class="hidden absolute bottom-[80px] left-2 md:left-16 z-50 rounded-2xl shadow-2xl border border-gray-200/20 overflow-hidden w-[95%] md:w-[350px]">
            <emoji-picker></emoji-picker>
        </div>

        <div class="theme-header backdrop-blur-lg p-3 md:p-4 border-t border-gray-200/20 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10 transition-colors duration-300">
            <form id="chat-form" class="flex items-end space-x-2 md:space-x-3 max-w-full relative">
                
                <button type="button" id="attach-btn" class="p-3 text-gray-400 hover:text-blue-500 theme-input rounded-full shadow-sm border border-gray-200/20 transition-transform hover:scale-110 flex-shrink-0" title="Gửi hình/file">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                </button>
                <input type="file" id="file-input" class="hidden" accept="image/*, .pdf, .doc, .docx, .xls, .xlsx, .zip">

                <div class="flex-1 relative theme-input rounded-3xl shadow-inner border border-gray-200/20 flex items-center transition-colors">
                    <input type="text" id="message-input" autocomplete="off" placeholder="Soạn tin nhắn..." class="w-full pl-4 pr-12 py-3 md:py-4 bg-transparent focus:outline-none placeholder-gray-400 theme-text">
                    
                    <div class="absolute right-2 flex items-center">
                        <button type="button" id="emoji-btn" class="p-2 text-gray-400 hover:text-yellow-500 rounded-full transition-colors" title="Chèn Icon">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </button>
                    </div>
                </div>
                
                <button type="submit" id="send-btn" class="bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white rounded-full p-3 md:p-4 flex-shrink-0 shadow-lg transition-transform transform hover:scale-110 disabled:opacity-50 disabled:hover:scale-100 flex items-center justify-center">
                    <svg class="w-6 h-6 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </form>
            
            <div id="file-preview" class="hidden mt-2 px-4 py-2 bg-blue-500/10 border border-blue-500/20 rounded-xl text-sm text-blue-500 flex justify-between items-center">
                <span class="truncate max-w-[80%] font-medium" id="file-name-display">filename.png</span>
                <button type="button" id="remove-file-btn" class="text-red-500 hover:text-red-700 font-bold p-1">&times;</button>
            </div>
        </div>
    </div>

    <div id="image-modal" class="fixed inset-0 z-50 bg-black/90 hidden flex items-center justify-center backdrop-blur-sm transition-opacity opacity-0 cursor-zoom-out">
        <img id="image-modal-content" src="" class="max-w-[95vw] max-h-[95vh] object-contain rounded-lg shadow-2xl transform scale-95 transition-transform duration-300">
        <button id="close-modal-btn" class="absolute top-6 right-6 text-white bg-black/50 hover:bg-red-500 rounded-full p-2 transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
    </div>
    <div id="room-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="theme-input p-6 rounded-2xl shadow-2xl w-80 transform scale-100 transition-transform border border-gray-200/20">
            <h3 class="text-lg font-bold mb-4 theme-text">Đổi tên phòng chat</h3>
            <input type="text" id="new-room-name" class="w-full px-4 py-2 border border-gray-300/30 rounded-lg focus:ring-2 focus:ring-pink-500 outline-none mb-4 bg-transparent theme-text" placeholder="Nhập tên mới...">
            <div class="flex justify-end space-x-2">
                <button id="cancel-room-btn" class="whitespace-nowrap px-4 py-2 text-gray-500 hover:bg-gray-500/20 rounded-lg transition-colors">Hủy</button>
                <button id="save-room-btn" class="whitespace-nowrap px-4 py-2 bg-pink-500 text-white rounded-lg hover:bg-pink-600 transition-colors shadow-lg">Lưu</button>
            </div>
        </div>
    </div>

    <script>
        // === PWA SETUP (Khởi tạo App Install & Service Worker cho Push Notification) ===
        const manifest = {
            name: "Nexus Chat AI",
            short_name: "Nexus Chat",
            start_url: location.href,
            display: "standalone",
            background_color: "#ffffff",
            theme_color: "#ee7752",
            icons: [{ src: "https://api.dicebear.com/7.x/shapes/svg?seed=Nexus&backgroundColor=ee7752", sizes: "192x192", type: "image/svg+xml" },
                    { src: "https://api.dicebear.com/7.x/shapes/svg?seed=Nexus&backgroundColor=ee7752", sizes: "512x512", type: "image/svg+xml" }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

        // Đăng ký Service Worker ẩn để kích hoạt Add to Home Screen và hiển thị Push Notification chuẩn trên điện thoại
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('fetch', function(e) {});
                self.addEventListener('notificationclick', function(e) {
                    e.notification.close();
                    e.waitUntil(clients.matchAll({ type: 'window' }).then(clientsArr => {
                        if (clientsArr.length) return clientsArr[0].focus();
                        else return clients.openWindow('/');
                    }));
                });
            `;
            const swBlob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-app-btn').classList.remove('hidden');
        });
        document.getElementById('install-app-btn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') document.getElementById('install-app-btn').classList.add('hidden');
                deferredPrompt = null;
            }
        });

        // === CẤU HÌNH API ===
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxmuMSKdLETKzs6BiW4T6S6Dz2l3OL8N2f3pMLh1IsTakFILLL32UUAR5NpvF-KFF2Y9A/exec';

        // === BIẾN TRẠNG THÁI ===
        let currentUser = ''; let pollingInterval = null; let lastMessageCount = 0; let isUserScrolling = false;
        let selectedFile = null; let roomNameStr = "Phòng Chat Chung"; let isMuted = false;
        let unreadCount = 0; const originalTitle = document.title;
        // Đổi âm thanh chú ý hơn & tăng âm lượng
        const notifSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3'); notifSound.volume = 1.0;

        const els = {
            loginScreen: document.getElementById('login-screen'), chatScreen: document.getElementById('chat-screen'),
            loginForm: document.getElementById('login-form'), chatForm: document.getElementById('chat-form'),
            messages: document.getElementById('chat-messages'), error: document.getElementById('login-error'),
            loginBtnText: document.querySelector('#login-btn span'), loginLoader: document.getElementById('login-loader'),
            sendBtn: document.getElementById('send-btn'), input: document.getElementById('message-input'),
            myAvatar: document.getElementById('my-avatar'), displayName: document.getElementById('display-name'),
            scrollBtn: document.getElementById('scroll-bottom-btn'), roomNameDisplay: document.getElementById('room-name-display'),
            editRoomBtn: document.getElementById('edit-room-btn'), roomModal: document.getElementById('room-modal'),
            attachBtn: document.getElementById('attach-btn'), fileInput: document.getElementById('file-input'),
            filePreview: document.getElementById('file-preview'), fileNameDisplay: document.getElementById('file-name-display'),
            removeFileBtn: document.getElementById('remove-file-btn'), notiBtn: document.getElementById('noti-btn'),
            statusText: document.getElementById('status-text'),
            imageModal: document.getElementById('image-modal'), imgModalContent: document.getElementById('image-modal-content'),
            closeModalBtn: document.getElementById('close-modal-btn'), soundBtn: document.getElementById('sound-btn'),
            themeBtns: [document.getElementById('theme-toggle-login'), document.getElementById('theme-toggle-chat')],
            toast: document.getElementById('new-msg-toast'), toastAvatar: document.getElementById('toast-avatar'),
            toastText: document.getElementById('toast-text'), emojiBtn: document.getElementById('emoji-btn'),
            emojiContainer: document.getElementById('emoji-picker-container'), picker: document.querySelector('emoji-picker')
        };

        // --- EMOJI PICKER ---
        els.emojiBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            els.emojiContainer.classList.toggle('hidden');
        });
        document.addEventListener('click', (e) => {
            if (!els.emojiContainer.contains(e.target) && e.target !== els.emojiBtn && !els.emojiBtn.contains(e.target)) {
                els.emojiContainer.classList.add('hidden');
            }
        });
        els.picker.addEventListener('emoji-click', event => {
            const cursorPosition = els.input.selectionStart;
            const textBefore = els.input.value.substring(0, cursorPosition);
            const textAfter = els.input.value.substring(cursorPosition);
            els.input.value = textBefore + event.detail.unicode + textAfter;
            
            // Set lại focus và con trỏ
            els.input.focus();
            els.input.setSelectionRange(cursorPosition + event.detail.unicode.length, cursorPosition + event.detail.unicode.length);
        });

        // --- THEME (DARK/LIGHT MODE) ---
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            localStorage.setItem('nexusTheme', isDark ? 'dark' : 'light');
            updateThemeIcons(isDark);
            // Cập nhật giao diện Emoji Picker
            els.picker.classList.toggle('dark', isDark);
            els.picker.classList.toggle('light', !isDark);
        }
        function updateThemeIcons(isDark) {
            document.querySelectorAll('.dark-icon').forEach(el => isDark ? el.classList.remove('hidden') : el.classList.add('hidden'));
            document.querySelectorAll('.light-icon').forEach(el => !isDark ? el.classList.remove('hidden') : el.classList.add('hidden'));
        }
        if (localStorage.getItem('nexusTheme') === 'dark' || (!localStorage.getItem('nexusTheme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.body.classList.add('dark-theme'); updateThemeIcons(true); els.picker.classList.add('dark');
        } else { els.picker.classList.add('light'); }
        els.themeBtns.forEach(btn => btn.addEventListener('click', toggleTheme));

        // --- QUẢN LÝ ÂM THANH & UI KHÁC ---
        els.soundBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            document.querySelector('.sound-on').classList.toggle('hidden', isMuted);
            document.querySelector('.sound-off').classList.toggle('hidden', !isMuted);
        });

        function openImageModal(src) {
            els.imgModalContent.src = src; els.imageModal.classList.remove('hidden');
            setTimeout(() => { els.imageModal.classList.remove('opacity-0'); els.imgModalContent.classList.remove('scale-95'); els.imgModalContent.classList.add('scale-100'); }, 10);
        }
        function closeImageModal() {
            els.imageModal.classList.add('opacity-0'); els.imgModalContent.classList.remove('scale-100'); els.imgModalContent.classList.add('scale-95');
            setTimeout(() => els.imageModal.classList.add('hidden'), 300);
        }
        els.imageModal.addEventListener('click', (e) => { if (e.target !== els.imgModalContent) closeImageModal(); });
        els.closeModalBtn.addEventListener('click', closeImageModal);

        async function apiCall(action, payload = {}) {
            if (action === 'getMessages' || action === 'getRoomInfo') { const res = await fetch(`${SCRIPT_URL}?action=${action}`); return await res.json(); }
            payload.action = action;
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
            return await res.json();
        }

        els.notiBtn.addEventListener('click', () => {
            if (!("Notification" in window)) alert("Trình duyệt không hỗ trợ thông báo.");
            else if (Notification.permission === "granted") alert("Thông báo đã được bật!");
            else if (Notification.permission !== "denied") Notification.requestPermission().then(p => { if (p === "granted") { new Notification("Nexus Chat", { body: "Đã bật thông báo!", icon: getAvatarUrl("Nexus") }); els.notiBtn.classList.add('text-yellow-500'); } });
            else alert("Bạn đã chặn thông báo trong trình duyệt.");
        });

        document.addEventListener('visibilitychange', () => { if (!document.hidden) { unreadCount = 0; document.title = originalTitle; } });

        function showInAppToast(msg) {
            els.toastAvatar.src = getAvatarUrl(msg.username);
            let pText = msg.isFile ? "Đã gửi một tệp đính kèm 📎" : msg.text.replace(/[*_~`]/g, '');
            els.toastText.innerText = `${msg.username}: ${pText}`;
            els.toast.classList.remove('-translate-y-32', 'opacity-0', 'pointer-events-none'); els.toast.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');
            clearTimeout(els.toast.hideTimeout); els.toast.hideTimeout = setTimeout(() => hideInAppToast(), 4000);
        }
        function hideInAppToast() { els.toast.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto'); els.toast.classList.add('-translate-y-32', 'opacity-0', 'pointer-events-none'); }
        els.toast.addEventListener('click', () => { scrollToBottom(true); hideInAppToast(); });
        
        // Cập nhật Push Notification hỗ trợ ServiceWorker và Rung cho điện thoại
        function showPushNotification(msg) { 
            if (Notification.permission === "granted" && document.hidden) {
                const title = `${msg.username} - ${roomNameStr}`;
                const options = { 
                    body: msg.isFile ? "Đã gửi một tệp 📎" : msg.text, 
                    icon: getAvatarUrl(msg.username),
                    vibrate: [200, 100, 200, 100, 200] // Rung báo hiệu chú ý trên đt
                };
                
                if ('serviceWorker' in navigator && navigator.serviceWorker.ready) {
                    navigator.serviceWorker.ready.then(reg => {
                        reg.showNotification(title, options);
                    });
                } else {
                    new Notification(title, options);
                }
            } 
        }

        function getAvatarUrl(name) { return `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(name)}&backgroundColor=b6e3f4,c0aede,d1d4f9,ffdfbf`; }
        function formatMessage(text, isFile = false, fileUrl = '') {
            if (isFile && fileUrl) {
                if (text.match(/\.(jpeg|jpg|gif|png)$/i) != null) return `<br><img src="${fileUrl}" onclick="openImageModal('${fileUrl}')" class="mt-2 rounded-xl max-w-[200px] sm:max-w-xs shadow-md cursor-zoom-in hover:scale-[1.02] transition-transform bg-white/50" alt="Ảnh"/><br><span class="text-xs text-blue-500 mt-1 block">📎 ${text}</span>`;
                return `<div class="flex items-center space-x-2 mt-1"><span>📎</span><a href="${fileUrl}" target="_blank" class="text-blue-500 hover:text-blue-600 hover:underline font-bold">${text}</a></div>`;
            }
            let safeText = text.replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag));
            safeText = safeText.replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold">$1</strong>').replace(/\*(.*?)\*/g, '<em class="italic">$1</em>').replace(/`(.*?)`/g, '<code class="md-code">$1</code>');
            if (/(https?:\/\/.*\.(?:png|jpg|jpeg|gif|webp))/ig.test(safeText)) safeText = safeText.replace(/(https?:\/\/.*\.(?:png|jpg|jpeg|gif|webp))/ig, '<br><img src="$1" onclick="openImageModal(\'$1\')" class="mt-2 rounded-xl max-w-[200px] sm:max-w-xs shadow-md cursor-zoom-in hover:scale-[1.02] transition-transform bg-white/50" onerror="this.style.display=\'none\'" alt="Ảnh link"/>');
            else safeText = safeText.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" class="text-blue-500 hover:text-blue-600 underline underline-offset-2 break-all">$1</a>');
            return safeText;
        }

        els.messages.addEventListener('scroll', () => {
            const { scrollTop, scrollHeight, clientHeight } = els.messages;
            if (scrollHeight - scrollTop - clientHeight > 100) { isUserScrolling = true; els.scrollBtn.classList.remove('hidden'); }
            else { isUserScrolling = false; els.scrollBtn.classList.add('hidden'); }
        });
        els.scrollBtn.addEventListener('click', () => scrollToBottom(true));
        function scrollToBottom(force = false) { if (!isUserScrolling || force) els.messages.scrollTo({ top: els.messages.scrollHeight, behavior: force ? 'smooth' : 'auto' }); }

        els.loginForm.addEventListener('submit', async function(e) {
            e.preventDefault(); const userVal = document.getElementById('username').value.trim(); const passVal = '123456';
            if(!userVal) return;
            els.loginBtnText.innerText = 'Đang xác thực...'; els.loginLoader.classList.remove('hidden'); els.error.classList.add('hidden');
            try {
                const res = await apiCall('checkLogin', { username: userVal, password: passVal });
                if (res.success) enterRoom(userVal); else { els.loginBtnText.innerText = 'Vào Phòng Ngay'; els.loginLoader.classList.add('hidden'); els.error.innerText = res.message; els.error.classList.remove('hidden'); }
            } catch (err) { els.loginBtnText.innerText = 'Vào Phòng Ngay'; els.loginLoader.classList.add('hidden'); els.error.innerText = 'Lỗi kết nối Server!'; els.error.classList.remove('hidden'); }
        });

        async function enterRoom(username) {
            currentUser = username; els.displayName.innerText = currentUser; els.myAvatar.src = getAvatarUrl(currentUser);
            els.loginScreen.classList.add('hidden'); els.chatScreen.classList.remove('hidden'); els.messages.innerHTML = '';
            await updateRoomInfo(); fetchMessages(); pollingInterval = setInterval(() => { fetchMessages(); updateRoomInfo(); }, 3000);
            if (Notification.permission === "granted") els.notiBtn.classList.add('text-yellow-500');
        }

        document.getElementById('logout-btn').addEventListener('click', () => {
            clearInterval(pollingInterval); currentUser = ''; lastMessageCount = 0;
            els.chatScreen.classList.add('hidden'); els.loginScreen.classList.remove('hidden');
        });

        async function updateRoomInfo() { try { const res = await apiCall('getRoomInfo'); if (res.roomName && res.roomName !== roomNameStr) { roomNameStr = res.roomName; els.roomNameDisplay.innerText = roomNameStr; } } catch (e) {} }
        els.editRoomBtn.addEventListener('click', () => { document.getElementById('new-room-name').value = roomNameStr; els.roomModal.classList.remove('hidden'); });
        document.getElementById('cancel-room-btn').addEventListener('click', () => els.roomModal.classList.add('hidden'));
        document.getElementById('save-room-btn').addEventListener('click', async () => {
            const newName = document.getElementById('new-room-name').value.trim(); if(!newName) return;
            els.roomModal.classList.add('hidden'); roomNameStr = newName; els.roomNameDisplay.innerText = "Đang đổi...";
            await apiCall('updateRoomName', { roomName: newName }); updateRoomInfo();
        });

        els.attachBtn.addEventListener('click', () => els.fileInput.click());
        els.fileInput.addEventListener('change', function() {
            if(this.files.length > 0) {
                selectedFile = this.files[0]; if(selectedFile.size > 3 * 1024 * 1024) { alert("Vui lòng chọn file dưới 3MB!"); selectedFile = null; this.value = ''; return; }
                els.fileNameDisplay.innerText = selectedFile.name; els.filePreview.classList.remove('hidden');
            }
        });
        els.removeFileBtn.addEventListener('click', () => { selectedFile = null; els.fileInput.value = ''; els.filePreview.classList.add('hidden'); });

        async function fetchMessages() { try { const messages = await apiCall('getMessages'); renderMessages(messages); } catch (e) {} }

        function renderMessages(messages) {
            if (messages.length === lastMessageCount) return;
            if (lastMessageCount > 0 && messages.length > lastMessageCount) {
                messages.slice(lastMessageCount).forEach(newMsg => {
                    if (newMsg.username !== currentUser && newMsg.username !== 'Hệ thống') {
                        if(!isMuted) notifSound.play().catch(e=>{});
                        if (document.hidden) { unreadCount++; document.title = `(${unreadCount}) Tin nhắn mới - ${originalTitle}`; showPushNotification(newMsg); } 
                        else if (isUserScrolling) showInAppToast(newMsg);
                    }
                });
            }
            lastMessageCount = messages.length; els.messages.innerHTML = ''; 
            messages.forEach((msg) => {
                const isMe = msg.username === currentUser; const isSystem = msg.username === 'Hệ thống';
                const date = new Date(msg.timestamp); const timeStr = date.getHours().toString().padStart(2,'0') + ':' + date.getMinutes().toString().padStart(2,'0');
                const msgWrapper = document.createElement('div'); msgWrapper.className = `flex w-full msg-animate ${isSystem ? 'justify-center' : (isMe ? 'justify-end' : 'justify-start')}`;
                
                if (isSystem) msgWrapper.innerHTML = `<div class="bg-black/10 dark:bg-white/10 backdrop-blur-sm text-gray-500 dark:text-gray-300 text-xs px-4 py-1.5 rounded-full my-2 font-medium tracking-wide shadow-sm border border-gray-200/10">${formatMessage(msg.text)}</div>`;
                else {
                    const avatarSrc = getAvatarUrl(msg.username); const bubbleBg = isMe ? 'bg-gradient-to-br from-pink-500 to-rose-500 text-white rounded-tr-sm shadow-pink-500/30' : 'theme-input border border-gray-200/20 text-current rounded-tl-sm shadow-sm';
                    const timeColor = isMe ? 'text-pink-100' : 'text-gray-400';
                    msgWrapper.innerHTML = `
                        <div class="flex max-w-[85%] sm:max-w-[75%] items-end ${isMe ? 'flex-row-reverse space-x-reverse space-x-2' : 'space-x-2'}">
                            <img src="${avatarSrc}" class="w-8 h-8 sm:w-10 sm:h-10 rounded-full border border-gray-200/20 bg-white object-cover shadow-sm flex-shrink-0 cursor-pointer" onclick="openImageModal('${avatarSrc}')">
                            <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                                ${!isMe ? `<span class="text-[11px] font-bold text-gray-500 dark:text-gray-400 mb-1 ml-1">${msg.username}</span>` : ''}
                                <div class="px-5 py-3 rounded-[1.2rem] shadow-md ${bubbleBg}">
                                    <div class="text-[15px] leading-relaxed whitespace-pre-wrap break-words">${formatMessage(msg.text, msg.isFile, msg.fileUrl)}</div>
                                    <span class="text-[10px] mt-1.5 block opacity-80 text-${isMe ? 'right' : 'left'} ${timeColor} font-medium tracking-wide">${timeStr}</span>
                                </div>
                            </div>
                        </div>`;
                }
                els.messages.appendChild(msgWrapper);
            });
            scrollToBottom();
        }

        els.chatForm.addEventListener('submit', async function(e) {
            e.preventDefault(); const text = els.input.value.trim(); if (!text && !selectedFile) return;
            els.sendBtn.disabled = true; els.attachBtn.disabled = true; els.emojiBtn.disabled = true; els.emojiContainer.classList.add('hidden');
            let payload = { username: currentUser, text: text, isFile: false };
            if (selectedFile) {
                renderTempMessage(text, true); 
                const reader = new FileReader();
                reader.onload = async function() { payload.isFile = true; payload.fileName = selectedFile.name; payload.mimeType = selectedFile.type; payload.base64 = reader.result.split(',')[1]; await sendMessageToServer(payload); selectedFile = null; els.fileInput.value = ''; els.filePreview.classList.add('hidden'); };
                reader.readAsDataURL(selectedFile);
            } else { renderTempMessage(text, false); els.input.value = ''; await sendMessageToServer(payload); }
        });

        async function sendMessageToServer(payload) {
            try { await apiCall('saveMessage', payload); fetchMessages(); } catch (err) { alert("Lỗi gửi tin! (Có thể do mạng hoặc file nặng)."); }
            finally { els.sendBtn.disabled = false; els.attachBtn.disabled = false; els.emojiBtn.disabled = false; els.input.focus(); }
        }

        function renderTempMessage(text, isUploadingFile = false) {
            const tempDiv = document.createElement('div'); tempDiv.className = `flex w-full justify-end msg-animate opacity-60`;
            let contentText = text + (isUploadingFile ? `<br><span class="text-xs italic mt-1 block">Đang tải file lên Drive... ⏳</span>` : '');
            tempDiv.innerHTML = `<div class="flex max-w-[85%] sm:max-w-[75%] items-end flex-row-reverse space-x-reverse space-x-2"><img src="${getAvatarUrl(currentUser)}" class="w-8 h-8 sm:w-10 sm:h-10 rounded-full border border-gray-200/20 bg-white object-cover opacity-80 flex-shrink-0"><div class="flex flex-col items-end"><div class="px-5 py-3 rounded-[1.2rem] shadow-md bg-gradient-to-br from-pink-400 to-rose-400 text-white rounded-tr-sm"><div class="text-[15px] leading-relaxed whitespace-pre-wrap break-words">${formatMessage(contentText)}</div><span class="text-[10px] mt-1.5 block text-white/80 text-right animate-pulse tracking-wide">Đang bay đi... ✈️</span></div></div></div>`;
            els.messages.appendChild(tempDiv); scrollToBottom(true);
        }
        
        els.statusText.innerText = "Hệ thống AI sẵn sàng!";
    </script>
</body>
</html>
