    <style>
        /* Modern Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.8); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Advanced Glassmorphism */
        .glass-panel {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Animations */
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        @keyframes blob { 0% { transform: translate(0px, 0px) scale(1); } 33% { transform: translate(30px, -50px) scale(1.1); } 66% { transform: translate(-20px, 20px) scale(0.9); } 100% { transform: translate(0px, 0px) scale(1); } }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes fadeOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.95); } }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .animate-blob { animation: blob 10s infinite; }
        .animate-blob-delay { animation: blob 10s infinite 2s; }
        .card-enter { animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        
        .toast-enter { animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast-leave { animation: fadeOut 0.3s ease-in forwards; }
        .modal-enter { animation: fadeInScale 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .skeleton { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        /* Smooth Image Container */
        .image-container { position: relative; padding-bottom: 75%; overflow: hidden; border-radius: 1rem; }
        .image-container img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        
        body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    </style>

    <!-- JS Logic -->
    <script>
        // QUAN TRỌNG: Thay thế URL bằng App Script Web App của bạn
        const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwa3YQrx8HjYhwxNlBAS3iVnU30OyQaWDQ_aAlp2YCLezYQURKHAjSaCSFixEsxW-OWNA/exec';

        const STATUS_CONFIG = {
            vacant: { label: 'Trống', color: 'bg-emerald-500 text-white shadow-emerald-500/40 border-emerald-400', icon: 'check-circle' },
            rented: { label: 'Đang thuê', color: 'bg-blue-500 text-white shadow-blue-500/40 border-blue-400', icon: 'home' },
            deposited: { label: 'Đã cọc', color: 'bg-amber-500 text-white shadow-amber-500/40 border-amber-400', icon: 'clock' },
            maintenance: { label: 'Bảo trì', color: 'bg-slate-500 text-white shadow-slate-500/40 border-slate-400', icon: 'wrench' }
        };

        let state = {
            user: JSON.parse(localStorage.getItem('rfr_user')) || null,
            searchQuery: '', statusFilter: 'all',
            rooms: [], editingRoomId: null, commEditType: 'percent', viewingRoomId: null,
            bookmarks: JSON.parse(localStorage.getItem('rfr_bookmarks') || '[]'),
            isDark: localStorage.getItem('rfr_theme') === 'dark' || false
        };

        function initTheme() {
            if (state.isDark) document.documentElement.classList.add('dark');
            setTimeout(() => { if(document.getElementById('theme-icon')) document.getElementById('theme-icon').setAttribute('data-lucide', state.isDark ? 'moon' : 'sun'); lucide.createIcons(); }, 100);
        }

        window.toggleDarkMode = function() {
            state.isDark = !state.isDark;
            localStorage.setItem('rfr_theme', state.isDark ? 'dark' : 'light');
            document.documentElement.classList.toggle('dark');
            document.getElementById('theme-icon').setAttribute('data-lucide', state.isDark ? 'moon' : 'sun');
            lucide.createIcons();
        }

        function formatCurrency(num) { return Number(num).toLocaleString('vi-VN'); }
        function getCommissionInfo(room) {
            const type = room.commissionType || 'percent';
            const value = room.commissionValue || 0;
            if (type === 'percent') return { display: `${value}%`, absolute: (room.price * value) / 100, fullText: `${value}% (${formatCurrency((room.price * value) / 100)}đ)` };
            return { display: `${formatCurrency(value)}đ`, absolute: value, fullText: `${formatCurrency(value)}đ` };
        }
        function getBadgeHTML(statusId) {
            const config = STATUS_CONFIG[statusId] || STATUS_CONFIG.vacant;
            return `<span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[10px] font-extrabold uppercase tracking-widest backdrop-blur-md border border-white/20 ${config.color}"><i data-lucide="${config.icon}" class="w-3.5 h-3.5"></i>${config.label}</span>`;
        }

        function showToast(message, isError = false, overrideIcon = null) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = isError ? 'bg-red-500' : 'bg-slate-900 dark:bg-white text-white dark:text-slate-900';
            const iconColor = isError ? 'text-white' : (overrideIcon === 'heart' ? 'text-rose-500 fill-rose-500' : 'text-emerald-400 dark:text-emerald-600');
            const icon = overrideIcon || (isError ? 'x-circle' : 'check-circle');
            
            toast.className = `flex items-center gap-3 px-6 py-4 rounded-full shadow-2xl text-sm font-bold toast-enter ${bgColor}`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 flex-shrink-0 ${iconColor}"></i><span class="whitespace-nowrap">${message}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => { toast.classList.replace('toast-enter', 'toast-leave'); setTimeout(() => { if(container.contains(toast)) container.removeChild(toast); }, 300); }, 3000);
        }

        // AUTH SYSTEM
        function renderHeaderAuth() {
            const container = document.getElementById('auth-header-container');
            if (state.user) {
                const initials = state.user.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                container.innerHTML = `
                    <div class="flex items-center gap-2 cursor-pointer group" onclick="handleLogout()" title="Click để đăng xuất">
                        <div class="hidden md:block text-right mr-1">
                            <p class="font-bold text-slate-800 dark:text-white text-sm group-hover:text-rose-500 transition-colors">${state.user.name}</p>
                            <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest">${state.user.role === 'admin' ? 'Quản trị' : 'Thành viên'}</p>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-slate-900 dark:bg-white text-white dark:text-slate-900 flex items-center justify-center font-bold shadow-md group-hover:rotate-12 transition-all">
                            ${initials}
                        </div>
                    </div>`;
            } else {
                container.innerHTML = `
                    <button onclick="openAuthModal('login')" class="px-5 py-2.5 bg-slate-900 dark:bg-white text-white dark:text-slate-900 rounded-full text-sm font-bold shadow-md hover:shadow-lg transition-all active:scale-95 whitespace-nowrap">
                        Đăng nhập
                    </button>`;
            }
            lucide.createIcons();
        }

        window.openAuthModal = function(tab) { document.getElementById('auth-modal').classList.remove('hidden'); switchAuthTab(tab); }
        window.closeAuthModal = function() { document.getElementById('auth-modal').classList.add('hidden'); }
        
        window.switchAuthTab = function(tab) {
            const isLogin = tab === 'login';
            document.getElementById('form-login').classList.toggle('hidden', !isLogin);
            document.getElementById('form-register').classList.toggle('hidden', isLogin);
            const activeClass = 'bg-white dark:bg-slate-700 shadow-sm text-indigo-600 dark:text-white';
            const inactiveClass = 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-white';
            document.getElementById('tab-login').className = `flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all whitespace-nowrap ${isLogin ? activeClass : inactiveClass}`;
            document.getElementById('tab-register').className = `flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all whitespace-nowrap ${!isLogin ? activeClass : inactiveClass}`;
        }

        window.handleAuth = async function(e, type) {
            e.preventDefault();
            const btnSubmit = type === 'login' ? document.getElementById('btn-login-submit') : document.getElementById('btn-reg-submit');
            const originalText = btnSubmit.innerHTML;
            btnSubmit.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Đang xử lý...`;
            btnSubmit.disabled = true;

            const payload = { action: type };
            if (type === 'login') {
                payload.phone = document.getElementById('login-phone').value;
                payload.password = document.getElementById('login-pass').value;
            } else {
                payload.name = document.getElementById('reg-name').value;
                payload.phone = document.getElementById('reg-phone').value;
                payload.email = document.getElementById('reg-email').value;
                payload.password = document.getElementById('reg-pass').value;
            }

            try {
                const res = await fetch(APP_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                const data = await res.json();
                if (data.success) {
                    if (type === 'login') {
                        state.user = data.user;
                        localStorage.setItem('rfr_user', JSON.stringify(data.user));
                        showToast(data.message || "Đăng nhập thành công");
                        closeAuthModal();
                        renderHeaderAuth();
                        renderMainContent();
                    } else {
                        // Xử lý sau khi Đăng ký thành công (Pending)
                        showToast(data.message || "Đăng ký thành công! Vui lòng chờ duyệt.");
                        switchAuthTab('login');
                        document.getElementById('login-phone').value = payload.phone;
                        document.getElementById('login-pass').value = payload.password;
                    }
                } else showToast(data.message, true);
            } catch (err) { showToast("Lỗi kết nối máy chủ", true); } 
            finally { btnSubmit.innerHTML = originalText; btnSubmit.disabled = false; lucide.createIcons(); }
        }

        window.handleLogout = function() {
            state.user = null;
            localStorage.removeItem('rfr_user');
            showToast("Đã đăng xuất an toàn");
            renderHeaderAuth();
            renderMainContent();
            if (state.viewingRoomId) openRoomDetails(state.viewingRoomId);
        }

        // DATA LOGIC
        async function fetchInitialData() {
            initTheme();
            renderHeaderAuth();
            renderSkeleton();
            setSyncStatus(true, "Đang kết nối...");
            try {
                const response = await fetch(`${APP_SCRIPT_URL}?action=getData`);
                const result = await response.json();
                if (result.success && result.rooms) state.rooms = result.rooms;
            } catch (error) { showToast("Đang dùng dữ liệu cục bộ", true); } 
            finally { setSyncStatus(false, ""); renderMainContent(); }
        }

        function setSyncStatus(isLoading, msg) {
            const el = document.getElementById('sync-status');
            const textEl = document.getElementById('sync-text');
            if (isLoading) { textEl.innerText = msg; el.classList.remove('hidden'); el.classList.add('flex'); } 
            else { el.classList.add('hidden'); el.classList.remove('flex'); }
        }

                        ${room.video ? '<div class="absolute bottom-3 right-3 z-10 bg-black/40 backdrop-blur-md text-white p-2 rounded-xl border border-white/20"><i data-lucide="video" class="w-4 h-4"></i></div>' : ''}

                        <p class="text-sm font-medium text-slate-500 dark:text-slate-400 flex items-center gap-1.5 truncate mb-5"><i data-lucide="map-pin" class="w-4 h-4 text-rose-500"></i> ${room.building}</p>
                        <div class="mt-auto space-y-3">

                </div>`;
            }).join('');

            container.innerHTML = `
                <div class="space-y-8">
                    <!-- Modern Search Bar -->
                    <div class="glass-panel p-2 rounded-[2rem] shadow-soft flex flex-col md:flex-row items-center gap-2 border border-white/60 dark:border-white/10 relative z-20">

        }

        window.closeRoomDetails = function() {
            state.viewingRoomId = null;
            document.getElementById('main-media-container').innerHTML = ''; 
            document.getElementById('details-modal').classList.add('hidden');
        }

        window.openLightbox = function(el) {
            const content = el.innerHTML;
            if(!content.includes('img') && !content.includes('video')) return;
            document.getElementById('lightbox-content').innerHTML = content;
            document.getElementById('lightbox').classList.remove('hidden');
        }
        window.closeLightbox = function() {
            document.getElementById('lightbox-content').innerHTML = '';
            document.getElementById('lightbox').classList.add('hidden');
        }

        window.toggleBookmark = function(roomId, e) {
            if(e) e.stopPropagation();
            if(state.bookmarks.includes(roomId)) {
                state.bookmarks = state.bookmarks.filter(id => id !== roomId);
                showToast('Đã bỏ lưu phòng');
            } else {
                state.bookmarks.push(roomId);
                showToast('Đã thêm vào mục Yêu thích', false, 'heart');
            }
            localStorage.setItem('rfr_bookmarks', JSON.stringify(state.bookmarks));
            renderMainContent();
            if(state.viewingRoomId === roomId) {
                const bmBtn = document.getElementById('btn-modal-bookmark');
                if(bmBtn) bmBtn.innerHTML = `<i data-lucide="heart" class="w-5 h-5 ${state.bookmarks.includes(roomId) ? 'fill-rose-500 text-rose-500' : ''}"></i>`;
                lucide.createIcons();
            }
        }

        window.openMap = function() {
            if(!state.viewingRoomId) return;
            const room = state.rooms.find(r => r.id === state.viewingRoomId);
            if(room && room.building) window.open(`http://maps.google.com/?q=${encodeURIComponent(room.building)}`, '_blank');
        }

        window.shareRoomSmart = function(tone) {
            if(!state.viewingRoomId) return;
            const room = state.rooms.find(r => r.id === state.viewingRoomId);
            const commInfo = getCommissionInfo(room);
            let postContent = '';
            if (tone === 'standard') postContent = `📣 CHO THUÊ PHÒNG: ${room.name}\n📍 Địa chỉ: ${room.building}\n🛋️ Loại: ${room.type} - ${room.area}m²\n💰 Giá: ${formatCurrency(room.price)}đ/tháng\n✨ Trạng thái: ${STATUS_CONFIG[room.status]?.label || 'Trống'}\n📝 Mô tả: ${room.description || ''}\n🎁 Hoa hồng MG: ${commInfo.fullText}\n📞 Liên hệ ngay!`;
            else if (tone === 'sales') postContent = `🔥 GÓC SIÊU PHẨM GIÁ TỐT NHẤT KHU VỰC 🔥\n\nChính chủ cần cho thuê gấp [ ${room.name} ] tại ${room.building}.\n💎 Thiết kế hiện đại, diện tích rộng rãi ${room.area}m² thuộc phân khúc ${room.type}.\n💸 Mức giá cực mềm chỉ: ${formatCurrency(room.price)}đ/tháng.\n\n📍 Tiện ích đầy đủ, xách vali vào ở ngay!\n🤝 Anh em Môi Giới đẩy giúp, hoa hồng gửi thẳng: ${commInfo.fullText}.\n📲 Inbox hoặc Alo ngay để chốt deal!`;

            const textArea = document.createElement("textarea");
            textArea.value = postContent;
            textArea.style.position = "fixed"; textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.select();
            try { document.execCommand('copy'); showToast(`Đã copy nội dung: ${tone === 'standard' ? 'Tiêu chuẩn' : 'Bán hàng'}`); } 
            catch (err) { showToast('Không thể copy', true); }
            document.body.removeChild(textArea);
        }

        // COMMISSION LOGIC
        window.openCommissionModal = function(roomId, event) {
            if(event) event.stopPropagation();
            const room = state.rooms.find(r => r.id === roomId);
            state.editingRoomId = roomId;
            state.commEditType = room.commissionType || 'percent';
            document.getElementById('commission-input').value = room.commissionValue || 0;
            updateCommissionModalUI();
            previewCommission();
            document.getElementById('commission-modal').classList.remove('hidden');
        }
        window.closeCommissionModal = function() { state.editingRoomId = null; document.getElementById('commission-modal').classList.add('hidden'); }
        window.setCommissionType = function(type) { state.commEditType = type; updateCommissionModalUI(); previewCommission(); }
        
        function updateCommissionModalUI() {
            const isPercent = state.commEditType === 'percent';
            const activeClass = 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-white shadow-sm';
            const inactiveClass = 'text-slate-500 dark:text-slate-400 hover:bg-white/50 dark:hover:bg-slate-700/50';
            document.getElementById('btn-type-percent').className = `flex-1 py-2 text-sm font-bold rounded-lg whitespace-nowrap transition-all ${isPercent ? activeClass : inactiveClass}`;
            document.getElementById('btn-type-fixed').className = `flex-1 py-2 text-sm font-bold rounded-lg whitespace-nowrap transition-all ${!isPercent ? activeClass : inactiveClass}`;
        }

        window.previewCommission = function() {
            if(!state.editingRoomId) return;
            const room = state.rooms.find(r => r.id === state.editingRoomId);
            const inputVal = parseFloat(document.getElementById('commission-input').value) || 0;
            const absoluteVal = state.commEditType === 'percent' ? (room.price * inputVal) / 100 : inputVal;
            document.getElementById('comm-preview').innerText = `${formatCurrency(absoluteVal)}đ`;
        }

        window.saveCommission = function() {
            const inputVal = parseFloat(document.getElementById('commission-input').value);
            if(isNaN(inputVal) || inputVal < 0) { showToast('Giá trị không hợp lệ', true); return; }
            state.rooms = state.rooms.map(r => r.id === state.editingRoomId ? { ...r, commissionType: state.commEditType, commissionValue: inputVal } : r);
            showToast('Lưu hoa hồng thành công');
            closeCommissionModal();
            if(state.viewingRoomId === state.editingRoomId) openRoomDetails(state.viewingRoomId);
            renderMainContent();
            fetch(APP_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'updateCommission', roomId: state.editingRoomId, commissionType: state.commEditType, commissionValue: inputVal })
            }).catch(e => console.error('Lỗi lưu:', e));
        }

        window.setSearchQuery = function(val) { state.searchQuery = val; renderMainContent(); }
        window.setStatusFilter = function(val) { state.statusFilter = val; renderMainContent(); }

        document.addEventListener('DOMContentLoaded', fetchInitialData);
    </script>
</body>
</html>
