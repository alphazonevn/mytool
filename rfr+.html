    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root{
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.8); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        .tabular { font-variant-numeric: tabular-nums; }

        /* ---------- Glass surfaces ---------- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.62);
            backdrop-filter: blur(28px) saturate(160%);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }
        .dark .glass-panel {
            background: rgba(10, 10, 10, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glass-strong {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
        }
        .dark .glass-strong { background: rgba(5, 5, 5, 0.85); }

        .glass-chip {
            background: rgba(255,255,255,0.55);
            border: 1px solid rgba(255,255,255,0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .dark .glass-chip { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.08); }

        /* ---------- Ambient bg ---------- */
        @keyframes blob { 0% { transform: translate(0px, 0px) scale(1); } 33% { transform: translate(30px, -50px) scale(1.15); } 66% { transform: translate(-20px, 20px) scale(0.9); } 100% { transform: translate(0px, 0px) scale(1); } }
        .animate-blob { animation: blob 14s infinite; }
        .animate-blob-delay { animation: blob 14s infinite 3s; }
        .animate-blob-delay2 { animation: blob 16s infinite 6s; }

        /* ---------- Motion ---------- */
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(16px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes sheetDown { from { transform: translateY(0); } to { transform: translateY(100%); } }
        @keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scrimOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
        @keyframes popIn { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        .card-enter { animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .toast-enter { animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast-leave { animation: fadeOut 0.25s ease-in forwards; }
        .modal-enter { animation: fadeInScale 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .pop-in { animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .skeleton-shimmer {
            background: linear-gradient(90deg, rgba(148,163,184,0.12) 25%, rgba(148,163,184,0.24) 37%, rgba(148,163,184,0.12) 63%);
            background-size: 400% 100%;
            animation: shimmer 1.6s ease-in-out infinite;
        }

        .scrim-enter { animation: scrimIn 0.25s ease-out forwards; }
        .scrim-leave { animation: scrimOut 0.25s ease-in forwards; }
        .sheet-enter { animation: sheetUp 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .sheet-leave { animation: sheetDown 0.28s cubic-bezier(0.4, 0, 1, 1) forwards; }

        @media (min-width: 768px) {
            .sheet-enter { animation: fadeInScale 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
            .sheet-leave { animation: fadeOut 0.2s ease-in forwards; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
        }

        /* ---------- Media ---------- */
        .image-container { position: relative; padding-bottom: 72%; overflow: hidden; border-radius: 1.25rem; }
        .image-container img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1); }

        /* ---------- Drag handle for sheets ---------- */
        .sheet-handle { width: 40px; height: 5px; border-radius: 99px; background: rgba(148,163,184,0.5); margin: 10px auto 4px; }

        /* ---------- Stat card scroller ---------- */
        .stat-scroller { scroll-snap-type: x mandatory; }
        .stat-card { scroll-snap-align: start; }

        /* ---------- Bottom nav active indicator ---------- */
        .nav-item.active .nav-dot { opacity: 1; transform: scale(1); }
        .nav-dot { opacity: 0; transform: scale(0.4); transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1); }

        /* ---------- Range slider ---------- */
        input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 20px; height: 20px; border-radius: 50%;
            background: #fff; border: 3px solid #dc2626;
            box-shadow: 0 2px 8px rgba(220,38,38,0.5); cursor: pointer; margin-top: -8px;
        }
        input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 99px; }

        /* ---------- Segmented control underline ---------- */
        .seg-btn { position: relative; }

        /* ---------- Focus visibility ---------- */
        button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
            outline: 2px solid #dc2626; outline-offset: 2px;
        }

        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="flex flex-col h-screen bg-[#f8f9fa] dark:bg-[#030303] font-sans text-slate-900 dark:text-slate-100 overflow-hidden transition-colors duration-500">

    <!-- Ambient Background -->

        <div class="absolute top-[15%] right-[-15%] w-96 h-96 bg-rose-500/25 dark:bg-rose-700/15 rounded-full mix-blend-multiply dark:mix-blend-lighten filter blur-[100px] animate-blob animate-blob-delay"></div>
        <div class="absolute bottom-[-15%] left-[15%] w-[42rem] h-[42rem] bg-orange-500/15 dark:bg-orange-700/8 rounded-full mix-blend-multiply dark:mix-blend-lighten filter blur-[120px] animate-blob-delay2"></div>

            <div class="flex items-center gap-2 md:gap-4 min-w-0">

    <!-- Main Content -->

    <!-- ============ ROOM DETAILS SHEET ============ -->
    <div id="details-modal" class="hidden fixed inset-0 z-[105] flex items-end md:items-center justify-center">

    <!-- ============ COMMISSION SHEET ============ -->
    <div id="commission-modal" class="hidden fixed inset-0 z-[118] flex items-end md:items-center justify-center">
        <div class="absolute inset-0 bg-slate-900/40 dark:bg-black/70 backdrop-blur-sm scrim-enter" onclick="closeCommissionModal()"></div>
        <div class="relative w-full md:max-w-sm glass-strong rounded-t-[2rem] md:rounded-[2rem] shadow-sheet md:shadow-2xl border-t md:border border-white/60 dark:border-white/10 overflow-hidden sheet-enter">
            <div class="sheet-handle md:hidden"></div>
            <div class="px-6 pt-3 md:pt-5 pb-5 flex justify-between items-center">
                <h3 class="font-extrabold font-display text-slate-800 dark:text-white flex items-center gap-2">
                    <i data-lucide="wallet" class="w-5 h-5 text-red-500"></i> Cập nhật Hoa hồng
                </h3>
                <button onclick="closeCommissionModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white transition-colors bg-slate-100 dark:bg-slate-800 p-2 rounded-full">

                <div class="flex p-1 bg-slate-100 dark:bg-slate-800 rounded-xl">
                    <button id="btn-type-percent" onclick="setCommissionType('percent')" class="flex-1 py-2 text-sm font-bold rounded-lg bg-white dark:bg-slate-700 text-red-600 dark:text-white shadow-sm whitespace-nowrap transition-all">Tỉ lệ (%)</button>
                    <button id="btn-type-fixed" onclick="setCommissionType('fixed')" class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-500 dark:text-slate-400 whitespace-nowrap transition-all">Tiền mặt</button>
                </div>
                <div>
                    <input type="number" inputmode="decimal" id="commission-input" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-800 dark:text-white mb-3 focus:ring-2 focus:ring-red-500 outline-none font-bold transition-all" oninput="previewCommission()">
                    <div class="text-sm bg-red-50/50 dark:bg-red-500/10 p-4 rounded-xl flex justify-between items-center border border-red-100 dark:border-red-500/20">
                        <span class="text-slate-600 dark:text-slate-300 font-semibold">Thực nhận:</span>
                        <span id="comm-preview" class="font-black text-red-700 dark:text-red-400 text-lg tabular">0đ</span>

            <div class="px-6 py-4 bg-slate-50/80 dark:bg-slate-950/80 flex justify-end gap-3 border-t border-slate-100 dark:border-slate-800" style="padding-bottom: calc(1rem + var(--safe-bottom));">
                <button onclick="closeCommissionModal()" class="px-5 py-2.5 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 whitespace-nowrap transition-all active:scale-95">Hủy</button>
                <button onclick="saveCommission()" class="flex-1 py-2.5 bg-red-600 hover:bg-red-500 text-white rounded-xl text-sm font-bold whitespace-nowrap flex items-center justify-center gap-2 shadow-lg hover:shadow-red-500/30 transition-all active:scale-95">
                    <i data-lucide="check" class="w-4 h-4"></i> Lưu ngay
                </button>
            </div>
        </div>
    </div>

    <script>
        const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyCyIvKrORQ5I2-JmnoEWqAe1nQSLaGMaZJ8OnX0cf_DK-OWkvxnSlcTDXUWJnBaOjMPg/exec';

        // Trạng thái giữ nguyên hệ màu Semantic để thể hiện trực quan
        const STATUS_CONFIG = {
            vacant: { label: 'Trống', color: 'bg-emerald-500 text-white shadow-emerald-500/40 border-emerald-400', icon: 'check-circle', dot: 'bg-emerald-500' },
            rented: { label: 'Đang thuê', color: 'bg-blue-500 text-white shadow-blue-500/40 border-blue-400', icon: 'home', dot: 'bg-blue-500' },
            deposited: { label: 'Đã cọc', color: 'bg-amber-500 text-white shadow-amber-500/40 border-amber-400', icon: 'clock', dot: 'bg-amber-500' },
            maintenance: { label: 'Bảo trì', color: 'bg-slate-500 text-white shadow-slate-500/40 border-slate-400', icon: 'wrench', dot: 'bg-slate-500' }
        };

        let state = {
            user: null,
            searchQuery: '',
            statusFilters: [],         
            typeFilters: [],           
            maxPrice: 20000000,        
            priceFilterActive: false,
            videoOnly: false,
            rooms: [], editingRoomId: null, commEditType: 'percent', viewingRoomId: null,
            bookmarks: [],
            isDark: true, // Ép mặc định sang Dark mode với nền Đen Đậm
            activeTab: 'home',         
            viewMode: 'grid'           
        };

        let deferredInstallPrompt = null;

        try { state.user = JSON.parse(localStorage.getItem('rfr_user')) || null; } catch(e) { state.user = null; }
        try { state.bookmarks = JSON.parse(localStorage.getItem('rfr_bookmarks') || '[]'); } catch(e) { state.bookmarks = []; }
        try { state.isDark = localStorage.getItem('rfr_theme') !== 'light'; } catch(e) { state.isDark = true; }
        try { state.viewMode = localStorage.getItem('rfr_viewmode') || 'grid'; } catch(e) { state.viewMode = 'grid'; }

        function initTheme() {
            if (state.isDark) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const icon = document.getElementById('theme-icon');
            if (icon) {
                icon.setAttribute('data-lucide', state.isDark ? 'moon' : 'sun');
                lucide.createIcons();
            }
        }

        window.toggleDarkMode = function() {
            state.isDark = !state.isDark;
            try { localStorage.setItem('rfr_theme', state.isDark ? 'dark' : 'light'); } catch(e) {}
            document.documentElement.classList.toggle('dark');
            updateThemeIcon();
        }

        function formatCurrency(num) {
            const n = Number(num);
            if (isNaN(n)) return '0';
            return n.toLocaleString('vi-VN');
        }

        function getCommissionInfo(room) {
            const type = room.commissionType || 'percent';
            const value = Number(room.commissionValue) || 0;
            const price = Number(room.price) || 0;
            if (type === 'percent') {
                const abs = (price * value) / 100;
                return { display: value + '%', absolute: abs, fullText: value + '% (' + formatCurrency(abs) + 'đ)' };
            }
            return { display: formatCurrency(value) + 'đ', absolute: value, fullText: formatCurrency(value) + 'đ' };
        }

        function getBadgeHTML(statusId, size) {
            const config = STATUS_CONFIG[statusId] || STATUS_CONFIG.vacant;
            const sizeClass = size === 'sm' ? 'px-2.5 py-1 text-[9px]' : 'px-3 py-1.5 text-[10px]';
            return '<span class="inline-flex items-center gap-1.5 ' + sizeClass + ' rounded-full font-extrabold uppercase tracking-widest backdrop-blur-md border border-white/20 ' + config.color + '"><i data-lucide="' + config.icon + '" class="w-3.5 h-3.5"></i>' + config.label + '</span>';
        }

        function showToast(message, isError, overrideIcon) {
            isError = isError || false;
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bgColor = isError ? 'bg-red-500 text-white' : 'bg-slate-900 dark:bg-white text-white dark:text-slate-900';
            const iconColor = isError ? 'text-white' : (overrideIcon === 'heart' ? 'text-rose-500 fill-rose-500' : 'text-emerald-400 dark:text-emerald-600');
            const icon = overrideIcon || (isError ? 'x-circle' : 'check-circle');
            toast.className = 'flex items-center gap-3 px-6 py-4 rounded-full shadow-2xl text-sm font-bold toast-enter ' + bgColor;
            toast.innerHTML = '<i data-lucide="' + icon + '" class="w-5 h-5 flex-shrink-0 ' + iconColor + '"></i><span class="whitespace-nowrap">' + message + '</span>';
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(function() {
                toast.classList.replace('toast-enter', 'toast-leave');
                setTimeout(function() { if (container.contains(toast)) container.removeChild(toast); }, 300);
            }, 3000);
        }

        // ============ BOTTOM SHEET HELPERS ============
        function openSheet(modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) return;
            modal.classList.remove('hidden');
            const scrim = modal.querySelector(':scope > div.scrim-enter, :scope > div.scrim-leave');
            const panel = modal.querySelector(':scope > div.sheet-enter, :scope > div.sheet-leave');
            if (scrim) scrim.className = scrim.className.replace('scrim-leave', 'scrim-enter');
            if (panel) panel.className = panel.className.replace('sheet-leave', 'sheet-enter');
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        }

        function closeSheet(modalId, callback) {
            const modal = document.getElementById(modalId);
            if (!modal) return;
            const scrim = modal.querySelector(':scope > div.scrim-enter, :scope > div.scrim-leave');
            const panel = modal.querySelector(':scope > div.sheet-enter, :scope > div.sheet-leave');
            if (scrim) { scrim.classList.remove('scrim-enter'); scrim.classList.add('scrim-leave'); }
            if (panel) { panel.classList.remove('sheet-enter'); panel.classList.add('sheet-leave'); }
            setTimeout(function() {
                modal.classList.add('hidden');
                document.body.style.overflow = '';
                if (callback) callback();
            }, 280);
        }

        // ============ AUTH ============
        function renderHeaderAuth() {
            const container = document.getElementById('auth-header-container');
            if (!container) return;
            if (state.user) {
                const name = state.user.name || '';
                const initials = name.split(' ').map(function(n) { return n[0] || ''; }).join('').substring(0, 2).toUpperCase() || 'U';
                const roleLabel = state.user.role === 'admin' ? 'Quản trị' : 'Thành viên';
                container.innerHTML = '<div class="flex items-center gap-2 cursor-pointer group" onclick="handleLogout()" title="Click để đăng xuất">'
                    + '<div class="hidden md:block text-right mr-1">'
                    + '<p class="font-bold text-slate-800 dark:text-white text-sm group-hover:text-rose-500 transition-colors">' + name + '</p>'
                    + '<p class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest">' + roleLabel + '</p>'
                    + '</div>'
                    + '<div class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-slate-900 dark:bg-white text-white dark:text-slate-900 flex items-center justify-center font-bold shadow-md group-hover:rotate-12 transition-all text-sm">' + initials + '</div>'
                    + '</div>';
            } else {
                container.innerHTML = '<button onclick="openAuthModal(\'login\')" class="px-4 md:px-5 py-2 md:py-2.5 bg-slate-900 dark:bg-white text-white dark:text-slate-900 rounded-full text-xs md:text-sm font-bold shadow-md hover:shadow-lg transition-all active:scale-95 whitespace-nowrap">Đăng nhập</button>';
            }
            lucide.createIcons();
        }

        window.openAuthModal = function(tab) {
            openSheet('auth-modal');
            switchAuthTab(tab || 'login');
        }
        window.closeAuthModal = function() { closeSheet('auth-modal'); }

        window.switchAuthTab = function(tab) {
            const isLogin = tab === 'login';
            document.getElementById('form-login').classList.toggle('hidden', !isLogin);
            document.getElementById('form-register').classList.toggle('hidden', isLogin);
            const activeClass = 'flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all whitespace-nowrap bg-white dark:bg-slate-700 shadow-sm text-red-600 dark:text-white';
            const inactiveClass = 'flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all whitespace-nowrap text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-white';
            document.getElementById('tab-login').className = isLogin ? activeClass : inactiveClass;
            document.getElementById('tab-register').className = !isLogin ? activeClass : inactiveClass;
        }

        window.handleAuth = async function(e, type) {
            e.preventDefault();
            const btnId = type === 'login' ? 'btn-login-submit' : 'btn-reg-submit';
            const btnSubmit = document.getElementById(btnId);
            const originalHTML = btnSubmit.innerHTML;
            btnSubmit.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Đang xử lý...';
            btnSubmit.disabled = true;
            lucide.createIcons();

            const payload = { action: type };
            if (type === 'login') {
                payload.phone = document.getElementById('login-phone').value;
                payload.password = document.getElementById('login-pass').value;
            } else {
                payload.name = document.getElementById('reg-name').value;
                payload.phone = document.getElementById('reg-phone').value;
                payload.email = document.getElementById('reg-email').value;
                payload.password = document.getElementById('reg-pass').value;
            }

            try {
                const res = await fetch(APP_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                const data = await res.json();
                if (data.success) {
                    if (type === 'login') {
                        state.user = data.user;
                        try { localStorage.setItem('rfr_user', JSON.stringify(data.user)); } catch(e) {}
                        showToast(data.message || 'Đăng nhập thành công');
                        closeAuthModal();
                        renderHeaderAuth();
                        renderMainContent();
                    } else {
                        showToast(data.message || 'Đăng ký thành công! Vui lòng chờ duyệt.');
                        switchAuthTab('login');
                        document.getElementById('login-phone').value = payload.phone;
                        document.getElementById('login-pass').value = payload.password;
                    }
                } else {
                    showToast(data.message || 'Có lỗi xảy ra', true);
                }
            } catch(err) {
                showToast('Lỗi kết nối máy chủ', true);
            } finally {
                btnSubmit.innerHTML = originalHTML;
                btnSubmit.disabled = false;
                lucide.createIcons();
            }
        }

        window.handleLogout = function() {
            state.user = null;
            try { localStorage.removeItem('rfr_user'); } catch(e) {}
            showToast('Đã đăng xuất an toàn');
            renderHeaderAuth();
            renderMainContent();
        }

        // ============ DATA ============
        async function fetchInitialData() {
            initTheme();
            renderHeaderAuth();
            renderSkeleton();
            setSyncStatus(true, 'Đang kết nối...');
            try {
                const response = await fetch(APP_SCRIPT_URL + '?action=getData');
                const result = await response.json();
                if (result.success && result.rooms) {
                    state.rooms = result.rooms;
                    try { localStorage.setItem('rfr_rooms_cache', JSON.stringify(result.rooms)); } catch(e) {}
                }
            } catch(error) {
                let usedCache = false;
                try {
                    const cached = JSON.parse(localStorage.getItem('rfr_rooms_cache') || 'null');
                    if (cached && cached.length) { state.rooms = cached; usedCache = true; }
                } catch(e) {}
                showToast(usedCache ? 'Ngoại tuyến: hiển thị dữ liệu đã lưu' : 'Đang dùng dữ liệu cục bộ', true);
            } finally {
                setSyncStatus(false, '');
                initPriceRangeBounds();
                renderMainContent();
            }
        }

        function setSyncStatus(isLoading, msg) {
            const el = document.getElementById('sync-status');
            const textEl = document.getElementById('sync-text');
            if (!el || !textEl) return;
            if (isLoading) {
                textEl.innerText = msg;
                el.classList.remove('hidden');
                el.classList.add('flex');
            } else {
                el.classList.add('hidden');
                el.classList.remove('flex');
            }
        }

        function renderSkeleton() {
            const container = document.getElementById('main-content');
            if (!container) return;
            let skeletons = '';
            for (let i = 0; i < 8; i++) {
                skeletons += '<div class="glass-panel rounded-[1.5rem] shadow-sm overflow-hidden border border-white/50 dark:border-white/5">'
                    + '<div class="h-44 sm:h-56 skeleton-shimmer w-full"></div>'
                    + '<div class="p-5 space-y-3">'
                    + '<div class="h-5 skeleton-shimmer rounded-lg w-3/4"></div>'
                    + '<div class="h-4 skeleton-shimmer rounded-lg w-1/2"></div>'
                    + '</div></div>';
            }
            container.innerHTML = '<div class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6 xl:gap-8">' + skeletons + '</div>';
        }

        // ============ TAB / NAV ============
        window.setActiveTab = function(tab, btnEl) {
            state.activeTab = tab;
            document.querySelectorAll('.nav-item').forEach(function(el) {
                const isActive = el.getAttribute('data-tab') === tab;
                el.classList.toggle('active', isActive);
                el.classList.toggle('text-red-600', isActive);
                el.classList.toggle('dark:text-red-400', isActive);
                el.classList.toggle('text-slate-400', !isActive);
                el.classList.toggle('dark:text-slate-500', !isActive);
            });
            renderMainContent();
        }

        window.setViewMode = function(mode) {
            state.viewMode = mode;
            try { localStorage.setItem('rfr_viewmode', mode); } catch(e) {}
            renderMainContent();
        }

        // ============ FILTERS ============
        function getRoomTypes() {
            const types = {};
            state.rooms.forEach(function(r) { if (r.type) types[r.type] = true; });
            return Object.keys(types);
        }

        function initPriceRangeBounds() {
            const prices = state.rooms.map(function(r) { return Number(r.price) || 0; });
            const maxFound = prices.length ? Math.max.apply(null, prices) : 20000000;
            const roundedMax = Math.max(1000000, Math.ceil(maxFound / 500000) * 500000);
            const slider = document.getElementById('filter-price-range');
            if (slider) {
                slider.max = roundedMax;
                if (!state.priceFilterActive) { state.maxPrice = roundedMax; slider.value = roundedMax; }
            }
            updatePriceDisplay();
        }

        function updatePriceDisplay() {
            const display = document.getElementById('filter-price-display');
            if (display) display.innerText = state.priceFilterActive ? ('Lên đến ' + formatCurrency(state.maxPrice) + 'đ') : 'Không giới hạn';
        }

        window.onPriceFilterChange = function(val) {
            state.maxPrice = Number(val);
            const slider = document.getElementById('filter-price-range');
            const sliderMax = slider ? Number(slider.max) : 20000000;
            state.priceFilterActive = state.maxPrice < sliderMax;
            updatePriceDisplay();
        }

        window.toggleVideoFilter = function() {
            state.videoOnly = !state.videoOnly;
            const btn = document.getElementById('filter-video-toggle');
            const knob = btn.querySelector('span');
            if (state.videoOnly) {
                btn.classList.remove('bg-slate-300', 'dark:bg-slate-700');
                btn.classList.add('bg-red-600');
                knob.style.transform = 'translateX(20px)';
                btn.setAttribute('aria-checked', 'true');
            } else {
                btn.classList.add('bg-slate-300', 'dark:bg-slate-700');
                btn.classList.remove('bg-red-600');
                knob.style.transform = 'translateX(0px)';
                btn.setAttribute('aria-checked', 'false');
            }
        }

        function renderFilterChips() {
            const statusContainer = document.getElementById('filter-status-chips');
            const typeContainer = document.getElementById('filter-type-chips');
            if (!statusContainer || !typeContainer) return;

            statusContainer.innerHTML = Object.keys(STATUS_CONFIG).map(function(key) {
                const active = state.statusFilters.includes(key);
                const cfg = STATUS_CONFIG[key];
                return '<button onclick="toggleStatusFilterChip(\'' + key + '\')" class="px-4 py-2 rounded-full text-xs font-bold border transition-all flex items-center gap-1.5 whitespace-nowrap active:scale-95 '
                    + (active ? 'bg-red-600 text-white border-red-600 shadow-md shadow-red-500/30' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700')
                    + '"><span class="w-2 h-2 rounded-full ' + cfg.dot + '"></span>' + cfg.label + '</button>';
            }).join('');

            const types = getRoomTypes();
            typeContainer.innerHTML = types.length ? types.map(function(t) {
                const active = state.typeFilters.includes(t);
                return '<button onclick="toggleTypeFilterChip(\'' + t.replace(/'/g, "\\'") + '\')" class="px-4 py-2 rounded-full text-xs font-bold border transition-all whitespace-nowrap active:scale-95 '
                    + (active ? 'bg-red-600 text-white border-red-600 shadow-md shadow-red-500/30' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700')
                    + '">' + t + '</button>';
            }).join('') : '<p class="text-xs text-slate-400 font-medium">Chưa có dữ liệu loại phòng</p>';
        }

        window.toggleStatusFilterChip = function(key) {
            const idx = state.statusFilters.indexOf(key);
            if (idx > -1) state.statusFilters.splice(idx, 1); else state.statusFilters.push(key);
            renderFilterChips();
            updateFilterApplyCount();
        }
        window.toggleTypeFilterChip = function(type) {
            const idx = state.typeFilters.indexOf(type);
            if (idx > -1) state.typeFilters.splice(idx, 1); else state.typeFilters.push(type);
            renderFilterChips();
            updateFilterApplyCount();
        }

        function updateFilterApplyCount() {
            const el = document.getElementById('filter-apply-count');
            if (!el) return;
            const count = getActiveFilterCount();
            el.innerText = count > 0 ? ('Áp dụng (' + count + ')') : 'Áp dụng';
        }

        function getActiveFilterCount() {
            let n = state.statusFilters.length + state.typeFilters.length;
            if (state.priceFilterActive) n += 1;
            if (state.videoOnly) n += 1;
            return n;
        }

        window.openFilterSheet = function() {
            renderFilterChips();
            updatePriceDisplay();
            updateFilterApplyCount();
            openSheet('filter-modal');
        }
        window.closeFilterSheet = function() {
            closeSheet('filter-modal', renderMainContent);
        }
        window.resetFilters = function() {
            state.statusFilters = [];
            state.typeFilters = [];
            state.videoOnly = false;
            state.priceFilterActive = false;
            initPriceRangeBounds();
            const btn = document.getElementById('filter-video-toggle');
            if (btn) {
                btn.classList.add('bg-slate-300', 'dark:bg-slate-700');
                btn.classList.remove('bg-red-600');
                const knob = btn.querySelector('span');
                if (knob) knob.style.transform = 'translateX(0px)';
                btn.setAttribute('aria-checked', 'false');
            }
            renderFilterChips();
            updateFilterApplyCount();
            showToast('Đã đặt lại bộ lọc');
        }

        window.setSearchQuery = function(val) { state.searchQuery = val || ''; renderMainContent(); }

        function applyAllFilters(rooms) {
            return rooms.filter(function(room) {
                const searchTxt = state.searchQuery.toLowerCase();
                const matchesSearch = (room.name || '').toLowerCase().includes(searchTxt) || (room.building || '').toLowerCase().includes(searchTxt);
                const matchesStatus = state.statusFilters.length === 0 || state.statusFilters.includes(room.status);
                const matchesType = state.typeFilters.length === 0 || state.typeFilters.includes(room.type);
                const matchesPrice = !state.priceFilterActive || (Number(room.price) || 0) <= state.maxPrice;
                const matchesVideo = !state.videoOnly || !!room.video;
                return matchesSearch && matchesStatus && matchesType && matchesPrice && matchesVideo;
            });
        }

        // ============ DASHBOARD STATS ============
        function computeStats() {
            const rooms = state.rooms;
            const total = rooms.length;
            const byStatus = { vacant: 0, rented: 0, deposited: 0, maintenance: 0 };
            let totalCommission = 0;
            let totalRentedRevenue = 0;
            rooms.forEach(function(r) {
                if (byStatus[r.status] !== undefined) byStatus[r.status]++;
                const comm = getCommissionInfo(r);
                if (r.status === 'rented' || r.status === 'deposited') {
                    totalCommission += comm.absolute;
                    totalRentedRevenue += Number(r.price) || 0;
                }
            });
            const occupancyRate = total > 0 ? Math.round(((byStatus.rented + byStatus.deposited) / total) * 100) : 0;
            return { total: total, byStatus: byStatus, totalCommission: totalCommission, totalRentedRevenue: totalRentedRevenue, occupancyRate: occupancyRate };
        }

        function renderStatCardsRow() {
            const s = computeStats();
            const cards = [
                { label: 'Tổng số phòng', value: s.total, icon: 'building-2', color: 'from-red-500 to-rose-500' },
                { label: 'Phòng trống', value: s.byStatus.vacant, icon: 'check-circle', color: 'from-emerald-500 to-teal-500' },
                { label: 'Đang thuê', value: s.byStatus.rented, icon: 'home', color: 'from-blue-500 to-cyan-500' },
                { label: 'Đã cọc', value: s.byStatus.deposited, icon: 'clock', color: 'from-amber-500 to-orange-500' },
                { label: 'Tỉ lệ lấp đầy', value: s.occupancyRate + '%', icon: 'trending-up', color: 'from-fuchsia-500 to-pink-500' }
            ];
            if (state.user) {
                cards.push({ label: 'Tổng hoa hồng', value: formatCurrency(s.totalCommission) + 'đ', icon: 'wallet', color: 'from-red-500 to-rose-500', wide: true });
            }
            return '<div class="flex gap-3 overflow-x-auto hide-scrollbar stat-scroller pb-1 -mx-3 px-3 md:mx-0 md:px-0">'
                + cards.map(function(c) {
                    return '<div class="stat-card shrink-0 ' + (c.wide ? 'w-44' : 'w-32') + ' glass-panel rounded-2xl p-4 border border-white/60 dark:border-white/5 shadow-softer">'
                        + '<div class="w-8 h-8 rounded-xl bg-gradient-to-tr ' + c.color + ' flex items-center justify-center mb-3 shadow-sm"><i data-lucide="' + c.icon + '" class="w-4 h-4 text-white"></i></div>'
                        + '<p class="text-lg font-black text-slate-800 dark:text-white tabular leading-tight">' + c.value + '</p>'
                        + '<p class="text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mt-1">' + c.label + '</p>'
                        + '</div>';
                }).join('')
                + '</div>';
        }

        function renderStatsPage() {
            const s = computeStats();
            const statusRows = Object.keys(STATUS_CONFIG).map(function(key) {
                const cfg = STATUS_CONFIG[key];
                const count = s.byStatus[key] || 0;
                const pct = s.total > 0 ? Math.round((count / s.total) * 100) : 0;
                return '<div class="flex items-center gap-3">'
                    + '<span class="w-2.5 h-2.5 rounded-full ' + cfg.dot + ' shrink-0"></span>'
                    + '<span class="text-sm font-semibold text-slate-700 dark:text-slate-300 w-24 shrink-0">' + cfg.label + '</span>'
                    + '<div class="flex-1 h-2 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden"><div class="h-full ' + cfg.dot + ' rounded-full transition-all" style="width:' + pct + '%"></div></div>'
                    + '<span class="text-sm font-bold text-slate-800 dark:text-white tabular w-10 text-right">' + count + '</span>'
                    + '</div>';
            }).join('');

            const commissionCard = state.user ? (
                '<div class="glass-panel rounded-3xl p-6 border border-white/60 dark:border-white/5 shadow-softer bg-gradient-to-br from-red-50 to-rose-50 dark:from-red-900/10 dark:to-rose-900/10">'
                + '<p class="text-xs font-bold uppercase tracking-wider text-red-600 dark:text-red-400 mb-2">Tổng hoa hồng dự kiến (phòng thuê + đã cọc)</p>'
                + '<p class="text-3xl font-black text-slate-800 dark:text-white tabular">' + formatCurrency(s.totalCommission) + 'đ</p>'
                + '</div>'
            ) : (
                '<div class="glass-panel rounded-3xl p-6 border border-white/60 dark:border-white/5 shadow-softer text-center">'
                + '<i data-lucide="lock" class="w-6 h-6 text-slate-400 mx-auto mb-2"></i>'
                + '<p class="text-sm font-semibold text-slate-500 dark:text-slate-400">Đăng nhập để xem tổng hoa hồng</p>'
                + '<button onclick="openAuthModal(\'login\')" class="mt-3 px-4 py-2 bg-red-600 text-white rounded-xl text-xs font-bold active:scale-95 whitespace-nowrap">Đăng nhập ngay</button>'
                + '</div>'
            );

            return '<div class="space-y-5 pt-2">'
                + '<div>'
                + '<h1 class="text-2xl font-black font-display text-slate-800 dark:text-white mb-1">Thống kê tổng quan</h1>'
                + '<p class="text-sm text-slate-500 dark:text-slate-400">Cập nhật theo dữ liệu hiện có trong hệ thống</p>'
                + '</div>'
                + renderStatCardsRow()
                + '<div class="glass-panel rounded-3xl p-6 border border-white/60 dark:border-white/5 shadow-softer">'
                + '<h3 class="font-bold text-slate-800 dark:text-white mb-4 flex items-center gap-2"><i data-lucide="pie-chart" class="w-4 h-4 text-red-500"></i> Phân bố trạng thái</h3>'
                + '<div class="space-y-3">' + statusRows + '</div>'
                + '</div>'
                + commissionCard
                + '</div>';
        }

        // ============ ROOM CARD RENDER (grid + list) ============
        function buildRoomCard(room, index, mode) {
            const mainImage = (room.images && room.images.length > 0) ? room.images[0] : 'https://placehold.co/600x400/1e293b/475569?text=Alpha+Zone';
            let commissionHTML = '';
            if (state.user) {
                const commInfo = getCommissionInfo(room);
                commissionHTML = '<div class="flex justify-between items-center pt-3 mt-2 border-t border-slate-200/50 dark:border-slate-700/50">'
                    + '<span class="text-slate-500 dark:text-slate-400 text-[10px] font-extrabold uppercase tracking-wider flex items-center gap-1.5"><i data-lucide="gift" class="w-3.5 h-3.5 text-emerald-500"></i> Hoa hồng</span>'
                    + '<span class="font-extrabold text-emerald-600 dark:text-emerald-400 bg-emerald-100/50 dark:bg-emerald-500/10 px-2.5 py-1 rounded-lg text-sm shadow-sm border border-emerald-200/50 dark:border-emerald-500/20">' + commInfo.display + '</span>'
                    + '</div>';
            }
            const videoIcon = room.video ? '<div class="absolute bottom-3 right-3 z-10 bg-black/40 backdrop-blur-md text-white p-1.5 md:p-2 rounded-xl border border-white/20"><i data-lucide="video" class="w-3.5 h-3.5 md:w-4 md:h-4"></i></div>' : '';
            const isBookmarked = state.bookmarks.includes(room.id);

            if (mode === 'list') {
                return '<div class="card-enter glass-panel rounded-2xl hover:shadow-glow transition-all duration-400 cursor-pointer overflow-hidden group flex relative border border-white/60 dark:border-white/5" style="animation-delay:' + delay + 'ms" onclick="openRoomDetails(\'' + room.id + '\')">'
                    + '<div class="w-28 sm:w-36 shrink-0 relative overflow-hidden">'
                    + '<img src="' + mainImage + '" class="w-full h-full object-cover absolute inset-0 group-hover:scale-105 transition-transform duration-700" onerror="this.src=\'https://placehold.co/600x400/1e293b/475569?text=No+Image\'">'
                    + '<div class="absolute inset-0" style="padding-top:100%"></div>'
                    + videoIcon
                    + '</div>'
                    + '<div class="flex-1 p-3.5 flex flex-col min-w-0">'
                    + '<div class="flex items-start justify-between gap-2 mb-1">' + getBadgeHTML(room.status, 'sm') + '<button onclick="toggleBookmark(\'' + room.id + '\', event)" class="text-slate-300 dark:text-slate-600 hover:text-rose-500 transition-colors shrink-0"><i data-lucide="heart" class="w-4 h-4 ' + (isBookmarked ? 'fill-rose-500 text-rose-500' : '') + '"></i></button></div>'
                    + '<h3 class="font-extrabold text-sm text-slate-800 dark:text-white leading-snug line-clamp-2 group-hover:text-red-600 dark:group-hover:text-red-400 transition-colors">' + (room.name || '') + '</h3>'

                    + '<div class="mt-auto flex items-end justify-between pt-2">'
                    + '<span class="font-black text-red-600 dark:text-red-400 text-base tabular whitespace-nowrap">' + formatCurrency(room.price) + 'đ</span>'
                    + (state.user ? '<span class="font-bold text-emerald-600 dark:text-emerald-400 text-xs bg-emerald-100/50 dark:bg-emerald-500/10 px-2 py-0.5 rounded-lg">' + getCommissionInfo(room).display + '</span>' : '')
                    + '</div></div></div>';
            }

            return '<div class="card-enter glass-panel rounded-[1.5rem] hover:-translate-y-1.5 hover:shadow-glow transition-all duration-500 cursor-pointer overflow-hidden group flex flex-col relative border border-white/60 dark:border-white/5" style="animation-delay:' + delay + 'ms" onclick="openRoomDetails(\'' + room.id + '\')">'
                + '<button onclick="toggleBookmark(\'' + room.id + '\', event)" class="absolute top-3 right-3 md:top-4 md:right-4 z-20 p-2 md:p-2.5 rounded-full bg-white/30 dark:bg-black/30 backdrop-blur-md text-white hover:bg-white/50 dark:hover:bg-black/50 transition-all active:scale-90 border border-white/20">'
                + '<i data-lucide="heart" class="w-4 h-4 md:w-5 md:h-5 ' + (isBookmarked ? 'fill-rose-500 text-rose-500' : '') + '"></i>'
                + '</button>'
                + '<div class="image-container m-1.5 md:m-2 rounded-[1.1rem] md:rounded-[1.2rem] shadow-inner">'
                + '<img src="' + mainImage + '" class="group-hover:scale-105 transition-transform duration-700 ease-out" onerror="this.src=\'https://placehold.co/600x400/1e293b/475569?text=No+Image\'">'
                + '<div class="absolute top-2.5 left-2.5 md:top-3 md:left-3 z-10">' + getBadgeHTML(room.status, 'sm') + '</div>'
                + videoIcon
                + '</div>'
                + '<div class="p-3.5 md:p-5 flex-1 flex flex-col">'
                + '<h3 class="font-extrabold text-sm md:text-lg text-slate-800 dark:text-white leading-snug line-clamp-2 mb-1.5 md:mb-2 group-hover:text-red-600 dark:group-hover:text-red-400 transition-colors">' + (room.name || '') + '</h3>'

                + '<div class="mt-auto space-y-2 md:space-y-3">'
                + '<div class="flex justify-between items-center">'
                + '<span class="text-slate-500 dark:text-slate-400 text-[10px] md:text-xs font-semibold uppercase tracking-wider">Loại phòng</span>'

                + '<span class="font-black text-red-600 dark:text-red-400 text-base md:text-lg tabular whitespace-nowrap">' + formatCurrency(room.price) + 'đ</span>'
                + '</div>'
                + commissionHTML
                + '</div></div></div>';
        }

        // ============ MAIN RENDER ============

            const container = document.getElementById('main-content');
            if (!container) return;

            updateBookmarkBadge();

            if (state.activeTab === 'stats') {
                container.innerHTML = renderStatsPage();
                lucide.createIcons();
                return;
            }

            let sourceRooms = state.rooms;
            if (state.activeTab === 'bookmarks') {
                sourceRooms = state.rooms.filter(function(r) { return state.bookmarks.includes(r.id); });
            }
            const filteredRooms = applyAllFilters(sourceRooms);

            const roomsHTML = filteredRooms.map(function(room, index) {
                return buildRoomCard(room, index, state.viewMode);
            }).join('');

            const isBookmarksEmpty = state.activeTab === 'bookmarks' && sourceRooms.length === 0;
            const emptyHTML = '<div class="col-span-full py-20 text-center">'
                + '<div class="w-20 h-20 mx-auto mb-5 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center border border-slate-200 dark:border-slate-700 shadow-inner">'
                + '<i data-lucide="' + (isBookmarksEmpty ? 'heart' : 'search-x') + '" class="w-9 h-9 text-slate-400 dark:text-slate-500"></i></div>'

            const searchVal = (state.searchQuery || '').replace(/"/g, '&quot;');
            const filterCount = getActiveFilterCount();
            const heading = state.activeTab === 'bookmarks' ? 'Phòng đã lưu' : 'Không gian nổi bật';

            const gridClass = state.viewMode === 'list'
                ? 'flex flex-col gap-3'
                : 'grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 md:gap-6 xl:gap-8';

            container.innerHTML = '<div class="space-y-4 md:space-y-6">'
                + (state.activeTab === 'home' ? renderStatCardsRow() : '')
                + '<div>'
                + '<div class="flex items-center justify-between mb-3 px-1">'

                + '<div class="flex items-center gap-2">'
                + '<button onclick="setViewMode(\'grid\')" class="w-8 h-8 rounded-lg flex items-center justify-center transition-all ' + (state.viewMode === 'grid' ? 'bg-red-600 text-white shadow-md' : 'bg-white/50 dark:bg-slate-800/50 text-slate-400') + '"><i data-lucide="layout-grid" class="w-4 h-4"></i></button>'
                + '<button onclick="setViewMode(\'list\')" class="w-8 h-8 rounded-lg flex items-center justify-center transition-all ' + (state.viewMode === 'list' ? 'bg-red-600 text-white shadow-md' : 'bg-white/50 dark:bg-slate-800/50 text-slate-400') + '"><i data-lucide="list" class="w-4 h-4"></i></button>'
                + '</div></div>'
                + '<div class="glass-panel p-1.5 md:p-2 rounded-[1.5rem] md:rounded-[2rem] shadow-soft flex items-center gap-2 border border-white/60 dark:border-white/10 relative z-20 mb-4 md:mb-6">'
                + '<div class="flex-1 w-full relative flex items-center pl-2 md:pl-4">'
                + '<i data-lucide="search" class="w-4 h-4 md:w-5 md:h-5 text-red-500 absolute left-4 md:left-6"></i>'
                + '<input type="text" placeholder="Tìm kiếm không gian..." class="w-full pl-9 md:pl-12 pr-2 py-2.5 md:py-3.5 bg-transparent border-none focus:ring-0 text-slate-800 dark:text-white placeholder-slate-400 font-medium text-sm md:text-base outline-none" value="' + searchVal + '" oninput="window.setSearchQuery(this.value)">'
                + '</div>'
                + '<button onclick="openFilterSheet()" class="relative shrink-0 w-10 h-10 md:w-12 md:h-12 flex items-center justify-center rounded-full bg-white/50 dark:bg-slate-800/50 border border-white/60 dark:border-slate-700 text-red-600 dark:text-red-400 shadow-sm active:scale-90 transition-all">'
                + '<i data-lucide="sliders-horizontal" class="w-4 h-4 md:w-5 md:h-5"></i>'
                + (filterCount > 0 ? '<span class="absolute -top-1 -right-1 w-4 h-4 bg-rose-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center">' + filterCount + '</span>' : '')
                + '</button>'
                + '<div class="hidden md:flex items-center justify-center w-12 h-12 bg-red-600 text-white rounded-full shadow-lg shadow-red-500/30 font-black text-sm shrink-0">' + filteredRooms.length + '</div>'
                + '</div>'
                + '<div class="' + gridClass + '">'
                + (roomsHTML || emptyHTML)
                + '</div></div></div>';

            lucide.createIcons();
        }

        function updateBookmarkBadge() {
            const badge = document.getElementById('bookmark-count-badge');
            if (!badge) return;
            const count = state.bookmarks.length;
            if (count > 0) {
                badge.innerText = count > 9 ? '9+' : String(count);
                badge.classList.remove('hidden');
                badge.classList.add('flex');
            } else {
                badge.classList.add('hidden');
                badge.classList.remove('flex');
            }
        }

        // ============ ROOM DETAILS ============
        window.openRoomDetails = function(roomId) {
            const room = state.rooms.find(function(r) { return r.id === roomId; });
            if (!room) return;
            state.viewingRoomId = roomId;

            document.getElementById('detail-title').innerText = room.name || '';
            document.getElementById('detail-address').innerText = room.building || '';
            document.getElementById('detail-price').innerText = formatCurrency(room.price) + 'đ/tháng';
            document.getElementById('detail-type').innerText = room.type || '';
            document.getElementById('detail-description').innerText = room.description || 'Chưa cập nhật nội dung.';
            document.getElementById('detail-status-badge').innerHTML = getBadgeHTML(room.status);

            const btnBookmark = document.getElementById('btn-modal-bookmark');
            const isBookmarked = state.bookmarks.includes(room.id);
            btnBookmark.innerHTML = '<i data-lucide="heart" class="w-5 h-5 ' + (isBookmarked ? 'fill-rose-500 text-rose-500' : '') + '"></i>';
            btnBookmark.onclick = function(e) { toggleBookmark(room.id, e); };

            const commContainer = document.getElementById('detail-comm-container');
            const shareContainer = document.getElementById('smart-share-container');

            const zaloBtnHTML = '<a href="https://zalo.me/0879342346" target="_blank" rel="noopener noreferrer" class="w-full mt-2 py-3 bg-[#0068FF] hover:bg-[#0054cc] text-white rounded-xl text-sm font-bold shadow-md shadow-blue-500/30 transition-all active:scale-[0.98] flex items-center justify-center gap-2 whitespace-nowrap">'
                + '<div class="w-5 h-5 bg-white rounded-full flex items-center justify-center text-[#0068FF] font-black text-[10px]">Z</div>'
                + 'Chat Zalo: 0879.342.346</a>';

            if (state.user) {
                const commInfo = getCommissionInfo(room);
                const editBtn = state.user.role === 'admin'
                    ? '<button onclick="openCommissionModal(\'' + room.id + '\', event)" class="text-red-500 hover:text-red-600 bg-red-50 dark:bg-red-500/10 p-2 rounded-xl transition-colors active:scale-95 shrink-0"><i data-lucide="edit-3" class="w-5 h-5"></i></button>'
                    : '';
                
                /* TẠO HÀNG ĐỢI CUỘN NGANG KHI TRÀN BỞI THUỘC TÍNH FLEX-WRAP & OVERFLOW */
                commContainer.innerHTML = '<p class="text-emerald-600 dark:text-emerald-400 text-xs font-bold uppercase tracking-wider mb-1 text-left sm:text-right">Hoa hồng</p>'
                    + '<div class="flex items-center gap-2 justify-start sm:justify-end max-w-full">'
                    + '<div class="overflow-x-auto hide-scrollbar">'
                    + '<p class="text-base md:text-lg font-black text-emerald-600 dark:text-emerald-400 bg-emerald-100/50 dark:bg-emerald-500/10 px-3 py-1 rounded-xl whitespace-nowrap tabular">' + commInfo.fullText + '</p>'
                    + '</div>'
                    + editBtn + '</div>';
                    
                shareContainer.innerHTML = '<div class="text-[11px] font-extrabold text-slate-500 dark:text-slate-400 uppercase tracking-widest flex items-center gap-2 mb-1"><i data-lucide="wand-2" class="w-4 h-4 text-red-500"></i> AI Smart Copy</div>'
                    + '<div class="flex gap-3">'
                    + '<button onclick="shareRoomSmart(\'standard\')" class="flex-1 py-3 bg-white dark:bg-slate-800 border border-slate-200/50 dark:border-slate-700/50 text-slate-700 dark:text-white rounded-xl text-sm font-bold hover:border-red-500 hover:text-red-600 dark:hover:text-red-400 shadow-sm transition-all whitespace-nowrap active:scale-[0.98]">Bản tiêu chuẩn</button>'
                    + '<button onclick="shareRoomSmart(\'sales\')" class="flex-1 py-3 bg-white dark:bg-slate-800 border border-slate-200/50 dark:border-slate-700/50 text-slate-700 dark:text-white rounded-xl text-sm font-bold hover:border-red-500 hover:text-red-600 dark:hover:text-red-400 shadow-sm transition-all whitespace-nowrap active:scale-[0.98]">Bản bán hàng</button>'
                    + '</div>' + zaloBtnHTML;
            } else {
                commContainer.innerHTML = '<button onclick="openAuthModal(\'login\'); closeRoomDetails();" class="text-red-500 hover:text-red-600 text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 bg-red-50 dark:bg-red-500/10 px-4 py-2 rounded-xl active:scale-95 whitespace-nowrap"><i data-lucide="lock" class="w-4 h-4"></i> Đăng nhập xem HH</button>';
                shareContainer.innerHTML = '<div class="text-center py-2 text-slate-500 text-sm font-medium"><i data-lucide="lock" class="w-4 h-4 inline-block mb-1"></i> Tính năng Share bài yêu cầu đăng nhập</div>' + zaloBtnHTML;
            }

            const mediaContainer = document.getElementById('main-media-container');
            const thumbGallery = document.getElementById('thumbnail-gallery');
            thumbGallery.innerHTML = '';

            if (room.video) {
                thumbGallery.innerHTML += '<div onclick="setMainMedia(\'video\', \'' + room.video + '\')" class="h-full aspect-square flex-shrink-0 cursor-pointer rounded-xl overflow-hidden border-2 border-transparent hover:border-red-500 opacity-70 hover:opacity-100 transition-all relative flex items-center justify-center bg-slate-900 group"><i data-lucide="play-circle" class="w-8 h-8 text-white group-hover:scale-110 transition-transform"></i></div>';
            }
            if (room.images && room.images.length > 0) {
                room.images.forEach(function(imgUrl) {
                    thumbGallery.innerHTML += '<div onclick="setMainMedia(\'image\', \'' + imgUrl + '\')" class="h-full aspect-square flex-shrink-0 cursor-pointer rounded-xl overflow-hidden border-2 border-transparent hover:border-red-500 opacity-70 hover:opacity-100 transition-all"><img src="' + imgUrl + '" class="w-full h-full object-cover"></div>';
                });
            }

            if (room.video) setMainMedia('video', room.video);
            else if (room.images && room.images.length > 0) setMainMedia('image', room.images[0]);
            else {
                thumbGallery.innerHTML = '<p class="text-xs text-slate-500 font-medium w-full text-center py-4">Không có phương tiện</p>';
                mediaContainer.innerHTML = '<div class="flex flex-col items-center text-slate-400 dark:text-slate-600"><i data-lucide="image-off" class="w-16 h-16 mb-2 opacity-50"></i><p class="font-bold">Chưa có hình ảnh</p></div>';
            }

            openSheet('details-modal');
        }

        window.setMainMedia = function(type, url) {
            const container = document.getElementById('main-media-container');
            if (!container) return;
            if (type === 'video') {
                container.innerHTML = '<video controls class="w-full h-full object-contain outline-none" autoplay muted><source src="' + url + '" type="video/mp4"></video>';
            } else {
                container.innerHTML = '<img src="' + url + '" class="w-full h-full object-contain">';
            }
        }

        window.closeRoomDetails = function() {
            closeSheet('details-modal', function() {
                state.viewingRoomId = null;
                const mc = document.getElementById('main-media-container');
                if (mc) mc.innerHTML = '';
            });
        }

        window.openLightbox = function(el) {
            if (!el) return;
            const content = el.innerHTML;
            if (!content.includes('img') && !content.includes('video')) return;
            document.getElementById('lightbox-content').innerHTML = content;
            document.getElementById('lightbox').classList.remove('hidden');
        }
        window.closeLightbox = function() {
            document.getElementById('lightbox-content').innerHTML = '';
            document.getElementById('lightbox').classList.add('hidden');
        }

        window.toggleBookmark = function(roomId, e) {
            if (e) e.stopPropagation();
            if (state.bookmarks.includes(roomId)) {
                state.bookmarks = state.bookmarks.filter(function(id) { return id !== roomId; });
                showToast('Đã bỏ lưu phòng');
            } else {
                state.bookmarks.push(roomId);
                showToast('Đã thêm vào mục Yêu thích', false, 'heart');
            }
            try { localStorage.setItem('rfr_bookmarks', JSON.stringify(state.bookmarks)); } catch(e) {}
            renderMainContent();
            if (state.viewingRoomId === roomId) {
                const bmBtn = document.getElementById('btn-modal-bookmark');
                if (bmBtn) {
                    const isBookmarked = state.bookmarks.includes(roomId);
                    bmBtn.innerHTML = '<i data-lucide="heart" class="w-5 h-5 ' + (isBookmarked ? 'fill-rose-500 text-rose-500' : '') + '"></i>';
                    lucide.createIcons();
                }
            }
        }

        window.openMap = function() {
            if (!state.viewingRoomId) return;
            const room = state.rooms.find(function(r) { return r.id === state.viewingRoomId; });
            if (room && room.building) window.open('http://maps.google.com/?q=' + encodeURIComponent(room.building), '_blank');
        }

        window.shareRoomSmart = function(tone) {
            if (!state.viewingRoomId) return;
            const room = state.rooms.find(function(r) { return r.id === state.viewingRoomId; });
            if (!room) return;
            const commInfo = getCommissionInfo(room);
            let postContent = '';
            const statusLabel = (STATUS_CONFIG[room.status] && STATUS_CONFIG[room.status].label) || 'Trống';
            if (tone === 'standard') {
                postContent = '📣 CHO THUÊ PHÒNG: ' + room.name + '\n📍 Địa chỉ: ' + room.building + '\n🛋️ Loại: ' + room.type + '\n💰 Giá: ' + formatCurrency(room.price) + 'đ/tháng\n✨ Trạng thái: ' + statusLabel + '\n📝 Mô tả: ' + (room.description || '') + '\n🎁 Hoa hồng MG: ' + commInfo.fullText + '\n📞 Liên hệ ngay!';
            } else {
                postContent = '🔥 GÓC SIÊU PHẨM GIÁ TỐT NHẤT KHU VỰC 🔥\n\nChính chủ cần cho thuê gấp [ ' + room.name + ' ] tại ' + room.building + '.\n💎 Thiết kế hiện đại, phân khúc ' + room.type + '.\n💸 Mức giá cực mềm chỉ: ' + formatCurrency(room.price) + 'đ/tháng.\n\n📍 Tiện ích đầy đủ, xách vali vào ở ngay!\n🤝 Anh em Môi Giới đẩy giúp, hoa hồng gửi thẳng: ' + commInfo.fullText + '.\n📲 Inbox hoặc Alo ngay để chốt deal!';
            }
            const textArea = document.createElement('textarea');
            textArea.value = postContent;
            textArea.style.cssText = 'position:fixed;left:-9999px;top:0';
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('Đã copy nội dung: ' + (tone === 'standard' ? 'Tiêu chuẩn' : 'Bán hàng'));
            } catch(err) {
                showToast('Không thể copy', true);
            }
            document.body.removeChild(textArea);
        }

        // COMMISSION
        window.openCommissionModal = function(roomId, event) {
            if (event) event.stopPropagation();
            const room = state.rooms.find(function(r) { return r.id === roomId; });
            if (!room) return;
            state.editingRoomId = roomId;
            state.commEditType = room.commissionType || 'percent';
            document.getElementById('commission-input').value = room.commissionValue || 0;
            updateCommissionModalUI();
            previewCommission();
            openSheet('commission-modal');
        }
        window.closeCommissionModal = function() {
            closeSheet('commission-modal', function() { state.editingRoomId = null; });
        }
        window.setCommissionType = function(type) {
            state.commEditType = type;
            updateCommissionModalUI();
            previewCommission();
        }

        function updateCommissionModalUI() {
            const isPercent = state.commEditType === 'percent';
            const activeClass = 'flex-1 py-2 text-sm font-bold rounded-lg whitespace-nowrap transition-all bg-white dark:bg-slate-700 text-red-600 dark:text-white shadow-sm';
            const inactiveClass = 'flex-1 py-2 text-sm font-bold rounded-lg whitespace-nowrap transition-all text-slate-500 dark:text-slate-400 hover:bg-white/50 dark:hover:bg-slate-700/50';
            document.getElementById('btn-type-percent').className = isPercent ? activeClass : inactiveClass;
            document.getElementById('btn-type-fixed').className = !isPercent ? activeClass : inactiveClass;
        }

        window.previewCommission = function() {
            if (!state.editingRoomId) return;
            const room = state.rooms.find(function(r) { return r.id === state.editingRoomId; });
            if (!room) return;
            const inputVal = parseFloat(document.getElementById('commission-input').value) || 0;
            const price = Number(room.price) || 0;
            const absoluteVal = state.commEditType === 'percent' ? (price * inputVal) / 100 : inputVal;
            document.getElementById('comm-preview').innerText = formatCurrency(absoluteVal) + 'đ';
        }

        window.saveCommission = function() {
            const inputVal = parseFloat(document.getElementById('commission-input').value);
            if (isNaN(inputVal) || inputVal < 0) { showToast('Giá trị không hợp lệ', true); return; }
            state.rooms = state.rooms.map(function(r) {
                return r.id === state.editingRoomId ? Object.assign({}, r, { commissionType: state.commEditType, commissionValue: inputVal }) : r;
            });
            const editedId = state.editingRoomId;
            showToast('Lưu hoa hồng thành công');
            closeCommissionModal();
            if (state.viewingRoomId === editedId) openRoomDetails(state.viewingRoomId);
            renderMainContent();
            fetch(APP_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'updateCommission', roomId: editedId, commissionType: state.commEditType, commissionValue: inputVal })
            }).catch(function(e) { console.error('Lỗi lưu:', e); });
        }

        // ============ PWA INSTALL ============
        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            deferredInstallPrompt = e;
            const btn = document.getElementById('btn-install-pwa');
            if (btn) { btn.classList.remove('hidden'); btn.classList.add('flex'); }
        });
        window.triggerInstallPWA = async function() {
            if (!deferredInstallPrompt) { showToast('Trình duyệt không hỗ trợ cài đặt'); return; }
            deferredInstallPrompt.prompt();
            const choice = await deferredInstallPrompt.userChoice;
            if (choice.outcome === 'accepted') showToast('Đang cài đặt ứng dụng...');
            deferredInstallPrompt = null;
            const btn = document.getElementById('btn-install-pwa');
            if (btn) { btn.classList.add('hidden'); btn.classList.remove('flex'); }
        }
        window.addEventListener('appinstalled', function() {
            showToast('Đã cài đặt Alpha Zone thành công!');
        });

        // Basic offline detection
        window.addEventListener('offline', function() { showToast('Mất kết nối mạng — chế độ ngoại tuyến', true); });
        window.addEventListener('online', function() { showToast('Đã có kết nối trở lại'); });

        document.addEventListener('DOMContentLoaded', fetchInitialData);
    </script>
</body>
</html>
