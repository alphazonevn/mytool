<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFR+ Quản lý phòng cho thuê</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="flex h-screen bg-slate-50 font-sans text-slate-900 overflow-hidden">

    <aside class="w-64 bg-indigo-900 text-white flex flex-col shadow-xl z-10 flex-shrink-0">
        <div class="p-6 flex items-center gap-3 border-b border-indigo-800">
            <div class="w-10 h-10 bg-gradient-to-br from-blue-400 to-indigo-500 rounded-xl flex items-center justify-center font-bold text-xl shadow-lg">R+</div>
            <div>
                <h1 class="font-bold text-lg tracking-wide">RFR+ Space</h1>
                <p class="text-indigo-300 text-xs">Quản lý phòng cho thuê</p>
            </div>
        </div>
        <nav class="flex-1 py-6 px-4 space-y-2" id="sidebar-nav"></nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 z-0 flex-shrink-0">
            <div class="flex items-center gap-4">
                <h2 class="text-xl font-semibold text-slate-800" id="header-title">Bảng điều khiển</h2>
                <div id="sync-status" class="hidden items-center gap-2 px-3 py-1 bg-indigo-50 text-indigo-600 text-xs font-medium rounded-full">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5 animate-spin"></i> <span id="sync-text">Đang đồng bộ...</span>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <div class="flex items-center bg-slate-100 p-1 rounded-lg border border-slate-200">
                    <button onclick="setRole('seller')" id="btn-seller" class="px-3 py-1.5 text-sm font-medium rounded-md transition-all">Quản lý</button>
                    <button onclick="setRole('ctv')" id="btn-ctv" class="px-3 py-1.5 text-sm font-medium rounded-md transition-all">CTV</button>
                </div>
                <div id="user-avatar" class="w-9 h-9 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center font-bold">AD</div>
            </div>
        </header>

        <div class="flex-1 overflow-auto p-8 bg-slate-50" id="main-content"></div>
    </main>

    <script>
        const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyFNcPegzZmE0QRLrPGKtOLX_p-rB8dL-erafixgikvXbDg6BG_ehdmqLSxxyrIIMvl0g/exec';
        let state = {
            role: 'seller',
            activeTab: 'dashboard',
            rooms: [],
            ctvs: []
        };

        async function initApp() {
            renderSidebar();
            renderMainContent();
            fetchData();
        }

        async function fetchData() {
            document.getElementById('sync-status').classList.remove('hidden');
            try {
                const response = await fetch(`${APP_SCRIPT_URL}?action=getData`);
                const data = await response.json();
                if (data.rooms) state.rooms = data.rooms;
                if (data.ctvs) state.ctvs = data.ctvs;
                renderMainContent();
            } catch (e) {
                console.error("Lỗi tải dữ liệu:", e);
            } finally {
                document.getElementById('sync-status').classList.add('hidden');
            }
        }

        function setRole(role) {
            state.role = role;
            renderSidebar();
            renderMainContent();
        }

        function renderSidebar() {
            const nav = document.getElementById('sidebar-nav');
            document.getElementById('btn-seller').className = state.role === 'seller' ? 'px-3 py-1.5 text-sm font-medium rounded-md bg-white text-indigo-600 shadow-sm' : 'px-3 py-1.5 text-sm text-slate-500';
            document.getElementById('btn-ctv').className = state.role === 'ctv' ? 'px-3 py-1.5 text-sm font-medium rounded-md bg-white text-indigo-600 shadow-sm' : 'px-3 py-1.5 text-sm text-slate-500';
            
            nav.innerHTML = `
                <button onclick="state.activeTab='dashboard'; renderMainContent()" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-indigo-800 text-indigo-200">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Tổng quan
                </button>
                <button onclick="state.activeTab='rooms'; renderMainContent()" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-indigo-800 text-indigo-200">
                    <i data-lucide="home" class="w-5 h-5"></i> Phòng cho thuê
                </button>
            `;
            lucide.createIcons();
        }

        function renderMainContent() {
            const container = document.getElementById('main-content');
            container.innerHTML = `<div class="text-center py-10">Đang tải nội dung...</div>`;
            
            setTimeout(() => {
                container.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${state.rooms.map(r => `
                            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                                <h3 class="font-bold text-lg">${r.name || 'Phòng mẫu'}</h3>
                                <p class="text-sm text-slate-500">${r.building || 'Chưa cập nhật'}</p>
                                <div class="mt-4 flex justify-between items-center">
                                    <span class="text-indigo-600 font-bold">${(r.price || 0).toLocaleString()}đ</span>
                                    <span class="px-2 py-1 bg-green-100 text-green-700 rounded text-xs uppercase">${r.status || 'Trống'}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                lucide.createIcons();
            }, 500);
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
