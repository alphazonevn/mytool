<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFR+ Danh sách phòng</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Tùy chỉnh thanh cuộn */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px;}
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Toast notification animation */
        @keyframes slideInUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .toast-enter { animation: slideInUp 0.3s ease-out forwards; }
        .toast-leave { animation: fadeOut 0.3s ease-in forwards; }
        .modal-enter { animation: fadeInScale 0.2s ease-out forwards; }
        
        /* Aspect ratio cho ảnh card */
        .image-container { position: relative; padding-bottom: 60%; overflow: hidden; }
        .image-container img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body class="flex flex-col h-screen bg-slate-50 font-sans text-slate-900 overflow-hidden">

    <!-- Header -->
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 z-10 flex-shrink-0 shadow-sm w-full">
        <div class="flex items-center gap-4">
            <h2 class="text-xl font-bold text-slate-800">Danh sách phòng</h2>
            <div id="sync-status" class="hidden items-center gap-2 px-3 py-1 bg-indigo-50 text-indigo-600 text-xs font-medium rounded-full">
                <i data-lucide="clock" class="w-3.5 h-3.5 animate-spin"></i> <span id="sync-text">Đang tải dữ liệu...</span>
            </div>
        </div>

        <div class="flex items-center gap-6">
            <button class="relative text-slate-400 hover:text-slate-600">
                <i data-lucide="bell" class="w-5 h-5"></i>
                <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-500 border-2 border-white rounded-full"></span>
            </button>

            <div class="flex items-center gap-3 border-l border-slate-200 pl-6">
                <div id="user-avatar" class="w-9 h-9 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center font-bold">
                    AD
                </div>
                <div class="text-sm">
                    <p id="user-name" class="font-semibold text-slate-700">Admin System</p>
                    <p id="user-desc" class="text-slate-500 text-xs">Quản lý chi nhánh</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-auto p-4 md:p-8 bg-slate-50 relative w-full">
        <div id="main-content" class="max-w-7xl mx-auto pb-20">
            <!-- Nội dung sẽ được render bằng JS -->
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Modal cập nhật hoa hồng -->
    <div id="commission-modal" class="hidden fixed inset-0 bg-slate-900/50 z-[60] flex items-center justify-center backdrop-blur-sm transition-opacity p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden modal-enter">
            <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center bg-white">
                <h3 class="font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="wallet" class="w-4 h-4 text-indigo-500"></i> Cập nhật Hoa hồng
                </h3>
                <button onclick="closeCommissionModal()" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-5 space-y-4 bg-white">
                <div class="flex p-1 bg-slate-100 rounded-lg">
                    <button id="btn-type-percent" onclick="setCommissionType('percent')" class="flex-1 py-1.5 text-sm font-medium rounded-md bg-white shadow-sm text-indigo-600 transition-all">Theo Tỉ lệ (%)</button>
                    <button id="btn-type-fixed" onclick="setCommissionType('fixed')" class="flex-1 py-1.5 text-sm font-medium rounded-md text-slate-500 hover:text-slate-700 transition-all">Tiền mặt (VNĐ)</button>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2" id="comm-label">Tỉ lệ hoa hồng (%)</label>
                    <div class="relative">
                        <input type="number" id="commission-input" class="w-full pl-3 pr-12 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 font-medium" oninput="previewCommission()">
                        <span id="comm-suffix" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 font-medium">%</span>
                    </div>
                    <div class="mt-2 text-sm text-slate-600 bg-indigo-50 p-2.5 rounded-lg flex items-center justify-between border border-indigo-100">
                        <span>Thực nhận:</span>
                        <span id="comm-preview" class="font-bold text-indigo-700">0đ</span>
                    </div>
                </div>
            </div>
            <div class="px-5 py-4 bg-slate-50 border-t border-slate-100 flex justify-end gap-3">
                <button onclick="closeCommissionModal()" class="px-4 py-2 bg-white border border-slate-200 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-50 transition-colors">Hủy</button>
                <button onclick="saveCommission()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 shadow-sm transition-colors flex items-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i> Lưu lại
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Xem Chi Tiết Phòng -->
    <div id="details-modal" class="hidden fixed inset-0 bg-slate-900/70 z-[55] flex items-center justify-center backdrop-blur-sm p-4 md:p-6">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl h-[90vh] flex flex-col overflow-hidden modal-enter relative">
            
            <!-- Close Button Overlay -->
            <button onclick="closeRoomDetails()" class="absolute top-4 right-4 z-10 bg-white/80 hover:bg-white text-slate-800 p-2 rounded-full shadow-sm backdrop-blur transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <div class="flex-1 overflow-y-auto flex flex-col lg:flex-row">
                <!-- Cột trái: Media (Ảnh & Video) -->
                <div class="lg:w-3/5 bg-slate-100 flex flex-col border-r border-slate-200">
                    <!-- Khu vực hiển thị chính -->
                    <div class="relative w-full bg-black aspect-video lg:aspect-auto lg:flex-1 flex items-center justify-center overflow-hidden" id="main-media-container">
                        <!-- Nội dung ảnh/video sẽ được chèn bằng JS -->
                    </div>
                    
                    <!-- Thumbnail Gallery -->
                    <div class="h-28 bg-white border-t border-slate-200 p-3 flex gap-3 overflow-x-auto" id="thumbnail-gallery">
                        <!-- Thumbnails sẽ được chèn bằng JS -->
                    </div>
                </div>

                <!-- Cột phải: Thông tin chi tiết -->
                <div class="lg:w-2/5 flex flex-col bg-white">
                    <div class="p-6 flex-1 overflow-y-auto">
                        <div class="flex items-start justify-between mb-2">
                            <div id="detail-status-badge"></div>
                        </div>
                        <h2 id="detail-title" class="text-2xl font-bold text-slate-800 mb-2 leading-tight"></h2>
                        <p class="text-slate-500 text-sm flex items-center gap-1.5 mb-6"><i data-lucide="map-pin" class="w-4 h-4"></i> <span id="detail-address"></span></p>

                        <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 mb-6 flex justify-between items-center">
                            <div>
                                <p class="text-indigo-600 text-xs font-semibold uppercase tracking-wider mb-1">Giá thuê</p>
                                <p id="detail-price" class="text-2xl font-bold text-indigo-700"></p>
                            </div>
                            <div class="text-right">
                                <p class="text-emerald-600 text-xs font-semibold uppercase tracking-wider mb-1">Hoa hồng</p>
                                <p id="detail-commission" class="text-lg font-bold text-emerald-600 bg-emerald-100/50 px-2 rounded"></p>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4 mb-6">
                            <div class="border border-slate-100 rounded-lg p-3 bg-slate-50">
                                <p class="text-slate-500 text-xs mb-1">Loại phòng</p>
                                <p id="detail-type" class="font-semibold text-slate-800"></p>
                            </div>
                            <div class="border border-slate-100 rounded-lg p-3 bg-slate-50">
                                <p class="text-slate-500 text-xs mb-1">Diện tích</p>
                                <p id="detail-area" class="font-semibold text-slate-800"></p>
                            </div>
                        </div>

                        <div>
                            <h4 class="font-bold text-slate-800 mb-3 flex items-center gap-2">
                                <i data-lucide="align-left" class="w-4 h-4 text-slate-400"></i> Mô tả chi tiết
                            </h4>
                            <div id="detail-description" class="text-slate-600 text-sm leading-relaxed whitespace-pre-wrap"></div>
                        </div>
                    </div>
                    
                    <!-- Footer Actions -->
                    <div class="p-4 border-t border-slate-100 bg-slate-50 flex gap-3">
                        <button id="btn-share-detail" class="flex-1 py-3 bg-indigo-600 text-white rounded-xl text-sm font-semibold hover:bg-indigo-700 shadow-md transition-all flex items-center justify-center gap-2">
                            <i data-lucide="share-2" class="w-5 h-5"></i> Copy Bài Đăng
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CẤU HÌNH & HẰNG SỐ ---
        // Đã cập nhật URL AppScript mới theo yêu cầu
        const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwCr3sW_xvQxtbjcP39J680aPUNdg7OEBRHZd3RMkmfnTMiWH1stjDkDjazI1dsc0fzjw/exec';

        // Dữ liệu mẫu (chỉ dùng khi lỗi kết nối)
        const INITIAL_ROOMS = [
            { 
                id: 'P101', 
                name: 'Đang tải dữ liệu từ Google Sheets...', 
                building: 'Vui lòng chờ trong giây lát', 
                type: '-', 
                price: 0, 
                area: 0, 
                status: 'vacant',
                commissionType: 'percent',
                commissionValue: 0, 
                description: '',
                images: [],
                video: '' 
            }
        ];

        const STATUS_CONFIG = {
            vacant: { label: 'Trống', color: 'bg-emerald-100 text-emerald-700 border-emerald-200', icon: 'check-circle' },
            rented: { label: 'Đang thuê', color: 'bg-blue-100 text-blue-700 border-blue-200', icon: 'home' },
            deposited: { label: 'Đã cọc', color: 'bg-amber-100 text-amber-700 border-amber-200', icon: 'clock' },
            maintenance: { label: 'Bảo trì', color: 'bg-slate-100 text-slate-700 border-slate-200', icon: 'wrench' }
        };

        // --- 2. QUẢN LÝ TRẠNG THÁI (STATE) ---
        let state = {
            searchQuery: '',
            statusFilter: 'all',
            sortBy: 'default',
            rooms: [...INITIAL_ROOMS],
            editingRoomId: null,
            commEditType: 'percent', // 'percent' hoặc 'fixed' trong modal
            viewingRoomId: null // Dùng cho modal xem chi tiết
        };

        // --- 3. KẾT NỐI API ---
        async function fetchInitialData() {
            if (!APP_SCRIPT_URL) return;

            setSyncStatus(true, "Đang đồng bộ dữ liệu...");
            try {
                // Gọi API lấy dữ liệu từ Google Sheets
                const response = await fetch(`${APP_SCRIPT_URL}?action=getData`);
                const result = await response.json();
                
                if (result.success && result.rooms && result.rooms.length > 0) {
                    state.rooms = result.rooms;
                }
            } catch (error) {
                console.error("Lỗi kết nối AppScript:", error);
                showToast("Không thể tải dữ liệu mới. Đang hiển thị dữ liệu mẫu.", true);
            } finally {
                setSyncStatus(false, "");
                renderMainContent();
            }
        }

        // --- 4. CÁC HÀM TÍNH TOÁN & TIỆN ÍCH ---
        function formatCurrency(num) {
            return Number(num).toLocaleString('vi-VN');
        }

        function getCommissionInfo(room) {
            const type = room.commissionType || 'percent';
            const value = room.commissionValue || 0;
            
            if (type === 'percent') {
                const absoluteVal = (room.price * value) / 100;
                return {
                    display: `${value}%`,
                    absolute: absoluteVal,
                    fullText: `${value}% (${formatCurrency(absoluteVal)}đ)`
                };
            } else {
                return {
                    display: `${formatCurrency(value)}đ`,
                    absolute: value,
                    fullText: `${formatCurrency(value)}đ`
                };
            }
        }

        function getBadgeHTML(statusId) {
            const config = STATUS_CONFIG[statusId] || STATUS_CONFIG.vacant;
            return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold border uppercase tracking-wider ${config.color}"><i data-lucide="${config.icon}" class="w-3.5 h-3.5"></i>${config.label}</span>`;
        }

        function showToast(message, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = isError ? 'bg-red-600' : 'bg-slate-800';
            const icon = isError ? 'x-circle' : 'check-circle';
            
            toast.className = `flex items-center gap-2 px-4 py-3 rounded-lg shadow-lg text-white text-sm font-medium toast-enter ${bgColor}`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-leave');
                setTimeout(() => { if(container.contains(toast)) container.removeChild(toast); }, 300);
            }, 3000);
        }

        function setSyncStatus(isLoading, msg) {
            const el = document.getElementById('sync-status');
            const textEl = document.getElementById('sync-text');
            if (isLoading || msg) {
                textEl.innerText = msg;
                el.classList.remove('hidden'); el.classList.add('flex');
            } else {
                el.classList.add('hidden'); el.classList.remove('flex');
            }
        }

        // --- 5. HÀM XỬ LÝ SỰ KIỆN GIAO DIỆN ---
        window.setSearchQuery = function(val) { state.searchQuery = val; renderMainContent(); }
        window.setStatusFilter = function(val) { state.statusFilter = val; renderMainContent(); }
        window.setSortBy = function(val) { state.sortBy = val; renderMainContent(); }

        // --- TÍNH NĂNG CHIA SẺ BÀI VIẾT ---
        window.shareRoom = function(roomId, event) {
            if(event) event.stopPropagation(); // Ngăn click lan ra thẻ phòng (mở chi tiết)
            
            const room = state.rooms.find(r => r.id === roomId);
            if(!room) return;

            const commInfo = getCommissionInfo(room);
            const mediaCount = (room.images?.length || 0) + (room.video ? 1 : 0);
            let mediaText = mediaCount > 0 ? `📸 Có đính kèm ${room.images?.length || 0} ảnh ${room.video ? '& 1 video' : ''}\n` : '';

            const postContent = 
`📣 HOT: CHO THUÊ PHÒNG GIÁ TỐT!
🏡 ${room.name}
📍 Địa chỉ: ${room.building}
🛋️ Loại phòng: ${room.type} - Diện tích: ${room.area}m²
💰 Giá thuê: ${formatCurrency(room.price)}đ/tháng
✨ Trạng thái: ${STATUS_CONFIG[room.status].label}

📝 THÔNG TIN CHI TIẾT:
${room.description || 'Đang cập nhật...'}

${mediaText}
🎁 Hoa hồng giới thiệu: ${commInfo.fullText}

📞 Liên hệ ngay để biết thêm chi tiết và xem phòng trực tiếp!`;

            const textArea = document.createElement("textarea");
            textArea.value = postContent;
            textArea.style.position = "fixed"; textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.select();

            try {
                if(document.execCommand('copy')) showToast('Đã copy bài đăng (Kèm Mô tả & Hoa hồng)!');
                else showToast('Có lỗi xảy ra khi copy.', true);
            } catch (err) {
                showToast('Không thể copy nội dung trên thiết bị này.', true);
            }
            document.body.removeChild(textArea);
        }

        // --- MODAL CẬP NHẬT HOA HỒNG ---
        window.openCommissionModal = function(roomId, event) {
            if(event) event.stopPropagation();
            const room = state.rooms.find(r => r.id === roomId);
            if(!room) return;
            
            state.editingRoomId = roomId;
            state.commEditType = room.commissionType || 'percent';
            
            document.getElementById('commission-input').value = room.commissionValue || 0;
            updateCommissionModalUI();
            previewCommission(); // Tính toán ban đầu
            
            document.getElementById('commission-modal').classList.remove('hidden');
        }

        window.closeCommissionModal = function() {
            state.editingRoomId = null;
            document.getElementById('commission-modal').classList.add('hidden');
        }

        window.setCommissionType = function(type) {
            state.commEditType = type;
            updateCommissionModalUI();
            previewCommission();
        }

        function updateCommissionModalUI() {
            const isPercent = state.commEditType === 'percent';
            
            // Đổi nút active
            document.getElementById('btn-type-percent').className = `flex-1 py-1.5 text-sm font-medium rounded-md transition-all ${isPercent ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`;
            document.getElementById('btn-type-fixed').className = `flex-1 py-1.5 text-sm font-medium rounded-md transition-all ${!isPercent ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`;
            
            // Đổi label và suffix
            document.getElementById('comm-label').innerText = isPercent ? 'Tỉ lệ hoa hồng (%)' : 'Số tiền hoa hồng (VNĐ)';
            document.getElementById('comm-suffix').innerText = isPercent ? '%' : 'đ';
            document.getElementById('commission-input').placeholder = isPercent ? 'Ví dụ: 50' : 'Ví dụ: 1000000';
        }

        window.previewCommission = function() {
            if(!state.editingRoomId) return;
            const room = state.rooms.find(r => r.id === state.editingRoomId);
            const inputVal = parseFloat(document.getElementById('commission-input').value) || 0;
            
            let absoluteVal = 0;
            if (state.commEditType === 'percent') {
                absoluteVal = (room.price * inputVal) / 100;
            } else {
                absoluteVal = inputVal;
            }
            
            document.getElementById('comm-preview').innerText = `${formatCurrency(absoluteVal)}đ`;
        }

        window.saveCommission = function() {
            const inputVal = parseFloat(document.getElementById('commission-input').value);
            if(isNaN(inputVal) || inputVal < 0) {
                showToast('Giá trị không hợp lệ', true);
                return;
            }
            
            // Cập nhật state cục bộ
            state.rooms = state.rooms.map(r => 
                r.id === state.editingRoomId ? { ...r, commissionType: state.commEditType, commissionValue: inputVal } : r
            );
            
            showToast('Đã cập nhật hoa hồng thành công!');
            closeCommissionModal();
            
            // Nếu đang xem chi tiết phòng này, cập nhật luôn modal chi tiết
            if(state.viewingRoomId === state.editingRoomId) openRoomDetails(state.viewingRoomId);
            
            renderMainContent();

            // Gửi dữ liệu cập nhật lên Google Sheets (AppScript)
            if (APP_SCRIPT_URL) {
                fetch(APP_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'updateCommission',
                        roomId: state.editingRoomId,
                        commissionType: state.commEditType,
                        commissionValue: inputVal
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if(!data.success) console.error('Lỗi khi lưu vào Sheet:', data.message);
                })
                .catch(e => console.error('Lỗi kết nối khi lưu:', e));
            }
        }

        // --- MODAL XEM CHI TIẾT PHÒNG ---
        window.openRoomDetails = function(roomId) {
            const room = state.rooms.find(r => r.id === roomId);
            if(!room) return;
            state.viewingRoomId = roomId;

            // Đổ dữ liệu văn bản
            document.getElementById('detail-title').innerText = room.name;
            document.getElementById('detail-address').innerText = room.building;
            document.getElementById('detail-price').innerText = `${formatCurrency(room.price)}đ/th`;
            document.getElementById('detail-type').innerText = room.type;
            document.getElementById('detail-area').innerText = `${room.area}m²`;
            document.getElementById('detail-description').innerText = room.description || 'Chưa có mô tả chi tiết.';
            document.getElementById('detail-status-badge').innerHTML = getBadgeHTML(room.status);
            document.getElementById('detail-commission').innerText = getCommissionInfo(room).fullText;

            // Xử lý nút share trong modal
            const shareBtn = document.getElementById('btn-share-detail');
            shareBtn.onclick = () => shareRoom(roomId);

            // Xử lý Media (Ảnh & Video)
            const mediaContainer = document.getElementById('main-media-container');
            const thumbGallery = document.getElementById('thumbnail-gallery');
            thumbGallery.innerHTML = ''; // Clear cũ
            
            let hasMedia = false;

            // Load Video Thumbnail nếu có
            if (room.video) {
                hasMedia = true;
                const thumbHtml = `
                    <div onclick="setMainMedia('video', '${room.video}')" class="h-full aspect-square flex-shrink-0 cursor-pointer rounded-md overflow-hidden border-2 border-transparent hover:border-indigo-400 opacity-70 hover:opacity-100 transition-all relative flex items-center justify-center bg-slate-900 group">
                        <i data-lucide="play-circle" class="w-8 h-8 text-white group-hover:scale-110 transition-transform"></i>
                    </div>`;
                thumbGallery.innerHTML += thumbHtml;
            }

            // Load Image Thumbnails
            if (room.images && room.images.length > 0) {
                hasMedia = true;
                room.images.forEach((imgUrl, index) => {
                    const thumbHtml = `
                        <div onclick="setMainMedia('image', '${imgUrl}')" class="h-full aspect-square flex-shrink-0 cursor-pointer rounded-md overflow-hidden border-2 border-transparent hover:border-indigo-400 opacity-70 hover:opacity-100 transition-all">
                            <img src="${imgUrl}" class="w-full h-full object-cover">
                        </div>`;
                    thumbGallery.innerHTML += thumbHtml;
                });
            }

            // Hiển thị Media mặc định (Video đầu tiên, nếu không có thì Ảnh đầu tiên, không có thì placeholder)
            if (room.video) {
                setMainMedia('video', room.video);
            } else if (room.images && room.images.length > 0) {
                setMainMedia('image', room.images[0]);
            } else {
                thumbGallery.innerHTML = '<p class="text-xs text-slate-400 w-full text-center py-4">Không có hình ảnh/video đính kèm</p>';
                mediaContainer.innerHTML = `
                    <div class="flex flex-col items-center text-slate-500">
                        <i data-lucide="image-off" class="w-16 h-16 mb-2 opacity-50"></i>
                        <p class="font-medium">Chưa cập nhật hình ảnh</p>
                    </div>`;
            }

            lucide.createIcons();
            document.getElementById('details-modal').classList.remove('hidden');
        }

        window.setMainMedia = function(type, url) {
            const container = document.getElementById('main-media-container');
            if (type === 'video') {
                container.innerHTML = `
                    <video controls class="w-full h-full object-contain bg-black outline-none" autoplay muted>
                        <source src="${url}" type="video/mp4">
                        Trình duyệt của bạn không hỗ trợ thẻ video.
                    </video>`;
            } else {
                container.innerHTML = `<img src="${url}" class="w-full h-full object-contain bg-black">`;
            }
        }

        window.closeRoomDetails = function() {
            state.viewingRoomId = null;
            document.getElementById('main-media-container').innerHTML = ''; // Dừng video nếu đang chạy
            document.getElementById('details-modal').classList.add('hidden');
        }

        // --- 6. HÀM RENDER MAIN CONTENT ---
        function renderMainContent() {
            const container = document.getElementById('main-content');
            
            // Filter
            let filteredRooms = state.rooms.filter(room => {
                const searchTxt = state.searchQuery.toLowerCase();
                const matchesSearch = (room.name || '').toLowerCase().includes(searchTxt) || (room.building || '').toLowerCase().includes(searchTxt);
                const matchesStatus = state.statusFilter === 'all' || room.status === state.statusFilter;
                return matchesSearch && matchesStatus;
            });

            // Sort
            if (state.sortBy === 'price_asc') filteredRooms.sort((a, b) => a.price - b.price);
            else if (state.sortBy === 'price_desc') filteredRooms.sort((a, b) => b.price - a.price);
            else if (state.sortBy === 'commission_desc') filteredRooms.sort((a, b) => getCommissionInfo(b).absolute - getCommissionInfo(a).absolute);

            // Thống kê
            const total = filteredRooms.length;
            const vacant = filteredRooms.filter(r => r.status === 'vacant').length;
            const rented = filteredRooms.filter(r => r.status === 'rented').length;

            let roomsGridHTML = '';
            if (filteredRooms.length === 0) {
                roomsGridHTML = `
                    <div class="col-span-full py-16 text-center text-slate-500 bg-white rounded-xl border border-slate-200 border-dashed">
                        <i data-lucide="search-x" class="w-12 h-12 mx-auto mb-4 text-slate-300"></i>
                        <p class="font-medium text-slate-600">Không tìm thấy phòng nào</p>
                    </div>`;
            } else {
                roomsGridHTML = filteredRooms.map(room => {
                    const commInfo = getCommissionInfo(room);
                    const mainImage = (room.images && room.images.length > 0) ? room.images[0] : 'https://placehold.co/600x400/e2e8f0/64748b?text=No+Image';
                    const imageCount = room.images ? room.images.length : 0;
                    const hasVideo = !!room.video;
                    
                    let mediaBadge = '';
                    if(imageCount > 0 || hasVideo) {
                        mediaBadge = `
                        <div class="absolute bottom-2 right-2 bg-slate-900/80 backdrop-blur-sm text-white text-xs px-2 py-1 rounded-md flex items-center gap-2 shadow-sm pointer-events-none">
                            ${hasVideo ? '<i data-lucide="video" class="w-3 h-3"></i>' : ''}
                            ${imageCount > 0 ? `<span class="flex items-center gap-1"><i data-lucide="image" class="w-3 h-3"></i> ${imageCount}</span>` : ''}
                        </div>`;
                    }

                    return `
                    <div onclick="openRoomDetails('${room.id}')" class="bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col hover:border-indigo-400 hover:shadow-md transition-all cursor-pointer overflow-hidden group">
                        
                        <!-- Header Ảnh -->
                        <div class="image-container bg-slate-200 border-b border-slate-100">
                            <img src="${mainImage}" alt="Room" class="group-hover:scale-105 transition-transform duration-500">
                            <div class="absolute top-2 left-2 z-10">${getBadgeHTML(room.status)}</div>
                            ${mediaBadge}
                        </div>

                        <!-- Nội dung card -->
                        <div class="p-4 flex-1 flex flex-col">
                            <h3 class="font-bold text-slate-800 leading-snug line-clamp-2 mb-1 group-hover:text-indigo-600 transition-colors">${room.name}</h3>
                            <p class="text-xs text-slate-500 flex items-center gap-1 truncate mb-3"><i data-lucide="map-pin" class="w-3 h-3 flex-shrink-0"></i> ${room.building}</p>
                            
                            <div class="mt-auto space-y-2.5">
                                <div class="flex justify-between items-center text-sm">
                                    <span class="text-slate-500">Phân loại:</span>
                                    <span class="font-medium text-slate-800">${room.type} (${room.area}m²)</span>
                                </div>
                                <div class="flex justify-between items-center text-sm">
                                    <span class="text-slate-500">Giá thuê:</span>
                                    <span class="font-bold text-indigo-600 text-base">${formatCurrency(room.price)}đ</span>
                                </div>
                                <div class="flex justify-between items-center text-sm pt-2 border-t border-slate-100">
                                    <span class="text-slate-500 flex items-center gap-1.5"><i data-lucide="gift" class="w-3.5 h-3.5 text-emerald-500"></i> Hoa hồng:</span>
                                    <div class="flex items-center gap-1.5" onclick="event.stopPropagation()">
                                        <span class="font-bold text-emerald-700 bg-emerald-50 border border-emerald-100 px-2 py-0.5 rounded-md text-xs">${commInfo.display}</span>
                                        <button onclick="openCommissionModal('${room.id}', event)" class="text-slate-400 hover:text-indigo-600 transition-colors bg-slate-50 hover:bg-indigo-50 p-1.5 rounded-md" title="Chỉnh sửa">
                                            <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Action footer -->
                        <div class="px-4 py-3 bg-slate-50/50 border-t border-slate-100 flex gap-2">
                            <button onclick="openRoomDetails('${room.id}')" class="flex-1 py-2 bg-white border border-slate-200 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-100 transition-colors">Xem chi tiết</button>
                            <button onclick="shareRoom('${room.id}', event)" class="px-3 py-2 bg-indigo-50 border border-indigo-100 text-indigo-600 rounded-lg hover:bg-indigo-600 hover:text-white transition-colors" title="Copy Bài Viết">
                                <i data-lucide="share-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>`;
                }).join('');
            }

            container.innerHTML = `
                <div class="space-y-6">
                    <!-- Thanh công cụ -->
                    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        <div class="flex flex-wrap items-center gap-3">
                            <div class="relative">
                                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4"></i>
                                <input type="text" placeholder="Tìm tên phòng, tòa nhà..." class="pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 w-64 text-sm bg-slate-50" value="${state.searchQuery}" onkeyup="window.setSearchQuery(this.value)">
                            </div>
                            <div class="relative">
                                <i data-lucide="filter" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4"></i>
                                <select class="pl-10 pr-8 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm appearance-none bg-slate-50 cursor-pointer" onchange="window.setStatusFilter(this.value)">
                                    <option value="all" ${state.statusFilter === 'all' ? 'selected' : ''}>Tất cả trạng thái</option>
                                    <option value="vacant" ${state.statusFilter === 'vacant' ? 'selected' : ''}>Trống</option>
                                    <option value="rented" ${state.statusFilter === 'rented' ? 'selected' : ''}>Đang thuê</option>
                                    <option value="deposited" ${state.statusFilter === 'deposited' ? 'selected' : ''}>Đã cọc</option>
                                </select>
                                <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none w-4 h-4"></i>
                            </div>
                            <div class="relative">
                                <i data-lucide="arrow-up-down" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4"></i>
                                <select class="pl-10 pr-8 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm appearance-none bg-slate-50 cursor-pointer" onchange="window.setSortBy(this.value)">
                                    <option value="default" ${state.sortBy === 'default' ? 'selected' : ''}>Sắp xếp mặc định</option>
                                    <option value="price_asc" ${state.sortBy === 'price_asc' ? 'selected' : ''}>Giá tăng dần</option>
                                    <option value="price_desc" ${state.sortBy === 'price_desc' ? 'selected' : ''}>Giá giảm dần</option>
                                    <option value="commission_desc" ${state.sortBy === 'commission_desc' ? 'selected' : ''}>Hoa hồng cao nhất</option>
                                </select>
                                <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none w-4 h-4"></i>
                            </div>
                        </div>
                        
                        <div class="flex items-center gap-4 text-sm font-medium text-slate-600 bg-slate-50 px-4 py-2 rounded-lg border border-slate-200">
                            <span class="flex items-center gap-1.5"><i data-lucide="hash" class="w-4 h-4 text-indigo-500"></i> Tổng: ${total}</span>
                            <span class="w-px h-4 bg-slate-300"></span>
                            <span class="flex items-center gap-1.5 text-emerald-600"><i data-lucide="check-circle" class="w-4 h-4"></i> Trống: ${vacant}</span>
                        </div>
                    </div>
                    
                    <!-- Lưới danh sách phòng -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                        ${roomsGridHTML}
                    </div>
                </div>
            `;

            lucide.createIcons();
        }

        // --- 7. KHỞI CHẠY ---
        document.addEventListener('DOMContentLoaded', () => {
            fetchInitialData(); 
        });

    </script>
</body>
</html>
