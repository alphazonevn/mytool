<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <link rel="icon" href="https://i.pinimg.com/736x/58/98/19/58981979f44731d95ab25aad9a7c88cb.jpg" alt="Logo" class="w-10 h-10 rounded-xl object-cover mr-3 shadow-md border border-slate-100 transition-transform group-hover:scale-105">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Email Studio - MMO Theme</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { font-family: Arial, sans-serif; }
        body { 
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%); 
            box-sizing: border-box; 
            -webkit-font-smoothing: antialiased;
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .tab-active { 
            background: linear-gradient(135deg, #cf0106 0%, #a80005 100%); 
            color: white !important; 
            box-shadow: 0 4px 15px rgba(207, 1, 6, 0.4); 
            border: none !important;
        }
        
        @keyframes slideIn { 
            from { opacity: 0; transform: translateY(-10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .animate-slide { animation: slideIn 0.3s ease-out; }
        
        header { 
            background: linear-gradient(135deg, #cf0106 0%, #a80005 100%) !important; 
            box-shadow: 0 8px 20px rgba(207, 1, 6, 0.3); 
        }

        .glass-input {
            background-color: #ffffff;
            border: 2px solid #e5e7eb;
            border-radius: 0.75rem;
            transition: all 0.3s ease;
            outline: none;
        }
        .glass-input:focus {
            border-color: #ef4444;
        }

        .btn-primary {
            background: linear-gradient(to right, #dc2626, #b91c1c);
            color: white;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: linear-gradient(to right, #b91c1c, #991b1b);
            transform: scale(1.02);
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="h-full w-full overflow-auto bg-gradient-to-br from-gray-900 via-gray-800 to-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- CẤU HÌNH API ---
    const API_URL = "https://script.google.com/macros/s/AKfycbzK0XowOvBy3f2q_JpTzCivtP83TgmcIQGimtmppM8XJ4eRtXcVm4WPBs-FanObODjF/exec";

    // --- MẶC ĐỊNH (PHÒNG KHI API LỖI) ---
    const defaultTemplates = [{
      id: '1', name: "Thư mời Phỏng vấn", subject: "THƯ MỜI PHỎNG VẤN - [Vị Trí]",
      body: `<div style="background:#fafafa; color:#333; padding:40px; font-family:Arial, sans-serif; border: 1px solid #eee; border-radius: 8px; max-width: 600px; margin: 0 auto;">
  <h1 style="color:#cf0106; text-transform:uppercase; font-weight: normal; letter-spacing: 1px;">Thư Mời Phỏng Vấn</h1>
  <p>Chào <strong>[Tên Ứng Viên]</strong>,</p>
  <p>Cảm ơn bạn đã ứng tuyển vị trí <strong>[Vị Trí]</strong>. Chúng tôi mời bạn tham gia phỏng vấn:</p>
  <ul style="background:#fff; padding:20px; border: 1px solid #e5e7eb; border-radius:8px; list-style:none;">
    <li style="margin-bottom: 10px;"><strong style="color: #666;">Thời gian:</strong> [Giờ] ngày [Ngày]</li>
    <li><strong style="color: #666;">Địa điểm:</strong> [Địa Điểm]</li>
  </ul>
  <p style="color: #666; font-size: 13px; margin-top: 20px;">Vui lòng phản hồi email này để xác nhận.</p>
</div>`
    }];

    const App = () => {
      const [templates, setTemplates] = useState([]);
      const [activeId, setActiveId] = useState(null);
      const [viewMode, setViewMode] = useState('split');
      const [toast, setToast] = useState(null);
      const [isLoading, setIsLoading] = useState(true);

      const [vars, setVars] = useState({
        '[Tên Ứng Viên]': 'Anh Minh', 
        '[Vị Trí]': 'Frontend Developer',
        '[Giờ]': '09:00 AM', 
        '[Ngày]': '20/11/2026', 
        '[Địa Điểm]': 'Google Meet (Online)'
      });

      const activeTemplate = templates.find(t => t.id === activeId);
      const [editSubject, setEditSubject] = useState('');
      const [editBody, setEditBody] = useState('');

      // TẢI DỮ LIỆU
      useEffect(() => {
        fetch(API_URL)
          .then(res => res.json())
          .then(result => {
            if (result.status === 'success' && result.data && result.data.length > 0) {
              setTemplates(result.data);
              setActiveId(result.data[0].id);
              if(result.data[0].vars) setVars(result.data[0].vars);
            } else {
              setTemplates(defaultTemplates);
              setActiveId(defaultTemplates[0].id);
            }
            setIsLoading(false);
          })
          .catch(err => {
            setTemplates(defaultTemplates);
            setActiveId(defaultTemplates[0].id);
            setIsLoading(false);
            showToast("Lỗi tải API. Đang dùng mẫu nội bộ.", "error");
          });
      }, []);

      // Đồng bộ nội dung & biến khi đổi Tab
      useEffect(() => {
        if (activeTemplate) {
          setEditSubject(activeTemplate.subject);
          setEditBody(activeTemplate.body);
          if (activeTemplate.vars) setVars(activeTemplate.vars);
        }
      }, [activeId, templates.length]);

      const showToast = (msg, type = "info") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      // Xử lý Thêm / Xóa Biến Động
      const handleAddVar = () => {
          const varName = prompt("Nhập tên trường dữ liệu mới (Ví dụ: [Số Điện Thoại]):");
          if (varName && varName.trim() !== '') {
              const formattedName = varName.startsWith('[') && varName.endsWith(']') ? varName : `[${varName}]`;
              if (!vars.hasOwnProperty(formattedName)) {
                  setVars(prev => ({ ...prev, [formattedName]: '' }));
              }
          }
      };

      const handleRemoveVar = (keyToRemove) => {
          if (confirm(`Hệ thống sẽ xóa biến ${keyToRemove}. Tiếp tục?`)) {
              setVars(prev => {
                  const newVars = { ...prev };
                  delete newVars[keyToRemove];
                  return newVars;
              });
          }
      };

      const renderContent = (content) => {
        if(!content) return '';
        let result = content;
        Object.keys(vars).forEach(key => {
          const regex = new RegExp(key.replace(/\[/g, '\\[').replace(/\]/g, '\\]'), 'g');
          result = result.replace(regex, vars[key] || key); // Nếu biến rỗng, giữ nguyên tên
        });
        return result;
      };

      const renderedSubject = useMemo(() => renderContent(editSubject), [editSubject, vars]);
      const renderedBody = useMemo(() => renderContent(editBody), [editBody, vars]);

      // LƯU API (Bao gồm cập nhật vars hiện tại vào template)
      const handleSave = () => {
        if(!activeTemplate) return;
        
        // BẮT BUỘC NHẬP MẬT KHẨU TRƯỚC KHI LƯU
        const password = window.prompt("Vui lòng nhập mật khẩu xác nhận ghi đè dữ liệu:");
        if (password !== "729903") {
            showToast('Sai mật khẩu. Đã hủy thao tác lưu.', 'error');
            return;
        }

        const updatedTemplate = { id: activeId, name: activeTemplate.name, subject: editSubject, body: editBody, vars: vars };
        setTemplates(prev => prev.map(t => t.id === activeId ? updatedTemplate : t));
        showToast('Đang khởi tạo gói tin lưu trữ...', 'info');

        fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'SAVE', template: updatedTemplate }),
          redirect: "follow"
        })
        .then(res => res.json())
        .then(res => {
          if(res.status === 'success') showToast('Cấu trúc đã lưu vào máy chủ.', 'success');
        })
        .catch(err => showToast('Lưu Offline thành công (Mất kết nối API)', 'warning'));
      };

      const handleAddTemplate = () => {
        const newId = Date.now().toString();
        const newTemplate = { id: newId, name: 'Bản thảo mới', subject: 'Tiêu đề thư...', body: '<h1>Nội dung</h1>', vars: {} };
        setTemplates([...templates, newTemplate]);
        setActiveId(newId);
        setVars({});
      };

      const handleSendGmail = () => {
        const el = document.createElement('div');
        el.innerHTML = renderedBody;
        el.style.position = 'absolute'; el.style.left = '-9999px';
        document.body.appendChild(el);
        const sel = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(el);
        sel.removeAllRanges(); sel.addRange(range);
        document.execCommand('copy');
        sel.removeAllRanges(); document.body.removeChild(el);

        showToast("Dữ liệu lưu vào khay tạm. Mở dịch vụ Gmail...", "success");
        setTimeout(() => {
          window.open(`https://mail.google.com/mail/?view=cm&fs=1&su=${encodeURIComponent(renderedSubject)}`, '_blank');
        }, 800);
      };

      // Loading State
      if (isLoading) {
        return (
          <div className="h-screen w-full flex items-center justify-center">
             <div className="text-center">
                <p className="text-white font-light text-sm uppercase tracking-widest">Đang truy xuất cơ sở dữ liệu...</p>
             </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col pb-12">
          
          {/* TOAST */}
          {toast && (
            <div className="fixed top-5 right-5 z-[100] flex flex-col gap-2 max-w-md w-full pointer-events-none">
                <div className={`flex items-center p-4 rounded-xl text-[10px] font-light uppercase tracking-widest shadow-lg border animate-slide bg-white ${toast.type === 'success' ? 'border-green-200 text-green-800' : toast.type === 'error' ? 'border-red-200 text-red-800' : 'border-gray-200 text-gray-700'}`}>
                    <span>{toast.msg}</span>
                </div>
            </div>
          )}

          {/* HEADER */}
          <header className="text-white py-8 px-4 shadow-2xl relative">
              <div className="max-w-6xl mx-auto relative flex flex-col md:flex-row items-center justify-between gap-4">
                  <div className="flex items-center gap-4">
                      <div>
                          <h1 className="text-2xl md:text-3xl font-normal tracking-wide uppercase">Email Studio</h1>
                          <p className="text-sm text-red-100 uppercase tracking-widest font-light mt-1">Cơ sở dữ liệu biểu mẫu</p>
                      </div>
                  </div>
                  <div className="bg-white/10 px-4 py-2 rounded-lg border border-white/20 text-xs font-light tracking-wide flex items-center gap-2">
                      <div className="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div> Đồng bộ API Live
                  </div>
              </div>
          </header>

          {/* TABS */}
          <div className="max-w-6xl mx-auto px-4 mt-6 w-full">
              <div className="flex bg-white rounded-xl shadow-md p-1.5 gap-1 overflow-x-auto scrollbar-hide">
                  {templates.map(t => (
                      <button 
                        key={t.id} 
                        onClick={() => setActiveId(t.id)} 
                        className={`flex-none whitespace-nowrap py-3 px-6 rounded-lg font-normal transition-all uppercase text-[11px] tracking-widest ${activeId === t.id ? 'tab-active' : 'text-gray-600 hover:bg-gray-100'}`}
                      >
                          {t.name}
                      </button>
                  ))}
                  <button onClick={handleAddTemplate} className="flex-none whitespace-nowrap py-3 px-6 rounded-lg font-normal text-red-600 transition-all hover:bg-red-50 border border-dashed border-red-200 uppercase text-[11px] tracking-widest ml-1">
                      + Khởi tạo vùng mới
                  </button>
              </div>
          </div>

          {/* MAIN WORKSPACE */}
          <div className="max-w-6xl mx-auto px-4 py-6 w-full flex-1 flex flex-col">
              <div className="bg-white rounded-2xl shadow-2xl p-6 md:p-8 animate-slide flex-1 flex flex-col">
                  
                  {/* Info & Action Bar */}
                  <div className="flex flex-col md:flex-row gap-6 mb-8">
                      <div className="flex-1 space-y-4">
                          <div>
                              <label className="block text-xs font-light text-gray-500 mb-2 uppercase tracking-widest">Định danh hiển thị</label>
                              <input 
                                type="text" 
                                value={activeTemplate?.name || ''} 
                                onChange={(e) => setTemplates(prev => prev.map(t => t.id === activeId ? { ...t, name: e.target.value } : t))}
                                className="w-full glass-input px-4 py-3 font-normal text-gray-800 text-sm tracking-wide" 
                              />
                          </div>
                          <div>
                              <label className="block text-xs font-light text-gray-500 mb-2 uppercase tracking-widest">Cấu trúc chủ đề (Subject)</label>
                              <input 
                                type="text" 
                                value={editSubject}
                                onChange={(e) => setEditSubject(e.target.value)}
                                className="w-full glass-input px-4 py-3 font-normal text-gray-800 text-sm tracking-wide" 
                              />
                          </div>
                      </div>
                      
                      <div className="flex flex-col gap-3 min-w-[200px] justify-end">
                          <button onClick={handleSave} className="btn-primary py-3 px-8 rounded-xl font-normal text-xs uppercase tracking-widest shadow-lg text-center">
                              Ghi đè cấu hình
                          </button>
                          <button onClick={handleSendGmail} className="py-3 px-8 bg-white border border-red-600 text-red-600 hover:bg-red-50 rounded-xl font-normal text-xs uppercase tracking-widest transition-all text-center">
                              Đẩy qua Gmail
                          </button>
                      </div>
                  </div>

                  {/* Variables Manager */}
                  <div className="bg-gradient-to-r from-red-50 to-red-100 border-2 border-[#cf0106] rounded-xl p-5 mb-8">
                      <span className="text-[10px] font-normal text-red-800 uppercase tracking-widest block mb-4">Mảng biến động (Đầu vào)</span>
                      <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
                          {Object.keys(vars).map(key => (
                              <div key={key} className="relative group">
                                  <label className="block text-[10px] font-light text-gray-500 mb-1.5 uppercase tracking-wider">{key}</label>
                                  <input 
                                    type="text" 
                                    value={vars[key]} 
                                    onChange={(e) => setVars(prev => ({ ...prev, [key]: e.target.value }))}
                                    className="w-full bg-white border border-red-200 rounded-lg pl-3 pr-8 py-2 text-sm text-gray-800 focus:outline-none focus:border-red-500 transition-colors shadow-sm"
                                  />
                                  <button 
                                    onClick={() => handleRemoveVar(key)}
                                    className="absolute right-2 top-[24px] w-6 h-6 flex items-center justify-center text-gray-400 hover:text-red-600 hover:bg-red-50 rounded transition-colors"
                                    title="Xóa trường này"
                                  >✕</button>
                              </div>
                          ))}
                          <div className="flex items-end">
                              <button onClick={handleAddVar} className="h-[38px] w-full px-4 bg-white text-red-600 border border-dashed border-red-300 rounded-lg text-xs hover:bg-red-50 transition-colors font-light tracking-wide">
                                  + Thêm vùng
                              </button>
                          </div>
                      </div>
                  </div>

                  {/* View Controls */}
                  <div className="flex justify-center md:justify-start gap-2 mb-4 border-b border-gray-100 pb-4">
                      <button onClick={() => setViewMode('code')} className={`px-5 py-2 text-xs font-light tracking-widest uppercase rounded-xl transition-all border ${viewMode === 'code' ? 'bg-red-50 border-red-200 text-red-700 font-normal shadow-sm' : 'bg-white border-transparent text-gray-500 hover:bg-gray-50'}`}>Mã nguồn</button>
                      <button onClick={() => setViewMode('preview')} className={`px-5 py-2 text-xs font-light tracking-widest uppercase rounded-xl transition-all border ${viewMode === 'preview' ? 'bg-red-50 border-red-200 text-red-700 font-normal shadow-sm' : 'bg-white border-transparent text-gray-500 hover:bg-gray-50'}`}>Trực quan</button>
                      <button onClick={() => setViewMode('split')} className={`hidden md:block px-5 py-2 text-xs font-light tracking-widest uppercase rounded-xl transition-all border ${viewMode === 'split' ? 'bg-red-50 border-red-200 text-red-700 font-normal shadow-sm' : 'bg-white border-transparent text-gray-500 hover:bg-gray-50'}`}>Phân mảnh</button>
                  </div>

                  {/* Editors */}
                  <div className="flex-1 flex flex-col md:flex-row gap-6 min-h-[500px]">
                      
                      {(viewMode === 'code' || viewMode === 'split') && (
                          <div className="flex-1 flex flex-col relative group">
                              <label className="block text-[10px] font-light text-gray-400 mb-2 uppercase tracking-widest">Cấu trúc HTML (Raw)</label>
                              <textarea 
                                  value={editBody}
                                  onChange={(e) => setEditBody(e.target.value)}
                                  spellCheck="false"
                                  className="flex-1 w-full bg-gray-50 border border-gray-200 rounded-xl p-5 text-gray-800 font-mono text-[13px] leading-relaxed focus:outline-none focus:border-red-400 focus:ring-4 focus:ring-red-50 transition-all resize-none shadow-inner"
                                  placeholder="Nhập mã HTML..."
                              />
                          </div>
                      )}

                      {(viewMode === 'preview' || viewMode === 'split') && (
                          <div className="flex-1 flex flex-col relative">
                              <label className="flex items-center justify-between text-[10px] font-light text-gray-400 mb-2 uppercase tracking-widest">
                                <span>Đầu ra hiển thị (Cho phép gõ trực tiếp)</span>
                                <span className="text-[9px] text-red-500 normal-case tracking-normal hidden md:inline">*Cảnh báo: Việc sửa trực tiếp sẽ chèn đè chữ tĩnh lên các tham số biến.</span>
                              </label>
                              <div 
                                className="flex-1 w-full bg-white border border-gray-200 rounded-xl p-5 overflow-y-auto shadow-sm outline-none focus:border-red-400 focus:ring-4 focus:ring-red-50 transition-all cursor-text"
                                contentEditable={true}
                                suppressContentEditableWarning={true}
                                onBlur={(e) => {
                                    if (e.target.innerHTML !== renderedBody) {
                                        setEditBody(e.target.innerHTML);
                                        showToast('Đồng bộ dữ liệu trực quan xuống mã HTML thành công.', 'success');
                                    }
                                }}
                                dangerouslySetInnerHTML={{ __html: renderedBody }} 
                              />
                          </div>
                      )}

                  </div>
              </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
