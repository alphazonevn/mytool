<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="icon" href="https://i.pinimg.com/736x/58/98/19/58981979f44731d95ab25aad9a7c88cb.jpg" alt="Logo" class="w-10 h-10 rounded-xl object-cover mr-3 shadow-md border border-slate-100 transition-transform group-hover:scale-105">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Email Studio - Quản trị Thư HTML</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .html-editor { font-family: 'Fira Code', monospace; tab-size: 2; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- ICONS ---
    const IconMail = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>;
    const IconEye = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>;
    const IconCode = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>;
    const IconSave = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;
    const IconSend = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>;
    const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
    const IconCopy = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>;

    // --- INITIAL DATA ---
    const defaultTemplates = [
      {
        id: '1',
        name: "Thư mời Phỏng vấn",
        subject: "THƯ MỜI PHỎNG VẤN - [Vị Trí]",
        body: `<div style="background:#0a0a0a; color:#fff; padding:40px; font-family:Arial, sans-serif;">
  <h1 style="color:#00F2EA; text-transform:uppercase;">Thư Mời Phỏng Vấn</h1>
  <p>Chào <strong>[Tên Ứng Viên]</strong>,</p>
  <p>Cảm ơn bạn đã ứng tuyển vị trí <strong>[Vị Trí]</strong>. Chúng tôi mời bạn tham gia phỏng vấn:</p>
  <ul style="background:#111; padding:20px; border-radius:8px; list-style:none;">
    <li><strong>Thời gian:</strong> [Giờ] ngày [Ngày]</li>
    <li><strong>Địa điểm:</strong> [Địa Điểm]</li>
  </ul>
  <p>Vui lòng phản hồi email này để xác nhận.</p>
</div>`
      }
    ];

    const App = () => {
      const [templates, setTemplates] = useState(defaultTemplates);
      const [activeId, setActiveId] = useState('1');
      const [viewMode, setViewMode] = useState('split'); // split, code, preview
      const [toast, setToast] = useState(null);

      // Variables state
      const [vars, setVars] = useState({
        '[Tên Ứng Viên]': 'Anh Minh',
        '[Vị Trí]': 'Frontend Developer',
        '[Giờ]': '09:00 AM',
        '[Ngày]': '20/11/2026',
        '[Địa Điểm]': 'Google Meet (Online)'
      });

      const activeTemplate = templates.find(t => t.id === activeId) || templates[0];
      
      const [editSubject, setEditSubject] = useState('');
      const [editBody, setEditBody] = useState('');

      // Load active template data into editor
      useEffect(() => {
        if (activeTemplate) {
          setEditSubject(activeTemplate.subject);
          setEditBody(activeTemplate.body);
        }
      }, [activeId, templates.length]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      // Handle variable injection
      const renderContent = (content) => {
        let result = content;
        Object.keys(vars).forEach(key => {
          const regex = new RegExp(key.replace(/\[/g, '\\[').replace(/\]/g, '\\]'), 'g');
          result = result.replace(regex, vars[key]);
        });
        return result;
      };

      const renderedSubject = useMemo(() => renderContent(editSubject), [editSubject, vars]);
      const renderedBody = useMemo(() => renderContent(editBody), [editBody, vars]);

      // Actions
      const handleSave = () => {
        setTemplates(prev => prev.map(t => t.id === activeId ? { ...t, subject: editSubject, body: editBody } : t));
        showToast('Đã lưu mẫu thư thành công!');
      };

      const handleAddTemplate = () => {
        const newId = Date.now().toString();
        const newTemplate = { id: newId, name: 'Mẫu thư mới', subject: 'Tiêu đề thư...', body: '<h1>Nội dung HTML</h1>' };
        setTemplates([...templates, newTemplate]);
        setActiveId(newId);
      };

      const handleVarChange = (key, value) => {
        setVars(prev => ({ ...prev, [key]: value }));
      };

      const handleSendGmail = () => {
        const el = document.createElement('div');
        el.innerHTML = renderedBody;
        el.style.position = 'absolute'; el.style.left = '-9999px';
        document.body.appendChild(el);
        const sel = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(el);
        sel.removeAllRanges(); sel.addRange(range);
        document.execCommand('copy');
        sel.removeAllRanges(); document.body.removeChild(el);

        showToast("Đã copy HTML. Đang mở Gmail...");
        setTimeout(() => {
          window.open(`https://mail.google.com/mail/?view=cm&fs=1&su=${encodeURIComponent(renderedSubject)}`, '_blank');
        }, 800);
      };

      return (
        <div className="h-screen flex flex-col md:flex-row overflow-hidden">
          
          {/* Sidebar */}
          <aside className="w-full md:w-64 glass-panel flex flex-col border-r border-slate-700/50 flex-shrink-0">
            <div className="p-4 border-b border-slate-700/50 flex items-center justify-between">
              <h1 className="font-bold text-lg flex items-center text-indigo-400">
                <IconMail /> <span className="ml-2">Email Studio</span>
              </h1>
            </div>
            
            <div className="flex-1 overflow-y-auto p-3 space-y-2">
              <div className="text-xs font-semibold text-slate-500 uppercase mb-2 px-2">Danh sách Mẫu</div>
              {templates.map(t => (
                <button
                  key={t.id}
                  onClick={() => setActiveId(t.id)}
                  className={`w-full text-left px-3 py-2 rounded-lg text-sm transition-all ${activeId === t.id ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-900/20' : 'text-slate-300 hover:bg-slate-800'}`}
                >
                  {t.name}
                </button>
              ))}
            </div>
            
            <div className="p-3 border-t border-slate-700/50">
              <button onClick={handleAddTemplate} className="w-full flex items-center justify-center py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-sm transition-colors border border-slate-600">
                <IconPlus /> <span className="ml-1">Tạo mẫu mới</span>
              </button>
            </div>
          </aside>

          {/* Main Workspace */}
          <main className="flex-1 flex flex-col min-w-0 h-full">
            
            {/* Top Toolbar & Variables */}
            <header className="glass-panel p-4 border-b border-slate-700/50 flex flex-col gap-4 z-10 shadow-md">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <input 
                  type="text" 
                  value={activeTemplate?.name || ''} 
                  onChange={(e) => setTemplates(prev => prev.map(t => t.id === activeId ? { ...t, name: e.target.value } : t))}
                  className="bg-transparent border-none text-xl font-bold text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 rounded px-2 w-64"
                />
                <div className="flex space-x-2">
                  <button onClick={() => setViewMode('code')} className={`px-3 py-1.5 rounded text-sm flex items-center gap-1 ${viewMode === 'code' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}><IconCode/> Code</button>
                  <button onClick={() => setViewMode('preview')} className={`px-3 py-1.5 rounded text-sm flex items-center gap-1 ${viewMode === 'preview' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}><IconEye/> Preview</button>
                  <button onClick={() => setViewMode('split')} className={`px-3 py-1.5 rounded text-sm flex items-center gap-1 hidden md:flex ${viewMode === 'split' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}>Split</button>
                  <div className="w-px h-8 bg-slate-700 mx-1"></div>
                  <button onClick={handleSave} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-sm flex items-center gap-1 transition-colors"><IconSave/> Lưu</button>
                  <button onClick={handleSendGmail} className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded text-sm flex items-center gap-1 transition-colors"><IconSend/> Send qua Gmail</button>
                </div>
              </div>

              {/* Smart Variables Box */}
              <div className="bg-slate-900/50 border border-slate-700 rounded-lg p-3">
                <div className="text-xs font-semibold text-slate-400 mb-2">BIẾN ĐỘNG (Tự động chèn vào Subject & Code)</div>
                <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                  {Object.keys(vars).map(key => (
                    <div key={key}>
                      <label className="block text-[10px] text-slate-500 mb-1">{key}</label>
                      <input 
                        type="text" 
                        value={vars[key]} 
                        onChange={(e) => handleVarChange(key, e.target.value)}
                        className="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                  ))}
                </div>
              </div>

              {/* Subject Editor */}
              <div className="flex items-center gap-3">
                <span className="text-sm font-semibold text-slate-400 whitespace-nowrap">Subject:</span>
                <input 
                  type="text" 
                  value={editSubject}
                  onChange={(e) => setEditSubject(e.target.value)}
                  className="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                />
              </div>
            </header>

            {/* Main Editor Area */}
            <div className="flex-1 flex overflow-hidden bg-slate-950">
              
              {/* HTML Editor */}
              {(viewMode === 'code' || viewMode === 'split') && (
                <div className="flex-1 flex flex-col border-r border-slate-800 relative">
                  <div className="absolute top-0 right-0 bg-slate-800 text-xs px-2 py-1 rounded-bl-lg text-slate-400 pointer-events-none">HTML RAW</div>
                  <textarea 
                    value={editBody}
                    onChange={(e) => setEditBody(e.target.value)}
                    spellCheck="false"
                    className="flex-1 w-full p-4 bg-transparent text-emerald-400 html-editor text-sm focus:outline-none resize-none"
                    placeholder="Viết mã HTML tại đây..."
                  />
                </div>
              )}

              {/* Live Preview */}
              {(viewMode === 'preview' || viewMode === 'split') && (
                <div className="flex-1 flex flex-col relative bg-[#0a0a0a]">
                  <div className="absolute top-0 right-0 bg-slate-800 text-xs px-2 py-1 rounded-bl-lg text-slate-400 z-10 pointer-events-none">LIVE PREVIEW</div>
                  <div className="flex-1 overflow-y-auto p-4 custom-scrollbar">
                    {/* Rendered Output */}
                    <div dangerouslySetInnerHTML={{ __html: renderedBody }} />
                  </div>
                </div>
              )}
            </div>
          </main>

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-6 right-6 bg-indigo-600 text-white px-4 py-3 rounded-lg shadow-xl shadow-indigo-900/50 flex items-center animate-bounce z-50">
              <svg className="w-5 h-5 text-white mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
              <span className="font-medium text-sm">{toast}</span>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
