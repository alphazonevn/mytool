<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập / Đăng ký - My Tool</title>
    <link rel="icon" href="https://i.pinimg.com/736x/58/98/19/58981979f44731d95ab25aad9a7c88cb.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Script bảo mật Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        primaryHover: '#1d4ed8',
                        secondary: '#0f172a',
                        background: '#f8fafc',
                    },
                    fontFamily: {
                        sans: ['"Be Vietnam Pro"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: #f8fafc; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05);
        }
        .form-transition {
            transition: all 0.3s ease-in-out;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            min-width: 250px;
            padding: 16px 20px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .toast.show {
            transform: translateX(0);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <div id="toast-container" class="toast-container"></div>

    <!-- Background Decor -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-400 rounded-full mix-blend-multiply filter blur-[100px] opacity-40 animate-blob"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-cyan-400 rounded-full mix-blend-multiply filter blur-[100px] opacity-40 animate-blob animation-delay-2000"></div>

    <div class="w-full max-w-4xl glass-panel rounded-3xl overflow-hidden flex flex-col md:flex-row relative z-10">
        
        <!-- Cột Trái: Thông tin / Branding -->
        <div class="w-full md:w-5/12 bg-secondary p-10 flex flex-col justify-between text-white relative overflow-hidden">
            <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-blue-400 via-transparent to-transparent"></div>
            <div class="relative z-10">
                <a href="index.html" class="flex items-center mb-12 group">
                    <img src="https://i.pinimg.com/736x/58/98/19/58981979f44731d95ab25aad9a7c88cb.jpg" alt="My Tool Logo" class="w-12 h-12 rounded-xl object-cover mr-3 shadow-lg border-2 border-white/20 transition-transform group-hover:scale-105">
                    <span class="font-bold text-2xl tracking-tight">My<span class="text-primary font-extrabold">Tool</span></span>
                </a>
                <h2 class="text-3xl font-bold mb-4 leading-tight">Chào mừng bạn<br>trở lại!</h2>
                <p class="text-slate-400 text-sm leading-relaxed mb-8">
                    Đăng nhập để lưu trữ lịch sử sử dụng công cụ, tạo bộ sưu tập yêu thích và đồng bộ dữ liệu trên mọi thiết bị của bạn.
                </p>
            </div>
            
            <div class="relative z-10 flex items-center text-sm text-slate-400">
                <i class="fa-solid fa-shield-halved mr-2 text-emerald-400"></i>
                Bảo mật dữ liệu bằng Google Sheets
            </div>
        </div>

        <!-- Cột Phải: Form Đăng nhập / Đăng ký -->
        <div class="w-full md:w-7/12 p-10 bg-white">
            <!-- Tabs -->
            <div class="flex space-x-6 border-b border-slate-200 mb-8">
                <button onclick="switchTab('login')" id="tab-login" class="pb-3 text-primary font-semibold border-b-2 border-primary transition-colors focus:outline-none">
                    Đăng nhập
                </button>
                <button onclick="switchTab('register')" id="tab-register" class="pb-3 text-slate-400 font-medium border-b-2 border-transparent hover:text-slate-600 transition-colors focus:outline-none">
                    Đăng ký mới
                </button>
            </div>

            <!-- Form Đăng Nhập -->
            <div id="form-login" class="form-transition block">
                <form onsubmit="handleFormSubmit(event, 'login')">
                    <div class="mb-5">
                        <label class="block text-sm font-medium text-slate-700 mb-2">Email</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-regular fa-envelope"></i>
                            </div>
                            <input type="email" id="login-email" required class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm" placeholder="name@example.com">
                        </div>
                    </div>
                    <div class="mb-6">
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-sm font-medium text-slate-700">Mật khẩu</label>
                            <a href="#" class="text-xs text-primary hover:underline">Quên mật khẩu?</a>
                        </div>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-solid fa-lock"></i>
                            </div>
                            <input type="password" id="login-password" required class="w-full pl-10 pr-12 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm" placeholder="••••••••">
                            <button type="button" onclick="togglePassword('login-password', 'login-eye')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-primary transition-colors focus:outline-none">
                                <i id="login-eye" class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" id="btn-login" class="w-full bg-primary hover:bg-primaryHover text-white font-semibold py-3.5 rounded-xl transition-colors shadow-md flex items-center justify-center mt-2">
                        <span class="mr-2">Đăng Nhập</span>
                        <div class="loader" id="loader-login"></div>
                    </button>
                </form>
            </div>

            <!-- Form Đăng Ký -->
            <div id="form-register" class="form-transition hidden">
                <form onsubmit="handleFormSubmit(event, 'register')">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-slate-700 mb-2">Họ và tên</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-regular fa-user"></i>
                            </div>
                            <input type="text" id="reg-name" required class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm" placeholder="Nguyễn Văn A">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-slate-700 mb-2">Email</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-regular fa-envelope"></i>
                            </div>
                            <input type="email" id="reg-email" required class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm" placeholder="name@example.com">
                        </div>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-slate-700 mb-2">Mật khẩu</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-solid fa-lock"></i>
                            </div>
                            <input type="password" id="reg-password" required class="w-full pl-10 pr-12 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm" placeholder="Tạo mật khẩu an toàn">
                            <button type="button" onclick="togglePassword('reg-password', 'reg-eye')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-primary transition-colors focus:outline-none">
                                <i id="reg-eye" class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="btn-register" class="w-full bg-secondary hover:bg-slate-800 text-white font-semibold py-3.5 rounded-xl transition-colors shadow-md flex items-center justify-center mt-2">
                        <span class="mr-2">Tạo Tài Khoản</span>
                        <div class="loader" id="loader-register"></div>
                    </button>
                </form>
            </div>

            <!-- Phân cách -->
            <div class="mt-8 relative flex items-center">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink-0 mx-4 text-slate-400 text-xs uppercase tracking-wider">Hoặc tiếp tục với</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <!-- Nút Social -->
            <div class="mt-6 grid grid-cols-2 gap-4">
                <!-- Khu vực render nút Google chính thức -->
                <div id="googleBtnContainer" class="w-full h-[42px] flex items-center justify-center rounded-xl overflow-hidden"></div>
                
                <button type="button" class="flex items-center justify-center py-2.5 border border-slate-200 rounded-xl hover:bg-slate-50 transition-colors text-sm font-medium text-slate-600 h-[42px]">
                    <i class="fa-brands fa-github text-lg mr-2"></i> Github
                </button>
            </div>
        </div>
    </div>

    <script>
        // BƯỚC QUAN TRỌNG 1: Thay link này bằng URL Web App Google Apps Script của bạn
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw44S_FnJVWjlBlKp3RhpXkf7DmOxL4a0DFBJVzNP0jVRSe2IdLFtc-lpUtaD3ufVPhdw/exec';
        
        // BƯỚC QUAN TRỌNG 2: Thay Client ID của bạn để dùng được Google Sign-In
        // Truy cập Google Cloud Console -> APIs & Services -> Credentials để tạo OAuth Client ID
        const GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com';

        // Khởi tạo Google Sign-in khi load trang
        window.onload = function () {
            // 🔔 Xin quyền hiển thị thông báo đẩy (Push Notification) của trình duyệt
            if ("Notification" in window) {
                if (Notification.permission !== "granted" && Notification.permission !== "denied") {
                    Notification.requestPermission();
                }
            }

            if (typeof google !== 'undefined') {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleLogin
                });
                
                google.accounts.id.renderButton(
                    document.getElementById("googleBtnContainer"),
                    { 
                        theme: "outline", 
                        size: "large", 
                        type: "standard", 
                        width: "100%",
                        text: "signin_with",
                        shape: "rectangular"
                    }
                );
            }
        };

        // Hàm xử lý sau khi Google trả về kết quả đăng nhập thành công
        async function handleGoogleLogin(response) {
            try {
                // Giải mã Token JWT của Google để lấy Tên và Email
                const payload = parseJwt(response.credential);
                const userEmail = payload.email;
                const userName = payload.name;
                
                showToast("Đang đồng bộ dữ liệu với Google...", "success");

                // Lưu dữ liệu vào Sheet
                let apiPayload = {
                    action: 'google_login',
                    email: userEmail,
                    name: userName
                };

                // Gửi về backend (Không đợi để tránh block UI, nhưng vẫn fetch)
                fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(apiPayload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });

                // 🔔 Hiển thị thông báo đẩy hệ thống (Push Notification)
                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification("My Tool", {
                        body: `Chào mừng ${userName} quay trở lại!`,
                        icon: "https://i.pinimg.com/736x/58/98/19/58981979f44731d95ab25aad9a7c88cb.jpg"
                    });
                }

                // Lưu session trên trình duyệt và chuyển hướng
                const userData = {
                    name: userName,
                    email: userEmail,
                    loginTime: new Date().getTime(),
                    provider: 'Google'
                };
                localStorage.setItem('mytool_user', JSON.stringify(userData));
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                console.error(error);
                showToast("Lỗi khi xử lý đăng nhập Google", "error");
            }
        }

        // Hàm hỗ trợ giải mã JWT Token
        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // Xử lý chuyển tab Đăng nhập/Đăng ký
        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const regForm = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');
            
            // Reset messages
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
            document.getElementById('reg-name').value = '';
            document.getElementById('reg-email').value = '';
            document.getElementById('reg-password').value = '';

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                
                tabLogin.classList.replace('text-slate-400', 'text-primary');
                tabLogin.classList.replace('border-transparent', 'border-primary');
                tabLogin.classList.add('font-semibold');
                
                tabReg.classList.replace('text-primary', 'text-slate-400');
                tabReg.classList.replace('border-primary', 'border-transparent');
                tabReg.classList.remove('font-semibold');
            } else {
                regForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                
                tabReg.classList.replace('text-slate-400', 'text-primary');
                tabReg.classList.replace('border-transparent', 'border-primary');
                tabReg.classList.add('font-semibold');
                
                tabLogin.classList.replace('text-primary', 'text-slate-400');
                tabLogin.classList.replace('border-primary', 'border-transparent');
                tabLogin.classList.remove('font-semibold');
            }
        }

        // Xử lý Gửi Form Thủ Công
        async function handleFormSubmit(event, action) {
            event.preventDefault();
            
            if(APPS_SCRIPT_URL === 'THAY_URL_WEB_APP_CUA_BAN_VAO_DAY') {
                showToast("Lỗi: Bạn chưa cấu hình APPS_SCRIPT_URL.", "error");
                return;
            }

            const loader = document.getElementById(`loader-${action}`);
            const btnText = document.querySelector(`#btn-${action} span`);
            
            let payload = { action: action };
            if(action === 'login') {
                payload.email = document.getElementById('login-email').value;
                payload.password = document.getElementById('login-password').value;
            } else {
                payload.name = document.getElementById('reg-name').value;
                payload.email = document.getElementById('reg-email').value;
                payload.password = document.getElementById('reg-password').value;
            }

            loader.style.display = 'block';
            btnText.style.opacity = '0';
            
            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                
                const result = await response.json();
                
                if(result.success) {
                    showToast(result.message, "success");
                    
                    // 🔔 Hiển thị thông báo đẩy hệ thống (Push Notification)
                    if ("Notification" in window && Notification.permission === "granted") {
                        new Notification("My Tool", {
                            body: action === 'register' ? "Chúc mừng bạn đã đăng ký thành công! Hãy kiểm tra hộp thư email nhé." : "Đăng nhập thành công!",
                            icon: "https://i.pinimg.com/736x/58/98/19/58981979f44731d95ab25aad9a7c88cb.jpg"
                        });
                    }

                    if(action === 'login') {
                        const userData = {
                            name: result.name,
                            email: payload.email,
                            loginTime: new Date().getTime(),
                            provider: 'Local'
                        };
                        localStorage.setItem('mytool_user', JSON.stringify(userData));
                        
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1200);
                    } else {
                        setTimeout(() => { switchTab('login'); }, 1500);
                    }
                } else {
                    showToast(result.message, "error");
                }
            } catch (error) {
                showToast("Lỗi kết nối đến máy chủ. Vui lòng thử lại!", "error");
                console.error(error);
            } finally {
                loader.style.display = 'none';
                btnText.style.opacity = '1';
            }
        }

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        function showToast(message, type = "success") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            
            const iconColor = type === 'success' ? 'text-emerald-500' : 'text-red-500';
            const iconClass = type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation';
            
            toast.innerHTML = `
                <i class="fa-solid ${iconClass} ${iconColor} text-xl mr-3"></i>
                <div>
                    <h4 class="text-sm font-bold text-slate-800">${type === 'success' ? 'Thành công' : 'Thất bại'}</h4>
                    <p class="text-xs text-slate-500 mt-0.5">${message}</p>
                </div>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }
    </script>
</body>
</html>
