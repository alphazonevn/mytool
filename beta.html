<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Slideshow</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080a10;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#stage{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:#080a10;
}

.slide{
  position:absolute;
  inset:0;
  opacity:0;
  transition:opacity 1.2s ease-in-out;
  overflow:hidden;
}

.slide.active{
  opacity:1;
  z-index:2;
}

.slide img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.slide.active img{
  animation:zoom 10s ease-in-out forwards;
}

@keyframes zoom{
  from{transform:scale(1)}
  to{transform:scale(1.08)}
}

#overlay{
  position:absolute;
  z-index:5;
  left:0;
  right:0;
  bottom:0;
  padding:28px 5%;
  background:linear-gradient(transparent,rgba(0,0,0,.7));
  opacity:0;
  transition:opacity .4s;
}

#stage:hover #overlay,
#stage:focus-within #overlay{
  opacity:1;
}

#caption{
  font-size:clamp(16px,2vw,28px);
  font-weight:bold;
  margin-bottom:12px;
}

#progress{
  height:4px;
  background:#ffffff40;
  border-radius:10px;
  overflow:hidden;
}

#progressBar{
  width:0;
  height:100%;
  background:#fff;
}

#controls{
  display:flex;
  gap:10px;
  margin-top:14px;
  align-items:center;
}

button{
  border:1px solid #ffffff50;
  background:#ffffff18;
  color:white;
  border-radius:8px;
  padding:10px 16px;
  cursor:pointer;
}

button:hover{
  background:#ffffff35;
}

#counter{
  margin-left:auto;
  font-size:14px;
}

#message{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#aaa;
  font-size:18px;
  text-align:center;
  padding:30px;
}

@media(prefers-reduced-motion:reduce){
  .slide{transition:none}
  .slide.active img{animation:none}
}
</style>
</head>

<body>
<div id="stage">

  <div id="message">Đang tải thư viện ảnh...</div>

  <div id="overlay">
    <div id="caption">TV Slideshow</div>
    <div id="progress"><div id="progressBar"></div></div>

    <div id="controls">
      <button onclick="previous()">◀ Trước</button>
      <button id="playButton" onclick="toggle()">Tạm dừng</button>
      <button onclick="next()">Tiếp theo ▶</button>
      <button onclick="fullscreen()">Toàn màn hình</button>
      <span id="counter"></span>
    </div>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbx6jN83BxpLxk1MXBI2Pm55gtwduQh4p-94Z9SVLwtwcKZ-vV3lKgDa1OXwH1EySimG/exec';

const params = new URLSearchParams(location.search);
const TV_ID = params.get('tv') || 'TV1';

const DURATION = 8000;
const TRANSITION = 1200;

let items = [];
let index = 0;
let paused = false;
let timer = null;
let progressTimer = null;
let startedAt = 0;
let remaining = DURATION;
let currentDuration = DURATION;
let lastUpdate = '';

const stage = document.getElementById('stage');

function jsonp(action, extra = {}) {
  return new Promise((resolve, reject) => {
    const callback = 'cb_' + Date.now() +
      Math.random().toString(36).slice(2);

    const script = document.createElement('script');

    window[callback] = data => {
      delete window[callback];
      script.remove();
      resolve(data);
    };

    script.onerror = () => {
      delete window[callback];
      script.remove();
      reject(new Error('Không thể kết nối Apps Script'));
    };

    script.src = API + '?' +
      new URLSearchParams({
        action,
        callback,
        ...extra
      }).toString();

    document.body.appendChild(script);
  });
}

async function loadImages() {
  try {
    const data = await jsonp('getPlayerData', {
      tvId: TV_ID
    });

    const images = (data.items || []).filter(item =>
      item.mimeType &&
      item.mimeType.startsWith('image/')
    );

    const key = JSON.stringify(images);

    if (key !== lastUpdate) {
      lastUpdate = key;
      items = images;
      index = 0;
      remaining = DURATION;
      show();
    }
  } catch (error) {
    document.getElementById('message').textContent =
      'Không thể tải ảnh. Đang thử kết nối lại...';
  }
}

function createSlide(item, active) {
  const slide = document.createElement('div');
  slide.className = 'slide' + (active ? ' active' : '');

  const img = document.createElement('img');
  img.src = item.url;
  img.alt = item.name || 'Ảnh trình chiếu';
  img.loading = 'eager';

  slide.appendChild(img);
  return slide;
}

function show() {
  clearTimeout(timer);
  clearInterval(progressTimer);

  stage.querySelectorAll('.slide').forEach(el => el.remove());

  if (!items.length) {
    document.getElementById('message').style.display = 'flex';
    document.getElementById('message').textContent =
      'Chưa có ảnh trong danh sách phát';
    return;
  }

  document.getElementById('message').style.display = 'none';

  const item = items[index];
  const slide = createSlide(item, false);

  stage.insertBefore(slide, document.getElementById('overlay'));

  // Chờ ảnh tải xong mới bắt đầu chuyển cảnh.
  const img = slide.querySelector('img');

  img.onload = () => {
    requestAnimationFrame(() => {
      slide.classList.add('active');
    });

    document.getElementById('caption').textContent = item.name || '';
    document.getElementById('counter').textContent =
      (index + 1) + ' / ' + items.length;

    currentDuration = Math.max(
      3000,
      Number(item.duration || 8) * 1000
    );

    remaining = currentDuration;

    if (!paused) startTimer();
  };

  img.onerror = () => {
    setTimeout(next, 2000);
  };

  if (img.complete && img.naturalWidth > 0) img.onload();
}

function startTimer() {
  clearTimeout(timer);
  clearInterval(progressTimer);

  startedAt = Date.now();

  timer = setTimeout(next, remaining);

  progressTimer = setInterval(() => {
    const elapsed = Date.now() - startedAt;
    const percent = Math.min(
      100,
      elapsed / currentDuration * 100
    );

    document.getElementById('progressBar').style.width =
      percent + '%';
  }, 50);
}

function next() {
  if (!items.length) return;

  index = (index + 1) % items.length;
  remaining = currentDuration;
  show();
}

function previous() {
  if (!items.length) return;

  index = (index - 1 + items.length) % items.length;
  remaining = currentDuration;
  show();
}

function toggle() {
  paused = !paused;

  document.getElementById('playButton').textContent =
    paused ? 'Tiếp tục' : 'Tạm dừng';

  if (paused) {
    remaining -= Date.now() - startedAt;
    clearTimeout(timer);
    clearInterval(progressTimer);
  } else {
    startTimer();
  }
}

function fullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') previous();

  if (e.key === ' ') {
    e.preventDefault();
    toggle();
  }
});

loadImages();
setInterval(loadImages, 30000);
</script>
</body>
</html>
